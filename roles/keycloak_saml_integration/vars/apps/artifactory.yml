---
# Artifactory-specific SAML Integration Configuration
# NOTE: SAML SSO requires Artifactory Pro or Enterprise license
#       NOT supported in Artifactory OSS (Community Edition)
#
# KNOWN ISSUE: Nginx reverse proxy session/cookie handling
#   - SAML login may loop back to login page when using nginx proxy
#   - Symptoms: Works with "Remember Me" but not without it
#   - Root cause: Missing proxy headers for session persistence
#   - Workaround: Use direct IP in URLs (e.g., http://192.168.56.11:8080)
#   - Proper fix: Update nginx config with X-Artifactory-Override-Base-Url header

# Application Configuration
keycloak_saml_integration_app_config:
  home: "/opt/jfrog/artifactory"
  config_file: "etc/security/security.xml"
  service_name: "artifactory"
  user: "artifactory"
  group: "artifactory"
  # Artifactory Pro SAML callback URL
  saml_callback_url: "/ui/api/v1/auth/saml/loginResponse/artifactory"

# Artifactory admin credentials for API access
keycloak_saml_integration_artifactory_admin:
  user: "{{ vault_artifactory_admin_username }}"
  password: "{{ vault_artifactory_admin_password }}"

# Artifactory-specific SAML settings
keycloak_saml_integration_artifactory_saml:
  # Basic settings
  name: "default"
  enable_integration: true
  # Keycloak SAML endpoints
  login_url: "https://keycloak.local/realms/master/protocol/saml"
  logout_url: "https://keycloak.local/realms/master/protocol/saml"
  service_provider_name: "https://keycloak.local/realms/master"
  # User management
  auto_user_creation: true
  allow_user_to_access_profile: true
  # Group sync
  sync_groups: true
  group_attribute: "groups"
  email_attribute: "email"
  name_id_attribute: "username"
  # Security
  use_encrypted_assertion: false
  auto_redirect: false
  # Logout URLs for Keycloak Advanced settings
  logout_post_binding_url: "{{ artifactory_base_url }}/ui/login"
  logout_redirect_binding_url: "{{ artifactory_base_url }}/ui/login"
