---
# Wazuh-specific SAML Integration Configuration
# This focuses mainly on Keycloak client configuration; Wazuh indexer/dashboard
# SAML settings are still applied using the official Wazuh docs and manual steps.

# Application Configuration
# These values are mostly placeholders to satisfy the generic role interface.
# Wazuh's SAML integration is driven via the indexer and dashboard configuration
# rather than a simple webapp callback URL.
keycloak_saml_integration_app_config:
  home: "/usr/share/wazuh-dashboard"
  config_file: "config/wazuh.yml"
  service_name: "wazuh-dashboard"
  user: "wazuh-dashboard"
  group: "wazuh-dashboard"
  # Not directly used by Wazuh, but required by the generic role
  saml_callback_url: "/_opendistro/_security/saml/acs/idpinitiated"

# Override Keycloak SAML client configuration for Wazuh
# Per Wazuh docs, we prefer a fixed client_id "wazuh-saml" and
# redirect URLs based on the Wazuh dashboard base URL.
keycloak_saml_integration_client:
  client_id: "wazuh-saml"
  protocol: "saml"
  enabled: true
  front_channel_logout: true

  # Redirect URIs - based on wazuh_base_url from group_vars/all/saml_integration.yml
  redirect_uris:
    - "{{ wazuh_base_url }}/*"

  web_origins:
    - "{{ wazuh_base_url }}"

  base_url: "{{ wazuh_base_url }}"
  root_url: "{{ wazuh_base_url }}"
  admin_url: "{{ wazuh_base_url }}"

  # IDP-initiated SSO URL name (Settings tab)
  idp_initiated_sso_url_name: "wazuh-dashboard"

  attributes:
    saml_authnstatement: "true"
    # Sign documents ON for Wazuh (server-side signature)
    saml_server_signature: "true"
    saml_signature_algorithm: "RSA_SHA256"
    saml_client_signature: "false"
    # Sign assertions ON
    saml_assertion_signature: "true"
    saml_encrypt: "false"
    saml_force_post_binding: "true"
    saml_name_id_format: "username"
    # Explicitly provide additional signature attributes expected by create_saml_client.yml
    saml_signature_key_name: "NONE"
    saml_signature_canonicalization_method: "http://www.w3.org/2001/10/xml-exc-c14n#"
    saml_signing_certificate: ""
    saml_signing_private_key: ""
    # IDP-initiated SSO relay state and URL name
    saml_idp_initiated_sso_relay_state: "wazuh-dashboard"
    saml_idp_initiated_sso_url_name: "wazuh-dashboard"
    # Fine grain SAML endpoints per Wazuh docs
    saml_single_logout_service_url_redirect: "{{ wazuh_base_url }}"
    saml_assertion_consumer_url_post: "{{ wazuh_base_url }}/_opendistro/_security/saml/acs/idpinitiated"

# Wazuh relies on simple username/email/group attributes, plus a role list.
# Override protocol mappers to include default ones + Wazuh role list mapper.
keycloak_saml_integration_protocol_mappers:
  - name: "username"
    protocol: "saml"
    protocol_mapper: "saml-user-property-mapper"
    config:
      "attribute.name": "username"
      "attribute.nameformat": "Basic"
      "user.attribute": "username"

  - name: "email"
    protocol: "saml"
    protocol_mapper: "saml-user-property-mapper"
    config:
      "attribute.name": "email"
      "attribute.nameformat": "Basic"
      "user.attribute": "email"

  - name: "name"
    protocol: "saml"
    protocol_mapper: "saml-user-property-mapper"
    config:
      "attribute.name": "name"
      "attribute.nameformat": "Basic"
      "user.attribute": "firstName"

  - name: "groups"
    protocol: "saml"
    protocol_mapper: "saml-group-membership-mapper"
    config:
      "attribute.name": "groups"
      "attribute.nameformat": "Basic"
      # See note in defaults/main.yml: single=true emits one <Attribute>
      # with multiple values, avoiding OneLogin "duplicated Name" 400.
      "single": "true"
      "full.path": "false"

  # Wazuh role list mapper (Roles attribute)
  - name: "wazuhRoleKey"
    protocol: "saml"
    protocol_mapper: "saml-role-list-mapper"
    config:
      "attribute.name": "Roles"
      "attribute.nameformat": "Basic"
      "single": "true"

# Wazuh application SAML mapping used in templates/debug output if needed
keycloak_saml_integration_app_saml:
  enabled: true
  sp_entity_id: "wazuh-saml"
  groups_attribute: "groups"
  username_attribute: "username"
  email_attribute: "email"
  full_name_attribute: "displayName"
  force_authentication: false
  maximum_authentication_lifetime: 7776000  # 90 days
