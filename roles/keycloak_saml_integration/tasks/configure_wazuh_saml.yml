---
# Configure Wazuh SAML Authentication
# NOTE: This task file currently focuses on the Keycloak side (handled by the
# generic role) and provides guidance/verification for the Wazuh side using the
# existing documentation in docs/WAZUH_KEYCLOAK_SAML_MANUAL_SETUP*. It does not
# overwrite Wazuh indexer/dashboard config files directly, to avoid corrupting
# custom installations.

- name: Display Wazuh SAML integration summary
  ansible.builtin.debug:
    msg:
      - "🔐 Wazuh-Keycloak SAML Integration (app=wazuh)"
      - "🌐 Wazuh URL: {{ wazuh_base_url }}"
      - "🏛️  Keycloak Realm: {{ keycloak_saml_integration_keycloak.realm }}"
      - "👤 SAML Client ID: {{ keycloak_saml_integration_client.client_id }}"
      - "📎 Redirect URIs: {{ keycloak_saml_integration_client.redirect_uris }}"

- name: Ensure Wazuh indexer security directory exists
  ansible.builtin.file:
    path: /etc/wazuh-indexer/opensearch-security
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0750'

- name: Check if idp.metadata.xml already exists
  ansible.builtin.stat:
    path: /etc/wazuh-indexer/opensearch-security/idp.metadata.xml
  register: wazuh_idp_metadata

- name: Check if sp.metadata.xml already exists
  ansible.builtin.stat:
    path: /etc/wazuh-indexer/opensearch-security/sp.metadata.xml
  register: wazuh_sp_metadata

- name: Set temporary paths for Mellon metadata package
  ansible.builtin.set_fact:
    wazuh_mellon_zip_path: "/tmp/wazuh-{{ keycloak_saml_integration_keycloak.realm }}-{{ keycloak_saml_integration_client.client_id }}-mellon.zip"
    wazuh_mellon_extract_dir: "/tmp/wazuh-mellon-{{ keycloak_saml_integration_client.client_id }}"

- name: Ensure Mellon extract directory exists
  ansible.builtin.file:
    path: "{{ wazuh_mellon_extract_dir }}"
    state: directory
    mode: '0755'
  when:
    - (not wazuh_idp_metadata.stat.exists | default(false)) or (not wazuh_sp_metadata.stat.exists | default(false))

- name: Download mod_auth_mellon metadata ZIP from Keycloak
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_keycloak.admin_api_url }}/admin/realms/{{ keycloak_saml_integration_keycloak.realm }}/clients/{{ keycloak_saml_integration_saml_client_id }}/installation/providers/mod-auth-mellon"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_saml_integration_access_token }}"
    dest: "{{ wazuh_mellon_zip_path }}"
    status_code: 200
    validate_certs: false
  register: wazuh_mellon_download
  when:
    - keycloak_saml_integration_saml_client_id is defined
    - keycloak_saml_integration_access_token is defined
    - (not wazuh_idp_metadata.stat.exists | default(false)) or (not wazuh_sp_metadata.stat.exists | default(false))

- name: Stat Mellon metadata ZIP
  ansible.builtin.stat:
    path: "{{ wazuh_mellon_zip_path }}"
  register: wazuh_mellon_zip
  when:
    - (not wazuh_idp_metadata.stat.exists | default(false)) or (not wazuh_sp_metadata.stat.exists | default(false))

- name: Verify Mellon metadata ZIP downloaded
  ansible.builtin.assert:
    that:
      - wazuh_mellon_zip.stat.exists | default(false)
    fail_msg: "Expected Mellon ZIP at {{ wazuh_mellon_zip_path }} but it was not found"
  when:
    - not ansible_check_mode
    - (not wazuh_idp_metadata.stat.exists | default(false)) or (not wazuh_sp_metadata.stat.exists | default(false))

- name: Unpack Mellon metadata ZIP
  ansible.builtin.unarchive:
    src: "{{ wazuh_mellon_zip_path }}"
    dest: "{{ wazuh_mellon_extract_dir }}"
    remote_src: true
  when: wazuh_mellon_zip.stat.exists | default(false)

- name: Find Mellon idp metadata file
  ansible.builtin.find:
    paths: "{{ wazuh_mellon_extract_dir }}"
    patterns:
      - "idp-metadata.xml"
      - "idp.metadata.xml"
    recurse: true
    file_type: file
  register: wazuh_mellon_idp_find
  when: wazuh_mellon_zip.stat.exists | default(false)

- name: Find Mellon sp metadata file (optional)
  ansible.builtin.find:
    paths: "{{ wazuh_mellon_extract_dir }}"
    patterns:
      - "sp-metadata.xml"
      - "sp.metadata.xml"
    recurse: true
    file_type: file
  register: wazuh_mellon_sp_find
  when: wazuh_mellon_zip.stat.exists | default(false)

- name: Set Mellon metadata source paths
  ansible.builtin.set_fact:
    wazuh_mellon_idp_src: "{{ (((wazuh_mellon_idp_find | default({})).files | default([])) | map(attribute='path') | list | first) | default('') }}"
    wazuh_mellon_sp_src: "{{ (((wazuh_mellon_sp_find | default({})).files | default([])) | map(attribute='path') | list | first) | default('') }}"

- name: Verify Mellon metadata contains idp metadata (sp metadata optional)
  ansible.builtin.assert:
    that:
      - wazuh_mellon_idp_src | length > 0
    fail_msg: "mod-auth-mellon installation for client {{ keycloak_saml_integration_client.client_id }} did not contain idp metadata (searched under {{ wazuh_mellon_extract_dir }})"
  when:
    - not ansible_check_mode
    - wazuh_mellon_zip.stat.exists | default(false)

- name: Install idp.metadata.xml from Mellon package
  ansible.builtin.copy:
    src: "{{ wazuh_mellon_idp_src }}"
    dest: /etc/wazuh-indexer/opensearch-security/idp.metadata.xml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0644'
    remote_src: true
  when:
    - not wazuh_idp_metadata.stat.exists | default(false)
    - wazuh_mellon_idp_src | length > 0

- name: Install sp.metadata.xml from Mellon package (if present)
  ansible.builtin.copy:
    src: "{{ wazuh_mellon_sp_src }}"
    dest: /etc/wazuh-indexer/opensearch-security/sp.metadata.xml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0644'
    remote_src: true
  when:
    - not wazuh_sp_metadata.stat.exists | default(false)
    - wazuh_mellon_sp_src | length > 0

- name: Write idp.metadata.xml from SAML descriptor (fallback)
  ansible.builtin.copy:
    dest: /etc/wazuh-indexer/opensearch-security/idp.metadata.xml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0644'
    content: "{{ keycloak_saml_integration_saml_descriptor.content }}"
  when:
    - keycloak_saml_integration_saml_descriptor is defined
    - keycloak_saml_integration_saml_descriptor.content is defined
    - not wazuh_idp_metadata.stat.exists | default(false)
    - wazuh_mellon_idp_src | default('') | length == 0

# NOTE: sp.metadata.xml normally comes from Wazuh itself. For now we ensure the file
# exists as a placeholder if it is missing, so config.yml references do not break.
- name: Ensure sp.metadata.xml exists (placeholder if missing)
  ansible.builtin.copy:
    dest: /etc/wazuh-indexer/opensearch-security/sp.metadata.xml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0644'
    content: "<!-- placeholder Wazuh SP metadata -->\n"
  when:
    - not wazuh_sp_metadata.stat.exists | default(false)
    - wazuh_mellon_sp_src | default('') | length == 0

- name: Check Wazuh indexer config.yml exists
  ansible.builtin.stat:
    path: /etc/wazuh-indexer/opensearch-security/config.yml
  register: wazuh_indexer_config
  ignore_errors: true

- name: Try to read existing Wazuh SAML exchange_key from config.yml
  ansible.builtin.shell: "grep -E \"exchange_key:\" /etc/wazuh-indexer/opensearch-security/config.yml | head -n1 | awk -F\"'\" '{print $2}' || true"
  register: wazuh_exchange_key_grep
  changed_when: false
  when: wazuh_indexer_config.stat.exists | default(false)

- name: Set Wazuh SAML exchange_key fact from existing config if found
  ansible.builtin.set_fact:
    wazuh_saml_exchange_key: "{{ wazuh_exchange_key_grep.stdout }}"
  when:
    - wazuh_indexer_config.stat.exists | default(false)
    - wazuh_exchange_key_grep.stdout is defined
    - wazuh_exchange_key_grep.stdout | length > 0

- name: Generate new Wazuh SAML exchange key if not already set
  ansible.builtin.command: "openssl rand -hex 32"
  register: wazuh_exchange_key_cmd
  changed_when: true
  when: wazuh_saml_exchange_key is not defined

- name: Set Wazuh SAML exchange_key fact from generated value
  ansible.builtin.set_fact:
    wazuh_saml_exchange_key: "{{ wazuh_exchange_key_cmd.stdout }}"
  when:
    - wazuh_saml_exchange_key is not defined
    - wazuh_exchange_key_cmd.stdout is defined

- name: Backup Wazuh indexer config.yml before SAML changes
  ansible.builtin.include_tasks: common/backup_config.yml
  vars:
    config_path: "/etc/wazuh-indexer/opensearch-security/config.yml"
    config_owner: "wazuh-indexer"
    config_group: "wazuh-indexer"
  when: wazuh_indexer_config.stat.exists | default(false)

- name: Inject SAML authc block into indexer config.yml (idempotent)
  ansible.builtin.blockinfile:
    path: /etc/wazuh-indexer/opensearch-security/config.yml
    marker: "# {mark} ANSIBLE WAZUH SAML"
    insertafter: '^authc:'
    block: |
      saml_auth_domain:
        http_enabled: true
        transport_enabled: false
        order: 1
        http_authenticator:
          type: saml
          challenge: true
          config:
            idp:
              metadata_file: '/etc/wazuh-indexer/opensearch-security/idp.metadata.xml'
              entity_id: 'http://{{ keycloak_hostname }}/realms/{{ keycloak_saml_integration_keycloak.realm }}'
            sp:
              entity_id: wazuh-saml
              metadata_file: '/etc/wazuh-indexer/opensearch-security/sp.metadata.xml'
            kibana_url: {{ wazuh_base_url }}
            roles_key: Roles
            exchange_key: '{{ wazuh_saml_exchange_key }}'
        authentication_backend:
          type: noop
  when: wazuh_indexer_config.stat.exists | default(false)

- name: Check Wazuh indexer roles_mapping.yml exists
  ansible.builtin.stat:
    path: /etc/wazuh-indexer/opensearch-security/roles_mapping.yml
  register: wazuh_indexer_roles_mapping
  ignore_errors: true

- name: Backup Wazuh indexer roles_mapping.yml before SAML changes
  ansible.builtin.include_tasks: common/backup_config.yml
  vars:
    config_path: "/etc/wazuh-indexer/opensearch-security/roles_mapping.yml"
    config_owner: "wazuh-indexer"
    config_group: "wazuh-indexer"
  when: wazuh_indexer_roles_mapping.stat.exists | default(false)

- name: Ensure all_access backend role mapping for admin exists
  ansible.builtin.blockinfile:
    path: /etc/wazuh-indexer/opensearch-security/roles_mapping.yml
    marker: "# {mark} ANSIBLE WAZUH SAML"
    block: |
      all_access:
        reserved: false
        hidden: false
        backend_roles:
          - "admin"
  when: wazuh_indexer_roles_mapping.stat.exists | default(false)

- name: Check Wazuh dashboard config file exists
  ansible.builtin.stat:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
  register: wazuh_dashboard_config
  ignore_errors: true

- name: Backup Wazuh dashboard opensearch_dashboards.yml before SAML changes
  ansible.builtin.include_tasks: common/backup_config.yml
  vars:
    config_path: "/etc/wazuh-dashboard/opensearch_dashboards.yml"
    config_owner: "wazuh-dashboard"
    config_group: "wazuh-dashboard"
  when: wazuh_dashboard_config.stat.exists | default(false)

- name: Check if SAML auth already configured in opensearch_dashboards.yml
  ansible.builtin.shell: "grep -q 'opensearch_security.auth.type' /etc/wazuh-dashboard/opensearch_dashboards.yml && echo present || echo absent"
  register: wazuh_dashboard_saml_check
  changed_when: false
  when: wazuh_dashboard_config.stat.exists | default(false)

- name: Set fact for existing SAML auth config
  ansible.builtin.set_fact:
    wazuh_dashboard_saml_config_present: "{{ wazuh_dashboard_saml_check.stdout == 'present' }}"
  when: wazuh_dashboard_config.stat.exists | default(false)

- name: Enable SAML auth type in opensearch_dashboards.yml
  ansible.builtin.blockinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    marker: "# {mark} ANSIBLE WAZUH SAML"
    block: |
      opensearch_security.auth.type: "saml"
      server.xsrf.allowlist: ["/_opendistro/_security/saml/acs", "/_opendistro/_security/saml/logout", "/_opendistro/_security/saml/acs/idpinitiated"]
      opensearch_security.session.keepalive: false
  when:
    - wazuh_dashboard_config.stat.exists | default(false)
    - not wazuh_dashboard_saml_config_present | default(false)

- name: Check Wazuh API config file exists
  ansible.builtin.stat:
    path: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
  register: wazuh_api_config
  ignore_errors: true

- name: Backup Wazuh API config wazuh.yml before SAML changes
  ansible.builtin.include_tasks: common/backup_config.yml
  vars:
    config_path: "/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml"
    config_owner: "wazuh-dashboard"
    config_group: "wazuh-dashboard"
  when: wazuh_api_config.stat.exists | default(false)

- name: Ensure run_as is false in Wazuh API config
  ansible.builtin.lineinfile:
    path: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    regexp: '^\s*run_as:'
    line: '      run_as: false'
    backrefs: false
  when: wazuh_api_config.stat.exists | default(false)

- name: Restart Wazuh indexer and dashboard to apply SAML settings
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - wazuh-indexer
    - wazuh-dashboard
  ignore_errors: true

- name: Final Wazuh SAML reminder
  ansible.builtin.debug:
    msg:
      - "✅ Keycloak side for app=wazuh is now configured by the generic role."
      - "✅ Basic Wazuh indexer/dashboard SAML wiring has been applied (config.yml, roles_mapping.yml, opensearch_dashboards.yml, wazuh.yml)."
      - "   Review docs/WAZUH_KEYCLOAK_SAML_MANUAL_SETUP.md for fine-tuning (exchange_key, realms, advanced options)."

- name: Restart Wazuh dashboard via systemd
  ansible.builtin.systemd:
    name: wazuh-dashboard
    state: restarted
    enabled: yes
  ignore_errors: true
