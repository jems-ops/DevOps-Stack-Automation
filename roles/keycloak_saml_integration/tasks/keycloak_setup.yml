---
# Keycloak-side flow for the per-app SAML configuration.
# Runs on the Keycloak host (against http://localhost:8080) so the admin REST
# calls don't depend on the app hosts being able to reach the public HTTPS
# proxy. The app-side counterpart lives in tasks/app_setup.yml and pulls the
# resulting SAML client UUID + IdP certificate from this host's facts.

- name: Load app-specific configuration
  ansible.builtin.include_vars:
    file: "vars/apps/{{ keycloak_saml_integration_app_type }}.yml"
  tags: ['always']

- name: Set app-specific variables for role
  ansible.builtin.set_fact:
    keycloak_saml_integration_app_config: "{{ {keycloak_saml_integration_app_type: keycloak_saml_integration_app_config} }}"
  tags: ['always']

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - keycloak_saml_integration_app_type is defined
      - keycloak_saml_integration_app_type in ['jenkins', 'sonarqube', 'artifactory', 'nexus', 'securitycenter', 'wazuh']
      - keycloak_saml_integration_keycloak.realm is defined
      - keycloak_saml_integration_keycloak.admin_api_url is defined
    fail_msg: "Required variables are not defined or app_type is invalid. Supported apps: jenkins, sonarqube, artifactory, nexus, securitycenter, wazuh"
    success_msg: "All required variables are defined for {{ keycloak_saml_integration_app_type | upper }} SAML integration"
  tags: ['validate']

- name: Display Keycloak setup information
  ansible.builtin.debug:
    msg:
      - "🔐 {{ keycloak_saml_integration_app_type | capitalize }} - Keycloak side"
      - "🔑 Keycloak: {{ keycloak_saml_integration_keycloak.admin_api_url }}"
      - "🏛️  Realm: {{ keycloak_saml_integration_keycloak.realm }}"
      - "👤 SAML Client: {{ keycloak_saml_integration_client.client_id }}"
  tags: ['info']

- name: Get Keycloak access token
  ansible.builtin.include_tasks: keycloak/get_keycloak_token.yml
  tags: ['keycloak', 'token']

- name: Create Keycloak realm if it doesn't exist
  ansible.builtin.include_tasks: keycloak/create_keycloak_realm.yml
  when: not ansible_check_mode
  tags: ['keycloak', 'realm']

- name: Create or update Keycloak SAML client
  ansible.builtin.include_tasks: keycloak/create_saml_client.yml
  when: not ansible_check_mode
  tags: ['keycloak', 'saml', 'client']

- name: Configure SAML protocol mappers
  ansible.builtin.include_tasks: keycloak/configure_protocol_mappers.yml
  when:
    - not ansible_check_mode
    - not (skip_protocol_mappers | default(false) | bool)
  tags: ['keycloak', 'saml', 'mappers']

- name: Get Keycloak certificate
  ansible.builtin.include_tasks: keycloak/get_keycloak_certificate.yml
  when: not ansible_check_mode
  tags: ['keycloak', 'certificate']
