---
# Configure Tenable Security Center SAML Integration
# Uses Security Center REST API to configure SAML settings
# API Documentation: /rest/configSection/8/1 (SAML Configuration)

# Step 1: Authenticate to Security Center API
- name: Get Security Center session token
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/token"
    method: POST
    body_format: json
    body:
      username: "{{ vault_tsc_admin_username | default('admin') }}"
      password: "{{ vault_tsc_admin_password }}"
    status_code: 200
    validate_certs: false
  register: tsc_auth_response
  delegate_to: localhost

- name: Set Security Center session token
  ansible.builtin.set_fact:
    tsc_session_token: "{{ tsc_auth_response.json.response.token }}"

# Step 2: Get current SAML configuration
- name: Get current Security Center SAML configuration
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/configSection/8/1"
    method: GET
    headers:
      X-SecurityCenter: "{{ tsc_session_token }}"
    status_code: 200
    validate_certs: false
  register: tsc_current_saml_config
  delegate_to: localhost

# Step 3: Configure SAML settings via API
- name: Configure Security Center SAML via REST API
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/configSection/8/1"
    method: PATCH
    headers:
      X-SecurityCenter: "{{ tsc_session_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "SAML"
      description: "SAML SSO Integration with Keycloak"
      entityID: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}"
      idp: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}"
      usernameAttribute: "email"
      singleSignOnService: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}/protocol/saml"
      singleLogoutService: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}/protocol/saml"
      certData: "{{ keycloak_saml_integration_certificate }}"
      samlEnabled: "true"
    status_code: 200
    validate_certs: false
  register: tsc_saml_config_result
  delegate_to: localhost

# Step 4: Logout from Security Center API
- name: Logout from Security Center API
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/token"
    method: DELETE
    headers:
      X-SecurityCenter: "{{ tsc_session_token }}"
    status_code: 200
    validate_certs: false
  delegate_to: localhost
  ignore_errors: true
