---
# Configure Nessus / Tenable.sc SAML Integration via REST API

# Step 1: Authenticate to Security Center API
- name: Get Security Center session token
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/token"
    method: POST
    body_format: json
    body:
      username: "{{ vault_tsc_admin_username | default('admin') }}"
      password: "{{ vault_tsc_admin_password | default('admin') }}"
    status_code: 200
    validate_certs: false
    return_content: true
  register: tsc_auth_response
  delegate_to: localhost

# Step 2 & 3: Extract session token and cookie
- name: Set Security Center session auth facts
  ansible.builtin.set_fact:
    tsc_session_token: "{{ tsc_auth_response.json.response.token }}"
    tsc_session_cookie: "{{ tsc_auth_response.cookies_string | default(tsc_auth_response.cookie_string) }}"

# Step 4: Get current SAML configuration
- name: Get current Nessus SAML configuration
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/saml/1"
    method: GET
    headers:
      X-SecurityCenter: "{{ tsc_session_token }}"
      Cookie: "{{ tsc_session_cookie }}"
    status_code: 200
    validate_certs: false
  register: nessus_current_saml_config
  delegate_to: localhost

# Step 5: Configure SAML settings via API (Tenable.sc /saml/{id}::PATCH)
- name: Configure Nessus SAML via REST API
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/saml/1"
    method: PATCH
    headers:
      X-SecurityCenter: "{{ tsc_session_token }}"
      Cookie: "{{ tsc_session_cookie }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "SAML"
      description: "SAML SSO Integration with Keycloak"
      type: "saml2"
      entityID: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}"
      idp: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}"
      usernameAttribute: "email"
      singleSignOnService: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}/protocol/saml"
      singleLogoutService: "{{ keycloak_saml_integration_keycloak.base_url }}/realms/{{ keycloak_saml_integration_keycloak.realm }}/protocol/saml"
      certData: "{{ keycloak_saml_integration_certificate }}"
      samlEnabled: "true"
    status_code: 200
    validate_certs: false
    return_content: true
  register: nessus_saml_config_result
  delegate_to: localhost

- name: Debug Nessus SAML API response
  ansible.builtin.debug:
    var: nessus_saml_config_result

# Step 6: Logout from Security Center API
- name: Logout from Security Center API
  ansible.builtin.uri:
    url: "{{ keycloak_saml_integration_app.base_url }}/rest/token"
    method: DELETE
    headers:
      X-SecurityCenter: "{{ tsc_session_token }}"
      Cookie: "{{ tsc_session_cookie }}"
    status_code: 200
    validate_certs: false
  delegate_to: localhost
  ignore_errors: true
