---
# Main tasks for Generic Keycloak SAML Integration

- name: Load app-specific configuration
  ansible.builtin.include_vars:
    file: "vars/apps/{{ keycloak_saml_integration_app_type }}.yml"
  tags: ['always']

- name: Set app-specific variables for role
  ansible.builtin.set_fact:
    keycloak_saml_integration_app_config: "{{ {keycloak_saml_integration_app_type: keycloak_saml_integration_app_config} }}"
  tags: ['always']

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - keycloak_saml_integration_app_type is defined
      - keycloak_saml_integration_app_type in ['jenkins', 'sonarqube', 'artifactory', 'nexus', 'securitycenter', 'wazuh']
      - keycloak_saml_integration_keycloak.realm is defined
      - keycloak_saml_integration_keycloak.admin_api_url is defined
    fail_msg: "Required variables are not defined or app_type is invalid. Supported apps: jenkins, sonarqube, artifactory, nexus, securitycenter"
    success_msg: "All required variables are defined for {{ keycloak_saml_integration_app_type | upper }} SAML integration"
  tags: ['validate']

- name: Display integration information
  ansible.builtin.debug:
    msg:
      - "🔐 {{ keycloak_saml_integration_app_type | capitalize }}-Keycloak SAML Integration"
      - "🏗️  Application: {{ keycloak_saml_integration_app.base_url }}"
      - "🔑 Keycloak: {{ keycloak_saml_integration_keycloak.admin_api_url }}"
      - "🏛️  Realm: {{ keycloak_saml_integration_keycloak.realm }}"
      - "👤 SAML Client: {{ keycloak_saml_integration_client.client_id }}"
  tags: ['info']

- name: Run pre-flight checks
  ansible.builtin.include_tasks: preflight_checks.yml
  tags: ['preflight', 'checks']

- name: Get Keycloak access token
  ansible.builtin.include_tasks: get_keycloak_token.yml
  tags: ['keycloak', 'token']

- name: Create Keycloak realm if it doesn't exist
  ansible.builtin.include_tasks: create_keycloak_realm.yml
  when: not ansible_check_mode
  tags: ['keycloak', 'realm']

- name: Create or update Keycloak SAML client
  ansible.builtin.include_tasks: create_saml_client.yml
  when: not ansible_check_mode
  tags: ['keycloak', 'saml', 'client']

# Legacy `devops/<app>-users` Keycloak group/role model.
# Retired on the keycloak-freeipa-template branch in favor of FreeIPA-side
# groups (e.g. jenkins-administrators, sonar-administrators) synced via the
# LDAP group-ldap-mapper. Default is now skipped; opt back in by passing
# -e skip_client_roles=false on the command line.
- name: Configure client roles and hierarchical groups (legacy, off by default)
  ansible.builtin.include_tasks: configure_client_roles.yml
  when:
    - not ansible_check_mode
    - not (skip_client_roles | default(true) | bool)
  tags: ['keycloak', 'client_roles', 'groups', 'legacy']

- name: Configure SAML protocol mappers
  ansible.builtin.include_tasks: configure_protocol_mappers.yml
  when:
    - not ansible_check_mode
    - not (skip_protocol_mappers | default(false) | bool)
  tags: ['keycloak', 'saml', 'mappers']

- name: Create test user (optional)
  ansible.builtin.include_tasks: create_test_user.yml
  when:
    - not ansible_check_mode
    - keycloak_saml_integration_test_user.enabled | default(false) | bool
  tags: ['keycloak', 'test_user']

- name: Get Keycloak certificate
  ansible.builtin.include_tasks: get_keycloak_certificate.yml
  when: not ansible_check_mode
  tags: ['keycloak', 'certificate']

- name: Configure application SAML integration
  ansible.builtin.include_tasks: "configure_{{ keycloak_saml_integration_app_type }}_saml.yml"
  when: not (skip_app_config | default(false) | bool)
  tags: ['app', 'saml', 'configure']

- name: Display completion summary
  ansible.builtin.debug:
    msg:
      - "✅ {{ keycloak_saml_integration_app_type | capitalize }}-Keycloak SAML integration completed!"
      - ""
      - "🌐 Application URL: {{ keycloak_saml_integration_app.base_url }}"
      - "🔐 SAML Client ID: {{ keycloak_saml_integration_client.client_id }}"
      - "👥 Group: /{{ keycloak_saml_integration_parent_group }}/{{ keycloak_saml_integration_subgroups.users.name }}"
      - "👤 Test User: {{ keycloak_saml_integration_test_user.username }} / {{ keycloak_saml_integration_test_user.password }}"
  tags: ['summary']
  when: keycloak_saml_integration_test_user.enabled | default(false) | bool

- name: Display completion summary (no test user)
  ansible.builtin.debug:
    msg:
      - "✅ {{ keycloak_saml_integration_app_type | capitalize }}-Keycloak SAML integration completed!"
      - ""
      - "🌐 Application URL: {{ keycloak_saml_integration_app.base_url }}"
      - "🔐 SAML Client ID: {{ keycloak_saml_integration_client.client_id }}"
      - "👥 Group: /{{ keycloak_saml_integration_parent_group }}/{{ keycloak_saml_integration_subgroups.users.name }}"
  tags: ['summary']
  when: not (keycloak_saml_integration_test_user.enabled | default(false) | bool)
