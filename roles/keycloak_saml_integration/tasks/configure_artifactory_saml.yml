---
# Configure Artifactory SAML Authentication via REST API

- name: Compute SAML URLs and attributes
  ansible.builtin.set_fact:
    saml_name: "{{ keycloak_saml_integration_artifactory_saml.name }}"
    saml_login_url: "{{ keycloak_saml_integration_artifactory_saml.login_url }}"
    saml_logout_url: "{{ keycloak_saml_integration_artifactory_saml.logout_url }}"
    saml_sp_name: "{{ keycloak_saml_integration_artifactory_saml.service_provider_name }}"
    saml_name_id_attribute: "{{ keycloak_saml_integration_artifactory_saml.name_id_attribute }}"
    saml_email_attribute: "{{ keycloak_saml_integration_artifactory_saml.email_attribute }}"
    saml_group_attribute: "{{ keycloak_saml_integration_artifactory_saml.group_attribute }}"

- name: Apply SAML configuration via Artifactory API
  ansible.builtin.uri:
    url: "{{ artifactory_base_url }}/artifactory/api/saml/config"
    method: PUT
    user: "{{ artifactory_admin_user | default('admin') }}"
    password: "{{ artifactory_admin_password | default('Artifactory@2025') }}"
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ saml_name }}"
      enable_integration: true
      login_url: "{{ saml_login_url }}"
      logout_url: "{{ saml_logout_url }}"
      service_provider_name: "{{ saml_sp_name }}"
      certificate: "{{ keycloak_saml_integration_certificate }}"
      auto_user_creation: true
      allow_user_to_access_profile: true
      use_encrypted_assertion: false
      auto_redirect: false
      sync_groups: true
      group_attribute: "{{ saml_group_attribute }}"
      email_attribute: "{{ saml_email_attribute }}"
      name_id_attribute: "{{ saml_name_id_attribute }}"
    status_code: [200,201]
    validate_certs: false
  register: saml_config_result

- name: Display Artifactory SAML login URL
  ansible.builtin.debug:
    msg: |
      🔐 Artifactory SAML configured successfully
      Login URL: {{ artifactory_base_url }}/ui/login
      Look for "Login via SSO" button
      Status: {{ saml_config_result.status }}
