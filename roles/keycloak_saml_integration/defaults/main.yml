---
# Generic Keycloak SAML Integration Role Defaults
# This role supports multiple applications (Jenkins, SonarQube, etc.)

# Application Configuration
# Required: Set app_type to 'jenkins', 'sonarqube', 'artifactory', 'nexus', 'securitycenter', or 'wazuh'
keycloak_saml_integration_app_type: ""  # jenkins, sonarqube, artifactory, nexus, securitycenter, wazuh
keycloak_saml_integration_app_name: "{{ keycloak_saml_integration_app_type }}"

# Application URLs (dynamically resolved based on app_type)
keycloak_saml_integration_app:
  host: "{{ lookup('vars', keycloak_saml_integration_app_type + '_hostname', default='localhost') }}"
  port: "{{ 443 if keycloak_saml_integration_use_https else 8080 }}"
  protocol: "{{ 'https' if keycloak_saml_integration_use_https else 'http' }}"
  base_url: "{{ lookup('vars', keycloak_saml_integration_app_type + '_base_url', default='http://localhost:8080') }}"

# Keycloak Configuration
# Shared realm name for all applications
keycloak_saml_integration_realm_name: "master"

keycloak_saml_integration_keycloak:
  host: "{{ keycloak_hostname }}"
  port: 443
  protocol: "https"
  realm: "{{ keycloak_saml_integration_realm_name }}"
  admin_user: "{{ vault_keycloak_admin_user | default('admin') }}"
  admin_password: "{{ vault_keycloak_admin_password }}"
  base_url: "{{ keycloak_base_url }}"
  admin_api_url: "{{ keycloak_admin_api_url | default(keycloak_base_url) }}"

# SAML Client Configuration
keycloak_saml_integration_client:
  # For Artifactory, use full base URL as client_id (supports both IP:PORT or DNS)
  client_id: "{{ (keycloak_saml_integration_app.base_url if keycloak_saml_integration_app_type == 'artifactory' else keycloak_saml_integration_app_type) }}"
  protocol: "saml"
  enabled: true
  # Front channel logout: false for Artifactory, true for others
  front_channel_logout: "{{ false if keycloak_saml_integration_app_type == 'artifactory' else true }}"

  # Redirect URIs (dynamically built based on app type)
  redirect_uris:
    - "{{ keycloak_saml_integration_app.base_url }}{{ keycloak_saml_integration_app_config[keycloak_saml_integration_app_type].saml_callback_url }}"
    - "{{ keycloak_saml_integration_app.base_url }}/*"

  web_origins:
    - "{{ keycloak_saml_integration_app.base_url }}"

  # For Artifactory, root/home/base URL all use the full callback path
  base_url: "{{ keycloak_saml_integration_app.base_url + keycloak_saml_integration_app_config[keycloak_saml_integration_app_type].saml_callback_url if keycloak_saml_integration_app_type == 'artifactory' else keycloak_saml_integration_app.base_url }}"
  root_url: "{{ keycloak_saml_integration_app.base_url + keycloak_saml_integration_app_config[keycloak_saml_integration_app_type].saml_callback_url if keycloak_saml_integration_app_type == 'artifactory' else keycloak_saml_integration_app.base_url }}"
  admin_url: "{{ keycloak_saml_integration_app.base_url }}"

  # SAML Attributes
  attributes:
    saml_authnstatement: "true"
    saml_server_signature: "false"
    saml_signature_algorithm: "RSA_SHA256"
    saml_client_signature: "false"
    saml_assertion_signature: "true"
    saml_encrypt: "false"
    # Force POST binding OFF for Artifactory
    saml_force_post_binding: "{{ 'false' if keycloak_saml_integration_app_type == 'artifactory' else 'true' }}"
    saml_name_id_format: "username"
    # Additional signature attributes expected by create_saml_client.yml
    saml_signature_key_name: "NONE"
    saml_signature_canonicalization_method: "http://www.w3.org/2001/10/xml-exc-c14n#"
    saml_signing_certificate: ""
    saml_signing_private_key: ""
    # Logout binding URLs (app-specific, populated from app vars)
    saml_single_logout_service_url_post: "{{ lookup('vars', 'keycloak_saml_integration_' + keycloak_saml_integration_app_type + '_saml', default={}).get('logout_post_binding_url', '') }}"
    saml_single_logout_service_url_redirect: "{{ lookup('vars', 'keycloak_saml_integration_' + keycloak_saml_integration_app_type + '_saml', default={}).get('logout_redirect_binding_url', '') }}"

# Protocol Mappers
keycloak_saml_integration_protocol_mappers:
  - name: "username"
    protocol: "saml"
    protocol_mapper: "saml-user-property-mapper"
    config:
      "attribute.name": "username"
      "attribute.nameformat": "Basic"
      "user.attribute": "username"

  - name: "email"
    protocol: "saml"
    protocol_mapper: "saml-user-property-mapper"
    config:
      "attribute.name": "email"
      "attribute.nameformat": "Basic"
      "user.attribute": "email"

  - name: "name"
    protocol: "saml"
    protocol_mapper: "saml-user-property-mapper"
    config:
      "attribute.name": "name"
      "attribute.nameformat": "Basic"
      "user.attribute": "firstName"

  - name: "groups"
    protocol: "saml"
    protocol_mapper: "saml-group-membership-mapper"
    config:
      "attribute.name": "groups"
      "attribute.nameformat": "Basic"
      "single": "false"
      "full.path": "false"

# SAML Configuration for Applications
keycloak_saml_integration_app_saml:
  enabled: true
  sp_entity_id: "{{ keycloak_saml_integration_client.client_id }}"
  groups_attribute: "groups"
  username_attribute: "username"
  email_attribute: "email"
  full_name_attribute: "displayName"
  force_authentication: false
  maximum_authentication_lifetime: 7776000  # 90 days

# HTTPS Configuration
keycloak_saml_integration_use_https: true

# Logging
keycloak_saml_integration_debug_logging: false

# Authorization model: SAML `groups` attribute (wired in
# configure_protocol_mappers.yml) carries IPA group names. Apps map their
# matching admin group (e.g. jenkins-administrators, sonar-administrators)
# created by roles/freeipa_keycloak_prep and synced into Keycloak via the
# LDAP group-ldap-mapper. No Keycloak-side parent groups, subgroups, client
# roles, or test users are managed by this role.
