---
# tasks file for stig_freeipa

############################################################
# Backup configs (run with --tags backup)
############################################################
- name: "Backup pre-STIG configs"
  include_tasks: backup-configs.yml
  tags: [backup, enforcement]

############################################################
# Rollback (run with --tags rollback)
############################################################
- name: "Rollback STIG changes"
  include_tasks: rollback-configs.yml
  tags: [rollback, never]

############################################################
# Shared setup
############################################################
- name: "Resolve Tomcat paths"
  ansible.builtin.include_tasks:
    file: common/webserver/resolve-tomcat-paths.yml
    apply:
      tags: [always]
  tags: [enforcement, validation]

- name: "Gather common DNS facts"
  ansible.builtin.include_tasks:
    file: common/dns/common-dns-facts.yml
    apply:
      tags: [always]
  tags: [enforcement, validation]

- name: "Named Service Audit Rules"
  ansible.builtin.include_tasks:
    file: common/dns/named-audit-rules.yml
    apply:
      tags: [named-audit, enforcement, validation]
  tags: [named-audit, enforcement, validation]

############################################################
# Enforcement — Auditing
############################################################
- name: "Auditing enforcement"
  ansible.builtin.include_tasks:
    file: auditing/main.yml
    apply:
      tags: [enforcement]
  tags: [enforcement, V-264341, V-222998, V-222999, V-223000]

############################################################
# Enforcement — Authentication
############################################################
- name: "Authentication enforcement"
  ansible.builtin.include_tasks:
    file: authentication/main.yml
    apply:
      tags: [enforcement]
  tags: [enforcement, V-206374]

############################################################
# Enforcement — Hardening
############################################################
- name: "Hardening enforcement"
  ansible.builtin.include_tasks:
    file: hardening/main.yml
    apply:
      tags: [enforcement]
  tags: [enforcement, V-206412, V-206437, V-206380, V-206383]

############################################################
# Enforcement — Availability
############################################################
- name: "Availability enforcement"
  ansible.builtin.include_tasks:
    file: availability/main.yml
    apply:
      tags: [enforcement]
  tags: [enforcement, V-206433]

############################################################
# Enforcement — Networking (DNS)
############################################################
- name: "Networking enforcement"
  ansible.builtin.include_tasks:
    file: networking/main.yml
    apply:
      tags: [enforcement]
  tags: [enforcement,
    V-205157, V-205158, V-205160, V-205161, V-205224,
    V-205225, V-205227, V-205228, V-205230, V-205231,
    V-205233, V-205235, V-205236]

############################################################
# Ensure handlers run before validation
############################################################
- name: "Flush handlers"
  meta: flush_handlers

############################################################
# STIG Validation
############################################################
- name: "Run validation tasks"
  include_tasks: validation/main.yml
  tags: [validation]

############################################################
# Post-STIG Health Check
############################################################
- name: "Run post-STIG health check"
  include_tasks: post-health-check.yml
  tags: [health-check, enforcement]