---
# tasks file for stig_freeipa

############################################################
# Backup configs (first-run only, before any STIG changes)
############################################################

- name: "STIG FreeIPA | Backup pre-STIG configs"
  ansible.builtin.include_tasks:
    file: backup-configs.yml
    apply:
      tags: [backup, enforcement]
  tags:
    - backup
    - enforcement

############################################################
# Rollback (restores pre-STIG state from backup)
# Usage: --tags rollback
############################################################

- name: "STIG FreeIPA | Rollback STIG changes"
  ansible.builtin.include_tasks:
    file: rollback-configs.yml
    apply:
      tags: [rollback, never]
  tags:
    - rollback
    - never

############################################################
# Resolve Tomcat paths (shared, runs once)
############################################################

- name: "STIG FreeIPA | Resolve Tomcat paths"
  ansible.builtin.include_tasks:
    file: resolve-tomcat-paths.yml
    apply:
      tags: [enforcement, validation, V-222998, V-222999, V-223000]
  tags:
    - enforcement
    - validation
    - V-222998
    - V-222999
    - V-223000

############################################################
# Resolve DNS facts (shared, runs once)
############################################################

- name: "STIG FreeIPA | Resolve DNS facts"
  ansible.builtin.include_tasks:
    file: resolve-dns-facts.yml
    apply:
      tags: [enforcement, validation, V-205230, V-205231, V-205233, V-205235, V-205236]
  tags:
