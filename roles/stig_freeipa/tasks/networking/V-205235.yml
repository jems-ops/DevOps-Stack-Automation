---
############################################################
# STIG Control: V-205235
# SRG ID: SRG-APP-000516-DNS-000090
# Rule ID: SV-205235r961868
# Severity: CAT II
# Status: NOT APPLICABLE (DNSSEC Not Enabled)
#
# Title:
# DNSSEC must use FIPS-approved algorithms.
#
# Enforcement Strategy:
# - This control is conditional
# - If DNSSEC is NOT enabled → no enforcement required
# - If DNSSEC is enabled → enforce FIPS-approved algorithms
#
# Comments:
# FreeIPA DNS deployment does not use DNSSEC.
# No DNSSEC configuration, key material, or signed zones exist.
#
# Therefore:
# This control is NOT APPLICABLE and requires no enforcement.
#
# Note:
# If DNSSEC is introduced in future:
# - Enforce FIPS-approved algorithms (RSASHA256, ECDSA)
# - Ensure system operates in FIPS mode
# - Validate cryptographic module compliance
############################################################

- name: "V-205235 | Informational - DNSSEC not in use"
  ansible.builtin.debug:
    msg: |
      STIG V-205235 Enforcement:

      DNSSEC is not enabled in this FreeIPA environment.

      No enforcement actions required.

      If DNSSEC is enabled in future:
      - Use FIPS-approved algorithms (RSASHA256/ECDSA)
      - Ensure system operates in FIPS mode
      - Validate cryptographic compliance
