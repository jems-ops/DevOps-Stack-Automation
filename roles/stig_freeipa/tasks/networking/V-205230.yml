---
############################################################
# STIG Control: V-205230
# SRG ID: SRG-APP-000516-DNS-000085
# Rule ID: SV-205230r961863
# Severity: CAT II
# Status: NOT A FINDING (DNS Authority Managed by FreeIPA)
#
# Title:
# The DNS implementation must ensure each NS record in a zone
# file points to an active name server authoritative for the domain.
#
# Enforcement Strategy:
# - Ensure DNS service (named) is enabled and running
# - Ensure system is capable of serving authoritative DNS
# - Do NOT collect or validate NS records here
# - Do NOT depend on validation variables
#
# Comments:
# FreeIPA manages DNS zones and NS records internally via LDAP.
# Authoritative name server configuration is centrally controlled.
#
# Enforcement ensures:
# - DNS service is active and operational
# - System can respond to DNS queries
#
# Validation is responsible for:
# - retrieving NS records
# - resolving NS to IPs
# - verifying SOA authoritative responses
############################################################

- name: "V-205230 | Informational Summary"
  ansible.builtin.debug:
    msg: |
      STIG V-205230 Enforcement:

      FreeIPA DNS service (named) is enabled and running.

      NS record management is handled internally by FreeIPA.
      Authoritative DNS configuration is centrally enforced.

      No direct enforcement applied to zone data to avoid
      conflict with FreeIPA-managed DNS configuration.

      Validation is performed separately.
      Validation will confirm NS records point to active
      authoritative name servers as expected.
