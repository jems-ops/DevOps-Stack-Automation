---
############################################################
# STIG Control: V-206374
# SRG ID: SRG-APP-000141-WSR-000015
# Title: The web server must not perform user management
# Severity: CAT II
# Status: Enforced
#
# Finding Details:
# The use of local authentication mechanisms such as
# AuthUserFile, AuthType Basic/Digest, and Require valid-user
# indicates the web server is performing user management.
# This bypasses centralized authentication systems and may
# introduce security risks such as credential exposure and
# inconsistent access control enforcement.
#
# If any of the following are present, this is a finding:
# - AuthUserFile directives
# - AuthType directives (Basic/Digest)
# - Require valid-user
# - Access to .htaccess or .htpasswd files
#
# Manual Procedure:
# 1. Check for local authentication directives:
#    grep -RsiE 'AuthUserFile|AuthType|Require valid-user' /etc/httpd
#
# 2. Verify .ht* files are not accessible:
#    curl -k -I https://<host>/.htaccess
#
# 3. Verify .htaccess overrides are disabled:
#    grep -Rsi 'AllowOverride' /etc/httpd
#
# Expected Result:
# - No AuthUserFile/AuthType/Require directives
# - HTTP 403 returned for .htaccess/.htpasswd
# - AllowOverride set to None
#
# Comment:
# Local user authentication mechanisms (AuthUserFile, AuthType,
# and Require valid-user) have been removed. Access to .ht* files
# is denied. Authentication is centrally managed via FreeIPA/LDAP.
#
# EXCEPTION: The default <Directory /> Require all denied blocks
# the FreeIPA WSGI script (/usr/share/ipa/wsgi.py) which serves
# the IPA JSON-RPC API. A scoped <Directory> exception is added
# to allow access to the IPA application directory only.
#
# EXCEPTION: ipa.conf is excluded from AuthType removal because
# FreeIPA requires AuthType GSSAPI for Kerberos authentication
# and password-based web login.
############################################################

# ---------------------------------------------------------
# NOTE: .htaccess disable and .ht* file deny directives are
# now managed via the httpd.conf.j2 template (V-264341).
# ---------------------------------------------------------

# ---------------------------------------------------------
# Discover all httpd config files dynamically
# ---------------------------------------------------------
- name: "V-206374 | Find httpd configuration files"
  find:
    paths: /etc/httpd
    patterns: "*.conf"
    recurse: yes
  register: v206374_conf_files

# ---------------------------------------------------------
# Disable AuthUserFile (SAFE - comment instead of delete)
# ---------------------------------------------------------
- name: "V-206374 | Disable AuthUserFile"
  replace:
    path: "{{ item.path }}"
    regexp: '^\s*AuthUserFile\s+.*'
    replace: '# \g<0>  # Disabled by STIG V-206374'
    backup: yes
  loop: "{{ v206374_conf_files.files }}"
  notify: restart httpd

# ---------------------------------------------------------
# Disable AuthType (exclude ipa.conf)
# ---------------------------------------------------------
- name: "V-206374 | Disable AuthType (excluding ipa.conf)"
  replace:
    path: "{{ item.path }}"
    regexp: '^\s*AuthType\s+(?!GSSAPI).*'
    replace: '# \g<0>  # Disabled by STIG V-206374'
    backup: yes
  loop: "{{ v206374_conf_files.files | rejectattr('path', 'search', 'ipa.conf') | list }}"
  notify: restart httpd

# ---------------------------------------------------------
# Disable Require valid-user (exclude ipa.conf)
# ---------------------------------------------------------
- name: "V-206374 | Disable Require valid-user (excluding ipa.conf)"
  replace:
    path: "{{ item.path }}"
    regexp: '^\s*Require\s+valid-user.*'
    replace: '# \g<0>  # Disabled by STIG V-206374'
    backup: yes
  loop: "{{ v206374_conf_files.files | rejectattr('path', 'search', 'ipa.conf') | list }}"
  notify: restart httpd

# ---------------------------------------------------------
# Ensure FreeIPA required directives (idempotent)
# ---------------------------------------------------------
- name: "V-206374 | Ensure AuthType GSSAPI in FreeIPA config"
  lineinfile:
    path: /etc/httpd/conf.d/ipa.conf
    regexp: '^\s*AuthType\s+GSSAPI'
    line: '  AuthType GSSAPI'
    state: present
    backup: yes
  notify: restart httpd

- name: "V-206374 | Ensure Require valid-user in FreeIPA config"
  lineinfile:
    path: /etc/httpd/conf.d/ipa.conf
    regexp: '^\s*Require\s+valid-user'
    line: '  Require valid-user'
    state: present
    backup: yes
  notify: restart httpd

# ---------------------------------------------------------
# FreeIPA WSGI Exception (safe + idempotent)
# ---------------------------------------------------------
- name: "V-206374 | Allow FreeIPA WSGI application access"
  copy:
    dest: /etc/httpd/conf.d/ipa-stig-exception.conf
    content: |
      ############################################################
      # STIG Exception: FreeIPA WSGI Application Access
      # Required by: V-206374
      ############################################################
      <Directory "/usr/share/ipa">
          Require all granted
      </Directory>
    owner: root
    group: root
    mode: '0644'
  notify: restart httpd
