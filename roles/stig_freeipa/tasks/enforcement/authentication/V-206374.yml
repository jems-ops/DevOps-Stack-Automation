############################################################
# STIG Control: V-206374
# SRG ID: SRG-APP-000141-WSR-000015
# Title: The web server must not perform user management
# Severity: CAT II
# Status: Enforced
#
# Fix:
# - Deny access to .ht* files
# - Remove AuthUserFile directives
############################################################

- name: "V-206374 | Ensure .ht* files are denied"
  blockinfile:
    path: /etc/httpd/conf/httpd.conf
    block: |
      <FilesMatch "^\.ht">
          Require all denied
      </FilesMatch>
    marker: "# {mark} ANSIBLE STIG V-206374"
    create: yes
  notify: restart httpd

# ---------------------------------------------------------
# Dynamically discover valid httpd config files
# ---------------------------------------------------------

- name: "V-206374 | Find httpd configuration files"
  find:
    paths: /etc/httpd
    patterns: "*.conf"
    recurse: yes
  register: httpd_conf_files

# ---------------------------------------------------------
# Remove AuthUserFile safely
# ---------------------------------------------------------

- name: "V-206374 | Remove AuthUserFile directives"
  replace:
    path: "{{ item.path }}"
    regexp: '^\s*AuthUserFile\s+.*'
    replace: ''
  loop: "{{ httpd_conf_files.files }}"
  notify: restart httpd
