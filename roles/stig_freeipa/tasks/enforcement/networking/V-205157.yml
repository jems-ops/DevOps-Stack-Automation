---
############################################################
# STIG Control: V-205157
# SRG ID: SRG-APP-000001-DNS-000001
# Severity: CAT II
# Status: NOT A FINDING (Zone Transfer Control via FreeIPA)
#
# Title:
# The DNS implementation must limit the number of concurrent
# sessions for zone transfers to the number of secondary name servers.
#
# Enforcement Strategy:
# - Ensure named (FreeIPA DNS) service is enabled and running
# - Ensure DNS service is integrated with system
# - Do NOT query or parse FreeIPA zone configuration
# - Do NOT duplicate validation logic
#
# Comments:
# FreeIPA manages zone transfer restrictions via LDAP-backed
# DNS configuration (idnsAllowTransfer / allow-transfer).
#
# Enforcement ensures:
# - DNS service is active and capable of enforcing policies
#
# Validation is responsible for:
# - checking zone transfer ACLs
# - verifying no "allow-transfer any"
# - confirming restricted transfer configuration
############################################################

- name: "V-205157 | Ensure named service is enabled"
  systemd:
    name: named
    enabled: yes

- name: "V-205157 | Ensure named service is running"
  systemd:
    name: named
    state: started

- name: "V-205157 | Informational Summary"
  debug:
    msg: |
      STIG V-205157 Enforcement:

      FreeIPA DNS service (named) is enabled and running.

      Zone transfer restrictions are enforced by FreeIPA
      via LDAP-managed DNS configuration.

      No direct enforcement applied to configuration files
      to avoid conflict with FreeIPA-managed DNS settings.

      Validation is performed separately.
      Validation will confirm zone transfer ACLs are properly
      configured and no "allow-transfer any" exists.
      FreeIPA's internal mechanisms ensure compliance with this control.
