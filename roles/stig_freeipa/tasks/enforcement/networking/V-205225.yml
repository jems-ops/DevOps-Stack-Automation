############################################################
# STIG Control: V-205225
# SRG ID: SRG-APP-000504-DNS-000082
# Severity: CAT II
# Status: NOT APPLICABLE (DNSSEC Not Enabled)
#
# Title:
# The DNS implementation must use FIPS-validated cryptographic
# modules when DNSSEC is enabled.
#
# Enforcement Strategy:
# - This control is conditional.
# - If DNSSEC is NOT enabled → no enforcement required.
# - If DNSSEC is enabled → must enforce FIPS-approved algorithms.
#
# Comments:
# FreeIPA DNS deployment does not use DNSSEC.
# No DNSSEC keys, signing policies, or cryptographic operations exist.
#
# Therefore:
# This control is NOT APPLICABLE and requires no enforcement.
#
# Note:
# If DNSSEC is introduced in the future, configuration must ensure:
# - RSASHA256 / ECDSA algorithms
# - FIPS-compliant crypto modules
############################################################

- name: "V-205225 | Informational - DNSSEC not enabled"
  debug:
    msg: |
      STIG V-205225 Enforcement:

      DNSSEC is not enabled in this FreeIPA environment.

      No enforcement actions required.

      If DNSSEC is enabled in future:
      - Enforce FIPS-approved algorithms (RSASHA256/ECDSA)
      - Ensure cryptographic modules operate in FIPS mode
