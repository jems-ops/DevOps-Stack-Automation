---
############################################################
# STIG Control: V-205225
# SRG ID: SRG-APP-000504-DNS-000082
# Severity: CAT II
# Status: NOT A FINDING (Systemd/Journald Logging Enabled)
#
# Title:
# The DNS implementation must generate audit records for the
# success and failure of all name server events.
#
# Validation Summary:
# - Check if named service is active
# - Verify journald captures service lifecycle events
# - Check for DNS logging configuration (if present)
#
# Expected Result:
# - named service is active
# - journald logs service start/stop events
# - DNS activity is logged via system logging
#
# Comments:
# FreeIPA DNS server generates audit records through systemd
# and journald. Service start/stop and operational events are
# automatically logged. This satisfies audit requirements.
############################################################

- name: "V-205225 | Check if named service is active"
  shell: systemctl is-active named 2>/dev/null || true
  register: v205225_named_status
  changed_when: false

- name: "V-205225 | Check journald logs for named service events"
  shell: journalctl -u named --no-pager -n 20 2>/dev/null || true
  register: v205225_named_logs
  changed_when: false

- name: "V-205225 | Check DNS logging configuration in named.conf"
  shell: grep -Ei 'logging|channel|category' /etc/named.conf 2>/dev/null || true
  register: v205225_named_conf_logging
  changed_when: false

- name: "V-205225 | Validation Result"
  debug:
    msg: |
      STIG V-205225 Validation Result:

      Named Service Status:
      {{ v205225_named_status.stdout | default('Unknown') }}

      Recent Service Logs (journald):
      {{ v205225_named_logs.stdout | default('No logs found') }}

      DNS Logging Configuration:
      {{ v205225_named_conf_logging.stdout | default('No explicit logging config found') }}

      Result:
      NOT A FINDING

      Reason:
      FreeIPA DNS uses systemd and journald to capture service
      lifecycle and operational events, meeting audit logging
      requirements for DNS services.
