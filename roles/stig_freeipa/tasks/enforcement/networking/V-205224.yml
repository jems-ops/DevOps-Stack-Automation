---
############################################################
# STIG Control: V-205224
# SRG ID: SRG-APP-000504-DNS-000074
# Severity: CAT II
# Status: NOT A FINDING (Systemd/Journald Logging Enabled)
#
# Title:
# The DNS implementation must generate audit records for the
# success and failure of start and stop of the name server
# service or daemon.
#
# Validation Summary:
# - Verify named service status
# - Validate journald captures start/stop events
# - Confirm service lifecycle logging exists
#
# Expected Result:
# - named service present/active
# - journald contains start/stop logs
# → NOT A FINDING
#
# Comments:
# FreeIPA DNS relies on systemd and journald for audit logging.
# All service lifecycle events (start/stop/restart) are captured
# automatically, satisfying audit requirements.
############################################################

- name: "V-205224 | Check recent lifecycle events from journald"
  shell: journalctl -u named --no-pager | grep -Ei 'start|stop|starting|stopping|listening|no longer listening|shutting|running|loading' | tail -n 20 || true
  register: v205224_named_lifecycle_logs
  changed_when: false
  when: dns_named_active | bool

- name: "V-205224 | Enforcement Summary"
  debug:
    msg:
      named_service_active: "{{ dns_named_active }}"
      lifecycle_logs_found: "{{ (v205224_named_lifecycle_logs.stdout | default('')) | length > 0 }}"
