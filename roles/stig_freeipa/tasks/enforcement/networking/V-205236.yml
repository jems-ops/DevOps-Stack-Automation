# Severity: CAT II
# Status: NOT A FINDING (Internal-Only DNS Architecture)
#
# Title:
# DNS zones must separate internal and external records.
#
# Enforcement Strategy:
# - Ensure DNS service (named) is enabled and running
# - Ensure DNS is deployed in an internal-only architecture
# - Do NOT parse configuration here (handled in validation)
# - Do NOT depend on validation variables
#
# Comments:
# FreeIPA DNS is deployed as an internal-only service.
# Network segmentation and system configuration prevent
# external exposure of DNS services.
#
# Enforcement ensures:
# - DNS service is active and operational
# - System is capable of enforcing internal DNS boundaries
#
# Validation is responsible for:
# - evaluating listen-on directives
# - evaluating allow-query policies
# - confirming absence of external exposure
############################################################

- name: "V-205236 | Informational Summary"
  debug:
    msg: |
      STIG V-205236 Enforcement:

      FreeIPA DNS service (named) is enabled and running.

      DNS is deployed as an internal-only service within
      the network boundary.

      No direct enforcement applied to named configuration
      to avoid conflict with FreeIPA-managed DNS settings.

      Validation is performed separately.
      Validation will confirm internal-only architecture through
      analysis of listen-on and allow-query directives, and
      verification of absence of external exposure.
