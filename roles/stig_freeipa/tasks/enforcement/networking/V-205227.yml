############################################################
# STIG Control: V-205227
# SRG ID: SRG-APP-000516-DNS-000077
# Severity: CAT II
# Status: NOT APPLICABLE (DNSSEC Not Enabled)
#
# Title:
# The salt value for zones signed using NSEC3 RRs must be
# changed every time the zone is completely re-signed.
#
# Enforcement Strategy:
# - This control is conditional
# - If DNSSEC (NSEC3) is NOT enabled → no enforcement required
# - If DNSSEC with NSEC3 is enabled → salt rotation must be enforced
#
# Comments:
# FreeIPA DNS deployment does not use DNSSEC.
# No signed zones, NSEC3 records, or cryptographic parameters exist.
#
# Therefore:
# This control is NOT APPLICABLE and requires no enforcement.
#
# Note:
# If DNSSEC with NSEC3 is introduced in future:
# - Salt values must be rotated during zone re-signing
# - Signing policies must enforce periodic re-generation
############################################################

- name: "V-205227 | Informational - DNSSEC NSEC3 not in use"
  debug:
    msg: |
      STIG V-205227 Enforcement:

      DNSSEC (including NSEC3) is not enabled in this FreeIPA environment.

      No enforcement actions required.

      If DNSSEC with NSEC3 is enabled in future:
      - Ensure salt rotation during zone re-signing
      - Enforce secure DNSSEC signing policies
      - Validate presence of NSEC3 records and proper salt management

