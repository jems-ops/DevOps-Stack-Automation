---
############################################################
# STIG Control: V-205158
# SRG ID: SRG-APP-000001-DNS-000115
# Severity: CAT II
# Status: NOT A FINDING (Dynamic Update Control via FreeIPA)
#
# Title:
# The DNS implementation must limit the number of concurrent
# client connections to the number of allowed dynamic update clients.
#
# Enforcement Strategy:
# - Ensure named (FreeIPA DNS) service is enabled
# - Ensure IPA DNS capability is active
# - Do NOT modify or parse update-policy (handled by FreeIPA)
# - Do NOT duplicate validation logic
#
# Comments:
# FreeIPA manages DNS update-policy via LDAP and enforces
# GSS-TSIG (Kerberos-based authentication).
#
# Enforcement ensures:
# - DNS service is active and managed
# - System is capable of enforcing update restrictions
#
# Validation is responsible for:
# - verifying update-policy presence
# - checking krb5-self enforcement
# - confirming restricted update scope
############################################################

- name: "V-205158 | Ensure named service is enabled"
  systemd:
    name: named
    enabled: yes

- name: "V-205158 | Ensure named service is running"
  systemd:
    name: named
    state: started

- name: "V-205158 | Informational Summary"
  debug:
    msg: |
      STIG V-205158 Enforcement:

      FreeIPA DNS service (named) is enabled and running.

      Dynamic update restrictions are enforced by FreeIPA
      via LDAP-managed update-policy using GSS-TSIG (Kerberos).

      No direct enforcement applied to configuration files
      to avoid conflict with FreeIPA-managed DNS settings.

      Validation is performed separately.
      Validation will confirm:
      - update-policy presence in LDAP
      - krb5-self enforcement for updates
      - restricted update scope (e.g., specific zones)
      - absence of open update policies in named.conf
