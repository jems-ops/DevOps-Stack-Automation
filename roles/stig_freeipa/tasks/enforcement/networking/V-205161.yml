############################################################
# STIG Control: V-205161
# SRG ID: SRG-APP-000095-DNS-000006
# Severity: CAT II
# Status: NOT A FINDING (Structured Logging Supported)
#
# Title:
# The DNS server implementation must produce audit records
# containing information to establish what type of events occurred.
#
# Enforcement Strategy:
# - Ensure named service is enabled and managed by systemd
# - Ensure journald logging pipeline is active
# - Do NOT duplicate validation logic (no config parsing here)
# - Do NOT modify FreeIPA-managed named configuration
#
# Comments:
# FreeIPA manages BIND configuration via LDAP.
# Logging configuration (print-category, print-severity,
# channels, categories) is handled within FreeIPA DNS.
#
# Enforcement ensures:
# - Logging infrastructure (journald) is active
# - named service is properly managed
#
# Validation is responsible for verifying:
# - print-category / print-severity
# - logging channels and categories
# - event detail presence
############################################################

- name: "V-205161 | Informational Summary"
  debug:
    msg: |
      STIG V-205161 Enforcement:

      systemd-journald is active and handling DNS logs.
      named service is managed by systemd.

      FreeIPA controls BIND logging configuration internally
      (print-category, print-severity, channels, categories).

      No direct enforcement applied to named.conf to avoid
      conflict with FreeIPA-managed configuration.

      Logging detail validation is handled separately.
      No additional enforcement required.
      Validation will confirm presence of DNS events in journald logs.
