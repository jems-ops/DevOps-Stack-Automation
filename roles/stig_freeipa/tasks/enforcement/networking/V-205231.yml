############################################################
# STIG Control: V-205231
# SRG ID: SRG-APP-000516-DNS-000090
# Rule ID: SV-205231r961864
# Severity: CAT II
# Status: NOT APPLICABLE (DNSSEC Not Enabled)
#
# Title:
# DNSSEC key files must be protected or removed.
#
# Enforcement Strategy:
# - This control is conditional
# - If DNSSEC is NOT enabled → no enforcement required
# - If DNSSEC is enabled → enforce strict file permissions
#
# Comments:
# FreeIPA DNS deployment does not use DNSSEC.
# No DNSSEC key files (*.key, *.private) are present.
#
# Therefore:
# This control is NOT APPLICABLE and requires no enforcement.
#
# Note:
# If DNSSEC is introduced in future:
# - Key files must be owned by root:named
# - Permissions must be set to 600
# - Access must be restricted to authorized processes only
############################################################

- name: "V-205231 | Informational - No DNSSEC key enforcement required"
  debug:
    msg: |
      STIG V-205231 Enforcement:

      DNSSEC is not enabled in this FreeIPA environment.

      No DNSSEC key files are present.

      No enforcement actions required.

      If DNSSEC is enabled in future:
      - Ensure key files have permissions 600
      - Ensure ownership is root:named
      - Restrict access to authorized services only
