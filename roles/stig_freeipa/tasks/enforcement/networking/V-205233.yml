---
############################################################
# STIG Control: V-205233
# SRG ID: SRG-APP-000516-DNS-000095
# Rule ID: SV-205233r961866
# Severity: CAT II
# Status: NOT A FINDING (DNS Managed by FreeIPA)
#
# Title:
# DNS zone transfers must be restricted and consistent across
# authoritative name servers.
#
# Enforcement Strategy:
# - Ensure DNS service (named) is enabled and running
# - Ensure DNS infrastructure is centrally managed
# - Do NOT collect NS records here
# - Do NOT duplicate validation logic
#
# Comments:
# FreeIPA manages DNS zones and replication centrally via LDAP.
# Consistency between authoritative servers is handled internally.
#
# Enforcement ensures:
# - DNS service is active and operational
# - System is capable of serving authoritative DNS
#
# Validation is responsible for:
# - retrieving NS records
# - identifying multiple authoritative servers
# - determining replication consistency requirements
############################################################

- name: "V-205233 | Ensure named service is enabled"
  systemd:
    name: named
    enabled: yes

- name: "V-205233 | Ensure named service is running"
  systemd:
    name: named
    state: started

- name: "V-205233 | Informational Summary"
  debug:
    msg: |
      STIG V-205233 Enforcement:

      FreeIPA DNS service (named) is enabled and running.

      DNS zone management and replication are handled
      centrally by FreeIPA.

      No direct enforcement applied to DNS records
      to avoid conflict with FreeIPA-managed configuration.

      Validation is performed separately.
      Validation will confirm zone transfer restrictions and
      consistency requirements based on authoritative server roles.
