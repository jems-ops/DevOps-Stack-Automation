---
############################################################
# STIG Control: V-222998
# SRG ID: SRG-APP-000504-AS-000229
# Rule ID: SV-222998r961827
# Severity: CAT II
#
# Title:
# Changes to $CATALINA_HOME/bin folder must be logged.
#
# Description:
# The Tomcat bin directory contains startup/control scripts.
# Any modification must be audited for forensic visibility.
#
# Finding Details:
# If audit rules do not include:
# -w $CATALINA_HOME/bin -p wa -k tomcat
# then this is a finding.
#
# Manual Procedure:
# auditctl -l | grep <resolved_tomcat_bin_path>
#
# Expected:
# -w <path>/bin -p wa -k tomcat
#
# Comment:
# Audit rules are configured persistently under /etc/audit/rules.d/
# and applied using augenrules. FreeIPA environments resolve symlink
# paths to ensure correct audit coverage.
############################################################

# ---------------------------------------------------------
# Detect FreeIPA / PKI Tomcat (symlink-aware)
# ---------------------------------------------------------
- name: "V-222998 | Check PKI Tomcat path"
  stat:
    path: /var/lib/pki/pki-tomcat/bin
  register: v222998_pki_bin

# ---------------------------------------------------------
# Resolve real path (important for symlink)
# ---------------------------------------------------------
- name: "V-222998 | Resolve real Tomcat bin path"
  command: readlink -f /var/lib/pki/pki-tomcat/bin
  register: v222998_bin_real
  changed_when: false
  when: v222998_pki_bin.stat.exists

# ---------------------------------------------------------
# Fallback (standard Tomcat)
# ---------------------------------------------------------
- name: "V-222998 | Set fallback Tomcat bin path"
  set_fact:
    v222998_bin_path: "/usr/share/tomcat/bin"
  when: not v222998_pki_bin.stat.exists

- name: "V-222998 | Set resolved Tomcat bin path"
  set_fact:
    v222998_bin_path: "{{ v222998_bin_real.stdout }}"
  when: v222998_pki_bin.stat.exists

# ---------------------------------------------------------
# Ensure audit rule is present (persistent)
# ---------------------------------------------------------
- name: "V-222998 | Configure audit rule for Tomcat bin"
  lineinfile:
    path: /etc/audit/rules.d/tomcat.rules
    line: "-w {{ v222998_bin_path }} -p wa -k tomcat"
    create: yes
    state: present
    mode: '0640'
  notify: reload audit rules
