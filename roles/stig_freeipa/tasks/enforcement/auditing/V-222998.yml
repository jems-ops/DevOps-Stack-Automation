---
############################################################
# STIG Control: V-222998
# SRG ID: SRG-APP-000504-AS-000229
# Rule ID: SV-222998r961827
# Severity: CAT II
#
# Title:
# Changes to $CATALINA_HOME/bin folder must be logged.
#
# Description:
# The Tomcat bin directory contains startup/control scripts.
# Any modification must be audited for forensic visibility.
#
# Finding Details:
# If audit rules do not include:
# -w $CATALINA_HOME/bin -p wa -k tomcat
# then this is a finding.
#
# Implementation:
# Configure auditd to watch Tomcat bin directory for write/attribute changes.
#
# Manual Procedure:
# auditctl -l | grep $CATALINA_HOME/bin
#
# Expected:
# -w <path>/bin -p wa -k tomcat
#
# Comments:
# Uses persistent audit rules via /etc/audit/rules.d/
############################################################

- name: "V-222998 | Resolve real path for Tomcat bin (follows symlinks)"
  ansible.builtin.shell: |
    for p in /var/lib/pki/pki-tomcat/bin /usr/share/pki/server/bin /usr/share/tomcat/bin; do
      if [ -e "$p" ]; then readlink -f "$p"; exit 0; fi
    done
    # Fallback: standard Tomcat
    if [ -f /etc/systemd/system/tomcat.service ]; then
      CATALINA=$(grep -i 'catalina.home\|catalina.base' /etc/systemd/system/tomcat.service 2>/dev/null | awk -F= '{print $2}' | head -1)
      [ -n "$CATALINA" ] && readlink -f "$CATALINA/bin" && exit 0
    fi
    exit 1
  register: tomcat_bin_resolved
  changed_when: false
  failed_when: tomcat_bin_resolved.stdout == ""

- name: "V-222998 | Set Tomcat bin path"
  set_fact:
    tomcat_bin_path: "{{ tomcat_bin_resolved.stdout | trim }}"

- name: "V-222998 | Ensure audit rule exists for Tomcat bin"
  lineinfile:
    path: /etc/audit/rules.d/tomcat.rules
    line: "-w {{ tomcat_bin_path }} -p wa -k tomcat"
    create: yes
    state: present
  notify: restart auditd
