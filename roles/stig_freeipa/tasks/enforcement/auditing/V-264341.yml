---
############################################################
# STIG Control: V-264341
# Severity: CAT II
#
# Title:
# The web server must automatically generate audit records
# of the enforcement actions.
#
# Description:
# The web server must generate audit records for enforcement
# actions to support accountability and forensic analysis.
#
# Finding Details:
# If logging directives (CustomLog, ErrorLog) are not configured
# or auditd is not enabled, enforcement actions and access events
# may not be recorded. This results in lack of traceability and
# inability to perform forensic analysis.
#
# Manual Procedure:
# grep -i 'CustomLog\|ErrorLog' /etc/httpd/conf/httpd.conf
# ls -l /var/log/httpd/
# systemctl status auditd
#
# Expected:
# - CustomLog and ErrorLog configured
# - Logs stored under /var/log/httpd
# - auditd service installed and running
#
# Comment:
# Apache logging and auditd ensure that enforcement actions,
# access attempts, and system-level changes are recorded.
############################################################

- name: "V-264341 | Ensure web logging and auditd are configured"
  become: true
  block:

    ########################################################
    # Apache Logging
    ########################################################

    - name: "V-264341 | Ensure CustomLog directive"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^CustomLog'
        line: 'CustomLog "/var/log/httpd/access_log" combined'
        create: yes
      notify: restart httpd

    - name: "V-264341 | Ensure ErrorLog directive"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^ErrorLog'
        line: 'ErrorLog "/var/log/httpd/error_log"'
        create: yes
      notify: restart httpd

    ########################################################
    # Ensure auditd installed
    ########################################################

    - name: "V-264341 | Check if auditd is already installed"
      ansible.builtin.command: rpm -q audit
      register: auditd_installed
      changed_when: false
      failed_when: false

    - name: "V-264341 | Ensure auditd installed"
      package:
        name: audit
        state: present
      notify: restart auditd
      when: auditd_installed.rc != 0
