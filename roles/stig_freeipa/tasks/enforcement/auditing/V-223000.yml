---
############################################################
# STIG Control: V-223000
# SRG ID: SRG-APP-000504-AS-000229
# Rule ID: SV-223000r961827
# Severity: CAT II
#
# Title:
# Changes to $CATALINA_HOME/lib/ folder must be logged.
#
# Description:
# The Tomcat lib directory contains Java archive (jar)
# library files. Changes must be audited for forensic
# visibility and integrity.
#
# Finding Details:
# If audit rules do not include:
# -w $CATALINA_HOME/lib -p wa -k tomcat
# then this is a finding.
#
# Implementation:
# Configure auditd to watch Tomcat lib directory for
# write/attribute changes.
#
# Manual Procedure:
# auditctl -l | grep $CATALINA_HOME/lib
#
# Expected:
# -w <path>/lib -p wa -k tomcat
#
# Comments:
# Uses persistent audit rules via /etc/audit/rules.d/
############################################################

- name: "V-223000 | Resolve real path for Tomcat lib (follows symlinks)"
  ansible.builtin.shell: |
    for p in /var/lib/pki/pki-tomcat/lib /usr/share/pki/server/lib; do
      if [ -e "$p" ]; then readlink -f "$p"; exit 0; fi
    done
    # Fallback: standard Tomcat
    if [ -f /etc/systemd/system/tomcat.service ]; then
      CATALINA=$(grep -i 'catalina.home\|catalina.base' /etc/systemd/system/tomcat.service 2>/dev/null | awk -F= '{print $2}' | head -1)
      [ -n "$CATALINA" ] && readlink -f "$CATALINA/lib" && exit 0
    fi
    exit 1
  register: tomcat_lib_resolved
  changed_when: false
  failed_when: tomcat_lib_resolved.stdout == ""

- name: "V-223000 | Set Tomcat lib path"
  set_fact:
    tomcat_lib_path: "{{ tomcat_lib_resolved.stdout | trim }}"

- name: "V-223000 | Ensure audit rule exists for Tomcat lib"
  lineinfile:
    path: /etc/audit/rules.d/tomcat.rules
    line: "-w {{ tomcat_lib_path }} -p wa -k tomcat"
    create: yes
    state: present
  notify: restart auditd
