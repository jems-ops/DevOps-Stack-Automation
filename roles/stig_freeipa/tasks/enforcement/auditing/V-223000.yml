---
############################################################
# STIG Control: V-223000
# SRG ID: SRG-APP-000504-AS-000229
# Rule ID: SV-223000r961827
# Severity: CAT II
#
# Title:
# Changes to $CATALINA_HOME/lib/ folder must be logged.
#
# Description:
# The Tomcat lib directory contains Java archive (jar)
# library files. Changes must be audited for forensic
# visibility and integrity.
#
# Finding Details:
# If audit rules do not include:
# -w $CATALINA_HOME/lib -p wa -k tomcat
# then this is a finding.
#
# Manual Procedure:
# auditctl -l | grep <resolved_tomcat_lib_path>
#
# Expected:
# -w <path>/lib -p wa -k tomcat
#
# Comment:
# Audit rules are configured persistently under /etc/audit/rules.d/
# and applied using augenrules. FreeIPA environments resolve symlink
# paths to ensure correct audit coverage.
############################################################

# ---------------------------------------------------------
# Detect FreeIPA / PKI Tomcat lib path
# ---------------------------------------------------------
- name: "V-223000 | Check PKI Tomcat lib path"
  stat:
    path: /var/lib/pki/pki-tomcat/lib
  register: v223000_pki_lib

# ---------------------------------------------------------
# Resolve real path (symlink-aware)
# ---------------------------------------------------------
- name: "V-223000 | Resolve real Tomcat lib path"
  command: readlink -f /var/lib/pki/pki-tomcat/lib
  register: v223000_lib_real
  changed_when: false
  when: v223000_pki_lib.stat.exists

# ---------------------------------------------------------
# Fallback (standard Tomcat)
# ---------------------------------------------------------
- name: "V-223000 | Set fallback Tomcat lib path"
  set_fact:
    v223000_lib_path: "/usr/share/tomcat/lib"
  when: not v223000_pki_lib.stat.exists

- name: "V-223000 | Set resolved Tomcat lib path"
  set_fact:
    v223000_lib_path: "{{ v223000_lib_real.stdout }}"
  when: v223000_pki_lib.stat.exists

# ---------------------------------------------------------
# Configure persistent audit rule
# ---------------------------------------------------------
- name: "V-223000 | Configure audit rule for Tomcat lib"
  lineinfile:
    path: /etc/audit/rules.d/tomcat.rules
    line: "-w {{ v223000_lib_path }} -p wa -k tomcat"
    create: yes
    state: present
    mode: '0640'
  notify: reload audit rules
