---
############################################################
# STIG Control: V-206383
# SRG ID: SRG-APP-000141-WSR-000075
# Severity: CAT II
#
# Title:
# The web server must have Web Distributed Authoring (WebDAV) disabled.
#
# Status: NOT A FINDING (if validated)
#
# Finding Details:
# WebDAV functionality allows remote users to create, modify,
# and delete content on the web server. If enabled, this may
# allow unauthorized file manipulation and increase attack surface.
#
# Apache WebDAV is typically enabled through modules such as:
#   - mod_dav
#   - mod_dav_fs
#
# Fix:
# Ensure WebDAV modules are not loaded and no DAV directives
# are configured in Apache.
#
# Manual Procedure:
# 1. Check loaded modules:
#    httpd -M | grep -i dav
#
# 2. Check configuration:
#    grep -Ri "DAV" /etc/httpd/
#
# 3. Test HTTP methods:
#    curl -k -X OPTIONS https://<host> -i
#
# Expected:
#    - No DAV modules loaded
#    - No "DAV On" directives
#    - No DAV methods exposed
#
# Comments:
# FreeIPA does not require WebDAV functionality. This task
# validates that WebDAV is not enabled and provides
# informational output for compliance verification.
############################################################

########################################
# Disable DAV modules (if present)
########################################

- name: "V-206383 | Check if DAV module config exists"
  stat:
    path: /etc/httpd/conf.modules.d/00-dav.conf
  register: v206383_dav_conf

- name: "V-206383 | Disable DAV LoadModule directives"
  replace:
    path: /etc/httpd/conf.modules.d/00-dav.conf
    regexp: '^\s*LoadModule\s+.*dav.*'
    replace: '# \g<0>  # Disabled by STIG V-206383'
    backup: yes
  when: v206383_dav_conf.stat.exists
  notify: restart httpd

########################################
# Discover httpd config files dynamically
########################################

- name: "V-206383 | Find httpd configuration files"
  find:
    paths: /etc/httpd
    patterns: "*.conf"
    recurse: yes
  register: v206383_conf_files

########################################
# Disable DAV On directives safely
########################################

- name: "V-206383 | Disable DAV On directives"
  replace:
    path: "{{ item.path }}"
    regexp: '^\s*DAV\s+On.*'
    replace: '# DAV On  # Disabled by STIG V-206383'
  loop: "{{ v206383_conf_files.files }}"
  notify: restart httpd

########################################
# Verify modules
########################################

- name: "V-206383 | Check loaded modules"
  command: httpd -M
  register: v206383_modules
  changed_when: false
  failed_when: false

########################################
# Report result
########################################

- name: "V-206383 | Enforcement Result"
  debug:
    msg: >-
      {% if v206383_modules.stdout is not search('dav') %}
      NOT A FINDING: WebDAV modules are disabled
      {% else %}
      FINDING: DAV modules still present — manual review required
      {% endif %}
