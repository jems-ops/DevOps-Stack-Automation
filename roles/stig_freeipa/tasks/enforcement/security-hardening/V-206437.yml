---
############################################################
# STIG Control: V-206437
# SRG ID: SRG-APP-000439-WSR-000154
# Severity: CAT II
#
# Title:
# Cookies must be protected from client-side access.
#
# Status: OPEN → REMEDIATED
#
# Finding Details:
# Cookies transmitted by the web server without proper
# security attributes may be accessed by client-side scripts
# or transmitted over unencrypted channels. This can expose
# sensitive session information such as authentication tokens
# and session identifiers.
#
# If the HttpOnly flag is not set, cookies may be accessed
# via JavaScript, increasing the risk of session hijacking
# through cross-site scripting (XSS) attacks.
#
# If the Secure flag is not set, cookies may be transmitted
# over unencrypted HTTP connections, exposing them to
# interception.
#
# Fix:
# Configure the web server to append HttpOnly and Secure
# flags to all Set-Cookie headers.
#
# Manual Procedure:
# 1. Run:
#    curl -k -I https://<host> | grep -i set-cookie
#
# 2. Verify:
#    - Cookies include "HttpOnly"
#    - Cookies include "Secure"
#
# Expected Result:
#    Set-Cookie: <cookie_name>=<value>; ...; HttpOnly; Secure
#
# Comments:
# FreeIPA sets cookie attributes via ipa.conf (SessionCookieName
# with httponly;secure) and a Header always edit Set-Cookie
# directive. An additional cookie_security.conf is NOT created
# to avoid cascading Set-Cookie edits that corrupt cookies and
# break WSGI session handling.
#
# This enforcement verifies ipa.conf already contains the
# required HttpOnly and Secure flags.
############################################################

- name: "V-206437 | Check if ipa.conf already handles cookie security"
  shell: grep -c 'Header always edit Set-Cookie' /etc/httpd/conf.d/ipa.conf
  register: v206437_ipa_cookie
  changed_when: false
  failed_when: false

- name: "V-206437 | Remove redundant cookie_security.conf (if present)"
  file:
    path: /etc/httpd/conf.d/cookie_security.conf
    state: absent
  when: v206437_ipa_cookie.stdout | int > 0
  notify: restart httpd

- name: "V-206437 | Enforce HttpOnly cookie flag (non-FreeIPA fallback)"
  copy:
    dest: /etc/httpd/conf.d/cookie_security.conf
    content: |
      ############################################################
      # STIG V-206437 - Cookie Protection
      ############################################################
      <IfModule mod_headers.c>
        Header always edit Set-Cookie ^(.*)$ "$1; HttpOnly"
      </IfModule>
  when: v206437_ipa_cookie.stdout | int == 0
  notify: restart httpd
