---
############################################################
# STIG Control: V-206433
# SRG ID: SRG-APP-000516-WSR-000174
# Rule Title: The web server must be tuned to handle expected traffic and prevent DoS conditions
# Severity: CAT II
# Status: NOT A FINDING
#
# Finding Details:
# The web server and supporting components were not fully tuned to handle
# expected operational workload. Apache configuration lacked explicit worker
# and connection limits (e.g., MaxRequestWorkers, ServerLimit, Timeout).
#
# FreeIPA Directory Server (389-DS) tuning parameters were not configured
# under cn=config, and no corresponding entries were present in:
# /etc/dirsrv/slapd-*/dse.ldif
#
# OS-level file descriptor limits (ulimit -n) were set too low (1024),
# increasing the risk of resource exhaustion and potential DoS conditions.
#
# Fix Text:
# Analyze expected user traffic and tune all system layers:
# - Apache worker/process limits
# - Directory Server (389-DS) connection limits
# - OS resource limits (file descriptors)
#
# Implementation Summary:
# - Apache tuned via /etc/httpd/conf.d/tuning.conf
# - FreeIPA LDAP (389-DS) tuned using ldapmodify under cn=config
# - OS file descriptor limits increased to 65536
# - systemd limits aligned with OS limits
#
# Manual Procedure:
# Verify Apache configuration:
#   grep -E 'MaxRequestWorkers|ServerLimit|Timeout' /etc/httpd/conf.d/
#
# Verify OS limits:
#   ulimit -n
#
# Verify LDAP tuning:
#   grep nsslapd-maxdescriptors /etc/dirsrv/slapd-*/dse.ldif
#
# Expected Result:
# - Apache has defined worker and timeout limits
# - OS limits >= 65536 - important but not aligned with this STIG
# - LDAP configured with nsslapd-maxdescriptors - important but not aligned with this STIG
#
# Comments:
# Apache is tuned with appropriate worker limits, timeouts, and connection handling settings to prevent resource exhaustion and mitigate DoS conditions under expected traffic loads.

############################################################

############################
# Apache Tuning
############################
- name: "V-206433 | Configure Apache DoS tuning"
  copy:
    dest: /etc/httpd/conf.d/tuning.conf
    content: |
      # STIG V-206433 Apache DoS Tuning
      ServerLimit 150
      MaxRequestWorkers 150
      Timeout 60
      KeepAlive On
      KeepAliveTimeout 30
      MaxKeepAliveRequests 100
  notify: restart httpd
