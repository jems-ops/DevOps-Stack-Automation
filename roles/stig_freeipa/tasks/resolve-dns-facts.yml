---
############################################################
# Shared DNS Fact Resolution for Networking STIG Controls
#
# Gathers common DNS facts used by V-205230 through V-205236.
# Runs once; all networking controls reference these facts.
#
# Facts set:
#   dns_domain              - system DNS domain (hostname -d)
#   dns_ns_records          - NS record list for the domain
#   dns_ns_ips              - resolved IPs for each NS record
#   dns_soa_responses       - SOA responses per NS (authority check)
#   dns_named_conf          - full /etc/named.conf content
#   dns_listen_on           - listen-on directives from named.conf
#   dns_allow_query         - allow-query directives from named.conf
#   dns_dnssec_config       - whether dnssec-enable/validation is set
#   dns_dnssec_keys         - DNSSEC key files found (find result)
#   dns_dnssec_records      - files containing RRSIG/DNSKEY/NSEC
#   dns_zone_files          - zone-related files under /var/named
############################################################

# ---- Domain & NS Records ----

- name: "DNS Facts | Detect domain"
  command: hostname -d
  register: _dns_domain_raw
  changed_when: false

- name: "DNS Facts | Set dns_domain"
  set_fact:
    dns_domain: "{{ _dns_domain_raw.stdout | trim }}"

- name: "DNS Facts | Query NS records"
  command: "dig NS {{ dns_domain }} +short"
  register: _dns_ns_raw
  changed_when: false

- name: "DNS Facts | Set dns_ns_records"
  set_fact:
    dns_ns_records: "{{ _dns_ns_raw.stdout_lines }}"

- name: "DNS Facts | Resolve NS to IP"
  command: "dig A {{ item | trim }} +short"
  loop: "{{ dns_ns_records }}"
  register: _dns_ns_ips_raw
  changed_when: false

- name: "DNS Facts | Set dns_ns_ips"
  set_fact:
    dns_ns_ips: "{{ _dns_ns_ips_raw.results | map(attribute='stdout') | list }}"

- name: "DNS Facts | Query SOA per NS"
  command: "dig SOA {{ dns_domain }} @{{ item | trim }} +short"
  loop: "{{ dns_ns_records }}"
  register: _dns_soa_raw
  changed_when: false

- name: "DNS Facts | Set dns_soa_responses"
  set_fact:
    dns_soa_responses: "{{ _dns_soa_raw.results | map(attribute='stdout') | list }}"

# ---- Named Configuration ----

- name: "DNS Facts | Read named.conf"
  slurp:
    path: /etc/named.conf
  register: _dns_named_raw
  ignore_errors: true

- name: "DNS Facts | Set dns_named_conf"
  set_fact:
    dns_named_conf: "{{ (_dns_named_raw.content | b64decode) if _dns_named_raw.content is defined else '' }}"

- name: "DNS Facts | Extract listen-on"
  set_fact:
    dns_listen_on: "{{ dns_named_conf | regex_findall('listen-on[^;]*;') }}"

- name: "DNS Facts | Extract allow-query"
  set_fact:
    dns_allow_query: "{{ dns_named_conf | regex_findall('allow-query[^;]*;') }}"

# ---- DNSSEC State ----

- name: "DNS Facts | Detect DNSSEC config"
  set_fact:
    dns_dnssec_config: "{{ dns_named_conf is search('dnssec-enable|dnssec-validation', ignorecase=True) }}"

- name: "DNS Facts | Find DNSSEC key files"
  find:
    paths: /var/named
    patterns: "*.key,*.private"
  register: dns_dnssec_keys
  ignore_errors: true

- name: "DNS Facts | Find signed DNS records"
  find:
    paths: /var/named
    contains: "RRSIG|DNSKEY|NSEC"
    file_type: file
  register: dns_dnssec_records
  ignore_errors: true

# ---- Zone Files ----

- name: "DNS Facts | Discover zone files"
  find:
    paths: /var/named
    file_type: file
  register: dns_zone_files
  ignore_errors: true
