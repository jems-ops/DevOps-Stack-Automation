############################################################
# STIG Control: V-205160
# SRG ID: SRG-APP-000089-DNS-000005
# Severity: CAT II
# Status: NOT A FINDING (Audit Generation Infrastructure Enabled)
#
# Title:
# The DNS server implementation must be configured to provide
# audit record generation capability for DoD-defined auditable
# events within all DNS server components.
#
# Enforcement Strategy:
# - Ensure journald (logging backend) is active
# - Ensure named service is managed by systemd
# - Do NOT duplicate validation logic (no log parsing here)
#
# Comments:
# FreeIPA DNS relies on systemd journald and BIND logging.
# Audit record generation is handled automatically.
#
# Enforcement ensures:
# - Logging infrastructure exists
# - DNS service is integrated with system logging
#
# Validation is responsible for:
# - verifying audit events exist
# - checking success/failure logging
# - confirming unauthorized access logs
############################################################

- name: "V-205160 | Informational Summary"
  ansible.builtin.debug:
    msg: |
      STIG V-205160 Enforcement:

      systemd-journald is active and configured.
      named service is managed by systemd.

      Audit record generation is handled automatically
      through journald and BIND logging.

      No additional enforcement required.
      Validation will confirm presence of relevant audit events
      in journald logs.
