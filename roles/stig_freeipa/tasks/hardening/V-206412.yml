---
############################################################
# STIG Control: V-206412
# SRG ID: SRG-APP-000266-WSR-000159
# Severity: CAT II
#
# Title:
# Warning and error messages must minimize web server identity.
#
# Status: OPEN → REMEDIATED
#
# Finding Details:
# The Apache web server exposes detailed information in HTTP
# response headers, including version, OS, OpenSSL, and modules.
# This information can be used by attackers for fingerprinting
# and exploitation planning.
#
# Even though network protections (VLANs, firewalls, auth flows)
# exist, STIG requires application-level hardening to minimize
# disclosure.
#
# Fix:
# Configure Apache to suppress version and module information
# using ServerTokens, ServerSignature, and mod_headers.
#
# Manual Procedure:
# 1. Run:
#    curl -k -I https://<host>
# 2. Verify that:
#    - No version or module info is present
#    - Server header is minimal (e.g., "Apache")
#
# Expected:
#    Server: Apache
#
# Comments:
# This control ensures attackers cannot fingerprint the web
# server based on response headers or error messages.
# Web server configured to minimize information disclosure by restricting server tokens and disabling server signatures. Additional header hardening applied as defense-in-depth.
############################################################

- name: "V-206412 | Configure minimal server identity"
  ansible.builtin.copy:
    dest: /etc/httpd/conf.d/security.conf
    content: |
      ############################################################
      # STIG V-206412 - Minimize Information Disclosure
      ############################################################
      ServerTokens Prod
      ServerSignature Off

      # Optional hardening
      Header always unset Server
      Header always set Server "Apache"
  notify: restart httpd
