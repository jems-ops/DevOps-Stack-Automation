---
############################################################
# STIG Control: V-206374
#
# Validation Description:
# - .htaccess usage disabled
# - .ht* files not accessible (403)
# - No AuthUserFile/AuthType/Require valid-user present
#
# Expected:
# - AllowOverride None present
# - HTTP 403 for .htaccess
# - No local auth directives
############################################################

# ---------------------------------------------------------
# Check .htaccess HTTP access
# ---------------------------------------------------------
- name: "V-206374 | Check .htaccess access"
  ansible.builtin.shell: "curl -k -s -o /dev/null -w '%{http_code}' https://localhost/.htaccess || true"
  register: v206374_http
  changed_when: false

# ---------------------------------------------------------
# Check AllowOverride None
# ---------------------------------------------------------
- name: "V-206374 | Check AllowOverride"
  ansible.builtin.shell: "grep -Rsi 'AllowOverride None' /etc/httpd || true"
  register: v206374_override
  changed_when: false

# ---------------------------------------------------------
# Check for forbidden directives (excludes ipa.conf —
# FreeIPA requires AuthType GSSAPI and Require valid-user)
# ---------------------------------------------------------
- name: "V-206374 | Check AuthUserFile/AuthType/Require"
  ansible.builtin.shell: >
    grep -RnE '^[^#]*(AuthUserFile|AuthType|Require\s+valid-user)'
    /etc/httpd/conf /etc/httpd/conf.d
    --exclude=ipa.conf 2>/dev/null || true
  register: v206374_auth
  changed_when: false

# ---------------------------------------------------------
# Final Result
# ---------------------------------------------------------
- name: "V-206374 | Compliance Result"
  ansible.builtin.debug:
    msg: >-
      {% if v206374_http.stdout == '403'
         and v206374_override.stdout != ''
         and v206374_auth.stdout == '' %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
