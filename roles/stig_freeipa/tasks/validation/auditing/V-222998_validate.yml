---
############################################################
# STIG Control: V-222998
#
# Validation Description:
# - Verify audit rule exists for Tomcat bin directory
#
# Expected:
# -w <path>/bin -p wa -k tomcat
#
# Output:
# NOT A FINDING / FINDING
############################################################

# ---------------------------------------------------------
# Resolve Tomcat bin path
# ---------------------------------------------------------
- name: "V-222998 | Resolve Tomcat bin path"
  ansible.builtin.command: readlink -f /var/lib/pki/pki-tomcat/bin
  register: v222998_bin_path
  changed_when: false
  failed_when: false

# ---------------------------------------------------------
# Check audit rules
# ---------------------------------------------------------
- name: "V-222998 | Check audit rules"
  ansible.builtin.shell: "auditctl -l | grep '{{ v222998_bin_path.stdout }}' || true"
  register: v222998_audit
  changed_when: false

# ---------------------------------------------------------
# Final result
# ---------------------------------------------------------
- name: "V-222998 | Compliance Result"
  ansible.builtin.debug:
    msg: >-
      {% if '-p wa' in v222998_audit.stdout and '-k tomcat' in v222998_audit.stdout %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
