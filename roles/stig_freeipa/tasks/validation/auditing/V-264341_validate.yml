---
############################################################
# STIG Control: V-264341
#
# Validation Description:
# - Verify Apache logging directives exist
# - Verify log directory exists
# - Verify auditd is running
#
# Expected:
# - CustomLog and ErrorLog configured
# - /var/log/httpd exists
# - auditd active
#
# Output:
# NOT A FINDING / FINDING
############################################################

# ---------------------------------------------------------
# Check Apache logging directives
# ---------------------------------------------------------
- name: "V-264341 | Check logging directives"
  shell: "grep -RsiE 'CustomLog|ErrorLog' /etc/httpd 2>/dev/null || true"
  register: v264341_logs
  changed_when: false

# ---------------------------------------------------------
# Check log directory
# ---------------------------------------------------------
- name: "V-264341 | Check log directory"
  stat:
    path: /var/log/httpd
  register: v264341_logdir

# ---------------------------------------------------------
# Check auditd status
# ---------------------------------------------------------
- name: "V-264341 | Check auditd service"
  command: systemctl is-active auditd
  register: v264341_auditd
  changed_when: false
  failed_when: false

# ---------------------------------------------------------
# Final result
# ---------------------------------------------------------
- name: "V-264341 | Compliance Result"
  debug:
    msg: >-
      {% if v264341_logs.stdout != ''
         and v264341_logdir.stat.exists
         and v264341_auditd.stdout == 'active' %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
