---
############################################################
# STIG Control: V-222999
#
# Validation Description:
# - Verify audit rule exists for Tomcat conf directory
#
# Expected:
# -w <path>/conf -p wa -k tomcat
#
# Output:
# NOT A FINDING / FINDING
############################################################

# ---------------------------------------------------------
# Resolve Tomcat conf path
# ---------------------------------------------------------
- name: "V-222999 | Resolve Tomcat conf path"
  command: readlink -f /var/lib/pki/pki-tomcat/conf
  register: v222999_conf_path
  changed_when: false
  failed_when: false

# ---------------------------------------------------------
# Check audit rules
# ---------------------------------------------------------
- name: "V-222999 | Check audit rules"
  shell: "auditctl -l | grep '{{ v222999_conf_path.stdout }}' || true"
  register: v222999_audit
  changed_when: false

# ---------------------------------------------------------
# Final result
# ---------------------------------------------------------
- name: "V-222999 | Compliance Result"
  debug:
    msg: >-
      {% if '-p wa' in v222999_audit.stdout and '-k tomcat' in v222999_audit.stdout %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
