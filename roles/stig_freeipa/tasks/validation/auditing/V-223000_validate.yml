---
############################################################
# STIG Control: V-223000 (Validation)
# SRG ID: SRG-APP-000504-AS-000229
# Rule ID: SV-223000r961827
# Severity: CAT II
#
# Title:
# Changes to $CATALINA_HOME/lib/ folder must be logged.
#
# Validation Command:
# auditctl -l | grep $CATALINA_HOME/lib
#
# Expected Result:
# -w <CATALINA_HOME>/lib -p wa -k tomcat
#
# Passing Criteria:
# - Audit rule exists for Tomcat lib directory
# - Permission flags include "wa"
# - Key "tomcat" is present
############################################################

- name: "V-223000 | Validate audit rule for Tomcat lib"
  shell: "auditctl -l | grep '{{ tomcat_lib_path }}' || true"
  register: audit_lib_check
  changed_when: false

- name: "V-223000 | Compliance Result"
  debug:
    msg: >-
      {% if ('-p wa' in audit_lib_check.stdout) and ('-k tomcat' in audit_lib_check.stdout) %}
      NOT A FINDING: Audit rule properly configured for {{ tomcat_lib_path }}
      {% else %}
      FINDING: Audit rule missing or incorrectly configured for {{ tomcat_lib_path }}
      {% endif %}
