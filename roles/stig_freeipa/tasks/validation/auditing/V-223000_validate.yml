---
############################################################
# STIG Control: V-223000
#
# Validation Description:
# - Verify audit rule exists for Tomcat lib directory
#
# Expected:
# -w <path>/lib -p wa -k tomcat
#
# Output:
# NOT A FINDING / FINDING
############################################################

# ---------------------------------------------------------
# Resolve Tomcat lib path
# ---------------------------------------------------------
- name: "V-223000 | Resolve Tomcat lib path"
  ansible.builtin.command: readlink -f /var/lib/pki/pki-tomcat/lib
  register: v223000_lib_path
  changed_when: false
  failed_when: false

# ---------------------------------------------------------
# Check audit rules
# ---------------------------------------------------------
- name: "V-223000 | Check audit rules"
  ansible.builtin.shell: "auditctl -l | grep '{{ v223000_lib_path.stdout }}' || true"
  register: v223000_audit
  changed_when: false

# ---------------------------------------------------------
# Final result
# ---------------------------------------------------------
- name: "V-223000 | Compliance Result"
  ansible.builtin.debug:
    msg: >-
      {% if '-p wa' in v223000_audit.stdout and '-k tomcat' in v223000_audit.stdout %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
