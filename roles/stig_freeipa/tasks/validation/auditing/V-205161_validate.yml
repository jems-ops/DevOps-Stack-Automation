---
############################################################
# STIG Control: V-205161
# Validation: DNS Audit Event Type Logging (AU-3)
#
# Validation Summary:
# - Verify named service status
# - Extract full named configuration
# - Validate logging flags and channels
#
# Expected Result:
# - named active + print-category/print-severity + channels → NOT A FINDING
# - named not active → NOT APPLICABLE
############################################################

- name: "V-205161 | Extract full named configuration"
  shell: named-checkconf -p
  register: v205161_named_conf
  changed_when: false
  when: dns_named_active | bool

- name: "V-205161 | Validate configuration output not empty"
  fail:
    msg: "named-checkconf returned no output. BIND configuration may be invalid."
  when:
    - dns_named_active | bool
    - v205161_named_conf.stdout | trim == ""

- name: "V-205161 | Detect logging flags and channels"
  set_fact:
    v205161_has_print_category: "{{ v205161_named_conf.stdout is search('print-category') }}"
    v205161_has_print_severity: "{{ v205161_named_conf.stdout is search('print-severity') }}"
    v205161_has_channels: "{{ v205161_named_conf.stdout is search('channel') }}"
    v205161_has_categories: "{{ v205161_named_conf.stdout is search('category') }}"
  when: dns_named_active | bool

- name: "V-205161 | Compliance Result"
  ansible.builtin.debug:
    msg: |
      print-category : {{ v205161_has_print_category | default(false) }}
      print-severity : {{ v205161_has_print_severity | default(false) }}
      Channels       : {{ v205161_has_channels | default(false) }}
      Categories     : {{ v205161_has_categories | default(false) }}
      RESULT         : {{ 'NOT APPLICABLE' if not (dns_named_active | bool) else ('NOT A FINDING' if ((v205161_has_print_category | default(false)) and (v205161_has_print_severity | default(false)) and (v205161_has_channels | default(false)) and (v205161_has_categories | default(false))) else 'OPEN - logging configuration incomplete') }}
