---
############################################################
# STIG Control: V-205160
# Validation: DNS Audit Record Generation (DoD Events)
#
# Validation Summary:
# - Verify named service status
# - Collect journald logs for named service
# - Validate presence of audit-relevant events
#
# Expected Result:
# - named active + audit logs present → NOT A FINDING
# - named not active → NOT APPLICABLE
############################################################

- name: "V-205160 | Detect audit event indicators"
  ansible.builtin.set_fact:
    v205160_has_lifecycle: "{{ dns_named_journal is search('start|stop|restart|running') }}"
    v205160_has_failures: "{{ dns_named_journal is search('denied|failed|refused|error') }}"
    v205160_has_activity: "{{ dns_named_journal is search('query|client|transfer|update|command') }}"
  when: dns_named_active | bool

- name: "V-205160 | Compliance Result"
  ansible.builtin.debug:
    msg: |
      Lifecycle Events: {{ v205160_has_lifecycle | default(false) }}
      Activity Events : {{ v205160_has_activity | default(false) }}
      Failure Events  : {{ v205160_has_failures | default(false) }}
      RESULT          : {{ 'NOT APPLICABLE' if not (dns_named_active | bool) else ('NOT A FINDING' if ((v205160_has_lifecycle | default(false)) or (v205160_has_activity | default(false))) else 'OPEN - no audit log evidence found in journald') }}

