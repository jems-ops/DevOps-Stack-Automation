---
############################################################
# STIG Control: V-205230
# Validation: Authoritative Name Server Verification
#
# Validation Summary:
# - Retrieve NS records for domain
# - Resolve NS to IP addresses
# - Query each NS for SOA response
#
# Expected Result:
# - NS records exist
# - NS resolves to IP
# - NS responds authoritatively (SOA)
############################################################

- name: "V-205230 | Get NS records"
  ansible.builtin.shell: dig +short NS {{ dns_domain }}
  register: v205230_ns_records
  changed_when: false
  when: dns_named_active | bool

- name: "V-205230 | Validate NS records exist"
  ansible.builtin.fail:
    msg: "No NS records found for {{ dns_domain }}"
  when:
    - dns_named_active | bool
    - v205230_ns_records.stdout_lines | length == 0

- name: "V-205230 | Resolve NS records to IPs"
  ansible.builtin.shell: dig +short {{ item }}
  loop: "{{ v205230_ns_records.stdout_lines }}"
  register: v205230_ns_ips
  changed_when: false
  when: dns_named_active | bool

- name: "V-205230 | Query SOA from each NS"
  ansible.builtin.shell: dig @{{ item.item }} +short SOA {{ dns_domain }}
  loop: "{{ v205230_ns_ips.results }}"
  register: v205230_soa_responses
  changed_when: false
  when: dns_named_active | bool

- name: "V-205230 | Evaluate NS validation"
  ansible.builtin.set_fact:
    v205230_ns_valid: >-
      {{
        (v205230_ns_records.stdout_lines | length > 0) and
        (
          v205230_ns_ips.results
          | map(attribute='stdout')
          | select('!=', '')
          | list
          | length
          == (v205230_ns_records.stdout_lines | length)
        ) and
        (
          v205230_soa_responses.results
          | map(attribute='stdout')
          | select('!=', '')
          | list
          | length
          == (v205230_ns_records.stdout_lines | length)
        )
      }}
  when: dns_named_active | bool

- name: "V-205230 | Compliance Result"
  ansible.builtin.debug:
    msg: |
      NS Records : {{ v205230_ns_records.stdout_lines | default([]) }}
      Resolved   : {{ v205230_ns_ips.results | map(attribute='stdout') | list | default([]) }}
      SOA        : {{ v205230_soa_responses.results | map(attribute='stdout') | list | default([]) }}
      RESULT     : {{ 'NOT APPLICABLE' if not (dns_named_active | bool) else ('NOT A FINDING' if (v205230_ns_valid | default(false)) else 'OPEN - NS records missing, not resolving, or not authoritative') }}
