---
############################################################
# STIG Control: V-205233
# Validation: DNS Configuration Consistency Risk
#
# Validation Summary:
# - Retrieve NS records for domain
# - Evaluate number of authoritative servers
#
# Expected Result:
# - Single NS → NOT A FINDING
# - Multiple NS → OPEN (replication consistency required)
############################################################

- name: "V-205233 | Get NS records"
  ansible.builtin.shell: dig +short NS {{ dns_domain }}
  register: v205233_ns_records
  changed_when: false
  when: dns_named_active | bool

- name: "V-205233 | Validate NS records exist"
  ansible.builtin.fail:
    msg: "No NS records found for {{ dns_domain }}"
  when:
    - dns_named_active | bool
    - v205233_ns_records.stdout_lines | length == 0

- name: "V-205233 | Evaluate NS count"
  ansible.builtin.set_fact:
    v205233_ns_count: "{{ v205233_ns_records.stdout_lines | length }}"
  when: dns_named_active | bool

- name: "V-205233 | Compliance Result"
  ansible.builtin.debug:
    msg: |
      NS Records : {{ v205233_ns_records.stdout_lines | default([]) }}
      NS Count   : {{ v205233_ns_count | default(0) }}
      RESULT     : {{ 'NOT APPLICABLE' if not (dns_named_active | bool) else ('NOT A FINDING' if (v205233_ns_count | default(0) | int <= 1) else 'OPEN - multiple NS servers, validate replication consistency') }}
