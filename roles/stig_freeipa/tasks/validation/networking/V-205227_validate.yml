---
############################################################
# STIG Control: V-205227
#
# Validation Summary:
# Evaluate NSEC3 salt rotation requirement
#
# Expected Result:
# - No DNSSEC → NOT APPLICABLE
# - DNSSEC with NSEC3 → review salt rotation
############################################################

- name: "V-205227 | Compliance Result"
  debug:
    msg: |
      ===== V-205227 NSEC3 Salt Rotation Validation =====

      DNSSEC Config Present: {{ dns_dnssec_config }}
      DNSSEC Key Files Found: {{ dns_dnssec_keys.matched | default(0) }}
      Signed Records Found: {{ dns_dnssec_records.matched | default(0) }}

      RESULT:
      {{
        'NOT APPLICABLE'
        if (not dns_dnssec_config)
        and (dns_dnssec_keys.matched | default(0) == 0)
        and (dns_dnssec_records.matched | default(0) == 0)
        else 'OPEN - DNSSEC detected, verify NSEC3 salt rotation on re-sign'
      }}
