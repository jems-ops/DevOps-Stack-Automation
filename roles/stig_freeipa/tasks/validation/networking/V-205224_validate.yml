---
############################################################
# STIG Control: V-205224
# Validation: DNS Service Lifecycle Audit Logging (AU-12)
#
# Validation Summary:
# - Verify named service status
# - Collect journald logs for named service
# - Validate lifecycle event logging (start/stop/restart)
#
# Expected Result:
# - named active + lifecycle logs present → NOT A FINDING
# - named not active → NOT APPLICABLE
############################################################

- name: "V-205224 | Detect lifecycle events"
  set_fact:
    v205224_has_start: "{{ dns_named_journal is search('start|starting|running') }}"
    v205224_has_stop: "{{ dns_named_journal is search('stop|stopping|shutting|no longer listening') }}"
    v205224_has_restart: "{{ dns_named_journal is search('restart|reloading') }}"
  when: dns_named_active | bool

- name: "V-205224 | Compliance Result"
  ansible.builtin.debug:
    msg: |
      Start Events  : {{ v205224_has_start | default(false) }}
      Stop Events   : {{ v205224_has_stop | default(false) }}
      Restart Events: {{ v205224_has_restart | default(false) }}
      RESULT        : {{ 'NOT APPLICABLE' if not (dns_named_active | bool) else ('NOT A FINDING' if ((v205224_has_start | default(false)) or (v205224_has_stop | default(false)) or (v205224_has_restart | default(false))) else 'OPEN - no lifecycle events found in journald') }}
