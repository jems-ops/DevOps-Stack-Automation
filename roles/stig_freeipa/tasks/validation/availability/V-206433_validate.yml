---
############################################################
# STIG Control: V-206433
# Title: Web server must be tuned to prevent DoS conditions
# Severity: CAT II
#
# Validation Description:
# Verify Apache is configured with appropriate limits:
# - MaxRequestWorkers
# - Timeout
# - KeepAlive
# - KeepAliveTimeout
#
# Expected:
# - MaxRequestWorkers defined
# - Timeout <= 60
# - KeepAlive On
############################################################

- name: "V-206433 | Check Apache tuning config"
  shell: |
    grep -E "MaxRequestWorkers|Timeout|KeepAlive|KeepAliveTimeout" /etc/httpd/conf.d/*.conf 2>/dev/null || true
  register: v206433_tuning
  changed_when: false
  failed_when: false

- name: "V-206433 | Compliance Result"
  debug:
    msg: >-
      {% if 'MaxRequestWorkers' in v206433_tuning.stdout
         and 'Timeout 60' in v206433_tuning.stdout
         and 'KeepAlive On' in v206433_tuning.stdout %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
