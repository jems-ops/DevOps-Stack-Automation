---
############################################################
# STIG Control: V-206437
#
# Validation Description:
# - Cookies must include HttpOnly flag
#
# Expected:
# - Set-Cookie headers contain HttpOnly
############################################################

# ---------------------------------------------------------
# Check HttpOnly flag in config
# ---------------------------------------------------------
- name: "V-206437 | Check HttpOnly cookie flag"
  ansible.builtin.shell: "grep -Rsi 'HttpOnly' /etc/httpd 2>/dev/null || true"
  register: v206437_cookie
  changed_when: false

# ---------------------------------------------------------
# Optional: Check Secure flag (informational)
# ---------------------------------------------------------
- name: "V-206437 | Check Secure flag (optional)"
  ansible.builtin.shell: "grep -Rsi 'Secure' /etc/httpd 2>/dev/null || true"
  register: v206437_secure
  changed_when: false

# ---------------------------------------------------------
# Final result
# ---------------------------------------------------------
- name: "V-206437 | Compliance Result"
  ansible.builtin.debug:
    msg: >-
      {% if v206437_cookie.stdout != '' %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
