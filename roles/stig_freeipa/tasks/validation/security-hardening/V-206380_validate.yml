---
############################################################
# STIG Control: V-206380
#
# Validation Description:
# - No executable MIME types
# - No CGI handlers
# - (Optional) No ExecCGI
#
# Output:
# NOT A FINDING / FINDING
############################################################

# ---------------------------------------------------------
# Check for forbidden config (excludes ipa.conf — FreeIPA
# WSGI directories require ExecCGI as documented exception)
# ---------------------------------------------------------
- name: "V-206380 | Check CGI/MIME/ExecCGI"
  shell: >
    grep -RnE '^[^#]*(application/x-httpd-cgi|cgi-script|Options.*ExecCGI)'
    /etc/httpd/conf /etc/httpd/conf.d
    --exclude=ipa.conf 2>/dev/null || true
  register: v206380_check
  changed_when: false

# ---------------------------------------------------------
# Result
# ---------------------------------------------------------
- name: "V-206380 | Compliance Result"
  debug:
    msg: >-
      {% if v206380_check.stdout == "" %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
