---
############################################################
# STIG Control: V-206412
#
# Validation Description:
# - ServerTokens must be set to Prod
# - ServerSignature must be Off
# - (Optional) Server header minimized
#
# Expected:
# - ServerTokens Prod
# - ServerSignature Off
############################################################

# ---------------------------------------------------------
# Check ServerTokens
# ---------------------------------------------------------
- name: "V-206412 | Check ServerTokens"
  shell: "grep -Rsi 'ServerTokens Prod' /etc/httpd 2>/dev/null || true"
  register: v206412_tokens
  changed_when: false

# ---------------------------------------------------------
# Check ServerSignature
# ---------------------------------------------------------
- name: "V-206412 | Check ServerSignature"
  shell: "grep -Rsi 'ServerSignature Off' /etc/httpd 2>/dev/null || true"
  register: v206412_signature
  changed_when: false

# ---------------------------------------------------------
# Optional: Check Server header hardening
# ---------------------------------------------------------
- name: "V-206412 | Check Server header hardening"
  shell: "grep -Rsi 'Header always unset Server' /etc/httpd 2>/dev/null || true"
  register: v206412_header
  changed_when: false

# ---------------------------------------------------------
# Final result
# ---------------------------------------------------------
- name: "V-206412 | Compliance Result"
  debug:
    msg: >-
      {% if v206412_tokens.stdout != ''
         and v206412_signature.stdout != '' %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
