---
############################################################
# STIG Control: V-206383
#
# Validation Description:
# - No DAV modules loaded
# - No "DAV On" directives present
#
# Expected:
# - httpd -M shows no dav modules
# - No DAV On found in config
############################################################

########################################
# Check loaded modules
########################################
- name: "V-206383 | Check loaded modules"
  ansible.builtin.command: httpd -M
  register: v206383_modules
  changed_when: false
  failed_when: false

########################################
# Check DAV directives (single scan)
########################################
- name: "V-206383 | Check DAV directives"
  ansible.builtin.shell: |
    grep -Rsi "^[[:space:]]*DAV[[:space:]]+On" /etc/httpd 2>/dev/null || true
  register: v206383_config
  changed_when: false

########################################
# Normalize results (avoid repeated logic)
########################################
- name: "V-206383 | Set validation facts"
  ansible.builtin.set_fact:
    v206383_dav_module_present: "{{ 'dav' in (v206383_modules.stdout | lower) }}"
    v206383_dav_directive_present: "{{ v206383_config.stdout != '' }}"

########################################
# Final result
########################################
- name: "V-206383 | Compliance Result"
  ansible.builtin.debug:
    msg: |
      ===== V-206383 Validation =====

      DAV Module Present: {{ v206383_dav_module_present }}
      DAV Directive Present: {{ v206383_dav_directive_present }}

      RESULT:
      {% if not v206383_dav_module_present and not v206383_dav_directive_present %}
      NOT A FINDING
      {% else %}
      FINDING
      {% endif %}
