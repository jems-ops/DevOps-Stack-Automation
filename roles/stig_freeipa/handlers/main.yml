---
############################################################
# Handlers - STIG FreeIPA
############################################################

- name: restart httpd
  become: true
  ansible.builtin.service:
    name: httpd
    state: restarted

- name: reload httpd
  become: true
  ansible.builtin.service:
    name: httpd
    state: reloaded

- name: restart auditd
  become: true
  ansible.builtin.command: service auditd restart
  changed_when: true

- name: reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: yes

- name: reload audit rules
  become: true
  ansible.builtin.command: augenrules --load
  changed_when: true
