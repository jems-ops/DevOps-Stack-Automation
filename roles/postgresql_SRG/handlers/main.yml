---
# handlers file for postgresql_SRG

- name: Restart PostgreSQL
  become: true
  ansible.builtin.systemd:
    name: "{{ postgresql_srg_service_name | default(pg_service_name) }}"
    state: restarted

- name: Reload PostgreSQL
  become: true
  ansible.builtin.systemd:
    name: "{{ postgresql_srg_service_name | default(pg_service_name) }}"
    state: reloaded

- name: Restart sshd
  become: true
  ansible.builtin.systemd:
    name: sshd
    state: restarted
