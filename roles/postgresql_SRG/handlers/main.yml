---
# handlers file for postgresql_SRG

- name: Restart PostgreSQL
  become: true
  ansible.builtin.systemd:
    name: "{{ postgresql_srg_service_name | default(pg_service_name) }}"
    state: restarted

- name: Reload PostgreSQL
  become: true
  ansible.builtin.systemd:
    name: "{{ postgresql_srg_service_name | default(pg_service_name) }}"
    state: reloaded

- name: Restart sshd
  become: true
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Restart auditd
  become: true
  ansible.builtin.shell: augenrules --load && service auditd condrestart
  changed_when: true

- name: Restart Chronyd
  become: true
  ansible.builtin.systemd:
    name: chronyd
    state: restarted
