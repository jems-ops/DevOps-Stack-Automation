############################################################
# V-206519 Settings
############################################################

postgresql_srg_admin_roles:
  - postgres

postgresql_srg_authorized_superusers:
  - postgres

# PostgreSQL library directory (used by V-206544)
postgresql_srg_pg_lib_dir: "/usr/pgsql-{{ postgresql_srg_pg_version }}/lib"

postgresql_srg_admin_conn_limit: 10
# Application roles (e.g. sonar, bitbucketuser) need more connections than a plain
# interactive user.  SonarQube's HikariCP pool uses up to 20 connections per process
# (web + CE), so 30 gives comfortable headroom without being unlimited (-1).
postgresql_srg_user_conn_limit: 30

postgresql_srg_connlimit_exempt_roles: []

############################################################
# V-206525 Configuration
############################################################

# Audit requirements
postgresql_srg_pgaudit_classes: "ddl, role, write, read"
postgresql_srg_enable_catalog_audit: "on"

############################################################
# V-206552 Configuration
############################################################
postgresql_srg_authorized_exec_roles:
  - postgres

############################################################
# V-206551 Configuration
############################################################
postgresql_srg_disable_replication: true
postgresql_srg_disable_remote_access: true
postgresql_srg_disable_logical_decoding: true

############################################################
# V-206550 Configuration
############################################################
postgresql_srg_allowed_extensions:
  - plpgsql
  - pgaudit

postgresql_srg_allowed_languages:
  - plpgsql

postgresql_srg_allowed_packages:
  - postgresql16-server
  - postgresql16
  - postgresql16-libs

############################################################
# V-206549 Configuration
############################################################
# List every application database that is permitted on this instance.
# Add one entry per application that shares this PostgreSQL server.
postgresql_srg_allowed_databases:
  - postgres
  - sonarqube       # SonarQube
  - bitbucket     # Atlassian Bitbucket
  - confluence    # Atlassian Confluence
  - satellite     # Red Hat Satellite

# Safety guard: set to true ONLY after confirming postgresql_srg_allowed_databases
# is complete. When false, unauthorized databases are reported but NOT dropped.
postgresql_srg_drop_unauthorized_databases: false

############################################################
# V-206548 Configuration
############################################################
postgresql_srg_ddl_role: db_ddl
postgresql_srg_authorized_ddl_users:
  - postgres

############################################################
# V-206553 Configuration
############################################################
postgresql_srg_allowed_listen_addresses: "localhost"
postgresql_srg_allowed_port: 5432
############################################################
# V-206554 Configuration
############################################################
postgresql_srg_password_encryption: scram-sha-256

############################################################
# V-206567 — Application HBA Entries
############################################################
# Each entry produces one pg_hba.conf line and is validated
# by V-206567 to confirm scram-sha-256 is enforced.
#
# To support additional applications, add entries here or
# override this list in host_vars / group_vars.
#
# Supported types: host | hostssl | hostnossl
# Required fields: type, database, user, address, method
#
# Examples (uncomment and adapt as needed):
#   - { type: host, database: bitbucket,  user: bitbucketuser, address: "127.0.0.1/32", method: scram-sha-256 }
#   - { type: host, database: confluence, user: confuser,      address: "127.0.0.1/32", method: scram-sha-256 }
#   - { type: host, database: satellite,  user: satellite,     address: "127.0.0.1/32", method: scram-sha-256 }
postgresql_srg_hba_application_entries:
  - { type: host, database: sonarqube, user: sonar, address: "127.0.0.1/32", method: scram-sha-256 }

############################################################
# V-206611 Configuration
############################################################
postgresql_srg_patch_enforce: true

############################################################
# V-206565 / V-206580 Configuration
############################################################
postgresql_srg_idle_session_timeout: 15min
postgresql_srg_idle_tx_timeout: 10min
postgresql_srg_statement_timeout: 30min

############################################################
# V-206600 Configuration
############################################################
postgresql_srg_authorized_priv_roles:
  - postgres

############################################################
# V-263621 / V-263622 NTP Configuration
############################################################
# Override these in inventory/group_vars with your actual
# Satellite / NTP server hostname and IP.
postgresql_srg_ntp_server: satellite
postgresql_srg_ntp_server_ip: "192.168.1.100"

############################################################
# V-263621 / V-263622 NTP Configuration
############################################################
postgresql_srg_shared_preload_libraries: 'pgaudit'
postgresql_srg_pgaudit_log: 'read, write, ddl, role'
postgresql_srg_log_connections: true
postgresql_srg_log_disconnections: true
