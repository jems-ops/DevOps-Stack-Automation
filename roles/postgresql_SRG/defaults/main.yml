# --- New CAT II Controls (V-203602 – V-203605) ---
postgresql_srg_v203602_enabled: false
postgresql_srg_v203603_enabled: false
postgresql_srg_v203604_enabled: false
postgresql_srg_v203605_enabled: false

# --- New CAT II Controls (V-206620 – V-206643) ---
postgresql_srg_v206620_enabled: false
postgresql_srg_v206621_enabled: false
postgresql_srg_v206622_enabled: false
postgresql_srg_v206623_enabled: false
postgresql_srg_v206624_enabled: false
