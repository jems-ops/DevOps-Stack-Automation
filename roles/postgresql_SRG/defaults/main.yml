---
# defaults file for postgresql_SRG
#
# Purpose
# - This role implements PostgreSQL SRG/STIG-oriented controls referenced by V-IDs.
# - Many controls are file-based remediations against postgresql.conf/pg_hba.conf plus optional runtime validation.
#
# IMPORTANT
# - Some controls require pgaudit. If pgaudit cannot be installed in your environment, set
#   postgresql_srg_pgaudit_enabled: false and document an exception/POA&M.

# Enable/disable major role phases
postgresql_srg_enforcement_enabled: true
postgresql_srg_validation_enabled: true
postgresql_srg_post_healthcheck_enabled: true

############################################################
# Post-STIG Health Check Settings
############################################################
postgresql_srg_sonarqube_service_name: sonarqube
postgresql_srg_sonarqube_url: "https://sonar.local"
postgresql_srg_sonarqube_validate_certs: false    # set true if using a trusted CA cert
postgresql_srg_sonarqube_healthcheck_timeout: 30  # seconds

# PostgreSQL instance targeting
postgresql_srg_postgres_user: postgres
postgresql_srg_pg_version: "16"

# Default to distro service/layout
postgresql_srg_service_name: postgresql
postgresql_srg_data_dir: /var/lib/pgsql/data
postgresql_srg_conf_file: "{{ postgresql_srg_data_dir }}/postgresql.conf"
postgresql_srg_hba_file: "{{ postgresql_srg_data_dir }}/pg_hba.conf"
postgresql_srg_log_directory: "{{ postgresql_srg_data_dir }}/log"
postgresql_srg_pg_bin_path: "/usr/pgsql-{{ postgresql_srg_pg_version }}/bin"
postgresql_srg_psql_path: "{{ postgresql_srg_pg_bin_path }}/psql"

# Optional: auto-detect a supported systemd unit and set matching data_dir.
postgresql_srg_auto_detect: true
postgresql_srg_candidate_services:
  - postgresql
  - postgresql-16
  - postgresql-15
  - postgres

postgresql_srg_pgpass_search_paths:
  - /var/lib/pgsql
  - /home
  - /root

postgresql_srg_application_schemas:
  - public

postgresql_srg_revoke_existing_objects: false

postgresql_srg_readonly_role: readonly

postgresql_srg_scope_paths:
  - "{{ postgresql_srg_conf_file }}"
  - "{{ postgresql_srg_hba_file }}"
  - "{{ postgresql_srg_data_dir }}"

postgresql_srg_data_dir_map:
  postgresql: /var/lib/pgsql/data
  postgresql-16: /var/lib/pgsql/16/data
  postgresql-15: /var/lib/pgsql/15/data
  postgres: /var/lib/pgsql/data

############################################################
# Feature Toggles
############################################################

# pgaudit (many SRG controls assume it is available)
postgresql_srg_pgaudit_enabled: true
postgresql_srg_pgaudit_package: "pgaudit_{{ postgresql_srg_pg_version }}"

# FIPS mode (disable in lab environments where FIPS is not available)
postgresql_srg_fips_required: true
postgresql_srg_enforce_strict: true

# SELinux enforcement (set to false if SELinux is not available)
postgresql_srg_selinux_required: true

# Optional common logging knobs
postgresql_srg_log_line_prefix: "%m %H %p %u %d %c %h %r %a %e "

############################################################
# V-206520 — Authentication / Role Control
############################################################

# Application database users — keep in sync with postgresql_srg_hba_application_entries.
# Add one entry per application service account that must be permitted to log in.
postgresql_srg_approved_login_roles:
  - postgres
  - sonar           # SonarQube
  # - bitbucketuser # Bitbucket
  # - confuser      # Confluence
  # - satellite     # Red Hat Satellite
  - stig_validate_role
  - stig_limited

############################################################
# V-206521 — Access Control Enforcement
############################################################

postgresql_srg_access_control_enabled: true
postgresql_srg_target_database: postgres
postgresql_srg_application_schemas:
  - public
postgresql_srg_readonly_role: app_readonly
postgresql_srg_revoke_public: true
postgresql_srg_enforce_default_privileges: true

############################################################
# V-206555 — Password Storage Security
############################################################

postgresql_srg_config_scan_paths:
  - /etc/postgresql
  - /var/lib/pgsql
  # NOTE: Do NOT include /opt here — application config files (e.g. sonar.properties) live
  # under /opt and also contain password= entries.  Setting postgres:postgres 0600 on them
  # breaks the application.  If you need to audit /opt, use a read-only grep check rather
  # than the permission-enforcement task.
postgresql_srg_pgpass_search_paths:
  - /root
  - /home
  - /var/lib/pgsql

postgresql_srg_supported_versions:
  - "16"
  - "15"
############################################################
# V-206545 — Installation Account Control
############################################################

postgresql_srg_install_account_control_enabled: true
postgresql_srg_install_os_account: postgres
postgresql_srg_dba_group: dbadmins
postgresql_srg_install_account_shell: /sbin/nologin
postgresql_srg_audit_postgres_binaries: true

############################################################
# Per-Control Toggles
# Set to false to skip individual controls.
############################################################

# --- CAT I Controls ---
postgresql_srg_v206520_enabled: true
postgresql_srg_v206521_enabled: true
postgresql_srg_v206545_enabled: true
postgresql_srg_v206555_enabled: true
postgresql_srg_v206556_enabled: true
