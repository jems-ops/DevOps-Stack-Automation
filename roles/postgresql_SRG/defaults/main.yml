---
# defaults file for postgresql_SRG
#
# Purpose
# - This role implements PostgreSQL SRG/STIG-oriented controls referenced by V-IDs.
# - Many controls are file-based remediations against postgresql.conf/pg_hba.conf plus optional runtime validation.
#
# IMPORTANT
# - Some controls require pgaudit. If pgaudit cannot be installed in your environment, set
#   postgresql_srg_pgaudit_enabled: false and document an exception/POA&M.

# Enable/disable major role phases
postgresql_srg_enforcement_enabled: false
postgresql_srg_validation_enabled: true

# PostgreSQL instance targeting
postgresql_srg_postgres_user: postgres
postgresql_srg_pg_version: "16"

# Default to distro service/layout
postgresql_srg_service_name: postgresql
postgresql_srg_data_dir: /var/lib/pgsql/data
postgresql_srg_conf_file: "{{ postgresql_srg_data_dir }}/postgresql.conf"
postgresql_srg_hba_file: "{{ postgresql_srg_data_dir }}/pg_hba.conf"
postgresql_srg_log_directory: "{{ postgresql_srg_data_dir }}/log"
postgresql_srg_pg_bin_path: "/usr/pgsql-{{ postgresql_srg_pg_version }}/bin"
postgresql_srg_psql_path: "{{ postgresql_srg_pg_bin_path }}/psql"

# Optional: auto-detect a supported systemd unit and set matching data_dir.
postgresql_srg_auto_detect: true
postgresql_srg_candidate_services:
  - postgresql
  - postgresql-16
  - postgresql-15
  - postgres

postgresql_srg_data_dir_map:
  postgresql: /var/lib/pgsql/data
  postgresql-16: /var/lib/pgsql/16/data
  postgresql-15: /var/lib/pgsql/15/data
  postgres: /var/lib/pgsql/data

############################################################
# Feature Toggles
############################################################

# pgaudit (many SRG controls assume it is available)
postgresql_srg_pgaudit_enabled: false
postgresql_srg_pgaudit_package: "pgaudit_{{ postgresql_srg_pg_version }}"

# FIPS mode (disable in lab environments where FIPS is not available)
postgresql_srg_fips_required: false

# SELinux enforcement (set to false if SELinux is not available)
postgresql_srg_selinux_required: true

# Optional common logging knobs
postgresql_srg_log_line_prefix: "%m %H %p %u %d %c %h %r %a %e "

############################################################
# V-206520 — Authentication / Role Control
############################################################

postgresql_srg_approved_login_roles:
  - postgres
  - sonar
  - stig_validate_role
  - stig_limited

############################################################
# V-206521 — Access Control Enforcement
############################################################

postgresql_srg_access_control_enabled: true
postgresql_srg_target_database: postgres
postgresql_srg_application_schemas:
  - public
postgresql_srg_readonly_role: app_readonly
postgresql_srg_revoke_public: true
postgresql_srg_enforce_default_privileges: true

############################################################
# V-206555 — Password Storage Security
############################################################

postgresql_srg_config_scan_paths:
  - /etc
  - /opt
  - /var/lib/pgsql
postgresql_srg_pgpass_search_paths:
  - /root
  - /home
  - /var/lib/pgsql

############################################################
# V-206545 — Installation Account Control
############################################################

postgresql_srg_install_account_control_enabled: true
postgresql_srg_install_os_account: postgres
postgresql_srg_dba_group: dbadmins
postgresql_srg_install_account_shell: /sbin/nologin
postgresql_srg_audit_postgres_binaries: true

############################################################
# Per-Control Toggles
# Set to false to skip individual controls.
############################################################

# --- CAT I Controls ---
postgresql_srg_v206520_enabled: false
postgresql_srg_v206521_enabled: false
postgresql_srg_v206545_enabled: false
postgresql_srg_v206555_enabled: false
postgresql_srg_v206556_enabled: false
postgresql_srg_v206557_enabled: false
postgresql_srg_v206559_enabled: false
postgresql_srg_v206561_enabled: false
postgresql_srg_v206562_enabled: false
postgresql_srg_v206570_enabled: false
postgresql_srg_v206604_enabled: false
postgresql_srg_v206605_enabled: false
postgresql_srg_v265854_enabled: false
postgresql_srg_v233495_enabled: false

# --- CAT II Controls ---
postgresql_srg_v206519_enabled: true
postgresql_srg_v206522_enabled: true
postgresql_srg_v206523_enabled: true
postgresql_srg_v206524_enabled: true
postgresql_srg_v206525_enabled: true
postgresql_srg_v206526_enabled: true
postgresql_srg_v206527_enabled: true
postgresql_srg_v206528_enabled: true
postgresql_srg_v206529_enabled: true
postgresql_srg_v206530_enabled: true
postgresql_srg_v206531_enabled: true
postgresql_srg_v206532_enabled: true
postgresql_srg_v206533_enabled: true
postgresql_srg_v206534_enabled: true
postgresql_srg_v206537_enabled: true
postgresql_srg_v206538_enabled: true
postgresql_srg_v206539_enabled: true
postgresql_srg_v206540_enabled: true
postgresql_srg_v206541_enabled: true
postgresql_srg_v206542_enabled: true
postgresql_srg_v206543_enabled: true
postgresql_srg_v206544_enabled: true
postgresql_srg_v206546_enabled: true
postgresql_srg_v206547_enabled: false  # placeholder - no tasks defined
postgresql_srg_v206548_enabled: true
postgresql_srg_v206549_enabled: true
postgresql_srg_v206550_enabled: true
postgresql_srg_v206551_enabled: true
postgresql_srg_v206552_enabled: true

############################################################
# V-206519 Settings
############################################################

postgresql_srg_admin_roles:
  - postgres

postgresql_srg_admin_conn_limit: 10
postgresql_srg_user_conn_limit: 2

postgresql_srg_connlimit_exempt_roles: []

############################################################
# V-206525 Configuration
############################################################

# Audit requirements
postgresql_srg_pgaudit_classes: "ddl, role, write, read"
postgresql_srg_enable_catalog_audit: "on"

############################################################
# V-206552 Configuration
############################################################
postgresql_srg_authorized_exec_roles:
  - postgres

############################################################
# V-206551 Configuration
############################################################
postgresql_srg_disable_replication: true
postgresql_srg_disable_remote_access: true
postgresql_srg_disable_logical_decoding: true

############################################################
# V-206550 Configuration
############################################################
postgresql_srg_allowed_extensions:
  - plpgsql
  - pgaudit

postgresql_srg_allowed_languages:
  - plpgsql

postgresql_srg_allowed_packages:
  - postgresql16-server
  - postgresql16
  - postgresql16-libs

############################################################
# V-206549 Configuration
############################################################
postgresql_srg_allowed_databases:
  - postgres
  - myappdb

############################################################
# V-206548 Configuration
############################################################
postgresql_srg_ddl_role: db_ddl
postgresql_srg_authorized_ddl_users:
  - postgres
