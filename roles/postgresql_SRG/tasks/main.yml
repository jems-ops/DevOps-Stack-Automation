---
############################################################
# PostgreSQL SRG/STIG Role - Main Loader
#
# Auto-detect, backup, flush handlers, and healthcheck use
# the 'always' tag so they run regardless of tag filtering.
# This guarantees: backup runs first, healthcheck runs last.
############################################################

- name: PostgreSQL SRG | Auto-detect PostgreSQL instance
  ansible.builtin.include_tasks:
    file: auto-detect.yml
    apply:
      tags: [always]
  when: postgresql_srg_auto_detect | bool
  tags:
    - always

- name: PostgreSQL SRG | Common tasks
  ansible.builtin.include_tasks:
    file: common/normalize.yml
    apply:
      tags: [always]
  when: postgresql_srg_auto_detect | bool
  tags:
    - always

- name: PostgreSQL SRG | Pre-enforcement Backup
  ansible.builtin.include_tasks:
    file: enforcement/backup/main.yml
    apply:
      tags: [always]
  when: postgresql_srg_backup_enabled | bool
  tags:
    - always

- name: PostgreSQL SRG | Application Database Setup (pg_hba, SCRAM, DB/users)
  ansible.builtin.include_tasks:
    file: app_database_setup.yml
    apply:
      tags: [always]
  tags:
    - always

- name: PostgreSQL SRG | pgaudit Setup
  ansible.builtin.include_tasks:
    file: pgaudit_setup.yml
    apply:
      tags: [pgaudit, enforce]
  when: postgresql_srg_pgaudit_enabled | bool
  tags:
    - pgaudit
    - enforce

- name: PostgreSQL SRG | Load Enforcement Tasks
  ansible.builtin.import_tasks: enforcement/main.yml
  when: postgresql_srg_enforcement_enabled | bool
  tags:
    - enforce

- name: PostgreSQL SRG | Flush handlers so config changes take effect before validation
  ansible.builtin.meta: flush_handlers
  tags:
    - always

- name: PostgreSQL SRG | Load Validation Tasks
  ansible.builtin.import_tasks: validation/main.yml
  when: postgresql_srg_validation_enabled | bool
  tags:
    - validate

- name: PostgreSQL SRG | Post-STIG Health Check
  ansible.builtin.include_tasks:
    file: post_stig_healthcheck.yml
    apply:
      tags: [always]
  when: postgresql_srg_post_healthcheck_enabled | bool
  tags:
    - always
