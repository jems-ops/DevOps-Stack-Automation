---
############################################################
# STIG V-206529
# Enforcement - Audit records must contain timestamps
############################################################
#
# COMPLIANT WHEN:
# - log_line_prefix includes %m
#
# VERIFY:
# SHOW log_line_prefix;
# comment: PostgreSQL is configured with a log_line_prefix that includes the %m directive, ensuring that audit records contain the date and time of event occurrence. Therefore, V-206529 is Not a Finding.
############################################################

- name: V-206529 | Ensure log_line_prefix includes timestamp
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206529
    - cat2
