############################################################
# PostgreSQL STIG | V-206529
# Ensure audit records include date and time of event
############################################################

- name: Ensure log_line_prefix includes timestamp (%m)
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %H %p %u %d %c %h %r %a %e '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206529

- name: Ensure log_timezone is set to UTC
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_timezone\s*='
    line: "log_timezone = 'UTC'"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206529
