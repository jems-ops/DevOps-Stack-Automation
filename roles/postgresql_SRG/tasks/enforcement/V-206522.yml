############################################################
# PostgreSQL STIG | V-206522
# Ensure individual user accountability is captured
############################################################

- name: Ensure logging_collector is enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*logging_collector\s*='
    line: "logging_collector = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206522
    - logging

- name: Ensure log_connections is enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_connections\s*='
    line: "log_connections = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206522

- name: Ensure log_disconnections is enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_disconnections\s*='
    line: "log_disconnections = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206522

- name: Ensure log_statement captures all queries for audit
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_statement\s*='
    line: "log_statement = 'all'"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206522

- name: Ensure log_line_prefix includes user and application identity
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %H %p %u %d %c %h %r %a %e '"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206522
