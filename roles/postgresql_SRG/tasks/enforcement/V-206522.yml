---
############################################################
# STIG V-206522
# Enforcement - Non-Repudiation Controls
############################################################
#
# COMPLIANT WHEN:
# - log_connections = on
# - log_disconnections = on
# - log_line_prefix includes %u (username)
# - pgaudit is enabled in shared_preload_libraries
# - pgaudit.log is configured to capture actions
#
# VERIFY BY RUNNING:
# SHOW log_connections;
# SHOW log_disconnections;
# SHOW log_line_prefix;
# SHOW shared_preload_libraries;
# SHOW pgaudit.log;
# Comments: PostgreSQL supports non-repudiation via connection/disconnection
# logging and pgaudit. log_line_prefix includes %u for user identification.
# Therefore, V-206522 is Not a Finding.
############################################################

- name: "V-206522 | Ensure log_connections is enabled"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "ALTER SYSTEM SET log_connections = 'on';"
  tags:
    - V-206522
    - stig
    - cat2

- name: "V-206522 | Ensure log_disconnections is enabled"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "ALTER SYSTEM SET log_disconnections = 'on';"
  tags:
    - V-206522
    - stig
    - cat2

- name: "V-206522 | Ensure log_line_prefix captures username"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "ALTER SYSTEM SET log_line_prefix = '%m %u %d %r %p %c %a %h ';"
  tags:
    - V-206522
    - stig
    - cat2

- name: "V-206522 | Ensure pgaudit is loaded"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "ALTER SYSTEM SET shared_preload_libraries = 'pgaudit';"
  tags:
    - V-206522
    - stig
    - cat2

- name: "V-206522 | Ensure pgaudit logging configured"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "ALTER SYSTEM SET pgaudit.log = 'read, write, ddl';"
  tags:
    - V-206522
    - stig
    - cat2

- name: "V-206522 | Reload PostgreSQL configuration"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "SELECT pg_reload_conf();"
  tags:
    - V-206522
    - stig
    - cat2
