---
############################################################
# PostgreSQL SRG — Enforcement Main Loader
# Calls category-based loaders in dependency order.
#
# Tags:
#   enforce   — all enforcement tasks
#   access    — auth, RBAC, sessions, privileges
#   auditing  — pgaudit, logging, audit protection
#   config    — postgresql.conf, network, components
#   crypto    — FIPS, TLS, crypto modules
#   lifecycle — versioning, patching, time sync, cleanup
############################################################

- name: "Enforce | Access Control"
  ansible.builtin.import_tasks: access/main.yml
  tags: [enforce, access]

- name: "Enforce | Auditing"
  ansible.builtin.import_tasks: auditing/main.yml
  tags: [enforce, auditing]

- name: "Enforce | Configuration Hardening"
  ansible.builtin.import_tasks: config/main.yml
  tags: [enforce, config]

- name: "Enforce | Cryptography"
  ansible.builtin.import_tasks: crypto/main.yml
  tags: [enforce, crypto]

- name: "Enforce | Lifecycle & Cleanup"
  ansible.builtin.import_tasks: lifecycle/main.yml
  tags: [enforce, lifecycle]
