---
############################################################
# STIG V-206534
# Enforcement - Include additional detailed audit information
############################################################
#
# COMPLIANT WHEN:
# - pgaudit enabled
# - pgaudit.log_parameter = on
# - log_error_verbosity = verbose
# - log_statement configured for DDL at minimum
#
# VERIFY:
# SHOW pgaudit.log;
# SHOW pgaudit.log_parameter;
# SHOW log_error_verbosity;
# SHOW log_statement;
# Comment: PostgreSQL is configured with pgaudit to log full SQL statements, role activity, DDL operations, and parameters. Verbose error logging is enabled to capture detailed contextual information. Audit records contain sufficient organization-defined detailed information. Therefore, V-206534 is Not a Finding.
############################################################

- name: V-206534 | Enable detailed pgaudit classes
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206534
    - cat2

- name: V-206534 | Enable logging of parameters
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log_parameter\s*='
    line: "pgaudit.log_parameter = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206534
    - cat2

- name: V-206534 | Enable verbose error details
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_error_verbosity\s*='
    line: "log_error_verbosity = verbose"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206534
    - cat2

- name: V-206534 | Log DDL statements
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_statement\s*='
    line: "log_statement = 'ddl'"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206534
    - cat2
