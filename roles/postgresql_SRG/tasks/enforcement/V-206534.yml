############################################################
# PostgreSQL STIG | V-206534
# Ensure audit records include all org-defined information
############################################################

- name: Ensure log_line_prefix includes required org-defined fields
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %H %p %u %d %c %h %r %a %e '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206534
    - logging

- name: Ensure pgaudit captures required event classes
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206534
    - pgaudit

- name: Ensure failed statements are logged
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_min_error_statement\s*='
    line: "log_min_error_statement = error"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206534
