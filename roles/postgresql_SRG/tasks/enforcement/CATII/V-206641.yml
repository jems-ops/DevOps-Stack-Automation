---
############################################################
# STIG Control: V-206641
# Status : NOT A FINDING
#
# Title:
# The DBMS must implement NIST FIPS 140-2 or 140-3
# validated cryptographic modules.
#
# Finding Details:
# Cryptographic mechanisms used by the DBMS must be
# validated to ensure they meet NIST security standards.
# Use of non-validated cryptographic modules could expose
# sensitive data to compromise.
#
# Implementation in this Environment:
# PostgreSQL cryptographic operations rely on the OpenSSL
# library provided by the underlying RHEL operating system.
# The system operates in FIPS mode, ensuring cryptographic
# operations utilize NIST FIPS 140-2/140-3 validated modules.
#
# Manual Verification Steps:
#
# 1. Verify system FIPS mode:
#
#       cat /proc/sys/crypto/fips_enabled
#
#    Expected result:
#
#       1
#
# 2. Verify system crypto policy:
#
#       update-crypto-policies --show
#
#    Expected result:
#
#       FIPS
#
# 3. Confirm PostgreSQL uses system OpenSSL library.
#
# Comment:
# PostgreSQL inherits cryptographic protections from the
# underlying RHEL operating system. When FIPS mode is
# enabled, OpenSSL operates in FIPS-compliant mode using
# validated cryptographic modules. Therefore PostgreSQL
# cryptographic operations comply with FIPS requirements.
############################################################

- name: "V-206641 | Check FIPS mode"
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: fips_status
  changed_when: false
  tags: ['V-206641','CAT II','check']

- name: "V-206641 | Display FIPS status"
  ansible.builtin.debug:
    var: fips_status.stdout
  tags: ['V-206641','CAT II','check']

- name: "V-206641 | Verify system crypto policy"
  ansible.builtin.command: update-crypto-policies --show
  register: crypto_policy
  changed_when: false
  tags: ['V-206641','CAT II','check']

- name: "V-206641 | Display crypto policy"
  ansible.builtin.debug:
    var: crypto_policy.stdout
  tags: ['V-206641','CAT II','check']
