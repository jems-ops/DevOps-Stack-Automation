---
############################################################
# STIG Control: V-263613
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must, for password-based authentication, verify
# that when users create or update passwords, the passwords
# are not found on the list of commonly-used, expected,
# or compromised passwords.
#
# Finding Details:
# Passwords that appear in commonly-used or compromised
# password lists weaken authentication security and may
# allow unauthorized access.
#
# Implementation in this Environment:
# PostgreSQL is deployed as the backend database for the
# SonarQube application. End users do not authenticate
# directly to the DBMS and do not create or update
# passwords within PostgreSQL.
#
# User authentication and password policy enforcement,
# including compromised password detection, are handled by
# the centralized identity provider (Keycloak SSO).
#
# Comment:
# Because PostgreSQL does not perform password-based
# authentication for end users in this architecture,
# verification of commonly-used or compromised passwords
# is not applicable at the DBMS level.
#
# Manual Verification Steps:
#
# 1. Verify SonarQube authentication uses Keycloak SSO.
#
# 2. Verify PostgreSQL roles are application service
#    accounts rather than individual user accounts.
#
#       SELECT rolname FROM pg_roles;
#
# 3. Confirm password policies are enforced by the
#    enterprise identity provider.
############################################################

- name: "V-263613 | Password blacklist validation handled by identity provider"
  ansible.builtin.debug:
    msg: "DBMS does not perform password creation or updates for users; control not applicable."
  tags:
    - V-263613
    - CATII
    - check
