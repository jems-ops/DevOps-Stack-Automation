---
############################################################
# STIG Control: V-263615
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must, for password-based authentication, allow
# user selection of long passwords and passphrases,
# including spaces and printable characters.
#
# Finding Details:
# Restricting password length or printable characters may
# prevent users from creating strong passphrases and reduce
# password entropy.
#
# Implementation in this Environment:
# PostgreSQL in this deployment is used solely as the
# backend database for the SonarQube application.
# End users do not authenticate directly to the DBMS.
#
# User authentication is performed through the enterprise
# identity provider (Keycloak SSO). PostgreSQL is accessed
# only through application service accounts.
#
# Comment:
# Since PostgreSQL does not perform password-based
# authentication for end users, password selection
# capabilities within the DBMS are not used in this
# architecture. Password policies are enforced by the
# centralized identity provider.
#
# Manual Verification Steps:
#
# 1. Verify application authentication uses Keycloak SSO.
#
# 2. Verify PostgreSQL roles are service accounts only:
#
#       SELECT rolname FROM pg_roles;
#
# 3. Confirm users do not authenticate directly to the DBMS.
############################################################

- name: "V-263615 | Password selection handled by external identity provider"
  ansible.builtin.debug:
    msg: "PostgreSQL does not perform password-based authentication for users; control not applicable."
  tags:
    - V-263615
    - CATII
    - enforce

