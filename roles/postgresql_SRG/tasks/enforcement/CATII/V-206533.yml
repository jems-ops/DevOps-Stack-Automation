---
############################################################
# STIG Control: V-206533
# Status: NOT A FINDING
#
# Title:
# The DBMS must include the user identity in audit records.
#
# Finding Details:
# Audit records must include sufficient information to
# identify the user responsible for an event within the
# database system.
#
# Implementation in this Environment:
# PostgreSQL audit records include user identity through
# the log_line_prefix configuration parameter.
#
# The log prefix records the username, database name,
# process ID, session identifier, application name, and
# client host address for each logged event.
#
# Manual Verification Steps:
#
#     SHOW log_line_prefix;
#
# Comment:
# PostgreSQL log entries include sufficient identity
# information to establish accountability for database
# activity.
############################################################


############################################################
# Configure Identity Logging
############################################################

- name: "V-206533 | Configure log_line_prefix for identity tracking"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p %c %a %h '"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206533','CAT II','enforce']
