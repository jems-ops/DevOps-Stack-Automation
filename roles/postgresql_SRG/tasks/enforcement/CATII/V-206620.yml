---
############################################################
# STIG Control: V-206620
# Status: NOT A FINDING
#
# Title:
# DBMS must generate audit records when security objects
# are modified.
#
# Finding Details:
# Unauthorized modification of security objects such as
# roles, privileges, schemas, or database structures could
# allow attackers to escalate privileges or bypass access
# controls. Audit logging ensures these actions are
# recorded for monitoring and forensic investigation.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Security object modifications such as ALTER ROLE,
# ALTER TABLE, GRANT, and REVOKE operations are recorded
# in audit logs.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify audit classes include role and ddl:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Security object modification operations
# including ALTER ROLE, ALTER TABLE, GRANT, and REVOKE
# generate audit records containing timestamp, user
# identity, and affected object information. These logs
# ensure modifications to security objects are traceable
# for monitoring and forensic analysis.
############################################################

- name: "V-206620 | Ensure pgaudit extension enabled"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206620','CAT II', 'enforce']

- name: "V-206620 | Configure audit logging for security objects"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206620','CAT II', 'enforce']
