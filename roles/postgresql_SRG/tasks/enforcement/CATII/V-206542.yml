---
############################################################
# STIG Control: V-206542
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect audit configuration from
# unauthorized modification.
#
# Finding Details:
# Audit configuration files must be protected to ensure
# that auditing cannot be disabled or modified by
# unauthorized users. Improper file permissions or
# excessive privileges may allow attackers to modify or
# disable audit logging.
#
# Implementation in this Environment:
# PostgreSQL audit configuration files are owned by the
# postgres account and have restrictive file permissions.
# Only the postgres administrative account can modify the
# configuration files controlling database auditing.
#
# Manual Verification Steps:
#
# 1. Verify file permissions:
#
#       ls -l postgresql.conf
#       ls -l postgresql.auto.conf
#       ls -l pg_hba.conf
#
# 2. Verify superuser accounts:
#
#       SELECT rolname FROM pg_roles WHERE rolsuper=true;
#
# Comment:
# PostgreSQL audit configuration files are protected
# through operating system file permissions and ownership.
# Only authorized administrators can modify these files.
############################################################


############################################################
# Enforcement
############################################################

############################
# Protect postgresql.conf
############################

- name: "V-206542 | Protect postgresql.conf"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_conf_file }}"
    owner: postgres
    group: postgres
    mode: "0600"
  tags: ['V-206542','CAT II','enforce']


############################
# Protect postgresql.auto.conf
############################

- name: "V-206542 | Protect postgresql.auto.conf"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}/postgresql.auto.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  tags: ['V-206542','CAT II','enforce']


############################
# Protect pg_hba.conf
############################

- name: "V-206542 | Protect pg_hba.conf"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_hba_file }}"
    owner: postgres
    group: postgres
    mode: "0600"
  tags: ['V-206542','CAT II','enforce']


############################################################
# Validation
############################################################

- name: "V-206542 | Check file permissions"
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ postgresql_srg_conf_file }}"
    - "{{ postgresql_srg_data_dir }}/postgresql.auto.conf"
    - "{{ postgresql_srg_hba_file }}"
  register: v206542_files
  tags: ['V-206542','CAT II','check']


- name: "V-206542 | Assert correct permissions"
  ansible.builtin.assert:
    that:
      - item.stat.mode == "0600"
      - item.stat.pw_name == "postgres"
    fail_msg: >
      STIG V-206542 FAILED:
      Audit configuration file permissions incorrect.
    success_msg: >
      Audit configuration files protected.
  loop: "{{ v206542_files.results }}"
  tags: ['V-206542','CAT II','check']
