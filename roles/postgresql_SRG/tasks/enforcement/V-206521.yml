---
############################################################
# PostgreSQL STIG | V-206521
#
# FINDING DEFINITION:
# Configure the DBMS settings and access controls to permit
# user access only to objects and data that the user is
# authorized to view or interact with, and prevent access
# to all other objects and data.
#
# CONTROL INTENT:
# Enforce least privilege (AC-6). Users must only access
# explicitly authorized database objects. All other access
# must be denied by default.
#
# COMPLIANCE CHECKLIST:
# ✔ PUBLIC does NOT have CONNECT on database
# ✔ PUBLIC does NOT have USAGE on schema
# ✔ PUBLIC does NOT have CREATE on schema
# ✔ Default privileges are revoked from PUBLIC
# ✔ Access is role-based (RBAC model)
# ✔ Superuser accounts are minimized
#
# FAILED CONDITIONS (Finding if any are true):
# ✖ PUBLIC retains CONNECT privilege on database
# ✖ PUBLIC retains USAGE or CREATE on schema
# ✖ Default privileges grant access to PUBLIC
# ✖ Excessive direct object grants to users
# ✖ Excessive superuser accounts
# ✖ Users can access objects without explicit authorization
#
############################################################

- name: V-206521 | Revoke PUBLIC access to database
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE ALL ON DATABASE {{ postgresql_srg_target_database }} FROM PUBLIC;"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_revoke_public

############################################################
# Revoke PUBLIC access from schemas
############################################################

- name: V-206521 | Revoke PUBLIC access on schemas
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE ALL ON SCHEMA {{ item }} FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_revoke_public

############################################################
# Harden Default Privileges
############################################################

- name: V-206521 | Remove default PUBLIC table privileges
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "ALTER DEFAULT PRIVILEGES IN SCHEMA {{ item }}
     REVOKE ALL ON TABLES FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_enforce_default_privileges

############################################################
# Example Role-Based Access Model
############################################################

- name: V-206521 | Ensure readonly role exists
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -tc \
    "SELECT 1 FROM pg_roles WHERE rolname='{{ postgresql_srg_readonly_role }}';" | \
    grep -q 1 || \
    psql -d {{ postgresql_srg_target_database }} -c \
    "CREATE ROLE {{ postgresql_srg_readonly_role }};"
  when: postgresql_srg_access_control_enabled

- name: V-206521 | Grant SELECT privileges to readonly role
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "GRANT USAGE ON SCHEMA {{ item }} TO {{ postgresql_srg_readonly_role }};
     GRANT SELECT ON ALL TABLES IN SCHEMA {{ item }} TO {{ postgresql_srg_readonly_role }};"
  loop: "{{ postgresql_srg_application_schemas }}"
  when: postgresql_srg_access_control_enabled

############################################################
# Enforce Superuser Restriction
############################################################

- name: V-206521 | Check for unauthorized SUPERUSER roles
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -t -c \
    "SELECT rolname
     FROM pg_roles
     WHERE rolsuper = true
     AND rolname <> 'postgres';"
  register: postgresql_srg_extra_superusers
  changed_when: false
  when: postgresql_srg_access_control_enabled

- name: V-206521 | Fail if extra superusers detected
  fail:
    msg: "Unauthorized SUPERUSER roles detected: {{ postgresql_srg_extra_superusers.stdout_lines }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_extra_superusers.stdout | trim != ""
