---
############################################################
# STIG Control: V-263618
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect nonlocal maintenance sessions by
# separating the maintenance session from other network
# sessions using logically separated communications paths.
#
# Finding Details:
# If administrative sessions share the same communication
# paths as regular database traffic, attackers may intercept
# or manipulate privileged maintenance operations.
#
# Implementation in this Environment:
# PostgreSQL administrative maintenance sessions occur
# through SSH access to the host operating system. Network
# access to the database is restricted through pg_hba.conf
# and approved management networks.
#
# Comment:
# PostgreSQL itself does not enforce network segmentation.
# Administrative access occurs through secure SSH sessions
# to the host operating system, which is isolated from
# standard application traffic. Infrastructure controls
# ensure that maintenance sessions occur through
# logically separated communication paths.
#
# Manual Verification Steps:
# 1. Verify PostgreSQL listening interfaces:
#       psql -c "SHOW listen_addresses;"
#
# 2. Verify PostgreSQL listening ports:
#       ss -plnt | grep postgres
#
# 3. Verify pg_hba.conf restricts access to approved networks.
#
# 4. Confirm administrative access occurs through SSH.
############################################################

- name: "V-263618 | Ensure SSH service is enabled for maintenance access"
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
  tags:
    - V-263618
    - CATII
    - enforce
