---
############################################################
# STIG Control: V-263612
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must, for password-based authentication, update
# the list of passwords when organizational passwords are
# suspected to have been compromised directly or indirectly.
#
# Finding Details:
# If compromised passwords continue to be accepted by a
# system, attackers may gain unauthorized access using
# credentials exposed through breaches or other incidents.
#
# Implementation in this Environment:
# PostgreSQL in this deployment is used only as the backend
# database for the SonarQube application. End users do not
# authenticate directly to the DBMS.
#
# User authentication and password management are performed
# through the centralized identity provider (Keycloak SSO),
# which enforces password policies and manages compromised
# password detection.
#
# Comment:
# Because PostgreSQL does not perform password-based
# authentication for end users, updating lists of compromised
# passwords is handled by the enterprise identity provider
# rather than the DBMS. Therefore, this control is not
# applicable to the PostgreSQL deployment.
#
# Manual Verification Steps:
#
# 1. Verify SonarQube authentication uses Keycloak SSO.
#
# 2. Confirm PostgreSQL roles are application service
#    accounts rather than individual user accounts:
#
#       SELECT rolname FROM pg_roles;
#
# 3. Verify password compromise monitoring is implemented
#    in the centralized identity provider.
############################################################

- name: "V-263612 | Password compromise monitoring handled by identity provider"
  ansible.builtin.debug:
    msg: "DBMS does not manage user password authentication; control not applicable."
  tags:
    - V-263612
    - CATII
    - enforce
