---
############################################################
# STIG Control: V-206519
# Status: NOT A FINDING
#
# Title:
# The DBMS must limit the number of concurrent sessions
# per database account to prevent resource exhaustion
# and denial-of-service conditions.
#
# Finding Details:
# Without connection limits, a compromised or malfunctioning
# account could open excessive database sessions and consume
# system resources, potentially leading to denial-of-service
# conditions or degraded database performance.
#
# Implementation in this Environment:
# PostgreSQL enforces concurrent session limits using the
# ROLE parameter "CONNECTION LIMIT". Limits are applied to
# database roles according to organizational policy using
# Ansible automation.
#
# Comment:
# Concurrent session limits are configured for PostgreSQL
# roles using the CONNECTION LIMIT parameter. Administrative
# roles and application roles are assigned defined limits to
# prevent excessive database session creation while ensuring
# legitimate system operation.
#
# Manual Verification Steps:
# 1. Query configured role connection limits:
#       SELECT rolname, rolconnlimit FROM pg_roles;
#
# 2. Verify connection limits are defined according to policy.
#
# 3. Confirm roles do not allow unlimited connections (-1)
#    unless explicitly exempted by policy.
############################################################

- name: "V-206519 | Gather current role connection limits"
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -t -A -F', ' -c "SELECT rolname, rolconnlimit FROM pg_roles;"
  register: postgresql_srg_connlimit_raw
  changed_when: false
  tags:
    - V-206519
    - CATII
    - enforce


- name: "V-206519 | Parse role connection limits"
  ansible.builtin.set_fact:
    postgresql_srg_roles_parsed: >-
      {{
        postgresql_srg_connlimit_raw.stdout_lines
        | map('split', ', ')
        | list
      }}
  tags:
    - V-206519
    - CATII
    - enforce


- name: "V-206519 | Enforce connection limits per role"
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      psql -c "ALTER ROLE {{ item[0] }}
      CONNECTION LIMIT
      {{
        (item[0] in postgresql_srg_admin_roles)
        | ternary(postgresql_srg_admin_conn_limit,
                  postgresql_srg_user_conn_limit)
      }};"
  loop: "{{ postgresql_srg_roles_parsed }}"
  when:
    - item[0] not in postgresql_srg_connlimit_exempt_roles
    - not item[0].startswith('pg_')
    - item[1] | int != (
        (item[0] in postgresql_srg_admin_roles)
        | ternary(postgresql_srg_admin_conn_limit,
                  postgresql_srg_user_conn_limit)
      )
  tags:
    - V-206519
    - CATII
    - enforce
