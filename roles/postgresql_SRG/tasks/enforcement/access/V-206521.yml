---
############################################################
# STIG Control: V-206521
# Status: NOT A FINDING
#
# Title: Enforce Least Privilege Access Control
#
# Finding Details:
# Excessive privileges (especially PUBLIC) can expose data.
#
# SAFE ENFORCEMENT PRINCIPLES:
# - DO NOT modify system schemas (pg_catalog, information_schema)
# - DO NOT remove CONNECT
# - ONLY restrict application schemas
# - ENFORCE default privileges (critical)
#
# Implementation / Justification:
# Least privilege is enforced in this PostgreSQL environment:
#
#   • PUBLIC privileges are revoked from application schemas
#   • System schemas remain accessible as required by PostgreSQL
#   • CREATE privileges are removed from PUBLIC at database level
#   • Default privileges are hardened to prevent future exposure
#   • RBAC is implemented via a controlled readonly role
#   • Access is limited to authorized roles only
#
# Manual Verification Steps:
#
#   1. Verify PUBLIC CREATE privilege on database:
#        SELECT has_database_privilege('public', '<db>', 'CREATE');
#
#   2. Verify schema-level privileges:
#        SELECT nspname FROM pg_namespace
#        WHERE has_schema_privilege('public', oid, 'CREATE');
#
#   3. Verify default privileges:
#        SELECT * FROM pg_default_acl;
#
#   4. Verify PUBLIC table access:
#        SELECT * FROM information_schema.role_table_grants
#        WHERE grantee = 'public';
#
#   5. Verify RBAC role:
#        SELECT rolname FROM pg_roles WHERE rolname='<readonly_role>';
#
# Summary:
# PUBLIC access is restricted to prevent unauthorized privilege escalation.
# Default privileges are hardened to secure both current and future objects.
# RBAC is enforced for controlled access to database objects.
# Therefore, least privilege is fully enforced and V-206521 is NOT A FINDING.
############################################################

############################################################
# Normalize schemas
############################################################

- name: "V-206521 | Normalize schemas"
  ansible.builtin.set_fact:
    postgresql_srg_effective_schemas: >-
      {{
        postgresql_srg_application_schemas
        | flatten
        | map('trim')
        | reject('equalto', '')
        | difference(['pg_catalog', 'information_schema'])
        | list
      }}
  tags: ['V-206521', 'CAT-II', 'enforce', 'postgres', 'stig']


############################################################
# Render SQL scripts to /tmp
############################################################

- name: "V-206521 | Render ensure-role SQL script"
  ansible.builtin.template:
    src: "{{ role_path }}/files/sql/v206521_ensure_role.sql.j2"
    dest: /tmp/v206521_ensure_role.sql
    owner: postgres
    group: postgres
    mode: "0600"
  become: true
  tags: ['V-206521', 'enforce', 'rbac']

- name: "V-206521 | Render least-privilege SQL script"
  ansible.builtin.template:
    src: "{{ role_path }}/files/sql/v206521_least_privilege.sql.j2"
    dest: /tmp/v206521_least_privilege.sql
    owner: postgres
    group: postgres
    mode: "0600"
  become: true
  tags: ['V-206521', 'enforce']

############################################################
# Execute SQL scripts via psql
############################################################

- name: "V-206521 | Ensure readonly role exists"
  become: true
  become_user: postgres
  ansible.builtin.command: >-
    psql -d {{ postgresql_srg_target_database }}
    -f /tmp/v206521_ensure_role.sql
    --set ON_ERROR_STOP=1
  register: _v206521_role_result
  changed_when: false
  tags: ['V-206521', 'enforce', 'rbac']

- name: "V-206521 | Display role creation result"
  ansible.builtin.debug:
    var: _v206521_role_result.stdout_lines
  when: _v206521_role_result.stdout_lines | default([]) | length > 0
  tags: ['V-206521', 'enforce', 'rbac']

- name: "V-206521 | Execute least-privilege SQL script"
  become: true
  become_user: postgres
  ansible.builtin.command: >-
    psql -d {{ postgresql_srg_target_database }}
    -f /tmp/v206521_least_privilege.sql
    --set ON_ERROR_STOP=1
  register: _v206521_result
  changed_when: false
  tags: ['V-206521', 'enforce']

- name: "V-206521 | Display enforcement result"
  ansible.builtin.debug:
    var: _v206521_result.stdout_lines
  when: _v206521_result.stdout_lines | default([]) | length > 0
  tags: ['V-206521', 'enforce']

############################################################
# Clean up temporary SQL scripts
############################################################

- name: "V-206521 | Clean up temporary SQL scripts"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/v206521_ensure_role.sql
    - /tmp/v206521_least_privilege.sql
  tags: ['V-206521', 'enforce']
