############################################################
# STIG Control: V-206520
# Status: NOT A FINDING
#
# Title:
# The DBMS must integrate with an organization-level
# authentication mechanism.
#
# Finding Details:
# The DBMS is required to integrate with enterprise
# authentication services (e.g., LDAP, Active Directory)
# for centralized account management.
#
# Implementation in this Environment:
# PostgreSQL operates in an isolated, application-bound
# architecture and does not support direct user access.
#
#   • Database access restricted to localhost only
#   • No external user authentication required
#   • Service accounts used for application access
#   • No interactive user logins to DBMS
#
# Security Boundary Justification:
# The DBMS is deployed behind an application layer and is
# not exposed to end users. Authentication is handled by the
# application and/or OS-level controls rather than the DBMS.
#
# Therefore, enterprise authentication integration at the
# DBMS level is not required for this deployment model.
#
# Manual Verification Steps:
#
#   1. Verify network exposure:
#        SHOW listen_addresses;
#
#   2. Verify pg_hba.conf:
#        cat pg_hba.conf
#
#   3. Verify login roles:
#        SELECT rolname FROM pg_roles WHERE rolcanlogin = true;
#
# Conclusion:
# PostgreSQL is deployed as an application-specific database
# with restricted local access and controlled service accounts.
# Centralized authentication is enforced at the application/OS
# boundary. Therefore, V-206520 is NOT A FINDING.
# Therefore, enterprise authentication is not required.
############################################################

- name: "V-206520 | Informational - isolated architecture"
  ansible.builtin.debug:
    msg: >
      PostgreSQL operates in an isolated, application-bound model.
      No external users or enterprise authentication mechanisms are required.
      Access is controlled via OS and application RBAC.
  changed_when: false
  tags: ['V-206520', 'CAT-II', 'enforce', 'postgres', 'stig', 'justification']
