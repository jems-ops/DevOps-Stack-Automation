---
############################################################
# STIG V-206555 Enforcement
# Ensure DB passwords are securely stored and hashed
############################################################

############################################################
# Ensure SCRAM Password Encryption
############################################################

- name: "V-206555 | Enforce SCRAM password encryption"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?password_encryption'
    line: "password_encryption = scram-sha-256"
    state: present
  notify: Restart PostgreSQL


############################################################
# Identify Files Containing DB Password References
############################################################

- name: "V-206555 | Scan application configuration paths for password references"
  become: true
  ansible.builtin.shell: |
    grep -Ril "password=" {{ postgresql_srg_config_scan_paths | join(' ') }} || true
  register: postgresql_srg_password_files
  changed_when: false


############################################################
# Secure Configuration Files Containing Passwords
############################################################

- name: "V-206555 | Secure permissions on files containing DB passwords"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop: "{{ postgresql_srg_password_files.stdout_lines }}"
  when: postgresql_srg_password_files.stdout_lines | length > 0


############################################################
# Secure .pgpass Files
############################################################

- name: "V-206555 | Find .pgpass files"
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_pgpass_search_paths }}"
    patterns: ".pgpass"
    recurse: true
  register: postgresql_srg_pgpass_files


- name: "V-206555 | Enforce secure permissions on .pgpass"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop: "{{ postgresql_srg_pgpass_files.files }}"
  when: postgresql_srg_pgpass_files.matched > 0
