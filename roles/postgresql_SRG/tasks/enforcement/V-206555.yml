---
############################################################
# STIG V-206555 Enforcement
# Password Complexity / Lifetime / Reuse
# Status: NOT A FINDING (No DB Password Authentication)
############################################################

############################################################
# Enforce Peer Authentication Only
############################################################

- name: "V-206555 | Remove password-based authentication methods"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(host|local).*(md5|scram-sha-256|password)\s*$'
    replace: ''
  notify: Reload PostgreSQL

- name: "V-206555 | Ensure peer authentication for local connections"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    line: "local   all     all     peer"
    create: false
  notify: Reload PostgreSQL

############################################################
# Remove Stored Passwords from Roles
############################################################

- name: "V-206555 | Get roles with stored passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword IS NOT NULL;"
  register: postgresql_srg_roles_with_passwords
  changed_when: false

- name: "V-206555 | Remove passwords from roles"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -c "ALTER ROLE {{ item }} PASSWORD NULL;"
  loop: "{{ postgresql_srg_roles_with_passwords.stdout_lines }}"
  when: postgresql_srg_roles_with_passwords.stdout_lines | length > 0
  notify: Reload PostgreSQL
