---
############################################################
# STIG V-206526
# Enforcement - Audit FAILED retrieval of privileges/roles
############################################################
#
# COMPLIANT WHEN:
# - pgaudit enabled
# - read + role classes enabled
# - catalog auditing enabled
# - failed statements logged
#
# VERIFY:
# SHOW pgaudit.log;
# SHOW pgaudit.log_catalog;
# SHOW log_min_error_statement;
# comment: PostgreSQL has pgaudit enabled, catalog auditing active, and
# failed statements logged. Unsuccessful privilege/role retrieval attempts
# generate audit records. Therefore, V-206526 is Not a Finding.
############################################################

############################################################
# Ensure pgaudit auditing includes read + role
############################################################

- name: V-206526 | Configure pgaudit log classes
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206526
    - cat2

############################################################
# Enable catalog auditing
############################################################

- name: V-206526 | Enable catalog auditing
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log_catalog\s*='
    line: "pgaudit.log_catalog = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206526
    - cat2

############################################################
# Ensure failed statements are logged
############################################################

- name: V-206526 | Log failed statements
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_min_error_statement\s*='
    line: "log_min_error_statement = error"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206526
    - cat2
