---
############################################################
# STIG Control: V-263619
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must maintain a certificate trust store that
# contains only authorized certificate authorities when
# using TLS/SSL connections.
#
# Finding Details:
# If TLS is used and the DBMS does not properly validate
# trusted certificate authorities, attackers could present
# unauthorized certificates leading to man-in-the-middle
# attacks or compromised encrypted connections.
#
# Implementation in this Environment:
# PostgreSQL SSL/TLS encryption is not enabled in this
# environment (ssl = off). Therefore the DBMS does not
# establish TLS connections and does not maintain a
# certificate trust store or trust anchors.
#
# Comment:
# Since TLS/SSL is not configured for PostgreSQL, the DBMS
# does not rely on certificate validation mechanisms.
# Certificate trust stores only apply when TLS is enabled.
#
# Manual Verification Steps:
# 1. Verify PostgreSQL SSL configuration:
#
#       psql -t -c "SHOW ssl;"
#
# 2. Confirm the result:
#
#       ssl = off
#
# 3. Verify pg_hba.conf does not contain hostssl entries.
#
############################################################

- name: "V-263619 | TLS not enabled - control not applicable"
  ansible.builtin.debug:
    msg: "PostgreSQL SSL/TLS encryption is disabled (ssl=off); certificate trust store controls are not applicable."
  tags:
    - V-263619
    - CATII
    - enforce
