---
############################################################
# STIG V-206527
# Enforcement - Session Auditing at Startup
############################################################
#
# COMPLIANT WHEN:
# - pgaudit loaded via shared_preload_libraries
# - log_connections = on
# - log_disconnections = on
#
# VERIFY:
# SHOW shared_preload_libraries;
# SHOW log_connections;
# SHOW log_disconnections;
# Comment: PostgreSQL loads pgaudit via shared_preload_libraries at startup.
# Connection/disconnection logging enabled. Session auditing starts
# automatically upon DBMS startup. Therefore, V-206527 is Not a Finding.
############################################################

- name: V-206527 | Ensure pgaudit loads at startup
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^shared_preload_libraries\s*='
    line: "shared_preload_libraries = 'pgaudit'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206527
    - cat2

- name: V-206527 | Enable connection logging
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_connections\s*='
    line: "log_connections = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206527
    - cat2

- name: V-206527 | Enable disconnection logging
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_disconnections\s*='
    line: "log_disconnections = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206527
    - cat2
