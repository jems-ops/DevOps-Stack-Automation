---
############################################################
# STIG V-206520
# Enterprise Authentication Integration
#
# Architecture Decision:
# PostgreSQL operates in an isolated application-bound
# architecture and does not support enterprise interactive
# user authentication.
#
# Compliance achieved through:
# - localhost-only access
# - peer authentication for postgres admin
# - SCRAM authentication for service accounts
# - restricted login roles
############################################################

############################################################
# Restrict PostgreSQL network exposure
############################################################

- name: "V-206520 | Restrict listen_addresses to localhost"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
    state: present
  notify: Restart PostgreSQL

############################################################
# Remove trust authentication
############################################################

- name: "V-206520 | Remove trust authentication methods"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(local|host|hostssl|hostnossl).*\strust\s*$'
    replace: ''
  notify: Reload PostgreSQL

############################################################
# Enforce peer authentication for postgres admin
############################################################

- name: "V-206520 | Ensure postgres admin uses peer auth"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^local\s+all\s+postgres'
    line: "local   all   postgres   peer"
    state: present
  notify: Reload PostgreSQL

############################################################
# Enforce SCRAM authentication for localhost access
############################################################

- name: "V-206520 | Enforce SCRAM authentication (IPv4)"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32'
    line: "host    all    all    127.0.0.1/32    scram-sha-256"
  notify: Reload PostgreSQL

- name: "V-206520 | Enforce SCRAM authentication (IPv6)"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^host\s+all\s+all\s+::1/128'
    line: "host    all    all    ::1/128    scram-sha-256"
  notify: Reload PostgreSQL

############################################################
# Detect unauthorized login roles
############################################################

- name: "V-206520 | Identify login roles"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_roles WHERE rolcanlogin = true;"
  register: postgresql_srg_login_roles
  changed_when: false

- name: "V-206520 | Fail if unauthorized login roles exist"
  ansible.builtin.fail:
    msg: "Unauthorized login roles detected: {{ postgresql_srg_login_roles.stdout_lines }}"
  when: >
    postgresql_srg_login_roles.stdout_lines |
    difference(postgresql_srg_approved_login_roles) |
    length > 0
