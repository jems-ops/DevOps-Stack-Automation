---
############################################################
# STIG Control: V-233495
# Status: NOT A FINDING (when validated)
#
# Title:
# DBMS must use NSA-approved cryptography (FIPS)
#
# Enforcement Strategy:
# PostgreSQL relies on OS cryptographic modules.
# FIPS enforcement is handled at OS level.
#
# No automatic remediation performed.
############################################################

- name: "V-233495 | Informational - OS-level FIPS required"
  ansible.builtin.debug:
    msg: >
      PostgreSQL uses OS-provided cryptography (OpenSSL).
      FIPS compliance must be enforced at the OS level.
      This role validates but does not enable FIPS mode
      due to system-wide impact and reboot requirement.
  changed_when: false
  tags: ['V-233495','CAT-II','enforce','postgres','stig','manual','fips']
