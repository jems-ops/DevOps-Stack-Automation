---
############################################################
# STIG V-233495 Enforcement
# Deploy DBMS Compatible with NSA-Approved Cryptography
############################################################

############################################################
# Verify FIPS Kernel Mode
############################################################

- name: "V-233495 | Check FIPS kernel mode"
  become: true
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: postgresql_srg_fips_status
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-233495 | Fail if FIPS kernel mode disabled"
  ansible.builtin.fail:
    msg: "FIPS kernel mode not enabled. System must run in FIPS mode."
  when:
    - postgresql_srg_fips_required | bool
    - postgresql_srg_fips_status.stdout != "1"

############################################################
# Verify System Crypto Policy
############################################################

- name: "V-233495 | Check crypto policy"
  become: true
  ansible.builtin.command: update-crypto-policies --show
  register: postgresql_srg_crypto_policy
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-233495 | Fail if crypto policy not FIPS"
  ansible.builtin.fail:
    msg: "System crypto policy must be set to FIPS"
  when:
    - postgresql_srg_fips_required | bool
    - postgresql_srg_crypto_policy.stdout is not search("FIPS")

############################################################
# Ensure PostgreSQL Uses SCRAM Authentication
############################################################

- name: "V-233495 | Enforce SCRAM authentication"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32'
    line: "host    all    all    127.0.0.1/32    scram-sha-256"
    state: present
  notify: Reload PostgreSQL

############################################################
# Remove Weak Authentication Methods
############################################################

- name: "V-233495 | Remove MD5 and password authentication"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(host|local).*(md5|password)\s*$'
    replace: ''
  notify: Reload PostgreSQL

############################################################
# Restrict PostgreSQL Network Exposure
############################################################

- name: "V-233495 | Restrict listen_addresses"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
    state: present
  notify: Restart PostgreSQL
