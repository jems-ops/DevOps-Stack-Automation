---
############################################################
# STIG V-206559
# Protect DBMS PKI Private Keys
#
# Architecture Decision:
# PostgreSQL instance does not manage DBMS PKI private keys.
# TLS termination handled externally or disabled in isolated
# architecture.
# Compliance achieved through:
# V-206559
# Status: NOT A FINDING

# PostgreSQL instance does not manage DBMS PKI private keys.
# TLS termination is handled externally and the system
# operates using OS-provided FIPS validated cryptographic modules.
############################################################

############################################################
# Detect PostgreSQL private key
############################################################

- name: "V-206559 | Check for PostgreSQL private key"
  become: true
  ansible.builtin.stat:
    path: "{{ postgresql_srg_data_dir }}/server.key"
  register: postgresql_srg_server_key

############################################################
# Restrict permissions if key exists
############################################################

- name: "V-206559 | Restrict server.key permissions"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}/server.key"
    owner: postgres
    group: postgres
    mode: "0600"
  when: postgresql_srg_server_key.stat.exists

############################################################
# Verify OpenSSL FIPS mode
############################################################

- name: "V-206559 | Verify OpenSSL FIPS mode"
  become: true
  ansible.builtin.shell: |
    openssl list -providers | grep -i fips || true
  register: postgresql_srg_fips_check
  changed_when: false
