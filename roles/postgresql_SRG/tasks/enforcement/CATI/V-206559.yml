############################################################
# STIG Control: V-206559
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must protect PKI private keys.
#
# Finding Details:
# DBMS-managed PKI private keys must be protected using
# FIPS-validated cryptographic modules and restricted access.
#
# Implementation in this Environment:
# PostgreSQL instance does not manage or use DBMS-level
# PKI private keys.
#
#   • SSL/TLS is not enabled at the PostgreSQL layer
#   • No server.key actively used by DBMS
#   • Cryptographic controls handled at OS level (RHEL FIPS)
#   • System operates in isolated/internal architecture
#
# Therefore, this control is Not Applicable.
#
# Validation Approach:
# Verify absence of DBMS-managed private keys and confirm
# system-level cryptographic controls.
# Fix strategy:
# - Informational (primary)
# - Enforce only if key exists
############################################################


############################################################
# Check for server.key
############################################################

- name: "V-206559 | Check for server.key"
  become: true
  ansible.builtin.stat:
    path: "{{ postgresql_srg_data_dir }}/server.key"
  register: v206559_key
  changed_when: false
  tags: ['V-206559','CAT-II','enforce','postgres','stig']


############################################################
# Enforce permissions if key exists
############################################################

- name: "V-206559 | Secure server.key permissions"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}/server.key"
    owner: postgres
    group: postgres
    mode: "0600"
  when: v206559_key.stat.exists
  tags: ['V-206559','CAT-II','enforce','postgres','stig']


############################################################
# Informational output
############################################################

- name: "V-206559 | Informational - Not Applicable"
  ansible.builtin.debug:
    msg: >
      PostgreSQL server.key not present.
      Control V-206559 is Not Applicable in this environment.
  when: not v206559_key.stat.exists
  changed_when: false
  tags: ['V-206559','CAT-II','enforce','postgres','stig']
