---
############################################################
# PostgreSQL STIG | V-206521
#
# Enforce Least Privilege Access Control
#
# Control Objective:
# Users must only access explicitly authorized database
# objects and data. PUBLIC privileges must be revoked and
# role-based access control enforced.
#
# NIST Mapping:
# AC-3 Access Enforcement
# AC-6 Least Privilege
############################################################

############################################################
# Revoke PUBLIC access to database
############################################################

- name: "V-206521 | Revoke PUBLIC CONNECT on database"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE ALL ON DATABASE {{ postgresql_srg_target_database }} FROM PUBLIC;"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_revoke_public

############################################################
# Revoke PUBLIC schema privileges
############################################################

- name: "V-206521 | Revoke PUBLIC access on schemas"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE ALL ON SCHEMA {{ item }} FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_revoke_public

############################################################
# Revoke PUBLIC CREATE privilege
############################################################

- name: "V-206521 | Revoke PUBLIC create privilege on schemas"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE CREATE ON SCHEMA {{ item }} FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when: postgresql_srg_access_control_enabled

############################################################
# Revoke PUBLIC table access
############################################################

- name: "V-206521 | Revoke PUBLIC privileges on tables"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE ALL ON ALL TABLES IN SCHEMA {{ item }} FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when: postgresql_srg_access_control_enabled

############################################################
# Revoke PUBLIC sequence access
############################################################

- name: "V-206521 | Revoke PUBLIC privileges on sequences"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE ALL ON ALL SEQUENCES IN SCHEMA {{ item }} FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when: postgresql_srg_access_control_enabled

############################################################
# Revoke PUBLIC function execute
############################################################

- name: "V-206521 | Revoke PUBLIC execute on functions"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "REVOKE EXECUTE ON ALL FUNCTIONS IN SCHEMA {{ item }} FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when: postgresql_srg_access_control_enabled

############################################################
# Harden Default Privileges
############################################################

- name: "V-206521 | Remove default PUBLIC table privileges"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "ALTER DEFAULT PRIVILEGES IN SCHEMA {{ item }}
     REVOKE ALL ON TABLES FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_enforce_default_privileges

- name: "V-206521 | Remove default PUBLIC sequence privileges"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "ALTER DEFAULT PRIVILEGES IN SCHEMA {{ item }}
     REVOKE ALL ON SEQUENCES FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_enforce_default_privileges

- name: "V-206521 | Remove default PUBLIC function privileges"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "ALTER DEFAULT PRIVILEGES IN SCHEMA {{ item }}
     REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC;"
  loop: "{{ postgresql_srg_application_schemas }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_enforce_default_privileges

############################################################
# Role-Based Access Control Model
############################################################

- name: "V-206521 | Ensure readonly role exists"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -tc \
    "SELECT 1 FROM pg_roles WHERE rolname='{{ postgresql_srg_readonly_role }}';" | \
    grep -q 1 || \
    psql -d {{ postgresql_srg_target_database }} -c \
    "CREATE ROLE {{ postgresql_srg_readonly_role }};"
  when: postgresql_srg_access_control_enabled

- name: "V-206521 | Grant readonly access"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "GRANT USAGE ON SCHEMA {{ item }} TO {{ postgresql_srg_readonly_role }};
     GRANT SELECT ON ALL TABLES IN SCHEMA {{ item }} TO {{ postgresql_srg_readonly_role }};"
  loop: "{{ postgresql_srg_application_schemas }}"
  when: postgresql_srg_access_control_enabled

############################################################
# Enforce Superuser Restriction
############################################################

- name: "V-206521 | Detect unauthorized superusers"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d {{ postgresql_srg_target_database }} -t -c \
    "SELECT rolname
     FROM pg_roles
     WHERE rolsuper = true
     AND rolname <> 'postgres';"
  register: postgresql_srg_extra_superusers
  changed_when: false
  when: postgresql_srg_access_control_enabled

- name: "V-206521 | Fail if unauthorized superusers exist"
  ansible.builtin.fail:
    msg: "Unauthorized SUPERUSER roles detected: {{ postgresql_srg_extra_superusers.stdout_lines }}"
  when:
    - postgresql_srg_access_control_enabled
    - postgresql_srg_extra_superusers.stdout | trim != ""
