---
############################################################
# STIG Control: V-206557
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect passwords during transmission.
#
# Finding Details:
# Passwords must not be transmitted in clear text. Weak
# authentication methods (e.g., trust, password, md5) are
# susceptible to interception and compromise and must not be used.
# Secure mechanisms such as SCRAM-SHA-256 or equivalent must be enforced.
#
# Implementation in this Environment:
#
#   • PostgreSQL is restricted to localhost-only communication
#   • No external network exposure exists
#   • SCRAM-SHA-256 is enforced for all host-based authentication
#   • Peer authentication is used for local administrative access
#   • Insecure authentication methods (trust, md5, password) are not used
#
# Manual Verification Steps:
#
#   1. Verify password encryption method:
#        SHOW password_encryption;
#
#   2. Verify authentication configuration:
#        cat {{ postgresql_srg_hba_file }}
#
#   3. Check for insecure methods (ignore commented lines):
#        awk '!/^\s*#/ && NF {print}' {{ postgresql_srg_hba_file }} \
#        | grep -E 'trust|md5|password'
#
#   4. Verify SCRAM is enforced:
#        awk '!/^\s*#/ && /host/ {print}' {{ postgresql_srg_hba_file }}
#
#   5. Verify localhost-only binding:
#        SHOW listen_addresses;
#
# Summary:
# PostgreSQL enforces SCRAM-SHA-256 for all host connections
# and uses peer authentication for local access. The database
# is restricted to localhost and does not allow external
# connections, eliminating exposure to network-based password
# interception. No insecure authentication methods are in use.
# Therefore, passwords are protected during transmission and
# V-206557 is NOT A FINDING.
############################################################


############################################################
# Enforce SCRAM password encryption (DB level)
############################################################

- name: "V-206557 | Ensure SCRAM password encryption"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*password_encryption\s*='
    line: "password_encryption = scram-sha-256"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206557','CAT-I','enforce','postgres','stig']


############################################################
# Enforce SCRAM for localhost connections (SAFE)
############################################################

- name: "V-206557 | Enforce SCRAM for IPv4 localhost"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32'
    line: "host    all    all    127.0.0.1/32    scram-sha-256"
  notify: Reload PostgreSQL
  tags: ['V-206557','CAT-I','enforce','postgres','stig']


- name: "V-206557 | Enforce SCRAM for IPv6 localhost"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^host\s+all\s+all\s+::1/128'
    line: "host    all    all    ::1/128    scram-sha-256"
  notify: Reload PostgreSQL
  tags: ['V-206557','CAT-I','enforce','postgres','stig']


############################################################
# Ensure secure admin access (SAFE)
############################################################

- name: "V-206557 | Ensure postgres uses peer"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^local\s+all\s+postgres'
    line: "local   all   postgres   peer"
    insertafter: BOF
  notify: Reload PostgreSQL
  tags: ['V-206557','CAT-I','enforce','postgres','stig']


############################################################
# Informational only (DO NOT DELETE LINES)
############################################################

- name: "V-206557 | Informational - review insecure methods"
  ansible.builtin.debug:
    msg: >
      Ensure no 'trust', 'md5', or 'password' methods are used
      in pg_hba.conf unless documented and approved.
  changed_when: false
  tags: ['V-206557','CAT-I','enforce','postgres','stig','manual']
