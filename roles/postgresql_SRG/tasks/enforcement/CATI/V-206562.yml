---
############################################################
# STIG V-206562
# Validate Use of FIPS 140-2/140-3 Cryptographic Modules
#
# NOTE:
# FIPS enablement is handled by the RHEL8 STIG baseline.
# This role only verifies compliance.
############################################################

############################################################
# Verify FIPS mode enabled
############################################################

- name: "V-206562 | Check FIPS kernel mode"
  become: true
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: postgresql_srg_fips_status
  changed_when: false

- name: "V-206562 | Assert FIPS mode enabled"
  ansible.builtin.assert:
    that:
      - postgresql_srg_fips_status.stdout == "1"
    fail_msg: "FIPS mode is not enabled"
    success_msg: "FIPS mode enabled"
  when: postgresql_srg_fips_required

############################################################
# Verify system crypto policy
############################################################

- name: "V-206562 | Check crypto policy"
  become: true
  ansible.builtin.command: update-crypto-policies --show
  register: postgresql_srg_crypto_policy
  changed_when: false

- name: "V-206562 | Assert crypto policy is FIPS"
  ansible.builtin.assert:
    that:
      - postgresql_srg_crypto_policy.stdout is search("FIPS")
    fail_msg: "System crypto policy is not FIPS"
    success_msg: "Crypto policy set to FIPS"
  when: postgresql_srg_fips_required

############################################################
# Verify OpenSSL FIPS provider
############################################################

- name: "V-206562 | Check OpenSSL providers"
  become: true
  ansible.builtin.shell: |
    openssl list -providers
  register: postgresql_srg_openssl_providers
  changed_when: false

- name: "V-206562 | Assert FIPS provider available"
  ansible.builtin.assert:
    that:
      - postgresql_srg_openssl_providers.stdout is search("fips")
    fail_msg: "FIPS provider not detected"
    success_msg: "OpenSSL FIPS provider detected"
  when: postgresql_srg_fips_required
