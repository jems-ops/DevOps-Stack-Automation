############################################################
# STIG V-206605
# Enforcement (Informational Only - Isolated Environment)
############################################################
#
# NOTE:
# PostgreSQL operates in an isolated environment and is
# not exposed to external or untrusted networks.
#
# Cryptographic enforcement at the DBMS layer is not
# required. Protection is provided via:
#   • Localhost-only binding
#   • Network isolation
#   • OS-level FIPS cryptographic modules
#
############################################################

- name: "V-206605 | Enforcement placeholder - no DB TLS required"
  ansible.builtin.debug:
    msg: >
      PostgreSQL operates in an isolated environment (localhost-only).
      DBMS-level TLS is not implemented because no external or
      untrusted network communication exists.
      Cryptographic protections are enforced at the OS level (FIPS).
  changed_when: false
  tags: ['V-206605','CAT I','informational']

