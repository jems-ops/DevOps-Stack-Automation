---
############################################################
# STIG V-206605
# Cryptographic Protection Based on System Classification
#
# Architecture:
# PostgreSQL stores internal application metadata and
# relies on OS-level FIPS cryptographic modules.
############################################################

############################################################
# Restrict PostgreSQL network exposure
############################################################

- name: "V-206605 | Restrict PostgreSQL listen_addresses"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
    state: present
  notify: Restart PostgreSQL
