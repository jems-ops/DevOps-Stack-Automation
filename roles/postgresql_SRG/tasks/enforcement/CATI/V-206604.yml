############################################################
# STIG V-206604
# Enforcement (Informational Only - Data Classification)
############################################################
#
# NOTE:
# PostgreSQL stores internal application metadata only.
# The system operates within an isolated environment.
#
# Based on data classification:
#   • No sensitive data is transmitted externally
#   • No untrusted network paths exist
#
# Therefore, DBMS-level cryptographic enforcement is not
# required. Protection is provided through system isolation
# and OS-level security controls.
#
############################################################

- name: "V-206604 | Enforcement placeholder - crypto not required"
  ansible.builtin.debug:
    msg: >
      PostgreSQL stores non-sensitive internal metadata and is
      deployed in an isolated environment. Cryptographic
      protections at the DBMS layer are not required based on
      data classification. OS-level controls and system
      isolation provide adequate protection.
  changed_when: false
  tags: ['V-206604','CAT I','enforce']
