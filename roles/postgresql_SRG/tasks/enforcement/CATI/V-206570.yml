---
############################################################
# STIG V-206570 Enforcement
# Protect PostgreSQL Data at Rest (OS-Level Controls)
############################################################

############################################################
# Ensure Data Directory Ownership
############################################################

- name: "V-206570 | Ensure PostgreSQL data directory ownership"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory

############################################################
# Ensure Data Directory Permissions
############################################################

- name: "V-206570 | Set data directory permissions to 0700"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}"
    mode: "0700"

############################################################
# Restrict Configuration File Permissions
############################################################

- name: "V-206570 | Ensure postgresql.conf permissions"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_conf_file }}"
    owner: postgres
    group: postgres
    mode: "0600"

- name: "V-206570 | Ensure pg_hba.conf permissions"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_hba_file }}"
    owner: postgres
    group: postgres
    mode: "0600"

############################################################
# Restrict Files Inside Data Directory
############################################################

- name: "V-206570 | Find files in PostgreSQL data directory"
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_data_dir }}"
    file_type: file
    recurse: true
  register: postgresql_srg_data_files

- name: "V-206570 | Ensure DB files are not group/world readable"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ postgresql_srg_data_files.files }}"
  loop_control:
    label: "{{ item.path }}"

############################################################
# Protect PostgreSQL Socket Directory
############################################################

- name: "V-206570 | Ensure socket directory permissions"
  become: true
  ansible.builtin.file:
    path: /var/run/postgresql
    owner: postgres
    group: postgres
    mode: "0755"
  failed_when: false

############################################################
# Ensure SELinux Enforcing
############################################################

- name: "V-206570 | Ensure SELinux enforcing"
  become: true
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
