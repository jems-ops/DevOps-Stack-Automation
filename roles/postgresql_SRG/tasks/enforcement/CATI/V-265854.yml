---
############################################################
# STIG V-265854 Enforcement
# Ensure Supported PostgreSQL Version
############################################################

############################################################
# Gather PostgreSQL Server Version
############################################################

- name: "V-265854 | Gather PostgreSQL server version"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SHOW server_version;"
  register: postgresql_srg_version
  changed_when: false

############################################################
# Extract Major Version
############################################################

- name: "V-265854 | Extract PostgreSQL major version"
  ansible.builtin.set_fact:
    postgresql_srg_major_version: "{{ (postgresql_srg_version.stdout | regex_search('^([0-9]+)', '\\1'))[0] }}"

############################################################
# Define Supported Versions
############################################################

- name: "V-265854 | Define supported PostgreSQL versions"
  ansible.builtin.set_fact:
    postgresql_srg_supported_versions:
      - "16"
      - "15"

############################################################
# Fail if Unsupported Version
############################################################

- name: "V-265854 | Fail if unsupported PostgreSQL version detected"
  ansible.builtin.fail:
    msg: >
      Unsupported PostgreSQL version detected: {{ postgresql_srg_major_version }}.
      Supported versions: {{ postgresql_srg_supported_versions }}
  when: postgresql_srg_major_version not in postgresql_srg_supported_versions

- name: "V-265854 | Gather PostgreSQL package version"
  become: true
  ansible.builtin.package_facts:
    manager: auto
