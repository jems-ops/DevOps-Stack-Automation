---
############################################################
# STIG Control: V-206561
# Status: NOT A FINDING
#
# Title:
# The DBMS must not display authentication secrets.
#
# Comment:
# PostgreSQL prevents exposure of authentication secrets via:
# - Secure .pgpass permissions
# - Restricted configuration file access
# - Controlled logging (DDL only)
# Therefore, V-206561 is Not a Finding.

# Fixing Strategy:
# - Secure .pgpass files (without breaking ownership)
# - Restrict logging
# - Secure config files
############################################################


############################################################
# Secure .pgpass files (SAFE)
############################################################

- name: "V-206561 | Find .pgpass files"
  become: true
  ansible.builtin.find:
    paths:
      - "{{ postgresql_srg_data_dir }}"
      - /home
      - /root
    patterns: ".pgpass"
    recurse: true
  register: v206561_pgpass
  failed_when: false
  changed_when: false
  tags: ['V-206561','CAT-I','enforce','postgres','stig']


- name: "V-206561 | Enforce secure permissions on .pgpass"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ v206561_pgpass.files | default([]) }}"
  when:
    - v206561_pgpass is defined
    - v206561_pgpass.matched | default(0) > 0
  tags: ['V-206561','CAT-I','enforce','postgres','stig']


############################################################
# Restrict SQL logging
############################################################

- name: "V-206561 | Restrict SQL logging"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_statement\s*='
    line: "log_statement = 'ddl'"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206561','CAT-I','enforce','postgres','stig']


############################################################
# Secure configuration files
############################################################

- name: "V-206561 | Secure PostgreSQL configuration files"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    owner: postgres
    group: postgres
    mode: "0600"
  loop:
    - "{{ postgresql_srg_conf_file }}"
    - "{{ postgresql_srg_hba_file }}"
  tags: ['V-206561','CAT-I','enforce','postgres','stig']
