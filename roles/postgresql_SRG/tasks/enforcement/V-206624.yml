---
############################################################
# STIG Control: V-206624
# Audit deletion of privileges
# comment: PostgreSQL auditing is implemented using the pgaudit extension. Privilege and role management operations such as REVOKE statements and role membership removals are recorded in the database audit logs. Audit records include the timestamp, database user, operation performed, and affected object, ensuring that removal of permissions and privileges is fully traceable.

# Status: Not a finding
############################################################

- name: "V-206624 | Ensure pgaudit library loaded"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206624','CAT II', 'enforce']

- name: "V-206624 | Enable role audit logging"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206624','CAT II', 'enforce']