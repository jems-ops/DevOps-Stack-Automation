---
############################################################
# STIG V-206565
# Enforcement - Terminate and invalidate sessions
############################################################

- name: V-206565 | Enable connection logging
  become: true
  lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_connections\s*='
    line: "log_connections = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206565
    - cat2

- name: V-206565 | Enable disconnection logging
  become: true
  lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_disconnections\s*='
    line: "log_disconnections = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206565
    - cat2

- name: V-206565 | Ensure idle_session_timeout configured
  become: true
  lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*idle_session_timeout\s*='
    line: "idle_session_timeout = {{ postgresql_srg_idle_session_timeout }}"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206565
    - cat2
