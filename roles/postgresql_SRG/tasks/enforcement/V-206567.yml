---
############################################################
# STIG V-206567
# Enforcement - Protect against MITM / session hijacking
# ✔ SSL enforced
#✔ SCRAM enabled
#✔ FIPS crypto module used (if required)
#✔ No trust authentication over network
############################################################

# SSL not applicable for isolated database - ssl=on and TLS version omitted

############################
# Enforce SCRAM
############################

- name: V-206567 | Enforce SCRAM password encryption
  become: true
  lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*password_encryption\s*='
    line: "password_encryption = scram-sha-256"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206567
    - cat2


############################
# Remove insecure HBA methods
############################

- name: V-206567 | Remove trust authentication
  become: true
  replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*host\s+.*\s+trust\s*$'
    replace: '# Removed by STIG V-206567 - trust not allowed'
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206567
    - cat2

# hostssl entry omitted - SSL not applicable for isolated database
