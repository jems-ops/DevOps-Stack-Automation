---
############################################################
# STIG Control: V-206625
# Audit unsuccessful attempts to delete privileges
# comment: PostgreSQL auditing is implemented using the pgaudit extension. Privilege and role management operations such as REVOKE, ALTER ROLE, and DROP ROLE generate audit records in the database logs. Failed attempts to remove privileges or modify role membership are recorded through PostgreSQL error logging and audit events, ensuring that unauthorized attempts to alter permissions are traceable.

# Status: Not a finding
############################################################

- name: "V-206625 | Ensure pgaudit library loaded"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206625','CAT II', 'enforce']

- name: "V-206625 | Configure role auditing"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206625','CAT II', 'enforce']