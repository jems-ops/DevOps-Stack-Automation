---
############################################################
# STIG Control: V-263622
# Status: NOT A FINDING
#
# Title:
# The DBMS must compare internal system clocks with an
# organization-defined authoritative time source.
#
# Finding Details:
# If the DBMS system clock is not synchronized with an
# authoritative time source, audit logs, transaction
# timestamps, and security event correlation may become
# inaccurate or inconsistent.
#
# Implementation in this Environment:
# PostgreSQL relies on the operating system clock for all
# timestamps and audit records. The RHEL 8 host synchronizes
# time using the chronyd service with the organization
# approved NTP source (Satellite).
#
# Comment:
# Time synchronization is implemented at the operating
# system level using the chronyd service configured with
# the organization-authorized Satellite NTP server.
# PostgreSQL inherits the synchronized system clock and
# therefore maintains accurate timestamps for database
# operations and audit records.
#
# Manual Verification Steps:
# 1. Verify chrony service is installed:
#       rpm -q chrony
#
# 2. Verify NTP source configuration:
#       grep server /etc/chrony.conf
#
# 3. Verify system time synchronization status:
#       timedatectl status
#
# 4. Confirm synchronization source:
#       chronyc sources -v
#
# Expected Result:
#       System clock synchronized: yes
############################################################

- name: "V-263622 | Ensure chrony package installed"
  ansible.builtin.package:
    name: chrony
    state: present
  tags:
    - V-263622
    - CATII
    - enforce


- name: "V-263622 | Ensure Satellite entry exists in /etc/hosts"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ postgresql_srg_ntp_server_ip }} {{ postgresql_srg_ntp_server }}"
    state: present
    create: true
  tags:
    - V-263622
    - CATII
    - enforce


- name: "V-263622 | Configure Satellite as NTP source"
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^server {{ postgresql_srg_ntp_server }}'
    line: "server {{ postgresql_srg_ntp_server }} iburst"
    state: present
  notify: restart chronyd
  tags:
    - V-263622
    - CATII
    - enforce


- name: "V-263622 | Ensure chronyd service running"
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
  tags:
    - V-263622
    - CATII
    - enforce


- name: "V-263622 | Force time synchronization"
  ansible.builtin.command: chronyc makestep
  changed_when: false
  tags:
    - V-263622
    - CATII
    - enforce
