############################################################
# STIG Control: V-265854
# Status: NOT A FINDING
#
# Title:
# The DBMS must be a supported version.
#
# Finding Details:
# The DBMS must run a version that is currently supported
# by the vendor. Unsupported or end-of-life (EOL) versions
# do not receive security patches and may expose the system
# to known vulnerabilities.
#
# Implementation in this Environment:
#
#   • PostgreSQL version 16.x is deployed
#   • Installed via vendor-supported distribution (RHEL/PGDG)
#   • System is running on supported RHEL 8.x platform
#   • Regular patching and updates are applied
#   • No deprecated or unsupported DBMS components are in use
#
# Manual Verification Steps:
#
#   1. Verify PostgreSQL version:
#        psql --version
#
#   2. Verify server version:
#        psql -c "SHOW server_version;"
#
#   3. Verify installed packages:
#        rpm -qa | grep -i postgresql
#
#   4. Confirm vendor support status:
#        https://www.postgresql.org/support/versioning/
#
# Summary:
# PostgreSQL is running a vendor-supported version (16.x)
# on a supported operating system with active patching.
# No unsupported components are present. Therefore,
# V-265854 is NOT A FINDING.
############################################################


############################################################
# Informational enforcement (manual upgrade control)
############################################################

- name: "V-265854 | Informational - manual upgrade required"
  ansible.builtin.debug:
    msg: >
      PostgreSQL must run a vendor-supported version.
      This role does not perform upgrades.
      If unsupported, use approved upgrade procedures
      (pg_upgrade or logical migration).
  changed_when: false
  tags: ['V-265854', 'CAT-II', 'enforce', 'postgres', 'stig', 'manual']
