---
############################################################
# STIG Control: V-263606
# Status : NOT A FINDING
#
# Title:
# Prevent installation of DBMS software components without
# verification of digital signatures.
#
# Finding Details:
# Installation of unsigned or untrusted software components
# may introduce malicious code or unauthorized modifications
# into the DBMS environment. Verifying digital signatures
# ensures software integrity and authenticity.
#
# Implementation in this Environment:
# PostgreSQL software is installed using the operating
# system package manager (DNF/YUM) which verifies GPG
# signatures for all packages before installation.
#
# Only packages from approved repositories are permitted
# and signature verification is enforced by the package
# manager configuration.
#
# Manual Verification Steps:
#
# 1. Verify GPG signature verification is enabled:
#
#       grep gpgcheck /etc/dnf/dnf.conf
#
# 2. Verify PostgreSQL packages are signed:
#
#       rpm -q --qf '%{NAME} %{SIGPGP:pgpsig}\n' postgresql
#
# 3. Verify packages originate from approved repositories:
#
#       dnf repolist
#
# Comment:
# PostgreSQL software components are installed through the
# operating system package manager which enforces GPG
# signature verification for all packages. Only packages
# from organization-approved repositories are installed.
# Therefore installation of unsigned or untrusted DBMS
# software components is prevented.
############################################################

- name: "V-263606 | Verify package signature checking"
  ansible.builtin.command: grep gpgcheck /etc/dnf/dnf.conf
  register: gpgcheck_status
  changed_when: false
  tags: ['V-263606', 'CAT II', 'enforce']

- name: "V-263606 | Display GPG check configuration"
  ansible.builtin.debug:
    var: gpgcheck_status.stdout
  tags: ['V-263606', 'CAT II', 'enforce']

- name: "V-263606 | Ensure PostgreSQL packages are from approved repositories"
  ansible.builtin.command: dnf repolist
  register: repo_list
  changed_when: false
  tags: ['V-263606', 'CAT II', 'enforce']

- name: "V-263606 | Display repository list"
  ansible.builtin.debug:
    var: repo_list.stdout
  tags: ['V-263606', 'CAT II', 'enforce']
