---
############################################################
# STIG V-206604
# Cryptographic Protection Based on Data Classification
#
# Architecture:
# PostgreSQL instance stores internal application metadata.
# Database is not externally accessible and does not transmit
# sensitive data across network boundaries.
############################################################

############################################################
# Ensure PostgreSQL restricted to localhost
############################################################

- name: "V-206604 | Restrict PostgreSQL listen_addresses"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
    state: present
  notify: Restart PostgreSQL

############################################################
# Remove external host entries
############################################################

- name: "V-206604 | Remove external host access"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*host(?:ssl|nossl)?\s+.*(?:0\.0\.0\.0\/0|\/0).*$'
    replace: ''
  notify: Reload PostgreSQL
