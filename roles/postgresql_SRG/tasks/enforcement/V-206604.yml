---
############################################################
# STIG V-206604 Enforcement
# Configure Required Cryptographic Protection
############################################################

############################################################
# Ensure FIPS Crypto Policy
############################################################

- name: "V-206604 | Ensure crypto policy set to FIPS"
  become: true
  ansible.builtin.command: update-crypto-policies --set FIPS
  register: postgresql_srg_crypto_policy
  changed_when: "'Setting system policy to FIPS' in postgresql_srg_crypto_policy.stdout"
  when: postgresql_srg_fips_required | bool

############################################################
# Ensure FIPS Kernel Mode Enabled
############################################################

- name: "V-206604 | Verify FIPS enabled"
  become: true
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: postgresql_srg_fips_status
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-206604 | Fail if FIPS disabled"
  ansible.builtin.fail:
    msg: "FIPS mode is not enabled. Reboot required after enabling."
  when:
    - postgresql_srg_fips_required | bool
    - postgresql_srg_fips_status.stdout | default('1') != "1"

############################################################
# Restrict PostgreSQL to Localhost
############################################################

- name: "V-206604 | Restrict listen_addresses to localhost"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
  notify: Restart PostgreSQL

############################################################
# Remove Weak Authentication Methods
############################################################

- name: "V-206604 | Remove weak auth methods"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(host|local).*(md5|password)\s*$'
    replace: ''
  notify: Reload PostgreSQL
