---
############################################################
# STIG Control: V-263607
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must require users to be individually authenticated
# before granting access to shared accounts or resources.
#
# Finding Details:
# Individual authentication ensures accountability and
# traceability of user actions within the DBMS.
#
# Implementation in this Environment:
# PostgreSQL is deployed as the backend database for the
# SonarQube application. End users do not authenticate
# directly to the DBMS.
#
# User authentication occurs at the application layer
# through the enterprise identity provider (Keycloak SSO).
#
# PostgreSQL is accessed only through application service
# accounts rather than individual user accounts.
#
# Comment:
# Since PostgreSQL does not authenticate individual users
# in this architecture, user accountability is enforced by
# the application and identity provider rather than the
# DBMS. Therefore this control is not applicable to the
# PostgreSQL deployment.
#
# Manual Verification Steps:
#
# 1. Verify SonarQube authentication uses Keycloak SSO.
#
# 2. Verify PostgreSQL roles are service accounts only:
#
#       SELECT rolname FROM pg_roles;
#
# 3. Confirm users do not authenticate directly to the DBMS.
############################################################

- name: "V-263607 | Individual authentication handled by application identity provider"
  ansible.builtin.debug:
    msg: "DBMS does not perform user authentication; control not applicable."
  tags:
    - V-263607
    - CATII
    - enforce
