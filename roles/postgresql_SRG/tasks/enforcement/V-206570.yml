---
############################################################
# STIG V-206570 Enforcement
# Protect Data at Rest (OS-Level Controls)
############################################################

############################################################
# Ensure Data Directory Ownership
############################################################

- name: "V-206570 | Ensure PostgreSQL data directory ownership"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}"
    owner: postgres
    group: postgres
    recurse: false

############################################################
# Ensure Data Directory Permissions 0700
############################################################

- name: "V-206570 | Set data directory permissions to 0700"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}"
    mode: '0700'

############################################################
# Restrict File Permissions Inside Data Directory
############################################################

- name: "V-206570 | Find files in data directory"
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_data_dir }}"
    file_type: file
    recurse: true
  register: postgresql_srg_data_files

- name: "V-206570 | Ensure DB files are not world/group readable"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '0600'
  loop: "{{ postgresql_srg_data_files.files }}"
  loop_control:
    label: "{{ item.path }}"

############################################################
# Ensure SELinux is Enforcing
############################################################

- name: "V-206570 | Ensure SELinux is enforcing"
  become: true
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
