---
############################################################
# PostgreSQL STIG | V-206545
#
# Control: Restrict and Track Use of DBMS Installation Account
#
# Objective:
# Ensure the PostgreSQL installation account (postgres)
# is restricted to authorized administrators and its use
# is fully auditable.
############################################################


############################################################
# Restrict postgres OS account interactive login
############################################################

- name: "V-206545 | Restrict postgres interactive shell"
  become: true
  ansible.builtin.user:
    name: "{{ postgresql_srg_install_os_account }}"
    shell: "{{ postgresql_srg_install_account_shell }}"
  when: postgresql_srg_install_account_control_enabled


############################################################
# Lock postgres password (service account protection)
############################################################

- name: "V-206545 | Lock postgres account password"
  become: true
  ansible.builtin.user:
    name: "{{ postgresql_srg_install_os_account }}"
    password_lock: true
  when: postgresql_srg_install_account_control_enabled


############################################################
# Prevent direct SSH login for postgres
############################################################

- name: "V-206545 | Prevent SSH login for postgres"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^DenyUsers'
    line: "DenyUsers postgres"
    create: true
    mode: "0644"
  notify: Restart sshd
  when: postgresql_srg_install_account_control_enabled


############################################################
# Enforce sudo-based DBA access
############################################################

- name: "V-206545 | Ensure DBA group exists"
  become: true
  ansible.builtin.group:
    name: "{{ postgresql_srg_dba_group }}"
    state: present
  when: postgresql_srg_install_account_control_enabled


- name: "V-206545 | Configure sudo access for DBA group"
  become: true
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/postgres_admins"
    content: |
      %{{ postgresql_srg_dba_group }} ALL=(postgres) ALL
    owner: root
    group: root
    mode: '0440'
  when: postgresql_srg_install_account_control_enabled


############################################################
# Restrict PostgreSQL SUPERUSER roles
############################################################

- name: "V-206545 | Identify unauthorized superusers"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -d postgres -tAc "
    SELECT rolname
    FROM pg_roles
    WHERE rolsuper = true
    AND rolname <> 'postgres';"
  register: postgresql_srg_extra_superusers
  changed_when: false
  when: postgresql_srg_install_account_control_enabled


- name: "V-206545 | Fail if unauthorized superusers exist"
  ansible.builtin.fail:
    msg: "Unauthorized SUPERUSER roles detected: {{ postgresql_srg_extra_superusers.stdout_lines }}"
  when:
    - postgresql_srg_install_account_control_enabled
    - postgresql_srg_extra_superusers.stdout | trim != ""


############################################################
# Enable pgAudit extension
############################################################

- name: "V-206545 | Ensure pgaudit library is loaded"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  notify: Restart PostgreSQL
  when: postgresql_srg_install_account_control_enabled


############################################################
# Configure PostgreSQL auditing
############################################################

- name: "V-206545 | Configure PostgreSQL audit logging"
  become: true
  ansible.builtin.blockinfile:
    path: "{{ postgresql_srg_conf_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - V-206545"
    block: |
      pgaudit.log = 'role,ddl,write,read'
      log_connections = on
      log_disconnections = on
      log_line_prefix = '%m %u %d %p'
  notify: Restart PostgreSQL
  when: postgresql_srg_install_account_control_enabled


############################################################
# Configure auditd tracking for postgres binaries
############################################################

- name: "V-206545 | Audit PostgreSQL binaries"
  become: true
  ansible.builtin.blockinfile:
    path: /etc/audit/rules.d/postgres.rules
    create: true
    mode: "0640"
    marker: "# {mark} ANSIBLE MANAGED - postgres binaries"
    block: |
      -w {{ postgresql_srg_pg_bin_path }}/psql -p x -k postgres_install_usage
      -w {{ postgresql_srg_pg_bin_path }}/postgres -p x -k postgres_install_usage
  notify: Restart auditd
  when:
    - postgresql_srg_install_account_control_enabled
    - postgresql_srg_audit_postgres_binaries


############################################################
# Audit PostgreSQL data directory access
############################################################

- name: "V-206545 | Audit PostgreSQL data directory"
  become: true
  ansible.builtin.blockinfile:
    path: /etc/audit/rules.d/postgres.rules
    marker: "# {mark} ANSIBLE MANAGED - postgres data dir"
    block: |
      -w {{ postgresql_srg_data_dir }} -p wa -k postgres_data_access
  notify: Restart auditd
  when:
    - postgresql_srg_install_account_control_enabled
    - postgresql_srg_audit_postgres_binaries
