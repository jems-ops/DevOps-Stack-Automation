---
############################################################
# PostgreSQL STIG | V-206545
#
# FINDING DEFINITION:
# Develop, document, and implement procedures to restrict
# and track use of the DBMS software installation account.
#
# CONTROL INTENT:
# The DBMS installation account (postgres) must be
# restricted to authorized personnel and all usage must
# be tracked and auditable.
#
# COMPLIANCE CHECKLIST:
# ✔ postgres account is not used for application access
# ✔ SSH login as postgres is restricted
# ✔ Password login is disabled or locked
# ✔ sudo usage required for privilege escalation
# ✔ All postgres sessions are audited
# ✔ Superuser accounts are minimized
#
# FAILED CONDITIONS:
# ✖ Direct SSH login permitted for postgres
# ✖ Application uses postgres account
# ✖ Multiple uncontrolled superusers exist
# ✖ No audit logs for postgres sessions
# ✖ No documented procedure governing usage
#
############################################################

- name: V-206545 | Lock postgres OS account password
  become: true
  command: passwd -l postgres
  ignore_errors: true
  tags:
    - stig
    - V-206545
    - enforcement

- name: V-206545 | Ensure postgres DB sessions are audited
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_connections\s*='
    line: "log_connections = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206545
    - enforcement

- name: V-206545 | Ensure disconnections are logged
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_disconnections\s*='
    line: "log_disconnections = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206545
    - enforcement

- name: Prevent direct SSH login as postgres
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^DenyUsers'
    line: 'DenyUsers postgres'
  notify: Restart sshd
  tags:
    - stig
    - V-206545
    - enforcement

- name: Validate superuser count
  become: true
  become_user: postgres
  command: psql -tAc "SELECT rolname FROM pg_roles WHERE rolsuper = true;"
  register: superusers
  changed_when: false
  tags:
    - stig
    - V-206545
    - enforcement

- name: Detect application using postgres account
  become: true
  become_user: postgres
  command: psql -tAc "SELECT usename FROM pg_stat_activity WHERE usename='postgres';"
  register: postgres_sessions
  changed_when: false
  tags:
    - stig
    - V-206545
    - enforcement
