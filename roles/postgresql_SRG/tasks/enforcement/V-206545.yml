---
############################################################
# PostgreSQL STIG | V-206545
#
# FINDING DEFINITION:
# Develop, document, and implement procedures to restrict
# and track use of the DBMS software installation account.
#
# CONTROL INTENT:
# The DBMS installation account (postgres) must be
# restricted to authorized personnel and all usage must
# be tracked and auditable.
#
# COMPLIANCE CHECKLIST:
# ✔ postgres account is not used for application access
# ✔ SSH login as postgres is restricted
# ✔ Password login is disabled or locked
# ✔ sudo usage required for privilege escalation
# ✔ All postgres sessions are audited
# ✔ Superuser accounts are minimized
#
# FAILED CONDITIONS:
# ✖ Direct SSH login permitted for postgres
# ✖ Application uses postgres account
# ✖ Multiple uncontrolled superusers exist
# ✖ No audit logs for postgres sessions
# ✖ No documented procedure governing usage
#
############################################################

- name: V-206545 | Restrict postgres OS account interactive login
  become: true
  user:
    name: "{{ postgresql_srg_install_os_account }}"
    shell: "{{ postgresql_srg_install_account_shell }}"
  when: postgresql_srg_install_account_control_enabled

############################################################
# Enforce sudo-based controlled access
############################################################

- name: V-206545 | Ensure DBA group exists
  become: true
  group:
    name: "{{ postgresql_srg_dba_group }}"
    state: present
  when: postgresql_srg_install_account_control_enabled

- name: V-206545 | Configure sudo access for DBA group
  become: true
  copy:
    dest: "/etc/sudoers.d/postgres_admins"
    content: |
      %{{ postgresql_srg_dba_group }} ALL=(postgres) ALL
    owner: root
    group: root
    mode: '0440'
  when: postgresql_srg_install_account_control_enabled

############################################################
# Restrict PostgreSQL Superuser Roles
############################################################

- name: V-206545 | Ensure only postgres is SUPERUSER
  become: true
  become_user: postgres
  shell: |
    psql -d postgres -t -c "
    SELECT rolname
    FROM pg_roles
    WHERE rolsuper = true
    AND rolname <> 'postgres';"
  register: postgresql_srg_extra_superusers
  changed_when: false
  when: postgresql_srg_install_account_control_enabled

- name: V-206545 | Fail if unauthorized superusers exist
  fail:
    msg: "Unauthorized SUPERUSER roles detected: {{ postgresql_srg_extra_superusers.stdout_lines }}"
  when:
    - postgresql_srg_install_account_control_enabled
    - postgresql_srg_extra_superusers.stdout | trim != ""

############################################################
# Enable pgaudit for privileged activity tracking
############################################################

- name: V-206545 | Ensure pgaudit is loaded
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  notify: Restart PostgreSQL
  when: postgresql_srg_install_account_control_enabled

- name: V-206545 | Configure pgaudit logging
  become: true
  blockinfile:
    path: "{{ pg_conf_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - V-206545"
    block: |
      pgaudit.log = 'role, ddl, write'
      log_connections = on
      log_disconnections = on
  notify: Restart PostgreSQL
  when: postgresql_srg_install_account_control_enabled

############################################################
# Track usage via auditd
############################################################

- name: V-206545 | Configure auditd rules for PostgreSQL binaries
  become: true
  blockinfile:
    path: /etc/audit/rules.d/postgres.rules
    create: yes
    block: |
      -w {{ postgresql_srg_pg_bin_path }}/psql -p x -k postgres_install_usage
      -w {{ postgresql_srg_pg_bin_path }}/postgres -p x -k postgres_install_usage
  notify: restart auditd
  when:
    - postgresql_srg_install_account_control_enabled
    - postgresql_srg_audit_postgres_binaries
