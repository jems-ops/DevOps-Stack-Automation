---
############################################################
# STIG Control: V-206540
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect audit logs from unauthorized
# deletion.
#
# Finding Details:
# Audit logs must be protected from unauthorized
# modification or deletion to ensure that security events
# remain available for monitoring and forensic analysis.
#
# Implementation in this Environment:
# PostgreSQL audit logs are stored in a dedicated log
# directory owned by the postgres account. Directory
# permissions are restricted to 0700 and log files are
# restricted to 0600 to prevent unauthorized modification
# or deletion.
#
# Manual Verification Steps:
#
# 1. Verify directory permissions:
#
#       ls -ld {{ postgresql_srg_log_directory }}
#
# 2. Verify log file permissions:
#
#       ls -l {{ postgresql_srg_log_directory }}
#
# Comment:
# PostgreSQL audit logs are stored in a restricted
# directory owned by the postgres administrative account.
# Only authorized administrators can modify or delete
# audit logs.
############################################################


############################################################
# Enforcement
############################################################

- name: "V-206540 | Protect PostgreSQL log directory"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_log_directory }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory
  tags: ['V-206540','CAT II','enforce']


############################
# Secure log files
############################

- name: "V-206540 | Find PostgreSQL log files"
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_log_directory }}"
    file_type: file
  register: v206540_logs
  tags: ['V-206540','CAT II','check']


- name: "V-206540 | Restrict log file permissions"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: postgres
    group: postgres
    mode: "0600"
  loop: "{{ v206540_logs.files }}"
  when: v206540_logs.matched > 0
  tags: ['V-206540','CAT II','enforce']
