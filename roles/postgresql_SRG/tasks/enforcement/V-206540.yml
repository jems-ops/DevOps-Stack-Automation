---
############################################################
# STIG V-206540
# Enforcement - Protect audit logs from unauthorized deletion
############################################################
#
# COMPLIANT WHEN:
# - Log directory owned by postgres
# - Directory permissions 0700
# - Log files 0600
# - No group/other write permission
#
# VERIFY:
# ls -ld {{ postgresql_srg_log_directory }}
# ls -l {{ postgresql_srg_log_directory }}
# comment: PostgreSQL audit logs are stored in a dedicated directory owned by the postgres account. Directory permissions are restricted to 0700 and log files are restricted to 0600. Only authorized accounts can modify or delete audit logs. Therefore, V-206540 is Not a Finding.
############################################################

- name: V-206540 | Ensure log directory ownership
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_log_directory }}"
    owner: postgres
    group: postgres
    state: directory
  tags:
    - stig
    - V-206540
    - cat2

- name: V-206540 | Restrict directory permissions
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_log_directory }}"
    mode: '0700'
    state: directory
  tags:
    - stig
    - V-206540
    - cat2

- name: V-206540 | Find log files
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_log_directory }}"
    patterns: "*.log"
  register: v206540_logs
  tags:
    - stig
    - V-206540
    - cat2

- name: V-206540 | Restrict log file permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop: "{{ v206540_logs.files }}"
  when: v206540_logs.matched > 0
  tags:
    - stig
    - V-206540
    - cat2
