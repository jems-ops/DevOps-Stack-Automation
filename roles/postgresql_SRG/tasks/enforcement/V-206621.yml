---
############################################################
# STIG Control: V-206621
# Audit unsuccessful attempts to modify security objects
# comment: PostgreSQL auditing is implemented using the pgaudit extension. Security object modification operations such as ALTER ROLE, ALTER TABLE, and privilege management commands are recorded in database audit logs. Failed attempts to modify security objects generate error entries within PostgreSQL logging, ensuring unauthorized modification attempts are captured for monitoring and forensic analysis.
# Status: Not a finding
############################################################

- name: "V-206621 | Ensure pgaudit extension enabled"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206621','CAT II', 'enforce']

- name: "V-206621 | Configure audit logging for security objects"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206621','CAT II', 'enforce']