---
############################################################
# STIG V-206537
# Enforcement - DBMS must use system clock for timestamps
############################################################
#
# COMPLIANT WHEN:
# - OS time synchronization enabled
# - PostgreSQL timezone configured
# - log_line_prefix includes timestamp (%m)
#
# VERIFY:
# timedatectl status
# SHOW timezone;
# SHOW log_line_prefix;
# comment: PostgreSQL derives timestamps from the operating system system clock. The host system is synchronized via chrony to authoritative time sources. PostgreSQL timezone is configured to UTC and audit logs include timestamp values. Therefore, V-206537 is Not a Finding.
############################################################

- name: V-206537 | Ensure chrony is installed
  become: true
  ansible.builtin.package:
    name: chrony
    state: present
  tags:
    - stig
    - V-206537
    - cat2

- name: V-206537 | Ensure chronyd service enabled
  become: true
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: yes
  tags:
    - stig
    - V-206537
    - cat2

- name: V-206537 | Configure PostgreSQL timezone
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^timezone\s*='
    line: "timezone = 'UTC'"
    backup: yes
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206537
    - cat2

- name: V-206537 | Ensure timestamp included in logs
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p %c %a %h '"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206537
    - cat2
