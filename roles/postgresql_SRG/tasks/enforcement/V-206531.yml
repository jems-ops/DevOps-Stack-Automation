---
############################################################
# STIG V-206531
# Enforcement - Audit records must contain SOURCE info
############################################################
#
# COMPLIANT WHEN:
# - log_line_prefix includes %r (remote host)
# - log_line_prefix includes %a (application name)
# - log_hostname = on
#
# VERIFY:
# SHOW log_line_prefix;
# SHOW log_hostname;
# comment: PostgreSQL is configured with log_line_prefix including remote host (%r) and application name (%a), and log_hostname enabled. Audit records contain sufficient information to establish the source/origin of events. Therefore, V-206531 is Not a Finding.
############################################################

- name: V-206531 | Configure log_line_prefix for source tracking
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p %a '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206531
    - cat2

- name: V-206531 | Enable hostname logging
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_hostname\s*='
    line: "log_hostname = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206531
    - cat2
