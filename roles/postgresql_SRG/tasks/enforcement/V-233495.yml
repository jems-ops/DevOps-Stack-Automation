---
############################################################
# STIG V-233495 Enforcement
# Deploy DBMS Compatible with NSA-Approved Cryptography
############################################################

############################################################
# Ensure FIPS Package Installed
############################################################

- name: "V-233495 | Ensure dracut-fips installed"
  become: true
  ansible.builtin.package:
    name: dracut-fips
    state: present
  when: postgresql_srg_fips_required | bool

############################################################
# Ensure Crypto Policy is FIPS
############################################################

- name: "V-233495 | Set system crypto policy to FIPS"
  become: true
  ansible.builtin.command: update-crypto-policies --set FIPS
  register: postgresql_srg_crypto_policy
  changed_when: "'Setting system policy to FIPS' in postgresql_srg_crypto_policy.stdout"
  when: postgresql_srg_fips_required | bool

############################################################
# Verify FIPS Mode Enabled
############################################################

- name: "V-233495 | Check FIPS enabled"
  become: true
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: postgresql_srg_fips_status
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-233495 | Fail if FIPS not enabled"
  ansible.builtin.fail:
    msg: "FIPS mode is not enabled. Reboot required after enabling."
  when:
    - postgresql_srg_fips_required | bool
    - postgresql_srg_fips_status.stdout | default('1') != "1"

############################################################
# Remove Weak Authentication Methods
############################################################

- name: "V-233495 | Remove weak auth methods from pg_hba.conf"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(host|local).*(md5|password)\s*$'
    replace: ''
  notify: Reload PostgreSQL
