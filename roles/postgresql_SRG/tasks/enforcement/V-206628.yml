---
############################################################
# STIG Control: V-206628
#
# Title:
# DBMS must generate audit records when categories of
# information are deleted.
#
# Implementation:
# PostgreSQL logs deletion operations through the pgaudit
# extension for DML and DDL events.
#
# Manual Verification Steps:
# 1. Verify pgaudit extension is installed.
# 2. Confirm pgaudit logs write and ddl operations.
# 3. Execute DELETE or DROP and verify the log entry.
# comment: PostgreSQL auditing is implemented using the pgaudit extension. Deletion operations such as DELETE, TRUNCATE, and DROP statements are recorded in database audit logs. These records include the user, timestamp, and affected object, ensuring that removal of database information is traceable for security monitoring and forensic analysis.

# Status: Not a finding
############################################################

- name: "V-206628 | Ensure pgaudit enabled"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206628','CAT II', 'enforce']