---
############################################################
# STIG V-206523
# Enforcement - Audit Record Generation
############################################################
#
# COMPLIANT WHEN:
# - log_connections = on
# - log_disconnections = on
# - log_statement includes ddl
# - shared_preload_libraries includes pgaudit
# - pgaudit.log includes read, write, ddl, role
# - pgaudit.log_catalog = on
#
# VERIFY BY RUNNING:
# SHOW log_connections;
# SHOW log_disconnections;
# SHOW log_statement;
# SHOW shared_preload_libraries;
# SHOW pgaudit.log;
# SHOW pgaudit.log_catalog;
# Comment: PostgreSQL generates audit records for all DoD-defined auditable
# events via connection/disconnection logging, DDL statement logging, and
# pgaudit (read, write, ddl, role). Catalog auditing is enabled.
# Therefore, V-206523 is Not a Finding.
############################################################

- name: "V-206523 | Enable connection logging"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -c "ALTER SYSTEM SET log_connections = 'on';"
  tags: [V-206523, stig, cat2]

- name: "V-206523 | Enable disconnection logging"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -c "ALTER SYSTEM SET log_disconnections = 'on';"
  tags: [V-206523, stig, cat2]

- name: "V-206523 | Enable DDL statement logging"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -c "ALTER SYSTEM SET log_statement = 'ddl';"
  tags: [V-206523, stig, cat2]

- name: "V-206523 | Enable pgaudit extension"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -c "ALTER SYSTEM SET shared_preload_libraries = 'pgaudit';"
  tags: [V-206523, stig, cat2]

- name: "V-206523 | Configure pgaudit event classes"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -c "ALTER SYSTEM SET pgaudit.log = 'read, write, ddl, role';"
  tags: [V-206523, stig, cat2]

- name: "V-206523 | Enable catalog auditing"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -c "ALTER SYSTEM SET pgaudit.log_catalog = 'on';"
  tags: [V-206523, stig, cat2]

- name: "V-206523 | Reload PostgreSQL"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -c "SELECT pg_reload_conf();"
  tags: [V-206523, stig, cat2]
