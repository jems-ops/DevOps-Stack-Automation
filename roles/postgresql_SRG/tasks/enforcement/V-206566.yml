---
############################################################
# STIG Control: V-206566
# Status: NOT A FINDING
#
# Title:
# The DBMS must generate session identifiers using
# system-generated values.
#
# Finding Details:
# If session identifiers can be supplied or modified by
# clients, attackers may reuse or hijack sessions. Session
# identifiers must therefore be generated internally by
# the DBMS.
#
# Implementation in this Environment:
# PostgreSQL generates session identifiers internally
# through backend processes. Each connection is assigned
# a server-generated process identifier (PID) and session
# metadata. Clients cannot supply or control session
# identifiers.
#
# Manual Verification Steps:
#
# 1. Verify active sessions:
#
#       SELECT pid, usename, backend_start
#       FROM pg_stat_activity;
#
# 2. Confirm session identifiers are generated by the
#    DBMS backend processes.
#
# Comment:
# PostgreSQL automatically generates session identifiers
# using backend process IDs. Client applications cannot
# supply or modify session identifiers. Therefore this
# control is inherently satisfied by PostgreSQL.
############################################################

# SSL not applicable for isolated database - ssl=on omitted
# V-206566 satisfies session ID requirement via system-generated backend PIDs

- name: V-206566 | Ensure password encryption uses SCRAM
  become: true
  lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*password_encryption\s*='
    line: "password_encryption = scram-sha-256"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206566
    - cat2
