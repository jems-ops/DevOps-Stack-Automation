---
############################################################
# STIG Control: V-206530
# Status: NOT A FINDING
#
# Title:
# The DBMS must include the location of the event in
# audit records.
#
# Finding Details:
# Audit records must include sufficient information to
# identify where database events occurred including the
# database name, user, process identifier, and client
# connection information.
#
# Implementation in this Environment:
# PostgreSQL audit logs include database name, user,
# process identifier, client host, and application name
# through the log_line_prefix configuration parameter.
#
# Manual Verification Steps:
#
#     SHOW log_line_prefix;
#
# Comment:
# PostgreSQL logging configuration ensures audit records
# contain sufficient contextual information to determine
# where database events occurred.
############################################################


############################################################
# Configure log prefix
############################################################

- name: "V-206530 | Ensure log_line_prefix includes location information"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p %c %a %h '"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206530', 'CAT II', 'enforce']
