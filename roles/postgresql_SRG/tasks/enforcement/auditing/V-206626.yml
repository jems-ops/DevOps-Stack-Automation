---
############################################################
# STIG Control: V-206626
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records when security
# objects are deleted.
#
# Finding Details:
# Deletion of security-related objects such as roles,
# schemas, or privilege assignments must be recorded
# to ensure traceability of changes to database security.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Security-related deletion operations such as DROP ROLE,
# DROP SCHEMA, DROP TABLE, and REVOKE privileges are
# captured in audit logs through the configured audit
# classes.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify audit classes include role and ddl:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL audit logging is implemented using the
# pgaudit extension. Security-related operations such
# as DROP ROLE, DROP SCHEMA, DROP TABLE, and REVOKE
# privileges generate audit records in the database
# log files. These records contain timestamp, user
# identity, and affected object information.
############################################################

- name: "V-206626 | Ensure pgaudit extension is configured"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206626', 'CAT II', 'enforce']

- name: "V-206626 | Configure audit logging for security operations"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206626', 'CAT II', 'enforce']
