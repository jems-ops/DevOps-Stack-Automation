---
############################################################
# STIG Control: V-206620
# SRG ID: SRG-APP-000500
# Severity: CAT II
#
# Title:
# The DBMS must generate audit records when security objects
# (tables, views, procedures, functions) are modified.
#
# Status:
# NOT A FINDING (Implemented via centralized audit controls)
#
# Finding Details:
# If audit records are not generated when security objects
# (tables, views, procedures, functions) are modified,
# unauthorized changes to database security structures may
# go undetected, potentially compromising system integrity.
#
# Manual Steps:
# 1. Verify pgaudit is enabled:
#    SHOW shared_preload_libraries;
# 2. Verify audit configuration:
#    SHOW pgaudit.log;
# 3. Execute:
#    CREATE TABLE test_audit(id INT);
#    ALTER TABLE test_audit ADD COLUMN name TEXT;
#    DROP TABLE test_audit;
# 4. Verify logs:
#    grep AUDIT /var/lib/pgsql/*/data/log/*
#
# Comment:
# This control is implemented via centralized PostgreSQL
# auditing configuration. The setting `pgaudit.log = 'all'`
# ensures DDL operations (CREATE, ALTER, DROP) and object
# modifications are fully audited, satisfying STIG
# requirements.
############################################################

- name: "V-206620 | Informational - handled by centralized audit configuration"
  ansible.builtin.debug:
    msg: >
      V-206620 is satisfied by centralized audit configuration
      (pgaudit.log = 'all') implemented in audit controls.
      No separate enforcement required.
  changed_when: false
