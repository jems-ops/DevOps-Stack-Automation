---
############################################################
# STIG Control: V-206622
# SRG ID: SRG-APP-000502
# Severity: CAT II
#
# Title:
# The DBMS must generate audit records when categories of
# information (e.g., classification/security levels) are modified.
#
# Status:
# NOT A FINDING (Implemented via centralized audit controls)
#
# Finding Details:
# If audit records are not generated when categories of
# information are modified (including updates, deletions,
# or reclassification), unauthorized changes to protected
# data may go undetected.
#
# Manual Steps:
# 1. Verify pgaudit is enabled:
#    SHOW shared_preload_libraries;
# 2. Verify audit configuration:
#    SHOW pgaudit.log;
# 3. Execute:
#    UPDATE / DELETE statements on data
# 4. Verify audit logs:
#    grep AUDIT /var/lib/pgsql/*/data/log/*
#
# Comment:
# This control is implemented via centralized PostgreSQL
# audit configuration. The setting `pgaudit.log = 'all'`
# ensures all WRITE operations (UPDATE, DELETE) and data
# modifications are fully audited, satisfying STIG requirements.
############################################################

- name: "V-206622 | Informational - handled by centralized audit configuration"
  ansible.builtin.debug:
    msg: >
      V-206622 is satisfied by centralized audit configuration
      (pgaudit.log = 'all') implemented in audit controls.
      No separate enforcement required.
  changed_when: false
