---
############################################################
# STIG Control: V-263604
#
# Title:
# The DBMS must implement capability to centrally review
# and analyze audit records from multiple components.
#
# Finding Details:
# Centralized audit analysis improves detection of
# suspicious activity across system components.
#
# Implementation in this Environment:
# PostgreSQL audit logs are forwarded to centralized
# logging infrastructure (SIEM) where analysis occurs.
#
# Manual Verification Steps:
# 1. Verify PostgreSQL logging is enabled.
# 2. Confirm logs are forwarded to centralized monitoring.
# 3. Verify SIEM correlates logs from multiple systems.
# comment: PostgreSQL generates audit logs for database activity using
# native logging and auditing mechanisms. These logs are forwarded to the
# organization's centralized security monitoring platform where they are
# aggregated, reviewed, and analyzed with audit records from other system
# components. Centralized audit review and correlation are implemented
# through enterprise security monitoring infrastructure rather than the
# DBMS itself.

# status: Not a finding
############################################################

- name: "V-263604 | Verify PostgreSQL log destination"
  become_user: postgres
  ansible.builtin.command: psql -t -c "SHOW log_destination;"
  register: log_destination
  changed_when: false
  tags: ['V-263604', 'CAT II', 'check']

- name: "V-263604 | Display log destination"
  ansible.builtin.debug:
    var: log_destination.stdout
  tags: ['V-263604', 'CAT II', 'check']
