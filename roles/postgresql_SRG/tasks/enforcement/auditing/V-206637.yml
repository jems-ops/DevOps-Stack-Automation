---
############################################################
# STIG Control: V-206637
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for unsuccessful
# attempts to access database objects.
#
# Finding Details:
# Logging unsuccessful access attempts helps detect
# unauthorized activity and provides evidence of
# attempted privilege escalation or misuse.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Failed attempts to access database objects such as
# tables, views, functions, or procedures generate
# permission-denied errors which are captured in the
# PostgreSQL logs and audit records.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension is installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit logging configuration:
#
#       SHOW pgaudit.log;
#
# 3. Verify error logging configuration:
#
#       SHOW log_min_error_statement;
#
# Comment:
# PostgreSQL audit logging is implemented using the pgaudit
# extension and database logging configuration. Failed
# attempts to access database objects generate permission-
# denied errors that are recorded in the database logs,
# ensuring unsuccessful access attempts are auditable.
############################################################

- name: "V-206637 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206637', 'CAT II', 'check']

- name: "V-206637 | Verify pgaudit logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206637', 'CAT II', 'check']

- name: "V-206637 | Verify error logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_min_error_statement;"
  register: error_log_config
  changed_when: false
  tags: ['V-206637', 'CAT II', 'check']

- name: "V-206637 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
      - "log_min_error_statement: {{ error_log_config.stdout }}"
  tags: ['V-206637', 'CAT II', 'check']
