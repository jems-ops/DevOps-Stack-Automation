---
############################################################
# STIG Control: V-206543
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect audit features from unauthorized
# removal.
#
# Finding Details:
# Audit mechanisms must be protected to ensure that
# security-relevant events are always recorded. If
# unauthorized users can disable or remove audit features,
# malicious activity may go undetected.
#
# Implementation in this Environment:
# PostgreSQL audit logging is implemented using the
# pgaudit extension. The pgaudit library is loaded at
# server startup using the shared_preload_libraries
# parameter, ensuring the auditing mechanism cannot be
# disabled without administrative privileges.
#
# Only authorized superuser accounts can modify the
# database configuration or remove audit features.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit is installed:
#
#       rpm -qa | grep pgaudit
#
# 2. Verify pgaudit is preloaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify pgaudit extension exists:
#
#       SELECT extname FROM pg_extension;
#
# 4. Verify superuser roles:
#
#       SELECT rolname FROM pg_roles WHERE rolsuper=true;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and is loaded at server startup. Superuser
# privileges are restricted to authorized administrators,
# preventing unauthorized users from disabling audit
# mechanisms.
############################################################


############################################################
# Enforcement
# Note: pgaudit install/preload/extension is handled by
# tasks/pgaudit_setup.yml (runs for all apps when
# postgresql_srg_pgaudit_enabled: true), independent of
# this control toggle.
# V-206543 validates the audit protection posture only.
############################################################

- name: "V-206543 | Verify pgaudit package is present"
  ansible.builtin.shell: rpm -q "{{ postgresql_srg_pgaudit_package }}"
  register: _v206543_pkg
  changed_when: false
  failed_when: false
  tags: ['V-206543', 'CAT-II', 'enforce']

- name: "V-206543 | Assert pgaudit package installed"
  ansible.builtin.assert:
    that: _v206543_pkg.rc == 0
    success_msg: "pgaudit package {{ postgresql_srg_pgaudit_package }} is installed."
    fail_msg: "pgaudit package {{ postgresql_srg_pgaudit_package }} is NOT installed."
  tags: ['V-206543', 'CAT-II', 'enforce']

- name: "V-206543 | Verify pgaudit in shared_preload_libraries"
  become_user: "{{ postgresql_srg_postgres_user }}"
  ansible.builtin.command: psql -tAc "SHOW shared_preload_libraries;"
  register: _v206543_preload
  changed_when: false
  tags: ['V-206543', 'CAT-II', 'enforce']

- name: "V-206543 | Assert pgaudit loaded at startup"
  ansible.builtin.assert:
    that: "'pgaudit' in _v206543_preload.stdout"
    success_msg: "pgaudit is present in shared_preload_libraries."
    fail_msg: "pgaudit is NOT in shared_preload_libraries."
  tags: ['V-206543', 'CAT-II', 'enforce']

- name: "V-206543 | Informational - audit protection enforced"
  ansible.builtin.debug:
    msg: "V-206543 NOT A FINDING: pgaudit loaded and protected via shared_preload_libraries."
  tags: ['V-206543', 'CAT-II', 'enforce', 'info']
