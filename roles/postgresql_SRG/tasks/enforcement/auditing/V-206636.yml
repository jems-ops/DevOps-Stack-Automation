---
############################################################
# STIG Control: V-206636
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for successful access
# to database objects.
#
# Finding Details:
# Logging successful access to database objects provides
# accountability and allows administrators to trace user
# actions performed on database objects such as tables,
# views, procedures, and functions.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration. Successful
# access to database objects (SELECT, INSERT, UPDATE, DELETE,
# EXECUTE) is captured in audit logs.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit is loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify pgaudit logging configuration:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration. Successful
# access to database objects is captured in audit logs,
# providing traceability for database activity.
############################################################

- name: "V-206636 | Verify pgaudit extension installed"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206636', 'CAT II', 'check']

- name: "V-206636 | Verify pgaudit library loaded"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_loaded
  changed_when: false
  tags: ['V-206636', 'CAT II', 'check']

- name: "V-206636 | Verify pgaudit logging configuration"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206636', 'CAT II', 'check']

- name: "V-206636 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "shared_preload_libraries: {{ pgaudit_loaded.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
  tags: ['V-206636', 'CAT II', 'check']
