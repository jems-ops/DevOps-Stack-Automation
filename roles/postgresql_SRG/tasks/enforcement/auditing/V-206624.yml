---
############################################################
# STIG Control: V-206624
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records when privileges
# are deleted.
#
# Finding Details:
# Removal of privileges must be logged to ensure
# traceability of security configuration changes
# within the database system.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Privilege management operations such as REVOKE
# statements and role membership removals generate
# audit records in database log files.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify role auditing enabled:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Privilege management operations such as
# REVOKE statements and role membership removals are
# recorded in database audit logs. Audit records include
# timestamp, database user, operation performed, and
# affected object information.
############################################################

- name: "V-206624 | Ensure pgaudit library loaded"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206624', 'CAT II', 'enforce']

- name: "V-206624 | Enable role audit logging"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206624', 'CAT II', 'enforce']
