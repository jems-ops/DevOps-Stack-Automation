---
############################################################
# STIG Control: V-206621
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for unsuccessful
# attempts to modify security objects.
#
# Finding Details:
# Unauthorized modification of security objects such as
# roles, privileges, or protected database structures may
# indicate malicious activity or privilege escalation
# attempts. These events must be recorded for investigation.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Failed attempts to modify security objects such as
# ALTER ROLE, GRANT, REVOKE, and other privileged
# operations generate error log entries and audit records.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify auditing classes enabled:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Security object modification operations
# including ALTER ROLE, GRANT, REVOKE, and other privilege
# management commands are recorded in database audit logs.
# Failed attempts generate error entries and audit records,
# ensuring unauthorized modification attempts are captured
# for monitoring and forensic analysis.
############################################################

- name: "V-206621 | Ensure pgaudit extension enabled"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206621', 'CAT II', 'enforce']

- name: "V-206621 | Configure audit logging for security objects"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206621', 'CAT II', 'enforce']
