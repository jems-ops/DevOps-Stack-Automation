---
############################################################
# STIG Control: V-206634
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records showing starting and
# ending time for user database access.
#
# Finding Details:
# Recording the start and end time of database sessions
# allows administrators to track user activity and perform
# forensic analysis of database access events.
#
# Implementation in this Environment:
# PostgreSQL logs session start and end events using the
# configuration parameters log_connections and
# log_disconnections.
#
# Log entries include timestamps through the log_line_prefix
# configuration, allowing the start and end time of each
# database session to be reconstructed.
#
# Manual Verification Steps:
#
# 1. Verify connection logging:
#
#       SHOW log_connections;
#
# 2. Verify disconnection logging:
#
#       SHOW log_disconnections;
#
# 3. Verify timestamp logging:
#
#       SHOW log_line_prefix;
#
# Comment:
# PostgreSQL logs all connection and disconnection events
# including timestamps, username, database, and client
# address. These records allow administrators to determine
# the start and end time of database sessions.
############################################################

- name: "V-206634 | Verify connection logging"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_connections;"
  register: log_connections_status
  changed_when: false
  tags: ['V-206634', 'CAT II', 'check']

- name: "V-206634 | Verify disconnection logging"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_disconnections;"
  register: log_disconnections_status
  changed_when: false
  tags: ['V-206634', 'CAT II', 'check']

- name: "V-206634 | Verify timestamp logging"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_line_prefix;"
  register: log_prefix
  changed_when: false
  tags: ['V-206634', 'CAT II', 'check']

- name: "V-206634 | Display configuration"
  ansible.builtin.debug:
    msg:
      - "log_connections: {{ log_connections_status.stdout }}"
      - "log_disconnections: {{ log_disconnections_status.stdout }}"
      - "log_line_prefix: {{ log_prefix.stdout }}"
  tags: ['V-206634', 'CAT II', 'check']
