---
############################################################
# STIG Control: V-206529
# Status: NOT A FINDING
#
# Title:
# The DBMS must include timestamps in audit records.
#
# Finding Details:
# Audit records must include date and time information to
# support event correlation and forensic analysis.
#
# Implementation in this Environment:
# PostgreSQL audit logs include timestamps through the
# log_line_prefix configuration parameter using the %m
# directive.
#
# Manual Verification Steps:
#
#     SHOW log_line_prefix;
#
# Comment:
# PostgreSQL audit records include timestamps to identify
# when database events occur.
############################################################

- name: "V-206529 | Ensure log_line_prefix includes timestamp"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p %c %a %h '"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206529', 'CAT II', 'enforce']
