---
############################################################
# STIG Control: V-206534
# Status: NOT A FINDING
#
# Title:
# The DBMS must include organization-defined additional
# detailed information in audit records.
#
# Finding Details:
# Audit records must contain sufficient contextual
# information to support monitoring, incident detection,
# and forensic analysis.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Audit logging includes SQL statements,
# role changes, data modifications, and parameter values.
#
# PostgreSQL verbose error logging is enabled to capture
# detailed contextual information for security events.
#
# Manual Verification Steps:
#
#   SHOW pgaudit.log;
#   SHOW pgaudit.log_parameter;
#   SHOW log_error_verbosity;
#   SHOW log_statement;
#
# Comment:
# PostgreSQL audit records contain detailed contextual
# information including SQL operations, parameters, role
# activity, and verbose error context.
############################################################


############################################################
# Ensure pgaudit loaded
############################################################

- name: "V-206534 | Ensure pgaudit preloaded"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*shared_preload_libraries\s*='
    line: "shared_preload_libraries = 'pgaudit'"
  notify: Restart PostgreSQL
  tags: ['V-206534', 'CAT II', 'enforce']


############################################################
# Enable detailed audit classes
############################################################

- name: "V-206534 | Enable detailed pgaudit classes"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206534', 'CAT II', 'enforce']


############################################################
# Enable parameter logging
############################################################

- name: "V-206534 | Enable logging of parameters"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log_parameter\s*='
    line: "pgaudit.log_parameter = on"
  notify: Restart PostgreSQL
  tags: ['V-206534', 'CAT II', 'enforce']


############################################################
# Enable verbose error context
############################################################

- name: "V-206534 | Enable verbose error logging"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_error_verbosity\s*='
    line: "log_error_verbosity = verbose"
  notify: Restart PostgreSQL
  tags: ['V-206534', 'CAT II', 'enforce']


############################################################
# Ensure DDL statements logged
############################################################

- name: "V-206534 | Log DDL statements"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_statement\s*='
    line: "log_statement = 'ddl'"
  notify: Restart PostgreSQL
  tags: ['V-206534', 'CAT II', 'enforce']
