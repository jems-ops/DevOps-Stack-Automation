---
############################################################
# STIG Control: V-206638
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for all direct access.
#
# Finding Details:
# Without audit logging of direct access to the DBMS,
# malicious or unauthorized activity could occur without
# detection. Audit records provide accountability and
# support forensic analysis.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension along with database logging configuration.
#
# All direct access to the database including command-line
# sessions and administrative queries is captured in audit
# logs through pgaudit and PostgreSQL logging parameters.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension is installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit is loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify pgaudit logging configuration:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL audit logging is implemented using the pgaudit
# extension and logging configuration. Direct database
# access including administrative commands and SQL queries
# is recorded in audit logs, ensuring accountability for
# all DBMS activity.
############################################################

- name: "V-206638 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206638', 'CAT II', 'check']

- name: "V-206638 | Verify pgaudit library loaded"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_loaded
  changed_when: false
  tags: ['V-206638', 'CAT II', 'check']

- name: "V-206638 | Verify pgaudit logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206638', 'CAT II', 'check']

- name: "V-206638 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "shared_preload_libraries: {{ pgaudit_loaded.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
  tags: ['V-206638', 'CAT II', 'check']
