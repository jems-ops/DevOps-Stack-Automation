---
############################################################
# STIG Control: V-206628
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records when categories of
# information are deleted.
#
# Finding Details:
# Logging deletion operations ensures administrators can
# detect unauthorized removal of database objects or data
# and support forensic investigations.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Deletion operations such as DELETE, TRUNCATE, and DROP
# are captured in audit logs through the pgaudit
# configuration.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify write and DDL activity auditing:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Deletion operations such as DELETE, TRUNCATE,
# and DROP statements are recorded in audit logs, ensuring
# removal of database information is traceable.
############################################################

- name: "V-206628 | Ensure pgaudit enabled"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206628', 'CAT II', 'enforce']
