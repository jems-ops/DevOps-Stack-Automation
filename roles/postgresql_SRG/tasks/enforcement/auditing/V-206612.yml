---
############################################################
# STIG Control: V-206612
# Status: NOT A FINDING
#
# Title:
# The DBMS must be able to generate audit records when
# security objects are accessed.
#
# Finding Details:
# The DBMS must generate audit records for access to
# security-relevant objects, including:
#
#   • SELECT (read)
#   • INSERT (create)
#   • UPDATE (modify)
#   • DELETE (remove)
#   • EXECUTE (functions/procedures)
#
# Failure to generate audit records prevents detection
# of unauthorized access or modification.
#
# Implementation in this Environment:
#
#   • pgaudit extension is installed and enabled
#   • shared_preload_libraries includes 'pgaudit'
#   • pgaudit.log is configured to capture:
#       - read
#       - write
#       - ddl
#       - role
#   • PostgreSQL logging is enabled and centralized
#
# Manual Verification Steps:
#
#   1. Verify pgaudit is enabled:
#        SHOW shared_preload_libraries;
#
#   2. Verify pgaudit configuration:
#        SHOW pgaudit.log;
#
#   3. Verify logging settings:
#        SHOW logging_collector;
#        SHOW log_destination;
#
#   4. Generate test query and verify logs:
#        SELECT * FROM pg_tables;
#        (Check PostgreSQL logs for audit entry)
#
# Summary:
# PostgreSQL is configured to generate audit records using
# the pgaudit extension for all security-relevant operations.
# Audit logging is active and verifiable. Therefore,
# V-206612 is NOT A FINDING.
############################################################

############################################################
# Enable pgaudit (CRITICAL)
############################################################

- name: "V-206612 | Ensure pgaudit in shared_preload_libraries"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206612', 'CAT-II', 'enforce', 'postgres', 'stig']


############################################################
# Configure pgaudit logging
############################################################

- name: "V-206612 | Configure pgaudit logging"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit.log'
    line: "pgaudit.log = 'read, write, ddl, role'"
  notify: Restart PostgreSQL
  tags: ['V-206612', 'CAT-II', 'enforce', 'postgres', 'stig']


############################################################
# Ensure logging collector enabled
############################################################

- name: "V-206612 | Enable logging collector"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?logging_collector'
    line: "logging_collector = on"
  notify: Restart PostgreSQL
  tags: ['V-206612', 'CAT-II', 'enforce', 'postgres', 'stig']


############################################################
# Informational check
############################################################

- name: "V-206612 | Informational - audit logging enabled"
  ansible.builtin.debug:
    msg: >
      PostgreSQL audit logging is enforced using pgaudit.
      Security object access is logged for monitoring and compliance.
  changed_when: false
  tags: ['V-206612', 'enforce', 'info']
