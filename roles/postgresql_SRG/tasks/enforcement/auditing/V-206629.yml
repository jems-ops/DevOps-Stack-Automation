---
############################################################
# STIG Control: V-206629
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records when attempts to
# delete categories of information fail or are denied.
#
# Finding Details:
# Logging failed deletion attempts allows administrators
# to detect unauthorized attempts to remove data or
# database objects.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Failed deletion attempts such as DELETE, DROP, or
# TRUNCATE operations generate permission-denied errors
# that are recorded in PostgreSQL logs and audit records.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify write activity auditing enabled:
#
#       SHOW pgaudit.log;
#
# 3. Verify error logging configuration:
#
#       SHOW log_min_error_statement;
#
# Comment:
# PostgreSQL logs unsuccessful attempts to delete database
# objects or data through standard error logging and the
# pgaudit extension. Failed deletion operations generate
# audit records that support monitoring and forensic
# analysis of unauthorized deletion attempts.
############################################################

- name: "V-206629 | Ensure pgaudit logging configured"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206629', 'CAT II', 'enforce']
