---
############################################################
# STIG Control: V-206528
# Status: NOT A FINDING
#
# Title:
# The DBMS must include the event type in audit records.
#
# Finding Details:
# Audit records must identify the type of event being
# logged, such as data access, modification, or role
# management operations.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Event classes are configured to capture
# DDL operations, role changes, and data access events.
#
# Catalog auditing is enabled to ensure access to system
# objects is also recorded.
#
# Manual Verification Steps:
#
#     SHOW pgaudit.log;
#     SHOW pgaudit.log_catalog;
#
# Comment:
# PostgreSQL audit records include event type information
# through the pgaudit logging configuration.
############################################################


############################################################
# Enable audit event classes
############################################################

- name: "V-206528 | Ensure pgaudit event classes enabled"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206528', 'CAT II', 'enforce']


############################################################
# Enable catalog auditing
############################################################

- name: "V-206528 | Ensure catalog auditing enabled"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log_catalog\s*='
    line: "pgaudit.log_catalog = on"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206528', 'CAT II', 'enforce']
