---
############################################################
# STIG Control: V-206539
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect audit information from
# unauthorized modification.
#
# Finding Details:
# Audit information must be protected from unauthorized
# modification to maintain the integrity of security
# monitoring and forensic investigation.
#
# Implementation in this Environment:
# PostgreSQL audit logs are written to a dedicated log
# directory owned by the postgres administrative account.
# Directory permissions are restricted to 0700 and log
# files are restricted to 0600.
#
# PostgreSQL logging_collector is enabled to ensure audit
# records are written to files under controlled access.
#
# Manual Verification Steps:
#
# 1. Verify logging collector is enabled:
#
#       SHOW logging_collector;
#
# 2. Verify log directory permissions:
#
#       ls -ld {{ postgresql_srg_log_directory }}
#
# 3. Verify log file permissions:
#
#       ls -l {{ postgresql_srg_log_directory }}
#
# Comment:
# Audit information is protected through strict file
# permissions and restricted DBMS administrative access.
############################################################


############################################################
# Protect Log Directory
############################################################

- name: "V-206539 | Ensure log directory protected"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_log_directory }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory
  tags: ['V-206539', 'CAT II', 'enforce']


############################################################
# Secure Existing Log Files
############################################################

- name: "V-206539 | Find PostgreSQL log files"
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_log_directory }}"
    file_type: file
  register: v206539_logs
  tags: ['V-206539', 'CAT II', 'check']


- name: "V-206539 | Restrict log file permissions"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: postgres
    group: postgres
    mode: "0600"
  loop: "{{ v206539_logs.files }}"
  when: v206539_logs.matched > 0
  tags: ['V-206539', 'CAT II', 'enforce']


############################################################
# Enable Logging Collector
############################################################

- name: "V-206539 | Ensure logging_collector enabled"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*logging_collector\s*='
    line: "logging_collector = on"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206539', 'CAT II', 'enforce']
