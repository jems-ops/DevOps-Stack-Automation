---
############################################################
# STIG Control: V-206526
# Status: NOT A FINDING
#
# Title:
# The DBMS must generate audit records for unsuccessful
# attempts to retrieve privileges/roles.
#
# Finding Details:
# Failed attempts to access role or privilege information
# must be recorded to support monitoring and incident
# investigation.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Role and read audit classes are enabled,
# catalog auditing is active, and failed statements are
# logged through log_min_error_statement.
#
# Manual Verification Steps:
#
#     SHOW pgaudit.log;
#     SHOW pgaudit.log_catalog;
#     SHOW log_min_error_statement;
#
# Comment:
# PostgreSQL audit records include unsuccessful attempts
# to retrieve privileges or roles.
############################################################


############################################################
# Enable pgaudit event classes
############################################################

- name: "V-206526 | Configure pgaudit log classes"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206526', 'CAT II', 'enforce']


############################################################
# Enable catalog auditing
############################################################

- name: "V-206526 | Enable catalog auditing"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log_catalog\s*='
    line: "pgaudit.log_catalog = on"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206526', 'CAT II', 'enforce']


############################################################
# Log failed statements
############################################################

- name: "V-206526 | Log failed statements"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^\s*#?\s*log_min_error_statement\s*='
    line: "log_min_error_statement = error"
    backup: true
  notify: Restart PostgreSQL
  tags: ['V-206526', 'CAT II', 'enforce']
