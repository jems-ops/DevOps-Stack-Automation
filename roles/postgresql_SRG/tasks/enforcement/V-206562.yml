---
############################################################
# STIG V-206562 Enforcement
# Ensure FIPS 140-2/140-3 Validated Cryptographic Modules
############################################################

############################################################
# Enable FIPS Mode at OS Level
############################################################

- name: "V-206562 | Ensure FIPS package installed"
  become: true
  ansible.builtin.package:
    name: dracut-fips
    state: present
  when: postgresql_srg_fips_required | bool

- name: "V-206562 | Ensure crypto policy set to FIPS"
  become: true
  ansible.builtin.command: update-crypto-policies --set FIPS
  register: postgresql_srg_crypto_policy
  changed_when: "'Setting system policy to FIPS' in postgresql_srg_crypto_policy.stdout"
  when: postgresql_srg_fips_required | bool

############################################################
# Verify FIPS is enabled
############################################################

- name: "V-206562 | Check FIPS enabled"
  become: true
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: postgresql_srg_fips_status
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-206562 | Fail if FIPS not enabled"
  ansible.builtin.fail:
    msg: "FIPS mode is not enabled. System reboot required after enabling FIPS."
  when:
    - postgresql_srg_fips_required | bool
    - postgresql_srg_fips_status.stdout | default('1') != "1"
