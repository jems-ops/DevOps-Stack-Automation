---
############################################################
# STIG Control: V-206611
# Status: NOT A FINDING
#
# Title:
# The DBMS must be maintained with the latest security-
# relevant software updates.
#
# Finding Details:
# Failure to apply security updates may leave the database
# system vulnerable to known exploits and software
# vulnerabilities. Timely patching ensures vulnerabilities
# are mitigated and the DBMS remains secure.
#
# Implementation in this Environment:
# PostgreSQL and system packages are maintained using the
# RHEL package manager (DNF). Security updates are monitored
# and applied according to organizational patch management
# policies. Automated configuration management may be used
# to install approved updates.
#
# Manual Verification Steps:
#
# 1. Check available security updates:
#
#       dnf updateinfo list security
#
# 2. Verify installed PostgreSQL version:
#
#       psql --version
#
# 3. Confirm security patches are applied according to
#    organizational patch management policy.
#
# Comment:
# PostgreSQL software updates are managed through the
# RHEL package management system (DNF). Security updates
# are applied according to the organization’s patch
# management procedures, ensuring vulnerabilities are
# remediated within required timeframes.
############################################################

- name: "V-206611 | Apply security updates"
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest
    security: yes
  when: postgresql_srg_patch_enforce
  tags: ['V-206611','CAT II','enforce']
