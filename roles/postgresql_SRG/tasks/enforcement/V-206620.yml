---
############################################################
# STIG Control: V-206620
# Audit modification of security objects
# comment:PostgreSQL auditing is implemented using the pgaudit extension. Security object modification operations such as ALTER TABLE, ALTER ROLE, and other DDL actions are recorded in the database audit logs. These records include the timestamp, user identity, and affected object, ensuring modifications to security objects are traceable for monitoring and forensic analysis.
# Status: Not a finding
############################################################

- name: "V-206620 | Ensure pgaudit extension enabled"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206620','CAT II', 'enforce']

- name: "V-206620 | Configure audit logging for security objects"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206620','CAT II', 'enforce']