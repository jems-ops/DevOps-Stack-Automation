---
############################################################
# STIG Control: V-263610
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must maintain a list of commonly used, expected,
# or compromised passwords on an organization-defined frequency.
#
# Finding Details:
# Systems that manage password-based authentication must
# maintain and update password blacklist databases to
# prevent the use of weak or compromised credentials.
#
# Implementation in this Environment:
# PostgreSQL is deployed as the backend database for the
# SonarQube application. End users do not authenticate
# directly to the DBMS.
#
# User authentication and password policy enforcement,
# including password blacklist maintenance, are handled
# through the centralized identity provider (Keycloak SSO).
#
# Comment:
# Because PostgreSQL does not perform password-based
# authentication for end users in this architecture,
# password blacklist management is implemented by the
# enterprise identity provider rather than the DBMS.
# Therefore, this control is not applicable to the
# PostgreSQL deployment.
#
# Manual Verification Steps:
#
# 1. Verify SonarQube authentication uses Keycloak SSO.
#
# 2. Confirm PostgreSQL roles are application service
#    accounts rather than individual user accounts.
#
#       SELECT rolname FROM pg_roles;
#
# 3. Verify password blacklist enforcement occurs in
#    the centralized identity provider.
############################################################

- name: "V-263610 | Password blacklist handled by identity provider"
  ansible.builtin.debug:
    msg: "DBMS does not manage user password authentication; control not applicable."
  tags:
    - V-263610
    - CATII
    - enforce
