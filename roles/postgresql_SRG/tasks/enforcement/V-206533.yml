############################################################
# PostgreSQL STIG | V-206533
# Ensure audit record includes user name
############################################################

- name: Ensure log_line_prefix includes user name (%u)
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %H %p %u %d %c %h %r %a %e '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206533
    - logging
