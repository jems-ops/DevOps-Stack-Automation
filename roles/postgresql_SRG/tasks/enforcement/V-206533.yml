---
############################################################
# STIG V-206533
# Enforcement - Audit records must include user identity
############################################################
#
# COMPLIANT WHEN:
# - log_line_prefix contains %u (user)
# - log_line_prefix contains %d (database)
# - log_line_prefix contains %p (process ID)
# - log_line_prefix contains %c (session ID)
# - log_line_prefix contains %a (application)
# - log_line_prefix contains %h (client host)
#
# VERIFY:
# SHOW log_line_prefix;
# comment: PostgreSQL is configured with log_line_prefix to capture user name, database name, process ID, session ID, application name, and client host. Audit records contain sufficient identity information to establish responsibility for events. Therefore, V-206533 is Not a Finding.
############################################################

- name: V-206533 | Configure log_line_prefix for identity tracking
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p %c %a %h '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206533
    - cat2

- name: V-206533 | Ensure pgaudit logging enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206533
    - cat2
