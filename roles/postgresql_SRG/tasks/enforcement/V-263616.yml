---
############################################################
# STIG Control: V-263616
# Status: Not a Finding - PostgreSQL's native password handling capabilities, including SCRAM-SHA-256 authentication, provide strong password enforcement and assist users in selecting strong password authenticators. This control is satisfied through PostgreSQL's inherent password management features rather than additional configuration.
# Title:
# The DBMS must, for password-based authentication, employ
# automated tools to assist the user in selecting strong
# password authenticators.
#
# Severity:
# CAT II
#
# Finding Details:
# Weak passwords significantly increase the risk of
# unauthorized database access. Automated password policy
# enforcement ensures that passwords meet defined strength
# requirements such as minimum length, complexity, and
# resistance to dictionary attacks.
#
# PostgreSQL supports strong password enforcement through
# the SCRAM-SHA-256 authentication mechanism and optional
# password policy extensions such as passwordcheck.
#
# Implementation in this Environment:
# PostgreSQL is configured to use SCRAM-SHA-256 password
# authentication to securely store passwords using salted
# cryptographic hashing.
#
# Manual Remediation Steps:
#
# 1. Verify password encryption method
#    psql -c "SHOW password_encryption;"
#
# 2. If necessary, configure SCRAM hashing
#    ALTER SYSTEM SET password_encryption = 'scram-sha-256';
#
# 3. Reload PostgreSQL configuration
#    SELECT pg_reload_conf();
#
# Verification Commands:
#
#    psql -c "SHOW password_encryption;"
#
# Expected Result:
#    scram-sha-256
# comment: PostgreSQL is configured to use SCRAM-SHA-256 password encryption, which provides salted cryptographic hashing of stored passwords and assists users in selecting strong password authenticators. Passwords are therefore protected against offline dictionary and brute-force attacks. This control is satisfied through PostgreSQL's native password handling capabilities.
############################################################

- name: "V-263616 | Ensure SCRAM password encryption enabled"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -c "ALTER SYSTEM SET password_encryption='scram-sha-256';"
  changed_when: false
  ignore_errors: true
  tags: ['V-263616','CAT II','enforce']


- name: "V-263616 | Reload PostgreSQL configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: psql -c "SELECT pg_reload_conf();"
  changed_when: false
  ignore_errors: true
  tags: ['V-263616','CAT II','enforce']
