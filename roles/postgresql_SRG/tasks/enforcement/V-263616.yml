---
############################################################
# STIG Control: V-263616
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must, for password-based authentication, employ
# automated tools to assist the user in selecting strong
# password authenticators.
#
# Finding Details:
# Weak passwords increase the risk of unauthorized access.
# This control applies when the DBMS is responsible for
# authenticating users with passwords.
#
# Implementation in this Environment:
# PostgreSQL in this deployment is used only as a backend
# database for the SonarQube application. End users do not
# authenticate directly to the DBMS.
#
# User authentication is performed through the application
# layer using Keycloak SSO. PostgreSQL is accessed using
# dedicated application service accounts.
#
# Comment:
# Since PostgreSQL does not perform password-based
# authentication for end users in this architecture, the
# requirement for DBMS password strength enforcement does
# not apply.
#
# Manual Verification Steps:
#
# 1. Verify PostgreSQL roles:
#       SELECT rolname FROM pg_roles;
#
# 2. Confirm users do not authenticate directly to the DBMS.
#
# 3. Verify application authentication uses Keycloak SSO.
############################################################

- name: "V-263616 | Password policy handled by application identity provider"
  ansible.builtin.debug:
    msg: "DBMS does not perform password-based authentication for users; control not applicable."
  tags:
    - V-263616
    - CATII
    - enforce
