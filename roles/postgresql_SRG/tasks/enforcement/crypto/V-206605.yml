---
############################################################
# STIG Control: V-206605
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect the confidentiality of information
# in transit using cryptographic mechanisms.
#
# Finding Details:
# DBMS communications must be protected using encryption
# (e.g., TLS) when transmitted over untrusted or external
# networks. Failure to do so may expose sensitive data to
# interception.
#
# Implementation in this Environment:
#
#   • PostgreSQL is bound to localhost only
#   • No external or untrusted network connections exist
#   • All DB communication occurs within the local host
#   • Network isolation prevents exposure to interception
#   • OS-level FIPS cryptographic modules enforce system security
#
# Manual Verification Steps:
#
#   1. Verify database binding:
#        SHOW listen_addresses;
#
#   2. Verify no external connections in pg_hba.conf:
#        awk '!/^\s*#/ && /host/ {print}' {{ postgresql_srg_hba_file }}
#
#   3. Verify no open remote ports:
#        ss -tulnp | grep 5432
#
#   4. Confirm SSL configuration:
#        SHOW ssl;
#
# Summary:
# PostgreSQL operates in an isolated environment with
# localhost-only communication and no exposure to untrusted
# networks. Since no external transmission occurs, the risk
# of interception is mitigated without DBMS-level TLS.
# Therefore, V-206605 is NOT A FINDING.
############################################################


############################################################
# Informational enforcement (no DB TLS required)
############################################################

- name: "V-206605 | Informational - no DB TLS required"
  ansible.builtin.debug:
    msg: >
      PostgreSQL operates in an isolated localhost-only environment.
      DBMS-level TLS is not required because no external or
      untrusted network communication exists. Protection is
      provided through network isolation and OS-level controls.
  changed_when: false
  tags: ['V-206605', 'CAT-I', 'enforce', 'postgres', 'stig', 'informational']
