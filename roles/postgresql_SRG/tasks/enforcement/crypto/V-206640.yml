---
############################################################
# STIG Control: V-206640
# Status : NOT A FINDING
#
# Title:
# DBMS must use NIST FIPS 140-2 or 140-3 validated
# cryptographic modules for hash generation and validation.
#
# Finding Details:
# Cryptographic hashing functions must use validated
# modules to ensure secure generation and verification
# of password hashes and other cryptographic data.
#
# Implementation in this Environment:
# PostgreSQL cryptographic hashing operations rely on the
# OpenSSL library provided by the underlying RHEL operating
# system. The system operates in FIPS mode which ensures
# cryptographic operations utilize NIST FIPS validated
# modules.
#
# PostgreSQL password hashing is configured to use the
# SCRAM-SHA-256 authentication mechanism.
#
# Manual Verification Steps:
#
# 1. Verify system FIPS mode:
#
#       cat /proc/sys/crypto/fips_enabled
#
#    Expected result:
#
#       1
#
# 2. Verify system crypto policy:
#
#       update-crypto-policies --show
#
#    Expected result:
#
#       FIPS
#
# 3. Verify PostgreSQL password hashing method:
#
#       SHOW password_encryption;
#
#    Expected result:
#
#       scram-sha-256
#
# Comment:
# PostgreSQL cryptographic hashing operations rely on the
# OpenSSL library provided by the RHEL operating system.
# When FIPS mode is enabled, OpenSSL operates using
# validated cryptographic modules. PostgreSQL password
# hashing uses SCRAM-SHA-256 which complies with FIPS
# cryptographic requirements.
############################################################

- name: "V-206640 | Check FIPS mode"
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: fips_mode
  changed_when: false
  tags: ['V-206640', 'CAT II', 'check']

- name: "V-206640 | Display FIPS status"
  ansible.builtin.debug:
    var: fips_mode.stdout
  tags: ['V-206640', 'CAT II', 'check']

- name: "V-206640 | Verify PostgreSQL password hashing"
  become_user: postgres
  ansible.builtin.command: psql -t -c "SHOW password_encryption;"
  register: password_hash_method
  changed_when: false
  tags: ['V-206640', 'CAT II', 'check']

- name: "V-206640 | Display password hashing method"
  ansible.builtin.debug:
    var: password_hash_method.stdout
  tags: ['V-206640', 'CAT II', 'check']
