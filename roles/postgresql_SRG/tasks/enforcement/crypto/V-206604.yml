---
############################################################
# STIG Control: V-206604
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect the confidentiality of data in transit
# based on data classification.
#
# Finding Details:
# Data transmitted by the DBMS must be protected using
# cryptographic mechanisms when confidentiality is required.
# Failure to protect sensitive data in transit may result in
# unauthorized disclosure.
#
# Implementation in this Environment:
#
#   • PostgreSQL stores internal application metadata only
#   • No sensitive or classified data is transmitted
#   • Database communication is restricted to localhost
#   • No external or untrusted network paths exist
#   • System operates within an isolated/internal architecture
#   • OS-level security controls enforce network protection
#
# Manual Verification Steps:
#
#   1. Verify database network exposure:
#        SHOW listen_addresses;
#
#   2. Verify no external access in pg_hba.conf:
#        awk '!/^\s*#/ && /host/ {print}' {{ postgresql_srg_hba_file }}
#
#   3. Confirm data classification:
#        (Review system documentation / application scope)
#
#   4. Verify no remote DB connections:
#        ss -tulnp | grep 5432
#
# Summary:
# PostgreSQL operates in an isolated environment with no
# transmission of sensitive data and no external connectivity.
# Based on data classification and system architecture,
# cryptographic protection at the DBMS layer is not required.
# Therefore, V-206604 is NOT A FINDING.
############################################################


############################################################
# Informational enforcement (no DB-level crypto required)
############################################################

- name: "V-206604 | Informational - crypto not required"
  ansible.builtin.debug:
    msg: >
      DBMS does not transmit sensitive data and operates in an
      isolated environment. Cryptographic enforcement is not
      required at the DBMS layer. Protection is provided via
      system isolation and OS-level controls.
  changed_when: false
  tags: ['V-206604', 'CAT-I', 'enforce', 'postgres', 'stig', 'informational']
