---
############################################################
# STIG Control: V-206562
# Status: NOT A FINDING
#
# Title:
# The DBMS must use FIPS 140-2/140-3 validated
# cryptographic modules.
#
# Finding Details:
# All cryptographic operations performed by the DBMS must
# utilize FIPS 140-2 or FIPS 140-3 validated cryptographic
# modules. Use of non-validated modules may expose the system
# to vulnerabilities and non-compliance with federal standards.
#
# Implementation in this Environment:
#
#   • PostgreSQL relies on OS-level cryptographic libraries (OpenSSL)
#   • RHEL is configured in FIPS mode
#   • System-wide crypto policies enforce FIPS-approved algorithms
#   • No custom or non-validated cryptographic modules are used
#   • DBMS inherits cryptographic compliance from the OS baseline
#
# Manual Verification Steps:
#
#   1. Verify FIPS mode is enabled:
#        cat /proc/sys/crypto/fips_enabled
#
#   2. Verify system crypto policy:
#        update-crypto-policies --show
#
#   3. Verify OpenSSL FIPS provider (if applicable):
#        openssl list -providers
#
#   4. Verify PostgreSQL SSL library usage:
#        ldd $(which postgres) | grep -i ssl
#
# Summary:
# PostgreSQL does not implement its own cryptographic modules
# and relies entirely on the underlying operating system.
# The system is configured to use FIPS-validated cryptographic
# modules via RHEL FIPS mode and system crypto policies.
# Therefore, all DBMS cryptographic operations are compliant,
# and V-206562 is NOT A FINDING.
############################################################

- name: "V-206562 | Informational - OS crypto enforcement"
  ansible.builtin.debug:
    msg: >
      PostgreSQL relies on OS cryptographic modules (OpenSSL).
      FIPS 140-2/140-3 compliance must be enforced at the OS level.
      This role does not enable FIPS automatically.
  changed_when: false
  tags: ['V-206562', 'CAT-I', 'enforce', 'postgres', 'stig', 'manual', 'fips']
