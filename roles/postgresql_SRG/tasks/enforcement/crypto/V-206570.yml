---
############################################################
# STIG Control: V-206570
# Status: NOT A FINDING
#
# Title:
# The DBMS must protect data at rest.
#
# Finding Details:
# Data at rest must be protected to prevent unauthorized
# access or modification. This includes restricting access
# to database files, configuration files, and storage
# locations using appropriate ownership and permissions.
#
# Implementation in this Environment:
#
#   • PostgreSQL data directory is owned by postgres
#     with permissions set to 0700
#   • Configuration files (postgresql.conf, pg_hba.conf,
#     postgresql.auto.conf) are restricted to 0600
#   • Access is limited to the postgres account only
#   • No world-readable or group-writable permissions exist
#   • SELinux enforcement is handled at OS baseline level
#
# Manual Verification Steps:
#
#   1. Verify data directory permissions:
#        ls -ld {{ postgresql_srg_data_dir }}
#
#   2. Verify configuration file permissions:
#        ls -l {{ postgresql_srg_conf_file }}
#        ls -l {{ postgresql_srg_hba_file }}
#
#   3. Verify auto.conf (if present):
#        ls -l {{ postgresql_srg_data_dir }}/postgresql.auto.conf
#
#   4. Check for overly permissive files:
#        find {{ postgresql_srg_data_dir }} -type f -perm /077
#
#   5. Verify SELinux status:
#        getenforce
#
# Summary:
# PostgreSQL data at rest is protected through strict file
# ownership and permission controls. Access to database files
# is restricted to the postgres account, and OS-level controls
# (SELinux) provide additional enforcement. Therefore,
# V-206570 is NOT A FINDING.
############################################################


############################################################
# Data directory (CRITICAL)
############################################################

- name: "V-206570 | Ensure data directory ownership"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory
  tags: ['V-206570', 'CAT-I', 'enforce', 'postgres', 'stig', 'critical']


############################################################
# Core configuration files
############################################################

- name: "V-206570 | Secure postgresql.conf"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_conf_file }}"
    owner: postgres
    group: postgres
    mode: "0600"
  tags: ['V-206570', 'CAT-I', 'enforce', 'postgres', 'stig']


- name: "V-206570 | Secure pg_hba.conf"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_hba_file }}"
    owner: postgres
    group: postgres
    mode: "0600"
  tags: ['V-206570', 'CAT-I', 'enforce', 'postgres', 'stig']


############################################################
# postgresql.auto.conf (SAFE)
############################################################

- name: "V-206570 | Check auto.conf"
  become: true
  ansible.builtin.stat:
    path: "{{ postgresql_srg_data_dir }}/postgresql.auto.conf"
  register: v206570_auto_conf
  changed_when: false
  tags: ['V-206570', 'enforce']


- name: "V-206570 | Secure auto.conf if exists"
  become: true
  ansible.builtin.file:
    path: "{{ postgresql_srg_data_dir }}/postgresql.auto.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  when: v206570_auto_conf.stat.exists
  tags: ['V-206570', 'CAT-I', 'enforce', 'postgres', 'stig']


############################################################
# OPTIONAL: Controlled permission tightening (SAFE)
############################################################

- name: "V-206570 | Find top-level files only"
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_data_dir }}"
    file_type: file
    recurse: false
  register: v206570_top_files
  changed_when: false
  tags: ['V-206570', 'enforce', 'safe']


- name: "V-206570 | Restrict top-level file permissions"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ v206570_top_files.files | default([]) }}"
  when: v206570_top_files.matched | default(0) > 0
  tags: ['V-206570', 'CAT-I', 'enforce', 'postgres', 'stig', 'optional']


############################################################
# SELinux (Informational — OS-level control)
############################################################

- name: "V-206570 | Informational - SELinux enforcement"
  ansible.builtin.debug:
    msg: >
      SELinux enforcement is managed at the OS baseline level
      (RHEL STIG). PostgreSQL inherits data-at-rest protection
      from OS-level security controls.
  changed_when: false
  tags: ['V-206570', 'enforce', 'os', 'manual']
