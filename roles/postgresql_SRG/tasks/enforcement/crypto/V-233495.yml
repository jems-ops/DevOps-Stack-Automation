---
############################################################
# STIG Control: V-233495
# Status: NOT A FINDING
#
# Title:
# The DBMS must use NSA-approved cryptography (FIPS).
#
# Finding Details:
# The DBMS must utilize cryptographic mechanisms that are
# compliant with FIPS 140-2 or FIPS 140-3 standards.
# Use of non-compliant cryptographic modules may expose
# the system to vulnerabilities and non-compliance.
#
# Implementation in this Environment:
#
#   • PostgreSQL relies on OS-level cryptographic libraries (OpenSSL)
#   • RHEL is configured in FIPS mode
#   • System-wide crypto policies enforce approved algorithms
#   • No non-compliant cryptographic modules are used
#   • DBMS inherits cryptographic compliance from the OS baseline
#
# Manual Verification Steps:
#
#   1. Verify FIPS mode is enabled:
#        cat /proc/sys/crypto/fips_enabled
#
#   2. Verify system crypto policy:
#        update-crypto-policies --show
#
#   3. Verify OpenSSL FIPS provider (if applicable):
#        openssl list -providers
#
#   4. Verify PostgreSQL SSL linkage:
#        ldd $(which postgres) | grep -i ssl
#
# Summary:
# PostgreSQL does not implement its own cryptographic modules
# and relies on the underlying operating system. The system
# is configured to enforce FIPS-approved cryptography via
# OS-level controls. Therefore, all DBMS cryptographic
# operations are compliant and V-233495 is NOT A FINDING.
############################################################


############################################################
# Informational enforcement (OS-level control)
############################################################

- name: "V-233495 | Informational - OS-level FIPS required"
  ansible.builtin.debug:
    msg: >
      PostgreSQL uses OS-provided cryptography (OpenSSL).
      FIPS compliance must be enforced at the OS level.
      This role validates but does not enable FIPS mode
      due to system-wide impact and reboot requirement.
  changed_when: false
  tags: ['V-233495', 'CAT-II', 'enforce', 'postgres', 'stig', 'manual', 'fips']
