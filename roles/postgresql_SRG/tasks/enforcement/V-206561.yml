---
############################################################
# STIG V-206561 Enforcement
# Prevent Display of Authentication Secrets
############################################################

############################################################
# Remove .pgpass Files
############################################################

- name: "V-206561 | Find .pgpass files"
  become: true
  ansible.builtin.find:
    paths:
      - /var/lib/pgsql
      - /home
      - /root
      - /opt
      - /etc
    patterns: ".pgpass"
    recurse: true
  register: postgresql_srg_pgpass_files

- name: "V-206561 | Remove discovered .pgpass files"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ postgresql_srg_pgpass_files.files }}"
  when: postgresql_srg_pgpass_files.matched > 0

############################################################
# Remove Password-Based Authentication Methods
############################################################

- name: "V-206561 | Remove password-based auth from pg_hba.conf"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(host|local).*(md5|scram-sha-256|password)\s*$'
    replace: ''
  notify: Reload PostgreSQL

############################################################
# Remove Stored Role Passwords
############################################################

- name: "V-206561 | Identify roles with stored passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword IS NOT NULL;"
  register: postgresql_srg_roles_with_passwords
  changed_when: false

- name: "V-206561 | Remove stored role passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -c "ALTER ROLE {{ item }} PASSWORD NULL;"
  loop: "{{ postgresql_srg_roles_with_passwords.stdout_lines }}"
  when: postgresql_srg_roles_with_passwords.stdout_lines | length > 0
  notify: Reload PostgreSQL
