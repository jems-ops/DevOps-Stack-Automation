---
############################################################
# STIG Control: V-263614
# Status: Not a Finding - PostgreSQL does not provide an automated account recovery mechanism. Password resets are performed by authorized administrators using controlled procedures. Users are required to immediately change their password following an administrator reset. Therefore, this control is satisfied through administrative processes rather than DBMS configuration.
# Title:
# The DBMS must, for password-based authentication, require
# immediate selection of a new password upon account recovery.
#
# Severity:
# CAT II
#
# Finding Details:
# If users continue using temporary or recovery passwords,
# attackers may exploit weak or known credentials. Requiring
# users to immediately select a new password after account
# recovery ensures secure authentication credentials.
#
# Implementation in this Environment:
# PostgreSQL does not provide an automated account recovery
# mechanism. Password resets are performed by authorized
# database administrators using administrative procedures.
#
# When a password reset occurs, administrators require the
# user to immediately change the password during the next
# authentication event.
#
# Manual Administrative Procedure:
#
# 1. Reset password using administrator account
#
#    ALTER ROLE username PASSWORD 'temporary_password';
#
# 2. Notify the user to change their password immediately.
#
# 3. User updates password after login
#
#    ALTER ROLE username PASSWORD 'new_secure_password';
#
# Verification Commands:
#
#    SELECT rolname FROM pg_roles;
#
# Expected Result:
# Password resets are performed through controlled
# administrative procedures requiring immediate change.
# comment:PostgreSQL does not provide a built-in account recovery mechanism. Password resets are performed by authorized administrators using controlled procedures. Users are required to immediately change their password following an administrator reset.
# Therefore, this control is satisfied through administrative processes rather than DBMS configuration.
############################################################

- name: "V-263614 | Informational control - password recovery handled by admin procedures"
  ansible.builtin.debug:
    msg: "PostgreSQL account recovery is handled through administrative procedures requiring immediate password change."
  tags: ['V-263614','CAT II','check']

