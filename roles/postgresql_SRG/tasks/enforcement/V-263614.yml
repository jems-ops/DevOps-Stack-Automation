---
############################################################
# STIG Control: V-263614
# Status: NOT APPLICABLE
#
# Title:
# The DBMS must, for password-based authentication, require
# immediate selection of a new password upon account recovery.
#
# Finding Details:
# If temporary or recovery passwords remain in use, attackers
# could exploit known credentials to gain unauthorized access.
# Systems must require users to immediately change passwords
# after account recovery.
#
# Implementation in this Environment:
# PostgreSQL is deployed as a backend database for the
# SonarQube application. End users do not authenticate
# directly to the DBMS.
#
# User authentication and password management, including
# account recovery and password reset procedures, are
# handled by the centralized identity provider (Keycloak SSO).
#
# Comment:
# Since PostgreSQL does not perform password-based
# authentication or password recovery for end users,
# the requirement for DBMS-enforced password reset upon
# account recovery is not applicable to this deployment.
#
# Manual Verification Steps:
#
# 1. Verify SonarQube authentication uses Keycloak SSO.
#
# 2. Confirm PostgreSQL roles are application service
#    accounts rather than individual user accounts.
#
#       SELECT rolname FROM pg_roles;
#
# 3. Verify user password reset procedures occur in
#    the centralized identity provider.
############################################################

- name: "V-263614 | Password recovery handled by external identity provider"
  ansible.builtin.debug:
    msg: "DBMS does not perform user password recovery; control not applicable."
  tags:
    - V-263614
    - CATII
    - enforce
