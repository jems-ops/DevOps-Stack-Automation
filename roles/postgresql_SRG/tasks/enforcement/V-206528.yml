---
############################################################
# STIG V-206528
# Enforcement - Audit record must include event type info
############################################################
#
# COMPLIANT WHEN:
# - pgaudit enabled
# - event classes defined
# - log_line_prefix includes timestamp, user, db, host, pid
#
# VERIFY:
# SHOW pgaudit.log;
# SHOW log_line_prefix;
# comment: PostgreSQL is configured with pgaudit enabled, event class logging active, catalog auditing enabled, and a log_line_prefix that captures timestamp, user, database, host, and process ID. Audit records contain sufficient information to identify event type and support forensic analysis. Therefore, V-206528 is Not a Finding.
############################################################

- name: V-206528 | Ensure pgaudit log classes include event types
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206528
    - cat2

- name: V-206528 | Ensure catalog auditing enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log_catalog\s*='
    line: "pgaudit.log_catalog = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206528
    - cat2

- name: V-206528 | Configure log_line_prefix for forensic detail
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206528
    - cat2
