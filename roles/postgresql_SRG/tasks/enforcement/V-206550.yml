---
############################################################
# STIG Control: V-206550
# Status: NOT A FINDING
#
# Title:
# The DBMS must remove or disable unused DBMS components.
#
# Finding Details:
# Unused database components such as extensions,
# procedural languages, or additional packages may
# introduce vulnerabilities or unauthorized functionality.
# Removing unnecessary components reduces the attack
# surface of the DBMS.
#
# Implementation in this Environment:
# The PostgreSQL installation used by the SonarQube
# application includes only approved database extensions,
# procedural languages, and DBMS packages required for
# mission operations.
#
# Unapproved extensions, languages, and software
# components are removed through configuration
# management and package management controls.
#
# Manual Verification Steps:
#
# 1. Verify installed extensions:
#
#       SELECT extname FROM pg_extension;
#
# 2. Verify installed procedural languages:
#
#       SELECT lanname FROM pg_language;
#
# 3. Verify installed PostgreSQL packages:
#
#       rpm -qa | grep postgresql
#
# Comment:
# Only required PostgreSQL components are installed
# for the SonarQube database environment. Unused
# extensions, procedural languages, and DBMS
# software components are removed in accordance
# with organizational hardening standards.
############################################################


############################################################
# Enforcement
############################################################

############################
# Remove Unauthorized Extensions
############################

- name: "V-206550 | Get installed extensions"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -d {{ postgresql_srg_target_database }} -t -A
    -c "SELECT extname FROM pg_extension;"
  register: v206550_ext
  changed_when: false
  tags: ['V-206550','CAT II','check']


- name: "V-206550 | Remove unauthorized extensions"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -d {{ postgresql_srg_target_database }}
    -c "DROP EXTENSION IF EXISTS {{ item }} CASCADE;"
  loop: "{{ v206550_ext.stdout_lines }}"
  when: item not in postgresql_srg_allowed_extensions
  ignore_errors: true
  tags: ['V-206550','CAT II','enforce']


############################
# Remove Unauthorized Procedural Languages
############################

- name: "V-206550 | Get installed languages"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -A
    -c "SELECT lanname FROM pg_language;"
  register: v206550_lang
  changed_when: false
  tags: ['V-206550','CAT II','check']


- name: "V-206550 | Remove unauthorized procedural languages"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "DROP LANGUAGE IF EXISTS {{ item }};"
  loop: "{{ v206550_lang.stdout_lines }}"
  when:
    - item not in postgresql_srg_allowed_languages
    - item not in ['internal','c','sql','plpgsql']
  ignore_errors: true
  tags: ['V-206550','CAT II','enforce']


############################
# Remove Unauthorized PostgreSQL Packages
############################

- name: "V-206550 | Gather installed PostgreSQL packages"
  become: true
  ansible.builtin.shell: |
    rpm -qa --qf '%{NAME}\n' | grep '^postgresql'
  register: v206550_pkgs
  changed_when: false
  tags: ['V-206550','CAT II','check']


- name: "V-206550 | Remove unauthorized PostgreSQL packages"
  become: true
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop: "{{ v206550_pkgs.stdout_lines }}"
  when: item not in postgresql_srg_allowed_packages
  ignore_errors: true
  tags: ['V-206550','CAT II','enforce']