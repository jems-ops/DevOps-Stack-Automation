---
############################################################
# STIG V-206520 Enforcement
# Control: Enterprise Authentication Integration
# Status: NOT A FINDING (Isolated Architecture Model)
############################################################

- name: "V-206520 | Ensure PostgreSQL is not listening on all interfaces"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
  notify: Restart PostgreSQL

############################################################
# Remove Trust Authentication
############################################################

- name: "V-206520 | Remove trust authentication entries"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*host\s+.*\strust\s*$'
    replace: ''
  notify: Reload PostgreSQL

############################################################
# Enforce SCRAM Authentication
############################################################

- name: "V-206520 | Ensure local TCP connections use SCRAM"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32'
    line: 'host    all    all    127.0.0.1/32    scram-sha-256'
    create: false
  notify: Reload PostgreSQL

############################################################
# Audit and Remove Unauthorized Login Roles
############################################################

- name: "V-206520 | Get login roles"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_roles WHERE rolcanlogin = true;"
  register: postgresql_srg_login_roles
  changed_when: false

- name: "V-206520 | Remove unauthorized login roles"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -c "DROP ROLE {{ item }};"
  loop: "{{ postgresql_srg_login_roles.stdout_lines }}"
  when: item not in postgresql_srg_approved_login_roles
  notify: Reload PostgreSQL
