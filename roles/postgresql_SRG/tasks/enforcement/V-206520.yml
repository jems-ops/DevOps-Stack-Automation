---
  #################################################################
  # 1️⃣ Collect Existing Login Roles
  #################################################################

  - name: Collect PostgreSQL login roles
    become: true
    become_user: postgres
    shell: psql -t -c "SELECT rolname FROM pg_roles WHERE rolcanlogin;"
    register: postgresql_srg_roles_raw
    changed_when: false

  - name: Normalize roles
    set_fact:
      postgresql_srg_login_roles: "{{ postgresql_srg_roles_raw.stdout_lines | map('trim') | list }}"

  - name: Identify unauthorized roles
    set_fact:
      postgresql_srg_unauthorized_roles: "{{ postgresql_srg_login_roles | difference(postgresql_srg_approved_local_accounts) }}"

  #################################################################
  # 2️⃣ Remove Unauthorized Roles
  #################################################################

  - name: Drop unauthorized roles
    become: true
    become_user: postgres
    shell: psql -c "DROP ROLE IF EXISTS {{ item }};"
    loop: "{{ postgresql_srg_unauthorized_roles }}"
    when: postgresql_srg_unauthorized_roles | length > 0

  #################################################################
  # 3️⃣ Backup pg_hba.conf (once)
  #################################################################

  - name: Backup pg_hba.conf
    become: true
    copy:
      src: "{{ pg_hba_file }}"
      dest: "{{ pg_hba_file }}.pre_v206520.bak"
      remote_src: true
      force: false

  #################################################################
  # 4️⃣ Configure LDAP Authentication
  #################################################################

  - name: Configure LDAP centralized authentication
    become: true
    blockinfile:
      path: "{{ pg_hba_file }}"
      marker: "# {mark} STIG V-206520 LDAP"
      block: |
        host all all 0.0.0.0/0 ldap ldapserver={{ postgresql_srg_ldap_server }} ldapbasedn="{{ postgresql_srg_ldap_basedn }}" ldapbinddn="{{ postgresql_srg_ldap_binddn }}" ldapbindpasswd={{ postgresql_srg_ldap_bindpw }} {% if postgresql_srg_ldap_tls %}ldaptls=1{% endif %}
    when: postgresql_srg_auth_method == "ldap"
    notify: Restart PostgreSQL

  #################################################################
  # 5️⃣ Configure Kerberos Authentication
  #################################################################

  - name: Configure GSSAPI centralized authentication
    become: true
    blockinfile:
      path: "{{ pg_hba_file }}"
      marker: "# {mark} STIG V-206520 GSS"
      block: |
        host all all 0.0.0.0/0 gss include_realm=1 krb_realm={{ postgresql_srg_kerberos_realm }}
    when: postgresql_srg_auth_method == "gss"
    notify: Restart PostgreSQL

  #################################################################
  # 6️⃣ Remove Trust Authentication
  #################################################################

  - name: Replace trust authentication with reject
    become: true
    replace:
      path: "{{ pg_hba_file }}"
      regexp: '\btrust\b'
      replace: 'reject'
    notify: Restart PostgreSQL
