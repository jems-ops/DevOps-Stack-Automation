---
############################################################
# STIG V-206556 Enforcement
# Remove DB password artifacts
############################################################

- name: "V-206556 | Remove .pgpass files"
  become: true
  ansible.builtin.find:
    paths:
      - /var/lib/pgsql
      - /home
      - /root
    patterns: ".pgpass"
    recurse: true
  register: postgresql_srg_pgpass_files

- name: "V-206556 | Delete discovered .pgpass files"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ postgresql_srg_pgpass_files.files }}"

############################################################
# Remove stored passwords from roles
############################################################

- name: "V-206556 | Identify roles with stored passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword IS NOT NULL;"
  register: postgresql_srg_roles_with_passwords
  changed_when: false

- name: "V-206556 | Remove stored role passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -c "ALTER ROLE {{ item }} PASSWORD NULL;"
  loop: "{{ postgresql_srg_roles_with_passwords.stdout_lines }}"
  when: postgresql_srg_roles_with_passwords.stdout_lines | length > 0

############################################################
# Remove password authentication methods
############################################################

- name: "V-206556 | Remove password authentication from pg_hba.conf"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(host|local).*(md5|scram-sha-256|password)\s*$'
    replace: ''
  notify: Reload PostgreSQL
