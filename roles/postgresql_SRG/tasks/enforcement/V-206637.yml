---
############################################################
# STIG Control: V-206637
#
# Title:
# DBMS must generate audit records for unsuccessful
# attempts to access database objects.
#
# Implementation:
# PostgreSQL auditing uses pgaudit and database logging
# configuration to record failed object access attempts.
#
# Manual Verification Steps:
# 1. Verify pgaudit extension is installed.
# 2. Confirm pgaudit logging configuration.
# 3. Verify error logging is enabled.
# comment: PostgreSQL audit logging is implemented using the pgaudit extension and database logging configuration. Failed access attempts to database objects, including tables, views, procedures, and functions, are captured in audit logs. These logs include permission-denied events and other unsuccessful access attempts, ensuring that unsuccessful object access is auditable.

# status: Not a finding
############################################################

- name: "V-206637 | Check pgaudit extension"
  become: true
  become_user: postgres
  ansible.builtin.command: psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206637','CAT II', 'enforce']

- name: "V-206637 | Display pgaudit status"
  ansible.builtin.debug:
    var: pgaudit_status.stdout
  tags: ['V-206637','CAT II', 'enforce']