---
############################################################
# STIG Control: V-206622
# Audit modification of categories of information
# comment: PostgreSQL auditing is implemented using the pgaudit extension. Data modification operations (INSERT, UPDATE, DELETE) and structural modifications (ALTER statements) are recorded in database audit logs. These records include the timestamp, user identity, and affected object, ensuring that modifications to categories of information are traceable for security monitoring and forensic analysis.
# Status: Not a finding
############################################################

- name: "V-206622 | Ensure pgaudit extension enabled"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?shared_preload_libraries'
    line: "shared_preload_libraries = 'pgaudit'"
  tags: ['V-206622','CAT II', 'enforce']

- name: "V-206622 | Configure audit logging for modifications"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
  tags: ['V-206622','CAT II', 'enforce']