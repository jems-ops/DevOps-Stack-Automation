---
############################################################
# STIG V-206532
# Enforcement - Audit records must contain outcome (success/failure)
############################################################
#
# COMPLIANT WHEN:
# - pgaudit enabled for relevant classes
# - log_min_error_statement = error
# - log_error_verbosity configured
#
# VERIFY:
# SHOW pgaudit.log;
# SHOW log_min_error_statement;
# SHOW log_error_verbosity;
# comment: PostgreSQL is configured to log failed statements and error conditions via log_min_error_statement and pgaudit. Audit records clearly indicate whether events were successful or failed. Therefore, V-206532 is Not a Finding.
############################################################

- name: V-206532 | Ensure pgaudit event classes enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206532
    - cat2

- name: V-206532 | Log failed statements
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_min_error_statement\s*='
    line: "log_min_error_statement = error"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206532
    - cat2

- name: V-206532 | Ensure error verbosity configured
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_error_verbosity\s*='
    line: "log_error_verbosity = default"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206532
    - cat2
