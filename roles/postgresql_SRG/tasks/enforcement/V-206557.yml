---
############################################################
# STIG V-206557 Enforcement
# Encrypt Passwords in Transit
# Status: NOT A FINDING (No Password Transmission)
############################################################

############################################################
# Restrict PostgreSQL to Localhost Only
############################################################

- name: "V-206557 | Restrict listen_addresses to localhost"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
  notify: Restart PostgreSQL

############################################################
# Remove All Password-Based Authentication Methods
############################################################

- name: "V-206557 | Remove md5/scram/password entries"
  become: true
  ansible.builtin.replace:
    path: "{{ postgresql_srg_hba_file }}"
    regexp: '^\s*(host|local).*(md5|scram-sha-256|password)\s*$'
    replace: ''
  notify: Reload PostgreSQL

############################################################
# Enforce Peer Authentication Only
############################################################

- name: "V-206557 | Ensure peer authentication for local access"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_hba_file }}"
    line: "local   all     all     peer"
    create: false
  notify: Reload PostgreSQL
