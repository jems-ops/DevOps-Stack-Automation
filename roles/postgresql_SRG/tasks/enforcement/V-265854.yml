---
############################################################
# STIG V-265854 Enforcement
# Ensure Supported DBMS Version
############################################################

- name: "V-265854 | Gather PostgreSQL version"
  become: true
  ansible.builtin.command: "{{ postgresql_srg_psql_path }} --version"
  register: postgresql_srg_version
  changed_when: false

- name: "V-265854 | Extract major version"
  ansible.builtin.set_fact:
    postgresql_srg_major_version: "{{ (postgresql_srg_version.stdout | regex_search('([0-9]+)\\.', '\\1'))[0] }}"

############################################################
# Define Supported Versions
############################################################

- name: "V-265854 | Define supported PostgreSQL major versions"
  ansible.builtin.set_fact:
    postgresql_srg_supported_versions:
      - "16"
      - "15"   # Include if still supported in your org

############################################################
# Fail if Unsupported Version
############################################################

- name: "V-265854 | Fail if PostgreSQL version unsupported"
  ansible.builtin.fail:
    msg: "Unsupported PostgreSQL major version detected: {{ postgresql_srg_major_version }}"
  when: postgresql_srg_major_version not in postgresql_srg_supported_versions
