---
############################################################
# STIG V-206524
# Enforcement - Restrict Audit Configuration Control
############################################################
#
# COMPLIANT WHEN:
# - Only authorized roles have SUPERUSER
# - PostgreSQL config files owned by postgres
# - Config files not writable by non-admin users
#
# VERIFY BY:
# SELECT rolname, rolsuper FROM pg_roles;
# ls -l postgresql.conf
# ls -l pg_hba.conf
# comment: PostgreSQL audit config is restricted to the postgres admin role.
# No application accounts retain SUPERUSER. Config files are owned/writable
# only by postgres. Therefore, V-206524 is Not a Finding.
############################################################

- name: "V-206524 | Gather SUPERUSER roles"
  become: true
  become_user: postgres
  ansible.builtin.shell: psql -t -A -c "SELECT rolname FROM pg_roles WHERE rolsuper = true;"
  register: v206524_superusers
  changed_when: false
  tags: [V-206524, stig, cat2]

- name: "V-206524 | Remove unauthorized SUPERUSER roles"
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -c "ALTER ROLE {{ item }} NOSUPERUSER;"
  loop: "{{ v206524_superusers.stdout_lines }}"
  when:
    - item not in postgresql_srg_admin_roles
  tags: [V-206524, stig, cat2]

- name: "V-206524 | Ensure postgresql.conf ownership"
  ansible.builtin.file:
    path: "{{ postgresql_srg_conf_file }}"
    owner: postgres
    group: postgres
    mode: '0600'
  tags: [V-206524, stig, cat2]

- name: "V-206524 | Ensure pg_hba.conf ownership"
  ansible.builtin.file:
    path: "{{ postgresql_srg_hba_file }}"
    owner: postgres
    group: postgres
    mode: '0600'
  tags: [V-206524, stig, cat2]
