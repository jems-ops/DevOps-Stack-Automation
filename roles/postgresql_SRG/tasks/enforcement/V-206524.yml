############################################################
# PostgreSQL STIG | V-206524
# Allow designated personnel to select auditable events
############################################################

- name: Ensure pgaudit is enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*shared_preload_libraries\s*='
    line: "shared_preload_libraries = 'pgaudit'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206524

- name: Configure default audit event classes
  become: true
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206524
