############################################################
# PostgreSQL STIG | V-206525
# Audit retrieval of privileges and role memberships
############################################################

- name: Ensure pgaudit is enabled
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*shared_preload_libraries\s*='
    line: "shared_preload_libraries = 'pgaudit'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206525

- name: Configure pgaudit to audit role and read operations
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log\s*='
    line: "pgaudit.log = 'ddl, role, write, read'"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206525

- name: Enable catalog auditing
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*pgaudit\.log_catalog\s*='
    line: "pgaudit.log_catalog = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206525
