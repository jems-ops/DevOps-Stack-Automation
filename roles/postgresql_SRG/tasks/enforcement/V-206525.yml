---
############################################################
# STIG V-206525
# Enforcement - Audit Privilege / Role Retrieval
############################################################
#
# COMPLIANT WHEN:
# - shared_preload_libraries contains pgaudit
# - pgaudit.log includes read + role
# - pgaudit.log_catalog = on
#
# VERIFY:
# SHOW shared_preload_libraries;
# SHOW pgaudit.log;
# SHOW pgaudit.log_catalog;
#
############################################################

############################################################
# Ensure pgaudit in shared_preload_libraries
############################################################

- name: V-206525 | Ensure shared_preload_libraries contains pgaudit
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^shared_preload_libraries\s*='
    line: "shared_preload_libraries = 'pgaudit'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - V-206525
    - stig
    - cat2

############################################################
# Configure pgaudit classes
############################################################

- name: V-206525 | Configure pgaudit log classes
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log\s*='
    line: "pgaudit.log = '{{ postgresql_srg_pgaudit_classes }}'"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - V-206525
    - stig
    - cat2

############################################################
# Enable catalog auditing
############################################################

- name: V-206525 | Enable catalog auditing
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^pgaudit\.log_catalog\s*='
    line: "pgaudit.log_catalog = {{ postgresql_srg_enable_catalog_audit }}"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - V-206525
    - stig
    - cat2
