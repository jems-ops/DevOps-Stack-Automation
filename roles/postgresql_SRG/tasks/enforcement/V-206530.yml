---
############################################################
# STIG V-206530
# Enforcement - Audit records must contain WHERE info
############################################################
#
# COMPLIANT WHEN:
# - log_line_prefix includes:
#   %d (database)
#   %u (user)
#   %r (remote host)
#   %p (process id)
#   %a (application name)
#
# VERIFY:
# SHOW log_line_prefix;
# comment: PostgreSQL is configured with a log_line_prefix that includes database name, user, remote host, process ID, and application name. Audit records contain sufficient information to establish where events occurred. Therefore, V-206530 is Not a Finding.
############################################################

- name: V-206530 | Configure log_line_prefix for location tracking
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgresql_srg_conf_file }}"
    regexp: '^log_line_prefix\s*='
    line: "log_line_prefix = '%m %u %d %r %p %a '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206530
    - cat2
