############################################################
# PostgreSQL STIG | V-206530
# Ensure audit record includes where event occurred
############################################################

- name: Ensure log_line_prefix includes server and database identifiers
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %H %p %u %d %c %h %r %a %e '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206530

