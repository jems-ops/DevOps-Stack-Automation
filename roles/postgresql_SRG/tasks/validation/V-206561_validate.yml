---
############################################################
# STIG V-206561 Validation (Audit Only)
############################################################

############################################################
# Check for .pgpass files
############################################################

- name: "V-206561 | Scan for .pgpass files"
  become: true
  ansible.builtin.find:
    paths:
      - /var/lib/pgsql
      - /home
      - /root
      - /opt
      - /etc
    patterns: ".pgpass"
    recurse: true
  register: postgresql_srg_pgpass_audit
  changed_when: false

- name: "V-206561 | Assert no .pgpass files exist"
  ansible.builtin.assert:
    that:
      - postgresql_srg_pgpass_audit.matched == 0
    fail_msg: ".pgpass file detected"
    success_msg: "No .pgpass files detected"

############################################################
# Check for password strings in configuration files
############################################################

- name: "V-206561 | Search for password= patterns in PostgreSQL configs"
  become: true
  ansible.builtin.shell: |
    grep -Rl 'password=' {{ postgresql_srg_data_dir }}/*.conf /var/lib/pgsql/.pgpass 2>/dev/null || true
  register: postgresql_srg_password_pattern_check
  changed_when: false

- name: "V-206561 | Assert no password patterns in PostgreSQL configs"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_pattern_check.stdout == ""
    fail_msg: "Password string detected in PostgreSQL configuration files"
    success_msg: "No password strings found in PostgreSQL configs"

############################################################
# Check for PGPASSWORD in environment
############################################################

- name: "V-206561 | Check process environment for PGPASSWORD"
  become: true
  ansible.builtin.shell: |
    ps eww -A | grep PGPASSWORD | grep -v grep || true
  register: postgresql_srg_env_check
  changed_when: false

- name: "V-206561 | Assert no PGPASSWORD in process list"
  ansible.builtin.assert:
    that:
      - postgresql_srg_env_check.stdout == ""
    fail_msg: "PGPASSWORD environment variable detected"
    success_msg: "No PGPASSWORD environment variables detected"

############################################################
# Check for stored DB role passwords
############################################################

- name: "V-206561 | Check for stored role passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword IS NOT NULL;"
  register: postgresql_srg_db_password_check
  changed_when: false

- name: "V-206561 | Assert no stored role passwords"
  ansible.builtin.assert:
    that:
      - postgresql_srg_db_password_check.stdout_lines | length == 0
    fail_msg: "Stored DB password detected"
    success_msg: "No stored DB passwords detected"
