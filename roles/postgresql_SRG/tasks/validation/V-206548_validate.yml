---
############################################################
# STIG V-206548
# Validation - DDL role membership verification
############################################################

- name: V-206548 | Get DDL role members
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "
    SELECT m.rolname
    FROM pg_auth_members am
    JOIN pg_roles r ON am.roleid = r.oid
    JOIN pg_roles m ON am.member = m.oid
    WHERE r.rolname='{{ postgresql_srg_ddl_role }}';"
  register: v206548_members
  changed_when: false
  tags:
    - stig
    - V-206548
    - cat2

- name: V-206548 | Assert only authorized DDL users
  ansible.builtin.assert:
    that:
      - v206548_members.stdout_lines | difference(postgresql_srg_authorized_ddl_users) | length == 0
    fail_msg: >
      STIG V-206548 FAILED:
      Unauthorized user has DDL modification privileges.
    success_msg: >
      STIG V-206548 PASSED:
      DDL modification privileges restricted to authorized users.
  tags:
    - stig
    - V-206548
    - cat2
