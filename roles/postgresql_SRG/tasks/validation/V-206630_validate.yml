---
############################################################
# STIG Control: V-206630
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records when successful
# logons or connections occur.
#
# Finding Details:
# Recording successful logon events provides accountability
# and allows administrators to track user access to the
# database system.
#
# Implementation in this Environment:
# PostgreSQL logs successful connection events using the
# log_connections parameter. Log entries include timestamp,
# username, database, and client address information
# through the configured log_line_prefix setting.
#
# Manual Verification Steps:
#
# 1. Verify connection logging:
#
#       SHOW log_connections;
#
# 2. Verify log prefix includes user and client address:
#
#       SHOW log_line_prefix;
#
# 3. Connect to the database using psql and confirm
#    the login event appears in PostgreSQL logs.
#
# Comment:
# PostgreSQL generates audit records for successful database
# connections using the log_connections parameter. These
# records include timestamp, username, database name, and
# client address, providing traceability for database access.
############################################################

- name: "V-206630 | Verify successful login logging"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_connections;"
  register: log_connections_status
  changed_when: false
  tags: ['V-206630','CAT II','check']

- name: "V-206630 | Verify log prefix configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_line_prefix;"
  register: log_prefix
  changed_when: false
  tags: ['V-206630','CAT II','check']

- name: "V-206630 | Display configuration"
  ansible.builtin.debug:
    msg:
      - "log_connections: {{ log_connections_status.stdout }}"
      - "log_line_prefix: {{ log_prefix.stdout }}"
  tags: ['V-206630','CAT II','check']
