---
############################################################
# STIG Control: V-206625
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for unsuccessful
# attempts to delete privileges.
#
# Finding Details:
# Unauthorized attempts to remove privileges or modify
# role memberships must be logged to ensure traceability
# of attempted privilege escalation or misuse.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Privilege and role management operations such as
# REVOKE, ALTER ROLE, and DROP ROLE generate audit
# records in the database logs. Failed attempts to
# remove privileges or modify role membership are
# recorded through PostgreSQL error logging and
# audit events.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify role auditing enabled:
#
#       SHOW pgaudit.log;
#
# 4. Verify error logging configuration:
#
#       SHOW log_min_error_statement;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Privilege management operations such as
# REVOKE, ALTER ROLE, and DROP ROLE generate audit
# records in database logs. Failed attempts to modify
# privileges are recorded through error logging and
# audit events, ensuring traceability of unauthorized
# privilege modification attempts.
############################################################

- name: "V-206625 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206625','CAT II','check']

- name: "V-206625 | Verify pgaudit library loaded"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_loaded
  changed_when: false
  tags: ['V-206625','CAT II','check']

- name: "V-206625 | Verify role auditing configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206625','CAT II','check']

- name: "V-206625 | Verify error logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_min_error_statement;"
  register: error_log_config
  changed_when: false
  tags: ['V-206625','CAT II','check']

- name: "V-206625 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "shared_preload_libraries: {{ pgaudit_loaded.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
      - "log_min_error_statement: {{ error_log_config.stdout }}"
  tags: ['V-206625','CAT II','check']
