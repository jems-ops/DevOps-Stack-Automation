---
############################################################
# STIG V-265854 Validation
# Ensure Supported DBMS Version
############################################################

############################################################
# Gather PostgreSQL Server Version
############################################################

- name: "V-265854 | Get PostgreSQL server version"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SHOW server_version;"
  register: postgresql_srg_server_version
  changed_when: false
  failed_when: false

############################################################
# Extract Major Version
############################################################

- name: "V-265854 | Extract PostgreSQL major version"
  ansible.builtin.set_fact:
    postgresql_srg_major_version: "{{ (postgresql_srg_server_version.stdout | regex_search('^([0-9]+)', '\\1'))[0] }}"

############################################################
# Define Supported Versions
############################################################

- name: "V-265854 | Define supported PostgreSQL versions"
  ansible.builtin.set_fact:
    postgresql_srg_supported_versions:
      - "16"
      - "15"

############################################################
# Display Version Information
############################################################

- name: "V-265854 | Display detected PostgreSQL version"
  ansible.builtin.debug:
    msg:
      - "Detected PostgreSQL version: {{ postgresql_srg_server_version.stdout }}"
      - "Detected major version: {{ postgresql_srg_major_version }}"
      - "Supported versions: {{ postgresql_srg_supported_versions }}"

############################################################
# Validate Supported Version
############################################################

- name: "V-265854 | Assert PostgreSQL version supported"
  ansible.builtin.assert:
    that:
      - postgresql_srg_major_version in postgresql_srg_supported_versions
    fail_msg: "Unsupported PostgreSQL version detected: {{ postgresql_srg_major_version }}"
    success_msg: "PostgreSQL version is supported"
