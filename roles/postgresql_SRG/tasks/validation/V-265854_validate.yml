---
############################################################
# STIG V-265854 Validation (Audit Only)
############################################################

############################################################
# Check PostgreSQL Version
############################################################

- name: "V-265854 | Get PostgreSQL version"
  become: true
  ansible.builtin.command: "{{ postgresql_srg_pg_bin_path }}/psql --version"
  register: postgresql_srg_version_check
  changed_when: false

- name: "V-265854 | Extract major version"
  ansible.builtin.set_fact:
    postgresql_srg_major_version: "{{ (postgresql_srg_version_check.stdout | regex_search('([0-9]+)\\.', '\\1'))[0] }}"

############################################################
# Define Supported Versions
############################################################

- name: "V-265854 | Define supported PostgreSQL major versions"
  ansible.builtin.set_fact:
    postgresql_srg_supported_versions:
      - "16"
      - "15"

############################################################
# Assert Supported Version
############################################################

- name: "V-265854 | Assert PostgreSQL version supported"
  ansible.builtin.assert:
    that:
      - postgresql_srg_major_version in postgresql_srg_supported_versions
    fail_msg: "Unsupported PostgreSQL version detected: {{ postgresql_srg_major_version }}"
    success_msg: "PostgreSQL version {{ postgresql_srg_major_version }} is supported"

############################################################
# Validate PostgreSQL Service Active
############################################################

- name: "V-265854 | Check PostgreSQL service status"
  become: true
  ansible.builtin.service_facts:

- name: "V-265854 | Assert PostgreSQL service running"
  ansible.builtin.assert:
    that:
      - "(postgresql_srg_service_name + '.service') in ansible_facts.services"
    fail_msg: "Service {{ postgresql_srg_service_name }} not found in running services"
    success_msg: "PostgreSQL service {{ postgresql_srg_service_name }} detected"
