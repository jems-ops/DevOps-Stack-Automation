---
############################################################
# STIG V-206555 Validation
############################################################

############################################################
# Validate pg_hba.conf contains no password methods
############################################################

- name: "V-206555 | Check for password authentication methods"
  become: true
  ansible.builtin.shell: |
    grep -v '^\s*#' {{ postgresql_srg_hba_file }} | grep -E '(md5|scram-sha-256|password)' || true
  register: postgresql_srg_password_auth_check
  changed_when: false

- name: "V-206555 | Assert no password authentication configured"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_auth_check.stdout == ""
    fail_msg: "Password-based authentication detected in pg_hba.conf"
    success_msg: "No password authentication configured"

############################################################
# Validate no stored passwords exist
############################################################

- name: "V-206555 | Check for stored role passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword IS NOT NULL;"
  register: postgresql_srg_stored_passwords
  changed_when: false

- name: "V-206555 | Assert no roles have stored passwords"
  ansible.builtin.assert:
    that:
      - postgresql_srg_stored_passwords.stdout_lines | length == 0
    fail_msg: "Stored DB passwords detected"
    success_msg: "No stored DB passwords exist"
