############################################################
# STIG V-206545
# Validation / Audit Tasks
############################################################

- name: V-206545 | Verify postgres OS account shell
  become: true
  shell: "getent passwd {{ postgresql_srg_install_os_account }}"
  register: postgresql_srg_install_shell
  changed_when: false

- name: Assert interactive login is disabled
  assert:
    that:
      - "'{{ postgresql_srg_install_account_shell }}' in postgresql_srg_install_shell.stdout"
    fail_msg: "Installation account shell not restricted"
    success_msg: "Installation account shell properly restricted"

############################################################
# Validate SUPERUSER roles
############################################################

- name: V-206545 | Check for unauthorized superusers
  become: true
  become_user: postgres
  shell: |
    psql -d postgres -t -c "
    SELECT rolname
    FROM pg_roles
    WHERE rolsuper = true
    AND rolname <> 'postgres';"
  register: postgresql_srg_superuser_validation
  changed_when: false

- name: Assert no extra superusers exist
  assert:
    that:
      - postgresql_srg_superuser_validation.stdout | trim == ""
    fail_msg: "Unauthorized SUPERUSER roles detected"
    success_msg: "Only postgres is SUPERUSER"

############################################################
# Validate pgaudit
############################################################

- name: V-206545 | Check shared_preload_libraries
  become: true
  become_user: postgres
  shell: psql -t -c "SHOW shared_preload_libraries;"
  register: postgresql_srg_spl_validation
  changed_when: false

- name: Assert pgaudit loaded
  assert:
    that:
      - "'pgaudit' in postgresql_srg_spl_validation.stdout"
    fail_msg: "pgaudit not enabled"
    success_msg: "pgaudit enabled"

############################################################
# Validate auditd rule exists
############################################################

- name: V-206545 | Verify audit rule file
  become: true
  stat:
    path: /etc/audit/rules.d/postgres.rules
  register: postgresql_srg_audit_rule

- name: Assert audit rule file exists
  assert:
    that:
      - postgresql_srg_audit_rule.stat.exists
    fail_msg: "auditd rules for postgres not configured"
    success_msg: "auditd rules configured"
