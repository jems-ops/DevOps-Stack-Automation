---
############################################################
# STIG V-206570 Validation (Audit Only)
############################################################

############################################################
# Validate Data Directory Permissions
############################################################

- name: "V-206570 | Check data directory permissions"
  become: true
  ansible.builtin.stat:
    path: "{{ postgresql_srg_data_dir }}"
  register: postgresql_srg_data_dir_stat
  changed_when: false

- name: "V-206570 | Assert ownership and permissions"
  ansible.builtin.assert:
    that:
      - postgresql_srg_data_dir_stat.stat.pw_name == "postgres"
      - postgresql_srg_data_dir_stat.stat.gr_name == "postgres"
      - postgresql_srg_data_dir_stat.stat.mode == "0700"
    fail_msg: "Data directory ownership or permissions incorrect"
    success_msg: "Data directory properly secured"

############################################################
# Validate No World-Readable Files
############################################################

- name: "V-206570 | Find world-readable files"
  become: true
  ansible.builtin.shell: |
    find {{ postgresql_srg_data_dir }} -type f -perm -o+r
  register: postgresql_srg_world_readable
  changed_when: false

- name: "V-206570 | Assert no world-readable files"
  ansible.builtin.assert:
    that:
      - postgresql_srg_world_readable.stdout == ""
    fail_msg: "World-readable database files detected"
    success_msg: "No world-readable database files found"

############################################################
# Validate SELinux Mode
############################################################

- name: "V-206570 | Check SELinux status"
  become: true
  ansible.builtin.command: getenforce
  register: postgresql_srg_selinux_check
  changed_when: false

- name: "V-206570 | Assert SELinux enforcing"
  ansible.builtin.assert:
    that:
      - postgresql_srg_selinux_check.stdout == "Enforcing"
    fail_msg: "SELinux is not enforcing"
    success_msg: "SELinux is enforcing"
