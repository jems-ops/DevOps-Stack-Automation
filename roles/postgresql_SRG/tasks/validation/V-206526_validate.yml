---
############################################################
# STIG V-206526
# Validation - Audit FAILED privilege retrieval
############################################################

- name: V-206526 | Gather audit configuration
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SELECT current_setting('pgaudit.log', true)
    UNION ALL SELECT current_setting('pgaudit.log_catalog', true)
    UNION ALL SELECT current_setting('log_min_error_statement');"
  register: postgresql_srg_v206526_settings
  changed_when: false
  tags:
    - stig
    - V-206526
    - cat2

- name: V-206526 | Parse results
  ansible.builtin.set_fact:
    v206526_list: "{{ postgresql_srg_v206526_settings.stdout_lines }}"
  tags:
    - stig
    - V-206526
    - cat2

- name: V-206526 | Identify failure reasons
  ansible.builtin.set_fact:
    v206526_failure_reasons: >-
      {{
        [] +
        (['pgaudit.log missing read'] if 'read' not in v206526_list[0] else []) +
        (['pgaudit.log missing role'] if 'role' not in v206526_list[0] else []) +
        (['pgaudit.log_catalog not enabled'] if 'on' not in v206526_list[1] else []) +
        (['Failed statements not logged'] if 'error' not in v206526_list[2] else [])
      }}
  tags:
    - stig
    - V-206526
    - cat2

- name: V-206526 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206526_failure_reasons | length == 0
    fail_msg: >
      STIG V-206526 FAILED:
      {{ v206526_failure_reasons | join(', ') }}
    success_msg: >
      STIG V-206526 PASSED:
      Failed privilege retrieval attempts are audited.
  tags:
    - stig
    - V-206526
    - cat2
