---
############################################################
# STIG V-206527
# Validation - Session Auditing at Startup
############################################################

- name: V-206527 | Gather session audit settings
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SELECT current_setting('shared_preload_libraries')
    UNION ALL SELECT current_setting('log_connections')
    UNION ALL SELECT current_setting('log_disconnections');"
  register: postgresql_srg_v206527_settings
  changed_when: false
  tags:
    - stig
    - V-206527
    - cat2

- name: V-206527 | Parse results
  ansible.builtin.set_fact:
    v206527_list: "{{ postgresql_srg_v206527_settings.stdout_lines }}"
  tags:
    - stig
    - V-206527
    - cat2

- name: V-206527 | Identify failure reasons
  ansible.builtin.set_fact:
    v206527_failure_reasons: >-
      {{
        [] +
        (['pgaudit not loaded at startup'] if 'pgaudit' not in v206527_list[0] else []) +
        (['log_connections not enabled'] if 'on' not in v206527_list[1] else []) +
        (['log_disconnections not enabled'] if 'on' not in v206527_list[2] else [])
      }}
  tags:
    - stig
    - V-206527
    - cat2

- name: V-206527 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206527_failure_reasons | length == 0
    fail_msg: >
      STIG V-206527 FAILED:
      {{ v206527_failure_reasons | join(', ') }}
    success_msg: >
      STIG V-206527 PASSED:
      Session auditing is active at DBMS startup.
  tags:
    - stig
    - V-206527
    - cat2
