############################################################
# STIG V-206521
# Validation / Audit Tasks
############################################################

############################################################
# Validate PUBLIC revocation
############################################################

- name: V-206521 | Check database ACL
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -t -c \
    "SELECT datacl
     FROM pg_database
     WHERE datname='{{ postgresql_srg_target_database }}';"
  register: postgresql_srg_db_acl
  changed_when: false

- name: Assert PUBLIC does not have database privileges
  assert:
    that:
      - "'=Tc/' not in postgresql_srg_db_acl.stdout"
    fail_msg: "PUBLIC still has database privileges"
    success_msg: "PUBLIC database privileges removed"

############################################################
# Validate schema privileges
############################################################

- name: V-206521 | Check schema ACL
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -t -c \
    "SELECT nspname, nspacl
     FROM pg_namespace
     WHERE nspname IN ({{ postgresql_srg_application_schemas | map('regex_replace', '(.*)', "'\\1'") | join(',') }});"
  register: postgresql_srg_schema_acl
  changed_when: false

- name: Display schema ACL
  debug:
    var: postgresql_srg_schema_acl.stdout_lines

############################################################
# Validate superuser restriction
############################################################

- name: V-206521 | Validate SUPERUSER roles
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -t -c \
    "SELECT rolname
     FROM pg_roles
     WHERE rolsuper = true;"
  register: postgresql_srg_superuser_validation
  changed_when: false

- name: Assert only postgres is SUPERUSER
  assert:
    that:
      - postgresql_srg_superuser_validation.stdout_lines | length == 1
      - "'postgres' in postgresql_srg_superuser_validation.stdout"
    fail_msg: "Unauthorized SUPERUSER roles detected"
    success_msg: "SUPERUSER restriction compliant"

############################################################
# Validate role grants
############################################################

- name: V-206521 | List role table grants
  become: true
  become_user: postgres
  shell: |
    psql -d {{ postgresql_srg_target_database }} -c \
    "SELECT grantee, table_schema, privilege_type
     FROM information_schema.role_table_grants
     ORDER BY grantee;"
  register: postgresql_srg_role_grants
  changed_when: false

- name: Display role grants
  debug:
    var: postgresql_srg_role_grants.stdout_lines
