---
############################################################
# STIG V-233495 Validation (Audit Only)
# Deploy DBMS Compatible with NSA-Approved Cryptography
############################################################

############################################################
# Validate FIPS Mode
############################################################

- name: "V-233495 | Check FIPS status"
  become: true
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: postgresql_srg_fips_check
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-233495 | Assert FIPS enabled"
  ansible.builtin.assert:
    that:
      - postgresql_srg_fips_check.stdout == "1"
    fail_msg: "FIPS mode is NOT enabled"
    success_msg: "FIPS mode is enabled"
  when: postgresql_srg_fips_required | bool

############################################################
# Validate Crypto Policy
############################################################

- name: "V-233495 | Check crypto policy"
  become: true
  ansible.builtin.command: update-crypto-policies --show
  register: postgresql_srg_crypto_policy_check
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-233495 | Assert crypto policy is FIPS"
  ansible.builtin.assert:
    that:
      - "'FIPS' in postgresql_srg_crypto_policy_check.stdout"
    fail_msg: "System crypto policy not set to FIPS"
    success_msg: "System crypto policy set to FIPS"
  when: postgresql_srg_fips_required | bool

############################################################
# Validate No Weak Auth Methods
############################################################

- name: "V-233495 | Check for weak auth methods"
  become: true
  ansible.builtin.shell: |
    grep -v '^\s*#' {{ postgresql_srg_hba_file }} | grep -E '(md5|password)' || true
  register: postgresql_srg_weak_auth_check
  changed_when: false

- name: "V-233495 | Assert no weak auth methods"
  ansible.builtin.assert:
    that:
      - postgresql_srg_weak_auth_check.stdout == ""
    fail_msg: "Weak authentication methods detected in pg_hba.conf"
    success_msg: "No weak authentication methods configured"
