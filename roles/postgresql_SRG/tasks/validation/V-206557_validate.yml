---
############################################################
# STIG V-206557 Validation (Audit Only)
############################################################

############################################################
# Validate listen_addresses
############################################################

- name: "V-206557 | Check listen_addresses"
  become: true
  ansible.builtin.shell: |
    grep -E "^listen_addresses" {{ postgresql_srg_conf_file }}
  register: postgresql_srg_listen_check
  changed_when: false

- name: "V-206557 | Assert localhost-only binding"
  ansible.builtin.assert:
    that:
      - "'localhost' in postgresql_srg_listen_check.stdout"
    fail_msg: "PostgreSQL listening on non-local interfaces"
    success_msg: "PostgreSQL restricted to localhost"

############################################################
# Validate No Password Authentication Methods
############################################################

- name: "V-206557 | Check for password authentication methods"
  become: true
  ansible.builtin.shell: |
    grep -v '^\s*#' {{ postgresql_srg_hba_file }} | grep -E '(md5|scram-sha-256|password)' || true
  register: postgresql_srg_password_check
  changed_when: false

- name: "V-206557 | Assert no password authentication configured"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_check.stdout == ""
    fail_msg: "Password-based authentication detected"
    success_msg: "No password authentication configured"

############################################################
# Validate Port Exposure
############################################################

- name: "V-206557 | Check listening ports"
  become: true
  ansible.builtin.shell: |
    ss -tulnp | grep 5432 || true
  register: postgresql_srg_port_check
  changed_when: false

- name: "V-206557 | Assert PostgreSQL not exposed externally"
  ansible.builtin.assert:
    that:
      - "'127.0.0.1:5432' in postgresql_srg_port_check.stdout"
    fail_msg: "PostgreSQL port exposed beyond localhost"
    success_msg: "PostgreSQL not externally exposed"
