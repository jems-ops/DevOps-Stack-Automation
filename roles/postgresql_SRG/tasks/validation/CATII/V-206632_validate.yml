---
############################################################
# STIG Control: V-206632
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for all privileged
# activities or system-level access.
#
# Finding Details:
# Privileged actions performed within the DBMS must be
# recorded to ensure accountability and detect misuse of
# administrative privileges.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Privileged operations such as CREATE, ALTER, DROP,
# GRANT, REVOKE, and role management are captured in
# audit logs through the pgaudit configuration.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify privileged activity logging enabled:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Privileged operations including CREATE,
# ALTER, DROP, GRANT, REVOKE, and role management are
# recorded in audit logs. This ensures that privileged
# database activities are captured for monitoring and
# forensic analysis.
############################################################

- name: "V-206632 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206632','CAT II','check']

- name: "V-206632 | Verify pgaudit library loaded"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_loaded
  changed_when: false
  tags: ['V-206632','CAT II','check']

- name: "V-206632 | Verify privileged activity logging"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206632','CAT II','check']

- name: "V-206632 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "shared_preload_libraries: {{ pgaudit_loaded.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
  tags: ['V-206632','CAT II','check']