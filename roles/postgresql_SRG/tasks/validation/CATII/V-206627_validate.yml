---
############################################################
# STIG Control: V-206627
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for attempts to
# delete security objects.
#
# Finding Details:
# Logging deletion attempts against security-related
# database objects ensures administrators can detect
# unauthorized attempts to modify database security
# configuration.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Security-related operations such as DROP ROLE,
# REVOKE privileges, DROP SCHEMA, and other privileged
# DDL actions are recorded in audit logs.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify audit classes include role and ddl:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Security-related operations such as DROP
# ROLE, REVOKE, and other privileged DDL actions are
# recorded in audit logs. Both successful and failed
# attempts to delete security objects generate audit
# records containing timestamp, user identity, and
# affected object.
############################################################

- name: "V-206627 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206627','CAT II','check']

- name: "V-206627 | Verify pgaudit library loaded"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_loaded
  changed_when: false
  tags: ['V-206627','CAT II','check']

- name: "V-206627 | Verify security object audit logging"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206627','CAT II','check']

- name: "V-206627 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "shared_preload_libraries: {{ pgaudit_loaded.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
  tags: ['V-206627','CAT II','check']
