---
############################################################
# STIG Control: V-206618
# Validation (Audit Only)
############################################################

############################################################
# 1️⃣ Check pgaudit is loaded
############################################################

- name: "V-206618 | Check shared_preload_libraries"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_lib

- name: "V-206618 | Assert pgaudit enabled"
  ansible.builtin.assert:
    that:
      - "'pgaudit' in pgaudit_lib.stdout"
    fail_msg: "pgaudit is NOT enabled"
    success_msg: "pgaudit is enabled"

############################################################
# 2️⃣ Validate audit configuration
############################################################

- name: "V-206618 | Check pgaudit.log"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_log

- name: "V-206618 | Assert privilege auditing"
  ansible.builtin.assert:
    that:
      - "'all' in pgaudit_log.stdout or 'role' in pgaudit_log.stdout"
    fail_msg: "Audit logging does NOT cover privilege changes"
    success_msg: "Audit logging covers privilege changes"

############################################################
# 3️⃣ Check logging collector
############################################################

- name: "V-206618 | Check logging_collector"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW logging_collector;"
  register: logging_collector

- name: "V-206618 | Assert logging enabled"
  ansible.builtin.assert:
    that:
      - "'on' in logging_collector.stdout"
    fail_msg: "logging_collector is OFF"
    success_msg: "logging_collector is ON"

############################################################
# 4️⃣ Check for audit logs
############################################################

- name: "V-206618 | Check for audit entries"
  ansible.builtin.shell: >
    grep -i "AUDIT" {{ postgresql_srg_log_dir | default('/var/lib/pgsql') }}/*/data/log/* 2>/dev/null | tail -n 5
  register: audit_logs
  ignore_errors: true

- name: "V-206618 | Warn if no logs found"
  ansible.builtin.debug:
    msg: "No audit logs found — run GRANT/REVOKE test"
  when: audit_logs.stdout_lines | length == 0

############################################################
# 5️⃣ Final assertion
############################################################

- name: "V-206618 | Final compliance check"
  ansible.builtin.assert:
    that:
      - "'pgaudit' in pgaudit_lib.stdout"
      - "'on' in logging_collector.stdout"
    fail_msg: "System is NOT compliant with V-206618"
    success_msg: "System is compliant with V-206618"
