---
############################################################
# STIG Control: V-263603
#
# Validation:
# Verify database roles are managed and disabled through
# centralized identity management processes.
############################################################

- name: "V-263603 | Check PostgreSQL roles"
  become: true
  become_user: postgres
  ansible.builtin.command: psql -t -c "SELECT rolname, rolvaliduntil FROM pg_roles;"
  register: role_expiration
  changed_when: false
  tags: ['V-203603', 'CAT II', 'validate']

- name: "V-263603 | Display role expiration settings"
  ansible.builtin.debug:
    var: role_expiration.stdout_lines
  tags: ['V-203603', 'CAT II', 'validate']
