---
############################################################
# STIG V-206534
# Validation - Detailed audit information present
############################################################

- name: V-206534 | Gather audit configuration
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SELECT current_setting('pgaudit.log', true)
    UNION ALL SELECT current_setting('pgaudit.log_parameter', true)
    UNION ALL SELECT current_setting('log_error_verbosity')
    UNION ALL SELECT current_setting('log_statement');"
  register: postgresql_srg_v206534_settings
  changed_when: false
  tags:
    - stig
    - V-206534
    - cat2

- name: V-206534 | Parse results
  ansible.builtin.set_fact:
    v206534_settings_list: "{{ postgresql_srg_v206534_settings.stdout_lines }}"
  tags:
    - stig
    - V-206534
    - cat2

- name: V-206534 | Identify failure reasons
  ansible.builtin.set_fact:
    v206534_failures: >-
      {{
        [] +
        (['pgaudit not configured'] if v206534_settings_list[0] == '' else []) +
        (['Parameters not logged'] if 'on' not in v206534_settings_list[1] else []) +
        (['Error verbosity not verbose'] if 'verbose' not in v206534_settings_list[2] else []) +
        (['DDL logging not enabled'] if 'ddl' not in v206534_settings_list[3] else [])
      }}
  tags:
    - stig
    - V-206534
    - cat2

- name: V-206534 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206534_failures | length == 0
    fail_msg: >
      STIG V-206534 FAILED:
      {{ v206534_failures | join(', ') }}
    success_msg: >
      STIG V-206534 PASSED:
      Detailed audit information is captured.
  tags:
    - stig
    - V-206534
    - cat2
