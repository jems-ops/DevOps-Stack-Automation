---
############################################################
# STIG V-206531
# Validation - Audit records contain SOURCE information
############################################################

- name: V-206531 | Gather source logging settings
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SELECT current_setting('log_line_prefix')
    UNION ALL SELECT current_setting('log_hostname');"
  register: postgresql_srg_v206531_settings
  changed_when: false
  tags:
    - stig
    - V-206531
    - cat2

- name: V-206531 | Parse results
  ansible.builtin.set_fact:
    v206531_list: "{{ postgresql_srg_v206531_settings.stdout_lines }}"
  tags:
    - stig
    - V-206531
    - cat2

- name: V-206531 | Identify failure reasons
  ansible.builtin.set_fact:
    v206531_failure_reasons: >-
      {{
        [] +
        (['Remote host (%r) missing'] if '%r' not in v206531_list[0] else []) +
        (['Application name (%a) missing'] if '%a' not in v206531_list[0] else []) +
        (['log_hostname not enabled'] if 'on' not in v206531_list[1] else [])
      }}
  tags:
    - stig
    - V-206531
    - cat2

- name: V-206531 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206531_failure_reasons | length == 0
    fail_msg: >
      STIG V-206531 FAILED:
      {{ v206531_failure_reasons | join(', ') }}
    success_msg: >
      STIG V-206531 PASSED:
      Audit records contain source/origin information.
  tags:
    - stig
    - V-206531
    - cat2
