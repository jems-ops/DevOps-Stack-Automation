---
############################################################
# STIG Control: V-206633
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records when attempted
# privileged actions are prevented.
#
# Finding Details:
# Unauthorized attempts to perform privileged actions
# must be recorded to ensure administrators can detect
# attempted privilege escalation or misuse of the DBMS.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Failed privileged actions such as CREATE, ALTER, DROP,
# GRANT, and REVOKE generate permission-denied errors
# which are captured in PostgreSQL logs and audit records.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit logs privileged operations:
#
#       SHOW pgaudit.log;
#
# 3. Verify error logging configuration:
#
#       SHOW log_min_error_statement;
#
# Comment:
# PostgreSQL records attempted privileged actions through
# database logging and the pgaudit extension. Failed
# administrative operations such as CREATE, ALTER, DROP,
# GRANT, and REVOKE generate audit records when permission
# checks fail, ensuring traceability of prevented
# privileged actions.
############################################################

- name: "V-206633 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206633','CAT II','check']

- name: "V-206633 | Verify pgaudit logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206633','CAT II','check']

- name: "V-206633 | Verify error logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_min_error_statement;"
  register: error_log_config
  changed_when: false
  tags: ['V-206633','CAT II','check']

- name: "V-206633 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
      - "log_min_error_statement: {{ error_log_config.stdout }}"
  tags: ['V-206633','CAT II','check']
