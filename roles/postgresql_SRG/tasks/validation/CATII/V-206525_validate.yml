---
############################################################
# STIG V-206525
# Validation - Audit Privilege Retrieval
############################################################

- name: V-206525 | Gather audit settings
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SELECT current_setting('shared_preload_libraries')
    UNION ALL SELECT current_setting('pgaudit.log', true)
    UNION ALL SELECT current_setting('pgaudit.log_catalog', true);"
  register: postgresql_srg_v206525_settings
  changed_when: false
  tags:
    - V-206525
    - stig
    - cat2

- name: V-206525 | Parse settings
  ansible.builtin.set_fact:
    v206525_list: "{{ postgresql_srg_v206525_settings.stdout_lines }}"
  tags:
    - V-206525
    - stig
    - cat2

- name: V-206525 | Identify non-compliance
  ansible.builtin.set_fact:
    v206525_failure_reasons: >-
      {{
        [] +
        (['pgaudit not enabled'] if 'pgaudit' not in v206525_list[0] else []) +
        (['pgaudit.log missing read'] if 'read' not in v206525_list[1] else []) +
        (['pgaudit.log missing role'] if 'role' not in v206525_list[1] else []) +
        (['pgaudit.log_catalog not enabled'] if 'on' not in v206525_list[2] else [])
      }}
  tags:
    - V-206525
    - stig
    - cat2

- name: V-206525 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206525_failure_reasons | length == 0
    fail_msg: >
      STIG V-206525 FAILED:
      {{ v206525_failure_reasons | join(', ') }}
    success_msg: >
      STIG V-206525 PASSED:
      Privilege and role retrieval auditing properly configured.
  tags:
    - V-206525
    - stig
    - cat2
