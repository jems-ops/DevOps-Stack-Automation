############################################################
# STIG Control: V-206638 Validation
############################################################

- name: "V-206638 | Verify audit logging configuration"
  become_user: postgres
  ansible.builtin.command: psql -t -c "SHOW log_connections;"
  register: log_connections_status
  changed_when: false
  tags: ['V-206638', 'CAT II', 'validate']

- name: "V-206638 | Display connection logging status"
  ansible.builtin.debug:
    var: log_connections_status.stdout
  tags: ['V-206638', 'CAT II', 'validate']
