---
############################################################
# STIG Control: V-206580
# Status: NOT A FINDING
#
# Title:
# The DBMS must automatically terminate database sessions
# after a defined period of inactivity.
#
# Finding Details:
# Inactive sessions may allow unauthorized users to
# continue operating under an authenticated session if
# the original user leaves the workstation unattended.
# Automatic termination limits the window of opportunity
# for session hijacking or misuse.
#
# Implementation in this Environment:
# PostgreSQL enforces automatic termination of inactive
# sessions through the following configuration parameters:
#
#   idle_session_timeout
#   idle_in_transaction_session_timeout
#   statement_timeout
#
# These parameters ensure inactive sessions, long-running
# idle transactions, and excessive query execution times
# are automatically terminated according to organizational
# security policy.
#
# Manual Verification Steps:
#
# 1. Verify session timeout settings:
#
#       SHOW idle_session_timeout;
#       SHOW idle_in_transaction_session_timeout;
#       SHOW statement_timeout;
#
# 2. Confirm values meet organizational policy.
#
# Comment:
# PostgreSQL is configured to automatically terminate
# inactive sessions and long-running idle transactions
# using built-in timeout parameters. This configuration
# ensures sessions cannot remain active indefinitely and
# reduces the risk of unauthorized session reuse.
############################################################

- name: "V-206580 | Check idle session timeout"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW idle_session_timeout;"
  register: idle_session_timeout
  changed_when: false
  tags: ['V-206580', 'CAT II', 'check']

- name: "V-206580 | Check idle transaction timeout"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW idle_in_transaction_session_timeout;"
  register: idle_tx_timeout
  changed_when: false
  tags: ['V-206580', 'CAT II', 'check']

- name: "V-206580 | Check statement timeout"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW statement_timeout;"
  register: statement_timeout
  changed_when: false
  tags: ['V-206580', 'CAT II', 'check']

- name: "V-206580 | Display session timeout configuration"
  ansible.builtin.debug:
    msg:
      - "idle_session_timeout: {{ idle_session_timeout.stdout }}"
      - "idle_in_transaction_session_timeout: {{ idle_tx_timeout.stdout }}"
      - "statement_timeout: {{ statement_timeout.stdout }}"
  tags: ['V-206580', 'CAT II', 'check']
