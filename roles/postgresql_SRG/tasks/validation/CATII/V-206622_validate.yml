---
############################################################
# STIG Control: V-206622
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records when categories
# of information are modified.
#
# Finding Details:
# Logging modifications to database information allows
# administrators to detect unauthorized changes and
# perform forensic analysis of database activity.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Data modification operations (INSERT, UPDATE, DELETE)
# and structural modifications (ALTER statements) are
# captured in audit logs.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify modification auditing enabled:
#
#       SHOW pgaudit.log;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Data modification operations such as INSERT,
# UPDATE, DELETE, and ALTER statements generate audit
# records containing timestamp, user identity, and
# affected object information.
############################################################

- name: "V-206622 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206622', 'CAT II', 'check']

- name: "V-206622 | Verify pgaudit library loaded"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_loaded
  changed_when: false
  tags: ['V-206622', 'CAT II', 'check']

- name: "V-206622 | Verify modification auditing"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206622', 'CAT II', 'check']

- name: "V-206622 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "shared_preload_libraries: {{ pgaudit_loaded.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
  tags: ['V-206622', 'CAT II', 'check']
