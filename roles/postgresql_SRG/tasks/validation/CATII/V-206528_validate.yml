---
############################################################
# STIG V-206528
# Validation - Audit record contains event type information
############################################################

- name: V-206528 | Gather audit configuration
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SELECT current_setting('pgaudit.log', true)
    UNION ALL SELECT current_setting('pgaudit.log_catalog', true)
    UNION ALL SELECT current_setting('log_line_prefix');"
  register: postgresql_srg_v206528_settings
  changed_when: false
  tags:
    - stig
    - V-206528
    - cat2

- name: V-206528 | Parse results
  ansible.builtin.set_fact:
    v206528_list: "{{ postgresql_srg_v206528_settings.stdout_lines }}"
  tags:
    - stig
    - V-206528
    - cat2

- name: V-206528 | Identify failure reasons
  ansible.builtin.set_fact:
    v206528_failure_reasons: >-
      {{
        [] +
        (['pgaudit event classes not configured'] if 'ddl' not in v206528_list[0] else []) +
        (['catalog auditing disabled'] if 'on' not in v206528_list[1] else []) +
        (['log_line_prefix missing timestamp'] if '%m' not in v206528_list[2] else []) +
        (['log_line_prefix missing user'] if '%u' not in v206528_list[2] else []) +
        (['log_line_prefix missing database'] if '%d' not in v206528_list[2] else [])
      }}
  tags:
    - stig
    - V-206528
    - cat2

- name: V-206528 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206528_failure_reasons | length == 0
    fail_msg: >
      STIG V-206528 FAILED:
      {{ v206528_failure_reasons | join(', ') }}
    success_msg: >
      STIG V-206528 PASSED:
      Audit records contain sufficient event type and forensic information.
  tags:
    - stig
    - V-206528
    - cat2
