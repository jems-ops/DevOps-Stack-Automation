---
############################################################
# STIG Control: V-206538
# Validation Only
#
# Title:
# The DBMS must protect audit information from
# unauthorized read access.
#
# Finding Details:
# Audit logs contain sensitive security information and
# must be protected from unauthorized read access.
#
# Validation Checks:
# 1. Log directory ownership
# 2. Log directory permissions (0700)
# 3. Log file ownership
# 4. Log file permissions (0600)
############################################################


############################################################
# Validate Log Directory
############################################################

- name: "V-206538 | Check PostgreSQL log directory"
  ansible.builtin.stat:
    path: "{{ postgresql_srg_log_directory }}"
  register: v206538_log_dir
  tags: ['V-206538', 'CAT II', 'check']


- name: "V-206538 | Assert log directory permissions"
  ansible.builtin.assert:
    that:
      - v206538_log_dir.stat.exists
      - v206538_log_dir.stat.isdir
      - v206538_log_dir.stat.pw_name == "postgres"
      - v206538_log_dir.stat.mode == "0700"
    fail_msg: >
      STIG V-206538 FAILED:
      PostgreSQL log directory permissions allow unauthorized read access.
    success_msg: >
      PostgreSQL log directory correctly restricted.
  tags: ['V-206538', 'CAT II', 'check']


############################################################
# Validate Log Files
############################################################

- name: "V-206538 | Find PostgreSQL log files"
  ansible.builtin.find:
    paths: "{{ postgresql_srg_log_directory }}"
    file_type: file
  register: v206538_logs
  tags: ['V-206538', 'CAT II', 'check']


- name: "V-206538 | Validate log file permissions"
  ansible.builtin.assert:
    that:
      - item.pw_name == "postgres"
      - item.mode == "0600"
    fail_msg: >
      STIG V-206538 FAILED:
      Log file {{ item.path }} allows unauthorized read access.
    success_msg: >
      Log file {{ item.path }} permissions are compliant.
  loop: "{{ v206538_logs.files }}"
  when: v206538_logs.matched > 0
  tags: ['V-206538', 'CAT II', 'check']
