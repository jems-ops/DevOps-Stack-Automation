---
############################################################
# STIG Control Validation: V-263618
# Purpose:
# Validate that PostgreSQL maintenance access occurs
# through controlled administrative paths.
############################################################

- name: "V-263618 | Check PostgreSQL listening interfaces"
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -t -c "SHOW listen_addresses;"
  register: v263618_listen_addresses
  changed_when: false
  tags:
    - V-263618
    - CATII
    - validate


- name: "V-263618 | Check PostgreSQL listening ports"
  ansible.builtin.command:
    cmd: ss -plnt
  register: v263618_ports
  changed_when: false
  tags:
    - V-263618
    - CATII
    - validate


- name: "V-263618 | Verify SSH service running"
  ansible.builtin.service_facts:
  tags:
    - V-263618
    - CATII
    - validate


- name: "V-263618 | Assert SSH service active"
  ansible.builtin.assert:
    that:
      - "'sshd.service' in ansible_facts.services"
      - "ansible_facts.services['sshd.service'].state == 'running'"
    fail_msg: "STIG V-263618 FAILED - SSH service not running"
    success_msg: "STIG V-263618 PASSED - SSH service active"
  tags:
    - V-263618
    - CATII
    - validate
