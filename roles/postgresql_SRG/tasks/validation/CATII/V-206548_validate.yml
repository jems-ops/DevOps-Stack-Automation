---
############################################################
# STIG V-206548
# Validation - DDL role membership verification
############################################################

- name: "V-206548 | Check schema privileges"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -d {{ postgresql_srg_target_database }}
    -t -c "\dn+ public"
  register: schema_privs
  changed_when: false
  tags: ['V-206548', 'CAT II', 'check']


- name: "V-206548 | Check DDL role members"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "
    SELECT r.rolname
    FROM pg_auth_members m
    JOIN pg_roles r ON m.member = r.oid
    WHERE m.roleid =
    (SELECT oid FROM pg_roles WHERE rolname='{{ postgresql_srg_ddl_role }}');"
  register: ddl_members
  changed_when: false
  tags: ['V-206548', 'CAT II', 'check']


- name: "V-206548 | Display validation results"
  ansible.builtin.debug:
    msg:
      - "Public schema privileges: {{ schema_privs.stdout }}"
      - "DDL role members: {{ ddl_members.stdout_lines }}"
  tags: ['V-206548', 'CAT II', 'check']
