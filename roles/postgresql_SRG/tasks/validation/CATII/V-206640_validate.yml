---
############################################################
# STIG Control: V-206640 Validation
############################################################

- name: "V-206640 | Check PostgreSQL password hashing"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW password_encryption;"
  register: password_encryption
  changed_when: false
  tags: ['V-206640', 'CAT II', 'validate']

- name: "V-206640 | Display hashing configuration"
  ansible.builtin.debug:
    var: password_encryption.stdout
  tags: ['V-206640', 'CAT II', 'validate']
