---
############################################################
# STIG V-206530
# Validation - Audit records contain WHERE information
############################################################

- name: V-206530 | Check log_line_prefix
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SHOW log_line_prefix;"
  register: postgresql_srg_v206530_prefix
  changed_when: false
  tags:
    - stig
    - V-206530
    - cat2

- name: V-206530 | Identify failure reasons
  ansible.builtin.set_fact:
    v206530_failure_reasons: >-
      {{
        [] +
        (['Database (%d) missing'] if '%d' not in postgresql_srg_v206530_prefix.stdout else []) +
        (['User (%u) missing'] if '%u' not in postgresql_srg_v206530_prefix.stdout else []) +
        (['Remote host (%r) missing'] if '%r' not in postgresql_srg_v206530_prefix.stdout else []) +
        (['Process ID (%p) missing'] if '%p' not in postgresql_srg_v206530_prefix.stdout else []) +
        (['Application name (%a) missing'] if '%a' not in postgresql_srg_v206530_prefix.stdout else [])
      }}
  tags:
    - stig
    - V-206530
    - cat2

- name: V-206530 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206530_failure_reasons | length == 0
    fail_msg: >
      STIG V-206530 FAILED:
      {{ v206530_failure_reasons | join(', ') }}
    success_msg: >
      STIG V-206530 PASSED:
      Audit records include sufficient location information.
  tags:
    - stig
    - V-206530
    - cat2
