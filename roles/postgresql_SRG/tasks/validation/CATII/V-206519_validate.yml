---
############################################################
# STIG Control Validation: V-206519
#
# Purpose:
# Validate that PostgreSQL roles have connection limits
# configured according to organizational policy.
############################################################

- name: "V-206519 | Query role connection limits"
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -t -c "SELECT rolname, rolconnlimit FROM pg_roles;"
  register: v206519_conn_limits
  changed_when: false
  tags:
    - V-206519
    - CATII
    - validate


- name: "V-206519 | Display role connection limits"
  ansible.builtin.debug:
    var: v206519_conn_limits.stdout_lines
  tags:
    - V-206519
    - CATII
    - validate
