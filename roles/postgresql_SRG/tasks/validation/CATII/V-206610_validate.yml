############################################################
# VALIDATION (GENERIC + FUTURE-PROOF)
############################################################

- name: "V-206610 | Validate current PostgreSQL version"
  ansible.builtin.assert:
    that:
      - v206610_major_version is match('^[0-9]+$')
    fail_msg: "Unable to determine PostgreSQL version"
    success_msg: "PostgreSQL version detected: {{ v206610_major_version }}"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206610', 'CAT-II', 'validate', 'postgres', 'stig']
############################################################
# Check obsolete packages
############################################################

- name: "V-206610 | Assert no obsolete packages"
  ansible.builtin.assert:
    that:
      - v206610_old_pkgs | length == 0
    fail_msg: >
      STIG V-206610 FAILED:
      Obsolete packages detected: {{ v206610_old_pkgs }}
    success_msg: "No obsolete PostgreSQL packages detected"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206610', 'CAT-II', 'validate', 'postgres', 'stig']
############################################################
# Check binary directories
############################################################

- name: "V-206610 | Find PostgreSQL binaries"
  ansible.builtin.find:
    paths: /usr
    patterns: "pgsql-*"
    file_type: directory
    recurse: false
  register: v206610_bin_dirs
  changed_when: false
  tags: ['V-206610', 'validate']
- name: "V-206610 | Detect obsolete binaries"
  ansible.builtin.set_fact:
    v206610_old_bins: >-
      {{
        v206610_bin_dirs.files
        | map(attribute='path')
        | reject('search', v206610_major_version)
        | list
      }}
  tags: ['V-206610', 'validate']
- name: "V-206610 | Assert no obsolete binaries"
  ansible.builtin.assert:
    that:
      - v206610_old_bins | length == 0
    fail_msg: "Obsolete binaries detected: {{ v206610_old_bins }}"
    success_msg: "No obsolete binaries found"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206610', 'validate']
############################################################
# Check data directories
############################################################

- name: "V-206610 | Find data directories"
  ansible.builtin.find:
    paths: /var/lib/pgsql
    file_type: directory
    recurse: false
  register: v206610_data_dirs
  changed_when: false
  tags: ['V-206610', 'validate']
- name: "V-206610 | Detect obsolete data directories"
  ansible.builtin.set_fact:
    v206610_old_data: >-
      {{
        v206610_data_dirs.files
        | map(attribute='path')
        | reject('search', v206610_major_version)
        | list
      }}
  tags: ['V-206610', 'validate']
- name: "V-206610 | Assert no obsolete data directories"
  ansible.builtin.assert:
    that:
      - v206610_old_data | length == 0
    fail_msg: "Obsolete data directories detected: {{ v206610_old_data }}"
    success_msg: "No obsolete data directories found"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206610', 'validate']
############################################################
# SUMMARY (AUDIT FRIENDLY)
############################################################

- name: "V-206610 | Summary"
  ansible.builtin.debug:
    msg: |
      Current Version: {{ v206610_major_version }}
      Obsolete Packages: {{ v206610_old_pkgs }}
      Obsolete Binaries: {{ v206610_old_bins | default([]) }}
      Obsolete Data Dirs: {{ v206610_old_data | default([]) }}
  changed_when: false
  tags: ['V-206610', 'validate', 'summary']
