---
############################################################
# STIG Control: V-206554
# Status: NOT A FINDING
#
# Title:
# The DBMS must uniquely identify and authenticate
# organizational users.
#
# Finding Details:
# Unique identification and authentication ensure that
# actions performed within the DBMS can be traced to an
# individual user or authorized service account. Shared
# or anonymous accounts may prevent accountability and
# enable unauthorized access.
#
# Implementation in this Environment:
# PostgreSQL serves as the backend database for the
# SonarQube application. End users do not authenticate
# directly to the DBMS.
#
# User authentication occurs at the application layer
# through the enterprise identity provider (Keycloak SSO),
# which uniquely identifies each user.
#
# PostgreSQL access is restricted to application service
# accounts, ensuring database actions remain traceable
# through application-level user identity and database
# role mapping.
#
# Manual Verification Steps:
#
# 1. Verify PostgreSQL roles:
#
#       SELECT rolname FROM pg_roles;
#
# 2. Confirm users do not authenticate directly to
#    PostgreSQL.
#
# 3. Verify application authentication occurs through
#    the enterprise identity provider (Keycloak).
#
# Comment:
# Unique user identification is implemented through the
# centralized identity provider used by the SonarQube
# application. PostgreSQL is accessed only by application
# service accounts, ensuring all database activity remains
# traceable to authenticated application users.
############################################################

- name: "V-206554 | Verify PostgreSQL roles"
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT rolname FROM pg_roles;"
  register: postgres_roles
  changed_when: false
  tags: ['V-206554', 'CAT II', 'check']

- name: "V-206554 | Display PostgreSQL roles"
  ansible.builtin.debug:
    var: postgres_roles.stdout_lines
  tags: ['V-206554', 'CAT II', 'check']
