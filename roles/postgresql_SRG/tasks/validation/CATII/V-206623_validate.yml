---
############################################################
# STIG Control: V-206623
# Status : NOT A FINDING
#
# Title:
# DBMS must generate audit records for failed attempts
# to modify categories of information.
#
# Finding Details:
# Unauthorized attempts to modify database objects must
# be logged to ensure traceability of attempted changes
# to protected data or structures.
#
# Implementation in this Environment:
# PostgreSQL auditing is implemented using the pgaudit
# extension and database logging configuration.
#
# Modification operations such as ALTER statements and
# updates to protected objects are captured in audit logs.
# Failed attempts generate error entries recorded by
# PostgreSQL logging.
#
# Manual Verification Steps:
#
# 1. Verify pgaudit extension installed:
#
#       SELECT extname FROM pg_extension WHERE extname='pgaudit';
#
# 2. Verify pgaudit library loaded:
#
#       SHOW shared_preload_libraries;
#
# 3. Verify modification auditing enabled:
#
#       SHOW pgaudit.log;
#
# 4. Verify error logging configuration:
#
#       SHOW log_min_error_statement;
#
# Comment:
# PostgreSQL auditing is implemented using the pgaudit
# extension. Modification operations such as ALTER
# statements and updates to protected objects generate
# audit records. Failed modification attempts produce
# error log entries ensuring unauthorized changes are
# traceable.
############################################################

- name: "V-206623 | Verify pgaudit extension installed"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SELECT extname FROM pg_extension WHERE extname='pgaudit';"
  register: pgaudit_status
  changed_when: false
  tags: ['V-206623','CAT II','check']

- name: "V-206623 | Verify pgaudit library loaded"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW shared_preload_libraries;"
  register: pgaudit_loaded
  changed_when: false
  tags: ['V-206623','CAT II','check']

- name: "V-206623 | Verify modification auditing"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW pgaudit.log;"
  register: pgaudit_config
  changed_when: false
  tags: ['V-206623','CAT II','check']

- name: "V-206623 | Verify error logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: >
    psql -t -c "SHOW log_min_error_statement;"
  register: error_log_config
  changed_when: false
  tags: ['V-206623','CAT II','check']

- name: "V-206623 | Display audit configuration"
  ansible.builtin.debug:
    msg:
      - "pgaudit extension: {{ pgaudit_status.stdout }}"
      - "shared_preload_libraries: {{ pgaudit_loaded.stdout }}"
      - "pgaudit.log: {{ pgaudit_config.stdout }}"
      - "log_min_error_statement: {{ error_log_config.stdout }}"
  tags: ['V-206623','CAT II','check']
