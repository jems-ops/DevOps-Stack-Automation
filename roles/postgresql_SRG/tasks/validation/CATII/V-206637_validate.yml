---
############################################################
# STIG Control: V-206637 Validation
############################################################

- name: "V-206637 | Verify error logging configuration"
  become: true
  become_user: postgres
  ansible.builtin.command: psql -t -c "SHOW log_min_error_statement;"
  register: error_logging
  changed_when: false
  tags: ['V-206637', 'CAT II', 'validate']

- name: "V-206637 | Display error logging setting"
  ansible.builtin.debug:
    var: error_logging.stdout
  tags: ['V-206637', 'CAT II', 'validate']
