---
############################################################
# STIG V-206520 Validation (Audit Only)
############################################################

############################################################
# Validate listen_addresses
############################################################

- name: "V-206520 | Validate listen_addresses"
  become: true
  ansible.builtin.shell: |
    grep -E "^listen_addresses" {{ postgresql_srg_conf_file }}
  register: postgresql_srg_listen_check
  changed_when: false

- name: "V-206520 | Assert listen_addresses restricted"
  ansible.builtin.assert:
    that:
      - "'localhost' in postgresql_srg_listen_check.stdout"
    fail_msg: "PostgreSQL is listening on non-local interfaces"
    success_msg: "PostgreSQL correctly restricted to localhost"

############################################################
# Validate No Trust Authentication
############################################################

- name: "V-206520 | Check for trust authentication"
  become: true
  ansible.builtin.shell: |
    grep -i trust {{ postgresql_srg_hba_file }} || true
  register: postgresql_srg_trust_check
  changed_when: false

- name: "V-206520 | Assert no trust authentication"
  ansible.builtin.assert:
    that:
      - postgresql_srg_trust_check.stdout == ""
    fail_msg: "Trust authentication detected in pg_hba.conf"
    success_msg: "No trust authentication configured"

############################################################
# Validate Login Roles
############################################################

- name: "V-206520 | Get login roles"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_roles WHERE rolcanlogin = true;"
  register: postgresql_srg_login_roles_audit
  changed_when: false

- name: "V-206520 | Assert only approved login roles exist"
  ansible.builtin.assert:
    that:
      - item in postgresql_srg_approved_login_roles
    fail_msg: "Unauthorized login role detected: {{ item }}"
    success_msg: "All login roles approved"
  loop: "{{ postgresql_srg_login_roles_audit.stdout_lines }}"
