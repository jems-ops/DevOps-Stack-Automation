############################################################
# Validation for V-206519
############################################################

- name: Create test role
  become: true
  become_user: postgres
  ansible.builtin.command: psql -tAc "CREATE ROLE stig_validate_role;"
  failed_when: false

- name: Attempt unauthorized parameter change
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -c "SET ROLE stig_validate_role; SET pgaudit.role='invalid';"
  failed_when: false

- name: Check denial logged
  become: true
  ansible.builtin.shell: |
    grep -i 'permission denied to set parameter "pgaudit.role"' {{ postgresql_srg_data_dir }}/log/* | tail -1
  register: validation_check
  changed_when: false
  failed_when: validation_check.stdout == ""
