---
############################################################
# STIG V-206556
# Validation Tasks
############################################################

############################################################
# Validate password encryption configuration
############################################################

- name: "V-206556 | Check password_encryption setting"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SHOW password_encryption;"
  register: postgresql_srg_password_encryption
  changed_when: false

- name: "Assert SCRAM password hashing enabled"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_encryption.stdout is search("scram-sha-256")
    fail_msg: "SCRAM password hashing not enabled"
    success_msg: "SCRAM password hashing confirmed"

############################################################
# Validate no MD5 authentication present
############################################################

- name: "V-206556 | Check for md5 authentication"
  become: true
  ansible.builtin.shell: |
    grep -v '^\s*#' {{ postgresql_srg_hba_file }} | grep -iw md5 || true
  register: postgresql_srg_md5_auth_check
  changed_when: false

- name: "Assert MD5 authentication disabled"
  ansible.builtin.assert:
    that:
      - postgresql_srg_md5_auth_check.stdout | trim == ""
    fail_msg: "MD5 authentication detected"
    success_msg: "MD5 authentication disabled"

############################################################
# Validate password hashes
############################################################

- name: "V-206556 | Check password hash types"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolpassword FROM pg_authid WHERE rolpassword IS NOT NULL;"
  register: postgresql_srg_password_hashes
  changed_when: false

- name: "Assert only SCRAM hashes exist"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_hashes.stdout is search("SCRAM-SHA-256") or postgresql_srg_password_hashes.stdout | trim == ""
    fail_msg: "Non-SCRAM password hashes detected"
    success_msg: "All password hashes are SCRAM"
