---
############################################################
# STIG V-206556 Validation (Audit Only)
############################################################

############################################################
# Check for .pgpass files
############################################################

- name: "V-206556 | Search for .pgpass files"
  become: true
  ansible.builtin.find:
    paths:
      - /var/lib/pgsql
      - /home
      - /root
    patterns: ".pgpass"
    recurse: true
  register: postgresql_srg_pgpass_audit
  changed_when: false

- name: "V-206556 | Assert no .pgpass files exist"
  ansible.builtin.assert:
    that:
      - postgresql_srg_pgpass_audit.matched == 0
    fail_msg: ".pgpass files detected"
    success_msg: "No .pgpass files found"

############################################################
# Check for stored role passwords
############################################################

- name: "V-206556 | Check for stored role passwords"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword IS NOT NULL;"
  register: postgresql_srg_password_check
  changed_when: false

- name: "V-206556 | Assert no stored role passwords"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_check.stdout_lines | length == 0
    fail_msg: "Stored DB passwords detected"
    success_msg: "No stored DB passwords detected"

############################################################
# Check pg_hba.conf for password methods
############################################################

- name: "V-206556 | Check for password authentication methods"
  become: true
  ansible.builtin.shell: |
    grep -v '^\s*#' {{ postgresql_srg_hba_file }} | grep -E '(md5|scram-sha-256|password)' || true
  register: postgresql_srg_hba_password_check
  changed_when: false

- name: "V-206556 | Assert no password authentication configured"
  ansible.builtin.assert:
    that:
      - postgresql_srg_hba_password_check.stdout == ""
    fail_msg: "Password authentication detected in pg_hba.conf"
    success_msg: "No password authentication configured"
