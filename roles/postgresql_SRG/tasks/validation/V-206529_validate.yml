---
############################################################
# STIG V-206529
# Validation - Audit records contain timestamps
############################################################

- name: V-206529 | Check log_line_prefix
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -t -A -c "SHOW log_line_prefix;"
  register: postgresql_srg_v206529_prefix
  changed_when: false
  tags:
    - stig
    - V-206529
    - cat2

- name: V-206529 | Identify failure reason
  ansible.builtin.set_fact:
    v206529_failure_reasons: >-
      {{
        [] +
        (['Timestamp (%m) missing in log_line_prefix']
         if '%m' not in postgresql_srg_v206529_prefix.stdout else [])
      }}
  tags:
    - stig
    - V-206529
    - cat2

- name: V-206529 | Assert compliance
  ansible.builtin.assert:
    that:
      - v206529_failure_reasons | length == 0
    fail_msg: >
      STIG V-206529 FAILED:
      {{ v206529_failure_reasons | join(', ') }}
    success_msg: >
      STIG V-206529 PASSED:
      Audit records include timestamp information.
  tags:
    - stig
    - V-206529
    - cat2
