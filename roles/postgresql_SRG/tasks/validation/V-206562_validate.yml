---
############################################################
# STIG V-206562 Validation (Audit Only)
############################################################

############################################################
# Validate FIPS Mode Enabled
############################################################

- name: "V-206562 | Check FIPS status"
  become: true
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: postgresql_srg_fips_check
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-206562 | Assert FIPS enabled"
  ansible.builtin.assert:
    that:
      - postgresql_srg_fips_check.stdout == "1"
    fail_msg: "FIPS mode is NOT enabled (CAT I Finding)"
    success_msg: "FIPS mode is enabled"
  when: postgresql_srg_fips_required | bool

############################################################
# Validate Crypto Policy
############################################################

- name: "V-206562 | Check crypto policy"
  become: true
  ansible.builtin.command: update-crypto-policies --show
  register: postgresql_srg_crypto_policy_check
  changed_when: false
  when: postgresql_srg_fips_required | bool

- name: "V-206562 | Assert crypto policy is FIPS"
  ansible.builtin.assert:
    that:
      - "'FIPS' in postgresql_srg_crypto_policy_check.stdout"
    fail_msg: "System crypto policy is not set to FIPS"
    success_msg: "System crypto policy is set to FIPS"
  when: postgresql_srg_fips_required | bool

############################################################
# Validate OpenSSL Version
############################################################

- name: "V-206562 | Check OpenSSL version"
  become: true
  ansible.builtin.command: openssl version
  register: postgresql_srg_openssl_check
  changed_when: false

- name: "V-206562 | Display OpenSSL version"
  ansible.builtin.debug:
    msg: "OpenSSL Version: {{ postgresql_srg_openssl_check.stdout }}"
