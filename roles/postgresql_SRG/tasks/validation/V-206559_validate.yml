---
############################################################
# STIG V-206559 Validation (Audit Only)
############################################################

############################################################
# Validate SSL is disabled
############################################################

- name: "V-206559 | Check SSL setting"
  become: true
  ansible.builtin.shell: |
    grep -E "^ssl\s*=" {{ postgresql_srg_conf_file }}
  register: postgresql_srg_ssl_check
  changed_when: false

- name: "V-206559 | Assert SSL disabled"
  ansible.builtin.assert:
    that:
      - "'ssl = off' in postgresql_srg_ssl_check.stdout"
    fail_msg: "SSL is enabled; PKI keys may be in use"
    success_msg: "SSL disabled; no PKI keys required"

############################################################
# Validate no private key exists
############################################################

- name: "V-206559 | Check for server.key"
  become: true
  ansible.builtin.stat:
    path: "{{ postgresql_srg_data_dir }}/server.key"
  register: postgresql_srg_key_check

- name: "V-206559 | Assert no server.key exists"
  ansible.builtin.assert:
    that:
      - not postgresql_srg_key_check.stat.exists
    fail_msg: "server.key exists — PKI key detected"
    success_msg: "No DBMS PKI private key found"
