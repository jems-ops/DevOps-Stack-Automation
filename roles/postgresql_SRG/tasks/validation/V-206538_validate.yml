---
############################################################
# STIG V-206538
# Validation - Audit logs protected from unauthorized read
############################################################

- name: V-206538 | Check log directory permissions
  become: true
  ansible.builtin.stat:
    path: "{{ postgresql_srg_log_directory }}"
  register: v206538_log_dir
  tags:
    - stig
    - V-206538
    - cat2

- name: V-206538 | Find log files
  become: true
  ansible.builtin.find:
    paths: "{{ postgresql_srg_log_directory }}"
    patterns: "*.log"
  register: v206538_log_files
  tags:
    - stig
    - V-206538
    - cat2

- name: V-206538 | Validate directory protection
  ansible.builtin.assert:
    that:
      - v206538_log_dir.stat.pw_name == "postgres"
      - v206538_log_dir.stat.gr_name == "postgres"
      - v206538_log_dir.stat.mode | int(base=8) <= 700
    fail_msg: >
      STIG V-206538 FAILED:
      Log directory permissions are not properly restricted.
    success_msg: >
      Log directory ownership and permissions are compliant.
  tags:
    - stig
    - V-206538
    - cat2

- name: V-206538 | Validate log file permissions
  ansible.builtin.assert:
    that:
      - v206538_log_files.files | rejectattr('mode', 'equalto', '0600') | list | length == 0
    fail_msg: >
      STIG V-206538 FAILED:
      One or more log files have incorrect permissions (expected 0600).
    success_msg: >
      All log files are properly restricted (0600).
  when: v206538_log_files.matched > 0
  tags:
    - stig
    - V-206538
    - cat2
