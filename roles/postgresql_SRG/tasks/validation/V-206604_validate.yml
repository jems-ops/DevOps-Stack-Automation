---
############################################################
# STIG V-206604 Validation
############################################################

############################################################
# Validate localhost binding
############################################################

- name: "V-206604 | Check listen_addresses"
  become: true
  ansible.builtin.shell: |
    grep -E "^listen_addresses" {{ postgresql_srg_conf_file }}
  register: postgresql_srg_listen_check
  changed_when: false

- name: "Assert PostgreSQL restricted to localhost"
  ansible.builtin.assert:
    that:
      - postgresql_srg_listen_check.stdout is search("localhost")
    fail_msg: "PostgreSQL listening on non-local interfaces"
    success_msg: "PostgreSQL restricted to localhost"

############################################################
# Validate no external host entries
############################################################

- name: "V-206604 | Check pg_hba.conf for external networks"
  become: true
  ansible.builtin.shell: |
    grep -v '^\s*#' {{ postgresql_srg_hba_file }} | grep -E "0\.0\.0\.0\/0|\/0" || true
  register: postgresql_srg_external_access
  changed_when: false

- name: "Assert no external database access"
  ansible.builtin.assert:
    that:
      - postgresql_srg_external_access.stdout | trim == ""
    fail_msg: "External database access detected"
    success_msg: "Database access restricted to internal network"

############################################################
# Validate database port exposure
############################################################

- name: "V-206604 | Check PostgreSQL listening ports"
  become: true
  ansible.builtin.shell: |
    ss -tulnp | grep 5432 || true
  register: postgresql_srg_port_check
  changed_when: false

- name: "Assert PostgreSQL not exposed externally"
  ansible.builtin.assert:
    that:
      - postgresql_srg_port_check.stdout is search("127.0.0.1")
    fail_msg: "PostgreSQL port exposed externally"
    success_msg: "PostgreSQL restricted to localhost"
