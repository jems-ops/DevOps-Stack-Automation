---
############################################################
# STIG V-206554
# Validation - Unique identification and authentication
############################################################

- name: V-206554 | Check password_encryption
  become: true
  become_user: postgres
  shell: psql -t -A -c "SHOW password_encryption;"
  register: v206554_scram
  changed_when: false

- name: Assert SCRAM enforced
  assert:
    that:
      - "'scram-sha-256' in v206554_scram.stdout"
    fail_msg: "STIG V-206554 FAILED: SCRAM not enforced."
    success_msg: "SCRAM enforced."
  tags:
    - stig
    - V-206554


- name: V-206554 | Check for trust authentication
  become: true
  shell: grep -Ev '^\s*#' {{ postgresql_srg_hba_file }} | grep -E '\btrust\b' || true
  register: v206554_trust
  changed_when: false

- name: Assert no trust authentication
  assert:
    that:
      - v206554_trust.stdout == ""
    fail_msg: "STIG V-206554 FAILED: trust authentication present."
    success_msg: "No trust authentication."
  tags:
    - stig
    - V-206554


- name: V-206554 | Check for duplicate login roles
  become: true
  become_user: postgres
  shell: |
    psql -t -A -c "
    SELECT rolname FROM pg_roles
    WHERE rolcanlogin = true;"
  register: v206554_users
  changed_when: false

- name: Display login roles for review
  debug:
    msg: "Login roles configured: {{ v206554_users.stdout_lines }}"
  tags:
    - stig
    - V-206554
