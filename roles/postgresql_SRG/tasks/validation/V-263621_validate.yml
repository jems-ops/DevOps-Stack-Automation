---
############################################################
# STIG Control: V-263621
#
# Validation:
# Ensure the host system clock is synchronized with the
# organization time source so that database timestamps are
# consistent across systems.
#
# Verification Commands:
#
#    getent hosts satellite
#    systemctl status chronyd
#    timedatectl status
#
# Expected:
#    System clock synchronized: yes
############################################################

- name: "V-263621 | Validate Satellite DNS resolution"
  ansible.builtin.command: "getent hosts {{ postgresql_srg_ntp_server }}"
  register: postgresql_srg_ntp_dns
  changed_when: false
  failed_when: postgresql_srg_ntp_dns.rc != 0
  tags: ['V-263621','CAT II','check']

- name: "V-263621 | Check chronyd service"
  ansible.builtin.command: systemctl is-active chronyd
  register: postgresql_srg_chrony_status
  changed_when: false
  tags: ['V-263621','CAT II','check']

- name: "V-263621 | Assert chronyd running"
  ansible.builtin.assert:
    that:
      - postgresql_srg_chrony_status.stdout == "active"
  tags: ['V-263621','CAT II','check']

- name: "V-263621 | Check system time synchronization"
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: postgresql_srg_time_sync
  changed_when: false
  tags: ['V-263621','CAT II','check']

- name: "V-263621 | Assert system clock synchronized"
  ansible.builtin.assert:
    that:
      - postgresql_srg_time_sync.stdout == "yes"
  tags: ['V-263621','CAT II','check']