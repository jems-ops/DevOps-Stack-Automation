---
############################################################
# STIG Control: V-206555
# Validation
############################################################


############################################################
# Scan DBMS-only paths
############################################################

- name: "V-206555 | Scan for password references (DBMS scope)"
  ansible.builtin.shell: |
    grep -Ril "password=" \
    {{ postgresql_srg_conf_file }} \
    {{ postgresql_srg_hba_file }} \
    {{ postgresql_srg_data_dir }} \
    2>/dev/null || true
  register: v206555_password_files
  changed_when: false
  failed_when: false
  tags: ['V-206555', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# Check file permissions
############################################################

- name: "V-206555 | Check file permissions"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ v206555_password_files.stdout_lines | default([]) }}"
  register: v206555_file_stats
  when: v206555_password_files.stdout_lines | length > 0
  changed_when: false
  tags: ['V-206555', 'CAT-I', 'validate', 'postgres', 'stig']


- name: "V-206555 | Assert secure permissions"
  ansible.builtin.assert:
    that:
      - item.stat.mode | int(base=8) <= 600
  loop: "{{ v206555_file_stats.results | default([]) }}"
  when: v206555_file_stats is defined
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206555', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# Validate .pgpass
############################################################

- name: "V-206555 | Find .pgpass files"
  ansible.builtin.find:
    paths: "{{ postgresql_srg_pgpass_search_paths }}"
    patterns: ".pgpass"
    recurse: true
  register: v206555_pgpass
  changed_when: false
  failed_when: false
  tags: ['V-206555', 'CAT-I', 'validate', 'postgres', 'stig']


- name: "V-206555 | Validate .pgpass permissions"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ v206555_pgpass.files | default([]) }}"
  register: v206555_pgpass_stat
  when: v206555_pgpass.matched | default(0) > 0
  changed_when: false
  tags: ['V-206555', 'CAT-I', 'validate', 'postgres', 'stig']


- name: "V-206555 | Assert .pgpass secure"
  ansible.builtin.assert:
    that:
      - item.stat.mode | int(base=8) <= 600
  loop: "{{ v206555_pgpass_stat.results | default([]) }}"
  when: v206555_pgpass_stat is defined
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206555', 'CAT-I', 'validate', 'postgres', 'stig']
