---
############################################################
# STIG V-206604
# Validation - Verify Isolation and No Sensitive Exposure
############################################################

############################################################
# Validate listen_addresses
############################################################

- name: "V-206604 | Check listen_addresses"
  ansible.builtin.shell: >-
    su -s /bin/bash - postgres -c
    "psql -tAc \"SHOW listen_addresses;\""
  register: v206604_listen
  changed_when: false
  tags: ['V-206604', 'CAT-I', 'validate', 'postgres', 'stig']

- name: "V-206604 | Assert localhost-only binding"
  ansible.builtin.assert:
    that:
      - v206604_listen.stdout | trim in ['localhost', '127.0.0.1']
    fail_msg: >
      STIG V-206604 FAILED:
      PostgreSQL is exposed beyond localhost.
    success_msg: >
      PostgreSQL restricted to localhost.
  tags: ['V-206604', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# Validate pg_hba.conf has no remote access
############################################################

- name: "V-206604 | Check pg_hba.conf for remote entries"
  ansible.builtin.shell: |
    grep -Ev '^\s*#|^\s*$' {{ postgresql_srg_hba_file }} | grep -E 'host\s+'
  register: v206604_hba
  changed_when: false
  failed_when: false
  tags: ['V-206604', 'CAT-I', 'validate', 'postgres', 'stig']

############################################################
# Check for external host access (FIXED)
############################################################

- name: "V-206604 | Check pg_hba.conf for external access (active lines only)"
  ansible.builtin.shell: |
    awk '
      !/^\s*#/ && NF {
        if ($1 == "host" &&
            $4 !~ /^(127\.0\.0\.1\/32|::1\/128)$/)
          print
      }
    ' {{ postgresql_srg_hba_file }}
  register: v206604_hba
  changed_when: false


- name: "V-206604 | Assert no external host access"
  ansible.builtin.assert:
    that:
      - v206604_hba.stdout_lines | length == 0
    fail_msg: >
      STIG V-206604 FAILED:
      External host access detected:
      {{ v206604_hba.stdout_lines }}
    success_msg: >
      PostgreSQL is restricted to localhost access only


############################################################
# Validate network exposure
############################################################

- name: "V-206604 | Check listening ports"
  ansible.builtin.shell: |
    ss -lntp | grep 5432 || true
  register: v206604_ports
  changed_when: false
  tags: ['V-206604', 'CAT-I', 'validate', 'postgres', 'stig']

- name: "V-206604 | Assert localhost-only listening"
  ansible.builtin.assert:
    that:
      - "'127.0.0.1:5432' in v206604_ports.stdout or '[::1]:5432' in v206604_ports.stdout"
    fail_msg: >
      STIG V-206604 FAILED:
      PostgreSQL listening on external interface.
    success_msg: >
      PostgreSQL listening only on localhost.
  tags: ['V-206604', 'CAT-I', 'validate', 'postgres', 'stig']
