---
############################################################
# STIG Control: V-206562
# Validation
#
# Objective:
# Ensure OS uses FIPS-validated crypto modules
############################################################


############################################################
# Check FIPS kernel mode
############################################################

- name: "V-206562 | Check FIPS kernel mode"
  become: true
  ansible.builtin.shell: |
    cat /proc/sys/crypto/fips_enabled 2>/dev/null || echo 0
  register: v206562_fips
  changed_when: false
  failed_when: false
  tags: ['V-206562','CAT-I','validate','postgres','stig','fips']


- name: "V-206562 | Assert FIPS mode enabled"
  ansible.builtin.assert:
    that:
      - v206562_fips.stdout | trim == "1"
    fail_msg: "FIPS mode is NOT enabled"
    success_msg: "FIPS mode enabled"
  when: postgresql_srg_fips_required | default(true)
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206562','CAT-I','validate','postgres','stig']


############################################################
# Check crypto policy (RHEL family)
############################################################

- name: "V-206562 | Check crypto policy"
  become: true
  ansible.builtin.shell: |
    update-crypto-policies --show 2>/dev/null || echo "UNKNOWN"
  register: v206562_crypto
  changed_when: false
  failed_when: false
  tags: ['V-206562','CAT-I','validate','postgres','stig']


- name: "V-206562 | Assert crypto policy includes FIPS"
  ansible.builtin.assert:
    that:
      - "'FIPS' in v206562_crypto.stdout"
    fail_msg: >
      System crypto policy is not FIPS:
      {{ v206562_crypto.stdout }}
    success_msg: "Crypto policy includes FIPS"
  when:
    - postgresql_srg_fips_required | default(true)
    - v206562_crypto.stdout != "UNKNOWN"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206562','CAT-I','validate','postgres','stig']


############################################################
# Check OpenSSL FIPS provider (evidence)
############################################################

- name: "V-206562 | Check OpenSSL providers"
  become: true
  ansible.builtin.shell: |
    openssl list -providers 2>/dev/null || echo ""
  register: v206562_openssl
  changed_when: false
  failed_when: false
  tags: ['V-206562','CAT-I','validate','postgres','stig','evidence']


- name: "V-206562 | Assert FIPS provider available"
  ansible.builtin.assert:
    that:
      - "'fips' in v206562_openssl.stdout | lower"
    fail_msg: "OpenSSL FIPS provider not detected"
    success_msg: "OpenSSL FIPS provider detected"
  when:
    - postgresql_srg_fips_required | default(true)
    - v206562_openssl.stdout != ""
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206562','CAT-I','validate','postgres','stig','optional']
