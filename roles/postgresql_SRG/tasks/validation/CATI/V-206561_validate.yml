---
############################################################
# STIG Control: V-206561
# Validation
############################################################


############################################################
# Validate .pgpass permissions
############################################################

- name: "V-206561 | Find .pgpass files"
  ansible.builtin.find:
    paths:
      - "{{ postgresql_srg_data_dir }}"
      - /home
      - /root
    patterns: ".pgpass"
    recurse: true
  register: v206561_pgpass
  changed_when: false
  failed_when: false
  tags: ['V-206561', 'CAT-I', 'validate', 'postgres', 'stig']


- name: "V-206561 | Check .pgpass permissions"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ v206561_pgpass.files | default([]) }}"
  register: v206561_pgpass_stat
  when:
    - v206561_pgpass is defined
    - v206561_pgpass.matched | default(0) > 0
  changed_when: false
  tags: ['V-206561', 'validate']


- name: "V-206561 | Assert .pgpass secure"
  ansible.builtin.assert:
    that:
      - item.stat.mode | int(base=8) <= 600
    fail_msg: ".pgpass file {{ item.stat.path }} has insecure permissions"
  loop: "{{ v206561_pgpass_stat.results | default([]) }}"
  when: v206561_pgpass_stat is defined
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206561', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# Validate logging configuration
############################################################

- name: "V-206561 | Check log_statement"
  become_user: postgres
  ansible.builtin.shell: psql -tAc "SHOW log_statement;"
  register: v206561_log_statement
  changed_when: false
  failed_when: false
  tags: ['V-206561', 'validate']


- name: "V-206561 | Assert logging safe"
  ansible.builtin.assert:
    that:
      - v206561_log_statement.stdout | trim in ['ddl', 'none']
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206561', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# STRICT DBMS-only password search
############################################################

- name: "V-206561 | Search for plaintext passwords"
  ansible.builtin.shell: |
    grep -RinI \
      --exclude-dir={pg_wal, base, global, pg_stat, log} \
      --exclude=*.{cfs, js, log} \
      -E "^[^#]*password\s*=" \
      {{ postgresql_srg_conf_file }} \
      {{ postgresql_srg_hba_file }} \
      {{ postgresql_srg_data_dir }} \
      2>/dev/null || true
  register: v206561_password_search
  changed_when: false
  failed_when: false
  tags: ['V-206561', 'validate']


- name: "V-206561 | Assert no plaintext passwords"
  ansible.builtin.assert:
    that:
      - v206561_password_search.stdout_lines | length == 0
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206561', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# Validate config file permissions
############################################################

- name: "V-206561 | Check config file permissions"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ postgresql_srg_conf_file }}"
    - "{{ postgresql_srg_hba_file }}"
  register: v206561_conf_stat
  changed_when: false
  tags: ['V-206561', 'validate']


- name: "V-206561 | Assert config files secure"
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == "postgres"
      - item.stat.mode | int(base=8) <= 600
  loop: "{{ v206561_conf_stat.results }}"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206561', 'CAT-I', 'validate', 'postgres', 'stig']
