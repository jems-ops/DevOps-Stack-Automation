---
############################################################
# STIG V-206561 Validation (Audit Only)
# Prevent Display of Authentication Secrets
############################################################

############################################################
# Check .pgpass File Permissions
############################################################

- name: "V-206561 | Locate .pgpass files"
  become: true
  ansible.builtin.find:
    paths:
      - /var/lib/pgsql
      - /home
      - /root
    patterns: ".pgpass"
    recurse: true
  register: postgresql_srg_pgpass_audit
  changed_when: false


- name: "V-206561 | Check .pgpass permissions"
  become: true
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ postgresql_srg_pgpass_audit.files }}"
  register: postgresql_srg_pgpass_permissions
  when: postgresql_srg_pgpass_audit.matched > 0


- name: "V-206561 | Assert .pgpass permissions secure"
  ansible.builtin.assert:
    that:
      - item.stat.mode == "0600"
    fail_msg: ".pgpass permissions are not secure"
    success_msg: ".pgpass permissions correctly secured"
  loop: "{{ postgresql_srg_pgpass_permissions.results }}"
  when: postgresql_srg_pgpass_audit.matched > 0


############################################################
# Check for password exposure in configuration files
############################################################

- name: "V-206561 | Search for plaintext password references in config files"
  become: true
  ansible.builtin.shell: |
    grep -h "password=" \
      {{ postgresql_srg_conf_file }} \
      {{ postgresql_srg_hba_file }} \
      {{ postgresql_srg_data_dir }}/postgresql.auto.conf \
      2>/dev/null || true
  register: postgresql_srg_password_pattern_check
  changed_when: false


- name: "V-206561 | Assert no plaintext passwords in config"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_pattern_check.stdout == ""
    fail_msg: "Plaintext password detected in PostgreSQL configuration files"
    success_msg: "No plaintext password exposure detected in config files"


############################################################
# Check PGPASSWORD Environment Variable Exposure
############################################################

- name: "V-206561 | Check running processes for PGPASSWORD"
  become: true
  ansible.builtin.shell: |
    ps eww -A | grep PGPASSWORD | grep -v grep || true
  register: postgresql_srg_env_check
  changed_when: false


- name: "V-206561 | Assert no PGPASSWORD exposure"
  ansible.builtin.assert:
    that:
      - postgresql_srg_env_check.stdout == ""
    fail_msg: "PGPASSWORD environment variable detected"
    success_msg: "No PGPASSWORD environment variables detected"


############################################################
# Verify Role Passwords Are Securely Hashed
############################################################

- name: "V-206561 | Check role password hashing"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword NOT LIKE 'SCRAM-SHA-256%';"
  register: postgresql_srg_password_hash_check
  changed_when: false


- name: "V-206561 | Assert passwords are hashed"
  ansible.builtin.assert:
    that:
      - postgresql_srg_password_hash_check.stdout_lines | length == 0
    fail_msg: "Non-hashed passwords detected"
    success_msg: "All role passwords are securely hashed"
