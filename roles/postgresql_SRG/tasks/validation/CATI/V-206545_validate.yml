---
############################################################
# STIG Control: V-206545
# Validation
############################################################


############################################################
# Check postgres shell
############################################################

- name: "V-206545 | Check postgres shell"
  ansible.builtin.command: getent passwd postgres
  register: v206545_passwd
  changed_when: false
  tags: ['V-206545','validate']


- name: "V-206545 | Assert restricted shell"
  ansible.builtin.assert:
    that:
      - v206545_passwd.stdout is search('/nologin|/bash')
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206545','CAT-I','validate','postgres','stig']


############################################################
# Check account lock
############################################################

- name: "V-206545 | Check account lock"
  ansible.builtin.command: passwd -S postgres
  register: v206545_lock
  changed_when: false
  failed_when: false
  tags: ['V-206545','validate']


- name: "V-206545 | Assert account controlled"
  ansible.builtin.assert:
    that:
      - v206545_lock.stdout is search('L|NP')
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206545','CAT-I','validate','postgres','stig']


############################################################
# Validate sudo access
############################################################

- name: "V-206545 | Check sudo config"
  ansible.builtin.stat:
    path: /etc/sudoers.d/postgres_admins
  register: v206545_sudo
  tags: ['V-206545','validate']


- name: "V-206545 | Assert sudo exists"
  ansible.builtin.assert:
    that:
      - v206545_sudo.stat.exists
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206545','CAT-I','validate','postgres','stig']


############################################################
# Validate audit rules
############################################################

- name: "V-206545 | Check audit rules"
  ansible.builtin.shell: auditctl -l | grep postgres || true
  register: v206545_audit
  changed_when: false
  tags: ['V-206545','validate']


- name: "V-206545 | Assert audit rules present"
  ansible.builtin.assert:
    that:
      - v206545_audit.stdout | length > 0
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206545','CAT-I','validate','postgres','stig']
