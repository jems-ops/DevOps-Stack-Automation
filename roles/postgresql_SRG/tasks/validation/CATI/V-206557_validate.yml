---
############################################################
# STIG Control: V-206557
# Validation
############################################################


############################################################
# Detect insecure methods (active only)
############################################################

- name: "V-206557 | Check pg_hba.conf for insecure methods"
  become: true
  ansible.builtin.shell: |
    awk '
      !/^\s*#/ && NF {
        if ($1 == "host" && $0 ~ /(md5|password)/) print
        if ($1 == "local" && $0 ~ /trust/) print
      }
    ' {{ postgresql_srg_hba_file }}
  register: v206557_hba_check
  changed_when: false
  failed_when: false
  tags: ['V-206557','CAT-I','validate','postgres','stig']


############################################################
# Assert secure configuration (non-blocking optional)
############################################################

- name: "V-206557 | Assert no insecure authentication"
  ansible.builtin.assert:
    that:
      - v206557_hba_check.stdout_lines | length == 0
    fail_msg: >
      Insecure authentication detected:
      {{ v206557_hba_check.stdout_lines }}
    success_msg: "Authentication methods are secure"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206557','CAT-I','validate','postgres','stig']


############################################################
# Validate SCRAM usage
############################################################

- name: "V-206557 | Check SCRAM usage"
  become: true
  ansible.builtin.shell: |
    awk '!/^\s*#/ && $1 == "host" {print}' {{ postgresql_srg_hba_file }}
  register: v206557_scram_check
  changed_when: false
  failed_when: false
  tags: ['V-206557','CAT-I','validate','postgres','stig']


- name: "V-206557 | Assert SCRAM enforced"
  ansible.builtin.assert:
    that:
      - "'scram-sha-256' in v206557_scram_check.stdout"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206557','CAT-I','validate','postgres','stig']
