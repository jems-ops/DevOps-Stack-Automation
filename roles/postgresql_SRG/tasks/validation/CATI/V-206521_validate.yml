---
############################################################
# STIG Control: V-206521
# Validation - Least Privilege Enforcement (FINAL)
############################################################


############################################################
# Check PUBLIC CREATE on database
############################################################

- name: "V-206521 | Check PUBLIC CREATE on database"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT has_database_privilege('public',
    '{{ postgresql_srg_target_database }}', 'CREATE');"
  register: v206521_db_create
  changed_when: false
  failed_when: false
  tags: ['V-206521', 'validate']


- name: "V-206521 | Assert CREATE revoked"
  ansible.builtin.assert:
    that:
      - v206521_db_create.stdout | trim == "f"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206521', 'validate']


############################################################
# Check schema CREATE privilege
############################################################

- name: "V-206521 | Check PUBLIC CREATE on schemas"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT nspname
    FROM pg_namespace
    WHERE has_schema_privilege('public', oid, 'CREATE')
    AND nspname NOT IN ('pg_catalog', 'information_schema');"
  register: v206521_schema_create
  changed_when: false
  failed_when: false
  tags: ['V-206521', 'validate']


- name: "V-206521 | Normalize schema results"
  ansible.builtin.set_fact:
    v206521_schema_create_clean: >-
      {{ v206521_schema_create.stdout_lines
         | map('trim')
         | reject('equalto', '')
         | list }}
  tags: ['V-206521', 'validate']


- name: "V-206521 | Assert CREATE restricted"
  ansible.builtin.assert:
    that:
      - v206521_schema_create_clean | length == 0
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206521', 'validate']


############################################################
# Check DEFAULT PRIVILEGES (FIXED)
############################################################

- name: "V-206521 | Check default privilege leaks"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT count(*)
    FROM pg_default_acl
    WHERE defaclacl::text ~ '=/';"
  register: v206521_default_acl
  changed_when: false
  failed_when: false
  tags: ['V-206521', 'validate', 'critical']


- name: "V-206521 | Assert default privileges hardened"
  ansible.builtin.assert:
    that:
      - v206521_default_acl.stdout | trim == "0"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206521', 'validate', 'critical']


############################################################
# Validate future RBAC grants (NEW 🔥)
############################################################

- name: "V-206521 | Check default SELECT grants for readonly role"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT count(*)
    FROM pg_default_acl
    WHERE defaclacl::text LIKE '%{{ postgresql_srg_readonly_role }}%';"
  register: v206521_rbac_default
  changed_when: false
  failed_when: false
  tags: ['V-206521', 'validate', 'rbac']


- name: "V-206521 | Assert RBAC default privileges configured"
  ansible.builtin.assert:
    that:
      - v206521_rbac_default.stdout | int >= 0
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206521', 'validate', 'rbac']


############################################################
# OPTIONAL: Existing table access
############################################################

- name: "V-206521 | Check PUBLIC table access"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT count(*)
    FROM information_schema.role_table_grants
    WHERE grantee = 'public';"
  register: v206521_table_public
  changed_when: false
  failed_when: false
  when: postgresql_srg_revoke_existing_objects | default(false)
  tags: ['V-206521', 'validate', 'optional']


- name: "V-206521 | Assert no PUBLIC table access"
  ansible.builtin.assert:
    that:
      - v206521_table_public.stdout | trim == "0"
  when: postgresql_srg_revoke_existing_objects | default(false)
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206521', 'validate', 'optional']


############################################################
# RBAC role exists
############################################################

- name: "V-206521 | Check readonly role"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT 1 FROM pg_roles
    WHERE rolname='{{ postgresql_srg_readonly_role }}';"
  register: v206521_readonly_role
  changed_when: false
  failed_when: false
  tags: ['V-206521', 'validate', 'rbac']


- name: "V-206521 | Assert readonly role exists"
  ansible.builtin.assert:
    that:
      - v206521_readonly_role.stdout | trim == "1"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206521', 'validate', 'rbac']
