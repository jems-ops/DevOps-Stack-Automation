---
############################################################
# STIG Control: V-265854
# Validation
#
# Objective:
# Ensure PostgreSQL version is vendor-supported
############################################################
############################################################
# Gather PostgreSQL version (SAFE)
############################################################

- name: "V-265854 | Gather PostgreSQL server version"
  become: true
  become_user: postgres
  ansible.builtin.command: psql -tAc "SHOW server_version;"
  register: postgresql_srg_version
  changed_when: false
  failed_when: false
  tags: ['V-265854', 'CAT-I', 'validate', 'postgres', 'stig', 'version']
############################################################
# Normalize version output
############################################################

- name: "V-265854 | Normalize version"
  ansible.builtin.set_fact:
    postgresql_srg_version_clean: "{{ postgresql_srg_version.stdout | default('') | trim }}"
  tags: ['V-265854', 'CAT-I', 'validate', 'postgres', 'stig']
############################################################
# Extract major version (SAFE)
############################################################

- name: "V-265854 | Extract major version"
  ansible.builtin.set_fact:
    postgresql_srg_major_version: >-
      {{
        (postgresql_srg_version_clean | regex_search('^([0-9]+)'))
        if postgresql_srg_version_clean != '' else 'unknown'
      }}
  tags: ['V-265854', 'CAT-I', 'validate', 'postgres', 'stig']
############################################################
# Define supported versions (OVERRIDABLE)
############################################################

- name: "V-265854 | Define supported versions"
  ansible.builtin.set_fact:
    postgresql_srg_supported_versions: >-
      {{
        postgresql_srg_supported_versions
        | default(['16', '15'])
      }}
  tags: ['V-265854', 'CAT-I', 'validate', 'postgres', 'stig']
############################################################
# Assert version is supported
############################################################

- name: "V-265854 | Assert supported PostgreSQL version"
  ansible.builtin.assert:
    that:
      - postgresql_srg_major_version != 'unknown'
      - postgresql_srg_major_version in postgresql_srg_supported_versions
    fail_msg: >
      STIG V-265854 FAILED:
      Unsupported or undetected PostgreSQL version: {{ postgresql_srg_version_clean }}.
      Supported versions: {{ postgresql_srg_supported_versions }}.
    success_msg: >
      PostgreSQL version {{ postgresql_srg_version_clean }} is supported.
  tags: ['V-265854', 'CAT-I', 'validate', 'postgres', 'stig', 'critical']
