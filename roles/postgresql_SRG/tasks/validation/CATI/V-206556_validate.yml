---
############################################################
# STIG Control: V-206556
# Validation — Password Encryption
#
# Uses SQL script: files/sql/v206556_validate.sql
# Output: key=value pairs parsed into a dict for assertions.
############################################################

############################################################
# 1. Copy and execute validation SQL script
############################################################

- name: "V-206556 | Copy validation SQL script"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/sql/v206556_validate.sql"
    dest: /tmp/v206556_validate.sql
    owner: postgres
    group: postgres
    mode: "0600"
  tags: ['V-206556', 'CAT-I', 'validate']

- name: "V-206556 | Execute validation SQL script"
  ansible.builtin.shell: >-
    su -s /bin/bash - postgres -c
    'psql -tA -f /tmp/v206556_validate.sql'
  register: _v206556_raw
  changed_when: false
  failed_when: false
  tags: ['V-206556', 'CAT-I', 'validate']

############################################################
# 2. Parse key=value output into a dict
############################################################

- name: "V-206556 | Parse validation results"
  ansible.builtin.set_fact:
    v206556: >-
      {{ dict(_v206556_raw.stdout_lines
              | select('match', '^\w+=.*')
              | map('split', '=')
              | map('list')) }}
  tags: ['V-206556', 'CAT-I', 'validate']

- name: "V-206556 | Display validation results"
  ansible.builtin.debug:
    var: v206556
  tags: ['V-206556', 'CAT-I', 'validate']

############################################################
# 3. Assert each check
############################################################

- name: "V-206556 | Assert SCRAM enabled"
  ansible.builtin.assert:
    that:
      - v206556.password_encryption == 'scram-sha-256'
    success_msg: "SCRAM password hashing is enabled."
    fail_msg: >-
      SCRAM is NOT enabled!
      Current setting: {{ v206556.password_encryption }}
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206556', 'CAT-I', 'validate']

- name: "V-206556 | Assert no weak password hashes"
  ansible.builtin.assert:
    that:
      - v206556.weak_hash_count | int == 0
    success_msg: "All roles use SCRAM password hashing."
    fail_msg: >-
      {{ v206556.weak_hash_count }} role(s) with weak hashes:
      {{ v206556.weak_hash_roles }}
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206556', 'CAT-I', 'validate']

############################################################
# 4. Clean up temporary SQL script
############################################################

- name: "V-206556 | Clean up validation SQL script"
  ansible.builtin.file:
    path: /tmp/v206556_validate.sql
    state: absent
  tags: ['V-206556', 'CAT-I', 'validate']
