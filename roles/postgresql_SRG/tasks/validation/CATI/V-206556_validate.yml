---
############################################################
# STIG Control: V-206556
# Validation
############################################################


############################################################
# Check password_encryption setting
############################################################

- name: "V-206556 | Check password_encryption"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SHOW password_encryption;"
  register: v206556_encryption
  changed_when: false
  failed_when: false
  tags: ['V-206556', 'CAT-I', 'validate', 'postgres', 'stig']


- name: "V-206556 | Assert SCRAM enabled"
  ansible.builtin.assert:
    that:
      - "'scram-sha-256' in v206556_encryption.stdout"
    fail_msg: "SCRAM password hashing is NOT enabled"
    success_msg: "SCRAM password hashing is enabled"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206556', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# Detect weak password hashes (SAFE)
############################################################

- name: "V-206556 | Detect weak password hashes"
  become: true
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT rolname
    FROM pg_authid
    WHERE rolpassword IS NOT NULL
    AND rolpassword NOT LIKE 'SCRAM-SHA-256%';"
  register: v206556_weak_hashes
  changed_when: false
  failed_when: false
  tags: ['V-206556', 'CAT-I', 'validate', 'postgres', 'stig']


- name: "V-206556 | Normalize weak hash results"
  ansible.builtin.set_fact:
    v206556_weak_clean: >-
      {{ v206556_weak_hashes.stdout_lines
         | map('trim')
         | reject('equalto', '')
         | list }}
  tags: ['V-206556', 'CAT-I', 'validate', 'postgres', 'stig']


- name: "V-206556 | Assert no weak hashes exist"
  ansible.builtin.assert:
    that:
      - v206556_weak_clean | length == 0
    fail_msg: >
      Weak password hashes detected:
      {{ v206556_weak_clean }}
    success_msg: "All roles use SCRAM password hashing"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206556', 'CAT-I', 'validate', 'postgres', 'stig']
