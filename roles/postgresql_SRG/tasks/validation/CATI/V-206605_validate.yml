---
############################################################
# STIG Control: V-206605
# Validation - Isolation-Based Compliance
#
# Title:
# The DBMS must protect data in transit.
#
# Compliance Model:
# PostgreSQL operates in an isolated localhost-only
# architecture. No external network communication exists.
#
# Therefore:
# TLS is not required at DBMS layer.
#
# Validation ensures:
#   • DB listens only on localhost
#   • No remote host connections allowed
#
# Therefore, V-206605 is Not a Finding.
############################################################
############################################################
# Check listen_addresses
############################################################

- name: "V-206605 | Check listen_addresses"
  ansible.builtin.shell: >-
    su -s /bin/bash - postgres -c
    "psql -tAc \"SHOW listen_addresses;\""
  register: v206605_listen
  changed_when: false
  tags: ['V-206605', 'CAT-I', 'validate', 'postgres', 'stig']
- name: "V-206605 | Assert localhost-only binding"
  ansible.builtin.assert:
    that:
      - "'localhost' in v206605_listen.stdout or '127.0.0.1' in v206605_listen.stdout"
    fail_msg: >
      STIG V-206605 FAILED:
      PostgreSQL is not restricted to localhost
    success_msg: >
      PostgreSQL is bound to localhost only
  tags: ['V-206605', 'CAT-I', 'validate', 'postgres', 'stig']
############################################################
# Check pg_hba.conf for remote access (FIXED LOGIC)
############################################################

- name: "V-206605 | Check for remote host connections"
  ansible.builtin.shell: |
    awk '
      !/^\s*#/ && NF {
        if ($1 == "host" &&
            $4 !~ /^(127\.0\.0\.1\/32|::1\/128)$/)
          print
      }
    ' {{ postgresql_srg_hba_file }}
  register: v206605_hba
  changed_when: false
  tags: ['V-206605', 'CAT-I', 'validate', 'postgres', 'stig']

- name: "V-206605 | Assert no external host access"
  ansible.builtin.assert:
    that:
      - v206605_hba.stdout_lines | length == 0
    fail_msg: >
      STIG V-206605 FAILED:
      Remote host-based connections detected:
      {{ v206605_hba.stdout_lines }}
    success_msg: >
      No remote host access configured
  tags: ['V-206605', 'CAT-I', 'validate', 'postgres', 'stig']
############################################################
# Final assertion: Isolation confirmed
############################################################

- name: "V-206605 | Confirm isolated architecture"
  ansible.builtin.debug:
    msg: >
      PostgreSQL operates in an isolated localhost-only architecture.
      No external network communication exists.
      DBMS-level TLS is not required.
      Control satisfied via network isolation.
  tags: ['V-206605', 'CAT-I', 'validate', 'postgres', 'stig']
