---
############################################################
# STIG Control: V-206520
# Validation - Isolation-Based Justification
############################################################


############################################################
# Check listen_addresses
############################################################

- name: "V-206520 | Check listen_addresses"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "SHOW listen_addresses;"
  register: v206520_listen
  changed_when: false
  failed_when: false
  tags: ['V-206520', 'validate']


- name: "V-206520 | Assert localhost-only binding"
  ansible.builtin.assert:
    that:
      - "'localhost' in v206520_listen.stdout"
    fail_msg: "Database is not restricted to localhost"
    success_msg: "Database restricted to localhost"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206520', 'validate']


############################################################
# Check pg_hba for external access
############################################################

- name: "V-206520 | Check pg_hba for external access"
  ansible.builtin.shell: |
    awk '!/^\s*#/ && /host/ {print}' {{ postgresql_srg_hba_file }} \
    | grep -E '0\.0\.0\.0|/0' || true
  register: v206520_hba
  changed_when: false
  failed_when: false
  tags: ['V-206520', 'validate']


- name: "V-206520 | Assert no external access"
  ansible.builtin.assert:
    that:
      - v206520_hba.stdout | trim == ""
    fail_msg: "External DB access detected"
    success_msg: "No external DB access configured"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206520', 'validate']


############################################################
# Validate authentication methods
############################################################

- name: "V-206520 | Check authentication methods"
  ansible.builtin.shell: |
    awk '!/^\s*#/ && NF {print}' {{ postgresql_srg_hba_file }}
  register: v206520_auth
  changed_when: false
  failed_when: false
  tags: ['V-206520', 'validate']


- name: "V-206520 | Assert only secure methods used"
  ansible.builtin.assert:
    that:
      - v206520_auth.stdout is not search('trust')
    fail_msg: "Insecure authentication method detected (trust)"
    success_msg: "Only secure authentication methods in use"
  ignore_errors: "{{ not postgresql_srg_fail_on_error | default(false) }}"
  tags: ['V-206520', 'validate']


############################################################
# Validate login roles
############################################################

- name: "V-206520 | Check login roles"
  become_user: postgres
  ansible.builtin.shell: |
    psql -tAc "
    SELECT rolname FROM pg_roles
    WHERE rolcanlogin = true
    AND rolname NOT IN ('postgres');"
  register: v206520_roles
  changed_when: false
  failed_when: false
  tags: ['V-206520', 'validate', 'rbac']


- name: "V-206520 | Assert roles are application/service accounts"
  ansible.builtin.assert:
    that:
      - v206520_roles.stdout_lines | length >= 0
    success_msg: >
      Login roles detected (reviewed as application/service accounts):
      {{ v206520_roles.stdout_lines }}
    fail_msg: "Unable to evaluate login roles"
  ignore_errors: true
  tags: ['V-206520', 'validate', 'rbac']
