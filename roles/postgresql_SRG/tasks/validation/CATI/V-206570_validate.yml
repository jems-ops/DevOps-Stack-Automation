---
############################################################
# STIG Control: V-206570
# Validation
#
# Objective:
# Ensure data directory is properly protected
############################################################


############################################################
# Check data directory
############################################################

- name: "V-206570 | Check data directory"
  ansible.builtin.stat:
    path: "{{ postgresql_srg_data_dir }}"
  register: v206570_stat
  changed_when: false
  tags: ['V-206570', 'CAT-I', 'validate', 'postgres', 'stig']


############################################################
# Assert ownership and permissions
############################################################

- name: "V-206570 | Assert data directory secure"
  ansible.builtin.assert:
    that:
      - v206570_stat.stat.exists
      - v206570_stat.stat.pw_name == "postgres"
      - v206570_stat.stat.gr_name == "postgres"
      - v206570_stat.stat.mode | int(base=8) <= 700
    fail_msg: >
      STIG V-206570 FAILED:
      Data directory is not properly secured.
    success_msg: >
      Data directory ownership and permissions are compliant.
  tags: ['V-206570', 'CAT-I', 'validate', 'postgres', 'stig', 'critical']


############################################################
# Validate config file permissions
############################################################

- name: "V-206570 | Check config file permissions"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ postgresql_srg_conf_file }}"
    - "{{ postgresql_srg_hba_file }}"
  register: v206570_conf_stat
  changed_when: false
  tags: ['V-206570', 'validate']


- name: "V-206570 | Assert config files secure"
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == "postgres"
      - item.stat.mode | int(base=8) <= 600
    fail_msg: "Config file {{ item.stat.path }} is not secure"
  loop: "{{ v206570_conf_stat.results }}"
  tags: ['V-206570', 'CAT-I', 'validate', 'postgres', 'stig']
