---
############################################################
# STIG Control: V-233495
# Validation
#
# Objective:
# Ensure system enforces FIPS-approved cryptography
############################################################
############################################################
# Check FIPS kernel mode (PRIMARY CONTROL)
############################################################

- name: "V-233495 | Check FIPS kernel mode"
  become: true
  ansible.builtin.shell: |
    cat /proc/sys/crypto/fips_enabled 2>/dev/null || echo 0
  register: postgresql_srg_fips_status
  changed_when: false
  failed_when: false
  tags: ['V-233495', 'CAT-I', 'validate', 'postgres', 'stig', 'fips']
- name: "V-233495 | Assert FIPS enabled"
  ansible.builtin.assert:
    that:
      - postgresql_srg_fips_status.stdout | trim == "1"
    fail_msg: "FIPS mode is NOT enabled at OS level"
    success_msg: "FIPS mode is enabled"
  when:
    - postgresql_srg_fips_required | default(true)
    - postgresql_srg_enforce_strict | default(true)
  ignore_errors: true
  tags: ['V-233495', 'CAT-I', 'validate', 'postgres', 'stig', 'fips']

############################################################
# Check crypto policy (RHEL-based systems)
############################################################

- name: "V-233495 | Check crypto policy"
  become: true
  ansible.builtin.shell: |
    update-crypto-policies --show 2>/dev/null || echo "UNKNOWN"
  register: postgresql_srg_crypto_policy
  changed_when: false
  failed_when: false
  tags: ['V-233495', 'CAT-I', 'validate', 'postgres', 'stig', 'fips']
- name: "V-233495 | Assert crypto policy is FIPS"
  ansible.builtin.assert:
    that:
      - "'FIPS' in postgresql_srg_crypto_policy.stdout"
    fail_msg: >
      System crypto policy is not FIPS:
      {{ postgresql_srg_crypto_policy.stdout }}
    success_msg: "System crypto policy is FIPS"
  when:
    - postgresql_srg_fips_required | default(true)
    - postgresql_srg_crypto_policy.stdout != "UNKNOWN"
  tags: ['V-233495', 'CAT-I', 'validate', 'postgres', 'stig']
############################################################
# Verify OpenSSL FIPS (This could be a strong evidence)
############################################################

- name: "V-233495 | Check OpenSSL FIPS provider"
  become: true
  ansible.builtin.shell: |
    openssl list -providers 2>/dev/null | grep -i fips || true
  register: postgresql_srg_openssl_fips
  changed_when: false
  failed_when: false
  tags: ['V-233495', 'CAT-I', 'validate', 'postgres', 'stig', 'evidence']
- name: "V-233495 | Assert OpenSSL FIPS available"
  ansible.builtin.assert:
    that:
      - postgresql_srg_openssl_fips.stdout != ""
    fail_msg: "OpenSSL FIPS provider not detected"
    success_msg: "OpenSSL FIPS provider detected"
  when: postgresql_srg_fips_required | default(true)
  ignore_errors: true
  tags: ['V-233495', 'CAT-I', 'validate', 'postgres', 'stig']
