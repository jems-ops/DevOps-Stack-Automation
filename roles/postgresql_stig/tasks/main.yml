---
############################################################
# PostgreSQL STIG Enforcement Role (Consolidated)
############################################################

- name: PostgreSQL STIG | Verify PostgreSQL service exists (no auto-detection)
  become: true
  ansible.builtin.command: "systemctl status {{ postgres_service_name }}"
  register: postgresql_stig__svc_status
  changed_when: false
  tags:
    - always

- name: PostgreSQL STIG | Validate PostgreSQL config files exist (no fallback)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ pg_conf_file }}"
    - "{{ pg_hba_file }}"
  register: postgresql_stig__conf_stat
  changed_when: false
  tags:
    - always

- name: PostgreSQL STIG | Fail when PostgreSQL config paths are missing
  ansible.builtin.fail:
    msg: >-
      PostgreSQL config file not found: {{ item.stat.path }}.
      Current vars: postgres_service_name={{ postgres_service_name }},
      pg_data_dir={{ pg_data_dir }}, pg_conf_file={{ pg_conf_file }}, pg_hba_file={{ pg_hba_file }}.
      If you're not using PostgreSQL 15 defaults, override these variables in inventory/group_vars.
  loop: "{{ postgresql_stig__conf_stat.results | default([]) }}"
  when:
    - postgresql_stig_fail_when_paths_missing | bool
    - item.stat.exists is defined
    - not item.stat.exists
  tags:
    - always

- name: PostgreSQL STIG | Apply PostgreSQL settings
  become: true
  tags:
    - postgresql
    - stig
  block:
    - name: Set max_connections
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*max_connections\s*='
        line: "max_connections = {{ pg_max_connections }}"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set client_min_messages to error
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*client_min_messages\s*='
        line: "client_min_messages = error"
        state: present
        backup: true
      notify: restart postgresql

    - name: Enforce secure pg_hba rules
      ansible.builtin.blockinfile:
        path: "{{ pg_hba_file }}"
        marker: "# {mark} ANSIBLE STIG MANAGED BLOCK"
        insertbefore: BOF
        backup: true
        block: |
          # Local connections
          local   all             all                                     peer

          # IPv4 local connections
          host    all             all             127.0.0.1/32            scram-sha-256

          # IPv6 local connections
          host    all             all             ::1/128                 scram-sha-256
      notify: restart postgresql

    - name: Ensure pgaudit package is installed (optional)
      ansible.builtin.package:
        name: "{{ pg_pgaudit_package }}"
        state: present
      register: postgresql_stig__pgaudit_pkg
      failed_when: postgresql_stig_require_pgaudit | bool and (postgresql_stig__pgaudit_pkg is failed)
      when: postgresql_stig_enable_pgaudit | bool

    - name: Query current shared_preload_libraries (optional)
      become_user: "{{ postgres_user }}"
      ansible.builtin.command: "psql -tA -d postgres -c 'show shared_preload_libraries'"
      register: postgresql_stig__spl
      changed_when: false
      failed_when: false
      when:
        - postgresql_stig_enable_pgaudit | bool
        - postgresql_stig__pgaudit_pkg is defined
        - not (postgresql_stig__pgaudit_pkg.failed | default(false))

    - name: Compute desired shared_preload_libraries with pgaudit
      ansible.builtin.set_fact:
        postgresql_stig__spl_current: "{{ postgresql_stig__spl.stdout | default('') | trim }}"
      when:
        - postgresql_stig_enable_pgaudit | bool
        - postgresql_stig__pgaudit_pkg is defined
        - not (postgresql_stig__pgaudit_pkg.failed | default(false))

    - name: Set shared_preload_libraries to include pgaudit
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*shared_preload_libraries\s*='
        line: >-
          shared_preload_libraries = '{{
            (((postgresql_stig__spl_current | default('') | length) > 0)
              | ternary((postgresql_stig__spl_current.split(',')), []))
            | map('trim')
            | reject('equalto','')
            | list
            + ['pgaudit']
            | unique
            | join(', ')
          }}'
        state: present
        backup: true
      notify: restart postgresql
      when:
        - postgresql_stig_enable_pgaudit | bool
        - postgresql_stig__pgaudit_pkg is defined
        - not (postgresql_stig__pgaudit_pkg.failed | default(false))

    - name: Enforce pgaudit.log categories (ddl, role, read, write)
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*pgaudit\.log\s*='
        line: "pgaudit.log = 'ddl, role, read, write'"
        state: present
        backup: true
      notify: restart postgresql
      when:
        - postgresql_stig_enable_pgaudit | bool
        - postgresql_stig__pgaudit_pkg is defined
        - not (postgresql_stig__pgaudit_pkg.failed | default(false))
    - name: PostgreSQL STIG | Enable connection logging
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*log_connections\s*='
        line: "log_connections = on"
        state: present
        backup: true
      notify: restart postgresql

    - name: PostgreSQL STIG | Enable disconnection logging
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*log_disconnections\s*='
        line: "log_disconnections = on"
        state: present
        backup: true
      notify: restart postgresql

    - name: PostgreSQL STIG | Set log_line_prefix with required fields
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*log_line_prefix\s*='
        line: "log_line_prefix = '< %m %a %u %d %r %p %c >'"
        state: present
        backup: true
      notify: restart postgresql
      tags:
        - postgresql
        - stig
        - logging

    - name: Enable logging_collector
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*logging_collector\s*='
        line: "logging_collector = {{ pg_logging_collector }}"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set log_directory
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*log_directory\s*='
        line: "log_directory = '{{ pg_log_directory }}'"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set log_filename
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*log_filename\s*='
        line: "log_filename = '{{ pg_log_filename }}'"
        state: present
        backup: true
      notify: restart postgresql

    - name: Flush handlers (apply PostgreSQL restart/reload before next roles)
      ansible.builtin.meta: flush_handlers

    - name: Ensure PostgreSQL service is running
      ansible.builtin.systemd:
        name: "{{ postgres_service_name }}"
        state: started
        enabled: true

############################################################
# SSL CONTROLS
############################################################

- name: PostgreSQL STIG | SSL configuration
  become: true
  tags:
    - postgresql
    - stig
    - ssl
  block:

    - name: Enable SSL
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*ssl\s*='
        line: "ssl = on"
        state: present
        backup: true
      notify: restart postgresql

    - name: Enforce strong password encryption (SCRAM)
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*password_encryption\s*='
        line: "password_encryption = scram-sha-256"
        state: present
        backup: true
      notify: restart postgresql

    - name: Enforce hostssl rules with client certificate requirement
      blockinfile:
        path: "{{ pg_data_dir }}/pg_hba.conf"
        marker: "# {mark} ANSIBLE STIG SSL MANAGED BLOCK"
        backup: true
        block: |
          # Enforce SSL connections only
          hostssl all all 0.0.0.0/0 scram-sha-256 clientcert=1
          hostssl all all ::0/0      scram-sha-256 clientcert=1
      notify: restart postgresql

############################################################
# SESSION / TCP HARDENING CONTROLS
############################################################

- name: PostgreSQL STIG | Session and TCP keepalive controls
  become: true
  tags:
    - postgresql
    - stig
    - session
    - tcp
  block:

    - name: Set statement_timeout
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*statement_timeout\s*='
        line: "statement_timeout = 10000"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set tcp_keepalives_idle
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*tcp_keepalives_idle\s*='
        line: "tcp_keepalives_idle = 10"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set tcp_keepalives_interval
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*tcp_keepalives_interval\s*='
        line: "tcp_keepalives_interval = 10"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set tcp_keepalives_count
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*tcp_keepalives_count\s*='
        line: "tcp_keepalives_count = 10"
        state: present
        backup: true
      notify: restart postgresql

############################################################
# CENTRALIZED LOGGING (SYSLOG)
############################################################

- name: PostgreSQL STIG | Enable syslog logging
  become: true
  tags:
    - postgresql
    - stig
    - logging
    - syslog
  block:

    - name: Ensure log_destination includes syslog
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*log_destination\s*='
        line: "log_destination = 'stderr, syslog'"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set syslog_facility
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*syslog_facility\s*='
        line: "syslog_facility = 'LOCAL0'"
        state: present
        backup: true
      notify: restart postgresql

    - name: Set syslog_ident
      lineinfile:
        path: "{{ pg_conf_file }}"
        regexp: '^\s*#?\s*syslog_ident\s*='
        line: "syslog_ident = 'postgres'"
        state: present
        backup: true
      notify: restart postgresql