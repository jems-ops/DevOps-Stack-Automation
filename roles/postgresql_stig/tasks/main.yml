---
############################################################
# PostgreSQL STIG Enforcement Role (Consolidated)
#
# DISA STIG note:
# - You indicated finding IDs are in the V-2140XX series.
# - This role annotates each enforcement step with "V-2140XX" as a placeholder.
# - Replace XX with the exact finding ID from your PostgreSQL STIG release (Version/Release).
############################################################

# STIG mapping (V-2140XX support): validate we're enforcing controls against the intended PostgreSQL instance.
# This prevents "false compliant" runs where we would edit the wrong service or wrong config path.
#
# NOTE: Do not use "systemctl status" as an existence check (it returns non-zero when the unit is stopped/failed).
- name: PostgreSQL STIG | Verify PostgreSQL systemd unit exists
  become: true
  ansible.builtin.command: "systemctl show {{ postgresql_stig_service_name }} -p LoadState"
  register: postgresql_stig__svc_show
  changed_when: false
  failed_when: false
  tags:
    - always

- name: PostgreSQL STIG | Fail when PostgreSQL systemd unit is not found
  ansible.builtin.fail:
    msg: "PostgreSQL systemd unit not found: {{ postgresql_stig_service_name }}"
  when: "'LoadState=not-found' in (postgresql_stig__svc_show.stdout | default(''))"
  tags:
    - always

# STIG mapping (V-2140XX support): ensure required PostgreSQL configuration files are present so compliance settings
# can be applied (postgresql.conf + pg_hba.conf).
- name: PostgreSQL STIG | Validate PostgreSQL config files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ postgresql_stig_conf_file }}"
    - "{{ postgresql_stig_hba_file }}"
  register: postgresql_stig__conf_stat
  changed_when: false
  tags:
    - always

# STIG mapping (V-2140XX support): fail fast when required configuration files are missing.
- name: PostgreSQL STIG | Fail when PostgreSQL config paths are missing
  ansible.builtin.fail:
    msg: >-
      PostgreSQL config file not found: {{ item.stat.path }}.
      Current vars: postgresql_stig_service_name={{ postgresql_stig_service_name }},
      postgresql_stig_data_dir={{ postgresql_stig_data_dir }},
      postgresql_stig_conf_file={{ postgresql_stig_conf_file }},
      postgresql_stig_hba_file={{ postgresql_stig_hba_file }}.
      If you're not using PostgreSQL 15 defaults, override these variables in inventory/group_vars.
  loop: "{{ postgresql_stig__conf_stat.results | default([]) }}"
  when:
    - postgresql_stig_fail_when_paths_missing | bool
    - item.stat.exists is defined
    - not item.stat.exists
  tags:
    - always

- name: PostgreSQL STIG | Apply PostgreSQL settings
  become: true
  tags:
    - postgresql
    - stig
  block:
    # STIG ID: V-2140XX - limit the number of concurrent connections to reduce risk of resource exhaustion / DoS.
    - name: Set max_connections
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\s*#?\s*max_connections\s*='
        line: "max_connections = {{ postgresql_stig_max_connections }}"
        state: present
        backup: true
      notify: restart postgresql

    # STIG ID: V-2140XX - enforce session keepalive and statement timeout controls to detect/terminate stale sessions
    # and reduce impact of hung/long-running queries.
    - name: PostgreSQL STIG | Enforce connection and timeout controls
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: "^\\s*#?\\s*{{ item.key }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
        state: present
        backup: true
      loop: "{{ postgresql_stig_connection_timeout_settings }}"
      notify: restart postgresql
      tags:
        - connection
        - timeout
      when:
        - postgresql_stig_connection_timeout_settings is defined
        - postgresql_stig_connection_timeout_settings | length > 0

    # STIG ID: V-2140XX - prevent excessive informational messages from being returned to clients (information disclosure).
    - name: Set client_min_messages to error
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\s*#?\s*client_min_messages\s*='
        line: "client_min_messages = error"
        state: present
        backup: true
      notify: restart postgresql

    # STIG ID: V-2140XX - enforce strong authentication for local/loopback connections (SCRAM) and avoid weak trust methods.
    # Note: This role manages a small "known-good" baseline; environment-specific access should be layered separately.
    - name: Enforce secure pg_hba rules
      ansible.builtin.blockinfile:
        path: "{{ postgresql_stig_hba_file }}"
        marker: "# {mark} ANSIBLE STIG MANAGED BLOCK"
        insertbefore: BOF
        backup: true
        block: |
          # Local connections
          local   all             all                                     peer

          # IPv4 local connections
          host    all             all             127.0.0.1/32            scram-sha-256

          # IPv6 local connections
          host    all             all             ::1/128                 scram-sha-256
      notify: restart postgresql

    # STIG ID: V-2140XX - enable audit extension support (pgaudit) to ensure required audit records can be generated.
    - name: Ensure pgaudit package is installed (optional)
      ansible.builtin.package:
        name: "{{ postgresql_stig_pgaudit_package }}"
        state: present
      register: postgresql_stig__pgaudit_pkg
      failed_when: postgresql_stig_pgaudit_required | bool and (postgresql_stig__pgaudit_pkg is failed)
      when: postgresql_stig_pgaudit_enabled | bool

    # STIG ID: V-2140XX - ensure audit provider is loaded at server start (shared_preload_libraries).
    # NOTE: We avoid querying via psql here so the role can still remediate when PostgreSQL is down.
    - name: PostgreSQL STIG | Derive PostgreSQL major version (best effort)
      ansible.builtin.set_fact:
        postgresql_stig__pg_major_from_svc: >-
          {{ postgresql_stig_service_name | regex_search('postgresql-([0-9]+)$', '\\1') | default('') }}
        postgresql_stig__pg_major_from_data: >-
          {{ postgresql_stig_data_dir | regex_search('/([0-9]+)/data$', '\\1') | default('') }}
        postgresql_stig__pg_major: >-
          {{
            postgresql_stig__pg_major_from_svc
            if (postgresql_stig__pg_major_from_svc | length > 0)
            else postgresql_stig__pg_major_from_data
          }}
      changed_when: false

    - name: PostgreSQL STIG | Build pgaudit library search paths (best effort)
      ansible.builtin.set_fact:
        postgresql_stig__pgaudit_lib_dirs: >-
          {{
            ((postgresql_stig__pg_major | default('') | length) > 0)
            | ternary([
              '/usr/pgsql-' ~ postgresql_stig__pg_major ~ '/lib'
            ], [])
            + [
              '/usr/lib64/pgsql',
              '/usr/lib/pgsql',
              '/usr/lib64/postgresql',
              '/usr/lib/postgresql'
            ]
          }}
      changed_when: false

    - name: PostgreSQL STIG | Check for pgaudit.so
      ansible.builtin.stat:
        path: "{{ item }}/pgaudit.so"
      loop: "{{ postgresql_stig__pgaudit_lib_dirs }}"
      register: postgresql_stig__pgaudit_lib_stat
      changed_when: false

    - name: PostgreSQL STIG | Set pgaudit library found fact
      ansible.builtin.set_fact:
        postgresql_stig__pgaudit_lib_found: >-
          {{
            (postgresql_stig__pgaudit_lib_stat.results | default([])
              | selectattr('stat.exists','defined')
              | selectattr('stat.exists')
              | list
              | length) > 0
          }}
      changed_when: false

    - name: PostgreSQL STIG | Read postgresql.conf for shared_preload_libraries
      ansible.builtin.slurp:
        src: "{{ postgresql_stig_conf_file }}"
      register: postgresql_stig__conf_slurp
      changed_when: false

    - name: PostgreSQL STIG | Compute desired shared_preload_libraries (add/remove pgaudit)
      ansible.builtin.set_fact:
        postgresql_stig__conf_text: "{{ postgresql_stig__conf_slurp.content | b64decode }}"
        postgresql_stig__spl_current: >-
          {{
            (postgresql_stig__conf_text
              | regex_search("(?m)^\\s*shared_preload_libraries\\s*=\\s*([^\\n#]+)", "\\1"))
            | default('')
            | trim
            | regex_replace("^'", '')
            | regex_replace("'$", '')
            | regex_replace('^"', '')
            | regex_replace('"$', '')
            | trim
          }}
        postgresql_stig__spl_list: >-
          {{
            ((postgresql_stig__spl_current | default('')) != '')
            | ternary((postgresql_stig__spl_current.split(',') | map('trim') | reject('equalto','') | list), [])
          }}
        postgresql_stig__pgaudit_pkg_failed: >-
          {{
            (postgresql_stig__pgaudit_pkg is defined)
            and (postgresql_stig__pgaudit_pkg.failed | default(false))
          }}
        postgresql_stig__pgaudit_pkg_ok: "{{ not (postgresql_stig__pgaudit_pkg_failed | bool) }}"
        postgresql_stig__pgaudit_should_be_enabled: >-
          {{
            (postgresql_stig_pgaudit_enabled | bool)
            and (postgresql_stig__pgaudit_pkg_ok | bool)
            and (postgresql_stig__pgaudit_lib_found | bool)
          }}
        postgresql_stig__spl_new_list: >-
          {{
            (postgresql_stig__pgaudit_should_be_enabled | bool)
            | ternary(
              ((postgresql_stig__spl_list | default([])) + ['pgaudit']) | unique | list,
              (postgresql_stig__spl_list | default([])) | reject('equalto','pgaudit') | list
            )
          }}
        postgresql_stig__spl_new: "{{ postgresql_stig__spl_new_list | join(', ') }}"
      changed_when: false

    - name: PostgreSQL STIG | Set shared_preload_libraries when needed
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\\s*#?\\s*shared_preload_libraries\\s*='
        line: "shared_preload_libraries = '{{ postgresql_stig__spl_new }}'"
        state: present
        backup: true
      notify: restart postgresql
      when: (postgresql_stig__spl_new_list | length) > 0

    - name: PostgreSQL STIG | Remove shared_preload_libraries when empty
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\\s*#?\\s*shared_preload_libraries\\s*='
        state: absent
        backup: true
      notify: restart postgresql
      when: (postgresql_stig__spl_new_list | length) == 0

    - name: PostgreSQL STIG | Note when pgaudit is enabled but library is missing
      ansible.builtin.debug:
        msg: >-
          pgaudit requested but pgaudit.so was not found in expected library paths.
          PostgreSQL will be configured WITHOUT pgaudit to avoid startup failure.
          Checked: {{ postgresql_stig__pgaudit_lib_dirs }}
          Package attempted: {{ postgresql_stig_pgaudit_package }}
        verbosity: 1
      when:
        - postgresql_stig_pgaudit_enabled | bool
        - not (postgresql_stig__pgaudit_should_be_enabled | bool)

    - name: Flush handlers (attempt service recovery before failing for missing required pgaudit)
      ansible.builtin.meta: flush_handlers
      when:
        - postgresql_stig_pgaudit_enabled | bool
        - postgresql_stig_pgaudit_required | bool
        - not (postgresql_stig__pgaudit_lib_found | bool)

    - name: PostgreSQL STIG | Fail when pgaudit is required but the library is missing
      ansible.builtin.fail:
        msg: >-
          pgaudit is required but PostgreSQL cannot load it (missing pgaudit.so).
          Fix by installing the correct pgaudit package for this PostgreSQL version (override postgresql_stig_pgaudit_package)
          or disable via postgresql_stig_pgaudit_enabled=false.
          Checked: {{ postgresql_stig__pgaudit_lib_dirs }}
      when:
        - postgresql_stig_pgaudit_enabled | bool
        - postgresql_stig_pgaudit_required | bool
        - not (postgresql_stig__pgaudit_lib_found | bool)

    # STIG ID: V-2140XX - configure audit/log forwarding to an approved central logging facility (syslog).
    - name: Configure PostgreSQL to log to syslog
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\s*#?\s*log_destination\s*='
        line: "log_destination = '{{ postgresql_stig_log_destination }}'"
        state: present
        backup: true
      notify: restart postgresql
      tags:
        - logging

    # STIG ID: V-2140XX - disable local log file collection by default (prefer syslog/centralized logging).
    - name: Disable logging_collector
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\s*#?\s*logging_collector\s*='
        line: "logging_collector = {{ postgresql_stig_logging_collector }}"
        state: present
        backup: true
      notify: restart postgresql
      tags:
        - logging

    # STIG ID: V-2140XX - log connection lifecycle events and include required identifiers for audit traceability.
    - name: PostgreSQL STIG | Enforce logging connection controls
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: "^\\s*#?\\s*{{ item.key }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
        state: present
        backup: true
      loop: "{{ postgresql_stig_logging_connection_settings }}"
      notify: Reload PostgreSQL
      tags:
        - logging
        - audit
      when:
        - postgresql_stig_logging_connection_settings is defined
        - postgresql_stig_logging_connection_settings | length > 0

    # STIG ID: V-2140XX - (conditional) when file logging is enabled, enforce an explicit log location/name for
    # controlled retention + access controls.
    - name: Set log_directory (only when logging_collector is on)
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\s*#?\s*log_directory\s*='
        line: "log_directory = '{{ postgresql_stig_log_directory }}'"
        state: present
        backup: true
      notify: restart postgresql
      when: (postgresql_stig_logging_collector | lower) == 'on'
      tags:
        - logging

    # STIG ID: V-2140XX - (conditional) when file logging is enabled, enforce an explicit log filename pattern.
    - name: Set log_filename (only when logging_collector is on)
      ansible.builtin.lineinfile:
        path: "{{ postgresql_stig_conf_file }}"
        regexp: '^\s*#?\s*log_filename\s*='
        line: "log_filename = '{{ postgresql_stig_log_filename }}'"
        state: present
        backup: true
      notify: restart postgresql
      when: (postgresql_stig_logging_collector | lower) == 'on'
      tags:
        - logging

    # Operational: ensure configuration changes (restart/reload) take effect before dependent roles execute.
    - name: Flush handlers (apply PostgreSQL restart/reload before next roles)
      ansible.builtin.meta: flush_handlers

    # STIG ID: V-2140XX - ensure the PostgreSQL service is enabled and running (required for compliant operation).
    - name: Ensure PostgreSQL service is running
      ansible.builtin.systemd:
        name: "{{ postgresql_stig_service_name }}"
        state: started
        enabled: true
