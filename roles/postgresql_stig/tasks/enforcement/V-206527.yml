############################################################
# PostgreSQL STIG | V-206527
# Enable session auditing
############################################################

- name: Ensure logging_collector is enabled
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*logging_collector\s*='
    line: "logging_collector = on"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206527

- name: Enable connection logging
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_connections\s*='
    line: "log_connections = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206527

- name: Enable disconnection logging
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_disconnections\s*='
    line: "log_disconnections = on"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206527

- name: Ensure log_line_prefix includes session identifier
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %H %p %u %d %c %h %r %a %e '"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206527
