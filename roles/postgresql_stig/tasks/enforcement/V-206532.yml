############################################################
# PostgreSQL STIG | V-206532
# Ensure audit record includes outcome of event
############################################################

- name: Ensure log_line_prefix includes SQLSTATE
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_line_prefix\s*='
    line: "log_line_prefix = '%m %p %u %d %c %h %r %a %e '"
    backup: true
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206532
    - logging

- name: Ensure log_min_error_statement is error
  become: true
  lineinfile:
    path: "{{ pg_conf_file }}"
    regexp: '^\s*#?\s*log_min_error_statement\s*='
    line: "log_min_error_statement = error"
  notify: Restart PostgreSQL
  tags:
    - stig
    - V-206532
    - logging
