############################################################
# Validation for V-206531
############################################################

- name: Generate test log entry
  become: true
  become_user: postgres
  command: psql -c "SELECT 1;"
  tags:
    - audit
    - V-206531

- name: Verify log contains client source information
  become: true
  shell: |
    tail -n 5 {{ pg_data_dir }}/log/*
  register: log_sample
  changed_when: false
  tags:
    - audit
    - V-206531

- name: Fail if client source information is not present in logs
  fail:
    msg: "Client source information is not present in PostgreSQL logs."
  when: "'client=' not in log_sample.stdout"
  tags:
    - audit
    - V-206531
