---
- name: Display SonarQube installation information
  debug:
    msg: |
      🔍 Installing SonarQube on {{ inventory_hostname }}
      📅 Installation time: {{ ansible_date_time.iso8601 }}
      🏠 SonarQube Home: {{ sonarqube_home }}
      🔌 SonarQube Port: {{ sonarqube_port }}
      📊 Version: {{ sonarqube_version }}

- name: Update package cache
  dnf:
    update_cache: yes

- name: Install required packages
  dnf:
    name: "{{ sonarqube_required_packages }}"
    state: present

- name: Install Java OpenJDK
  dnf:
    name: "{{ java_package }}"
    state: present

- name: Set system parameters for SonarQube
  sysctl:
    name: vm.max_map_count
    value: "{{ sonarqube_max_map_count }}"
    state: present
    sysctl_set: yes
    reload: yes

- name: Create SonarQube group
  group:
    name: "{{ sonarqube_group }}"
    state: present

- name: Create SonarQube user
  user:
    name: "{{ sonarqube_user }}"
    group: "{{ sonarqube_group }}"
    home: "{{ sonarqube_home }}"
    shell: /bin/bash
    system: yes
    create_home: no

- name: Initialize PostgreSQL database (idempotent)
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  register: postgres_init
  changed_when: postgres_init.rc == 0

- name: Start and enable PostgreSQL service
  ansible.builtin.systemd:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: yes

- name: Ensure PostgreSQL uses SCRAM password encryption (required for scram-sha-256 pg_hba rules)
  block:
    - name: Get postgresql.conf path from PostgreSQL
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: psql -tAc "show config_file;"
      register: postgresql_config_file_cmd
      changed_when: false

    - name: Set postgresql.conf path fact
      ansible.builtin.set_fact:
        postgresql_conf_file: "{{ postgresql_config_file_cmd.stdout | trim }}"

    - name: Configure password_encryption = scram-sha-256
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_file }}"
        regexp: "^#?\\s*password_encryption\\s*="
        line: "password_encryption = 'scram-sha-256'"
      notify: restart postgresql

    - name: Flush handlers so PostgreSQL restarts before role password is set
      ansible.builtin.meta: flush_handlers

- name: Configure PostgreSQL auth for SonarQube on localhost (avoid ident)
  block:
    - name: Get pg_hba.conf path from PostgreSQL
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: psql -tAc "show hba_file;"
      register: postgresql_pg_hba_file_cmd
      changed_when: false

    - name: Set pg_hba.conf path fact
      ansible.builtin.set_fact:
        postgresql_pg_hba_file: "{{ postgresql_pg_hba_file_cmd.stdout | trim }}"

- name: Remove existing SonarQube pg_hba localhost rule (IPv4) so we can re-insert in correct order
  ansible.builtin.lineinfile:
    path: "{{ postgresql_pg_hba_file }}"
    regexp: "^host\\s+{{ postgresql_db_name }}\\s+{{ postgresql_db_user }}\\s+127\\.0\\.0\\.1/32\\s+"
    state: absent
  notify: restart postgresql

- name: Allow SonarQube DB password auth on localhost (IPv4) (must be before generic ident rule)
  ansible.builtin.lineinfile:
    path: "{{ postgresql_pg_hba_file }}"
    line: "host    {{ postgresql_db_name }}    {{ postgresql_db_user }}    127.0.0.1/32    scram-sha-256"
    insertbefore: "^host\\s+all\\s+all\\s+127\\.0\\.0\\.1/32\\s+"
  notify: restart postgresql

- name: Remove existing SonarQube pg_hba localhost rule (IPv6) so we can re-insert in correct order
  ansible.builtin.lineinfile:
    path: "{{ postgresql_pg_hba_file }}"
    regexp: "^host\\s+{{ postgresql_db_name }}\\s+{{ postgresql_db_user }}\\s+::1/128\\s+"
    state: absent
  notify: restart postgresql

- name: Allow SonarQube DB password auth on localhost (IPv6) (must be before generic ident rule)
  ansible.builtin.lineinfile:
    path: "{{ postgresql_pg_hba_file }}"
    line: "host    {{ postgresql_db_name }}    {{ postgresql_db_user }}    ::1/128         scram-sha-256"
    insertbefore: "^host\\s+all\\s+all\\s+::1/128\\s+"
  notify: restart postgresql

- name: Flush handlers so PostgreSQL restarts before SonarQube connects
  ansible.builtin.meta: flush_handlers

- name: Create SonarQube database user
  become: true
  become_user: postgres
  postgresql_user:
    name: "{{ postgresql_db_user }}"
    password: "{{ postgresql_db_password }}"
    state: present

- name: Check SonarQube DB user password hash format
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >-
      psql -tAc "select case
        when rolpassword like 'SCRAM-SHA-256$%' then 'scram'
        when rolpassword like 'md5%' then 'md5'
        when rolpassword is null then 'null'
        else 'other'
      end
      from pg_authid where rolname='{{ postgresql_db_user }}';"
  register: postgresql_sonar_pw_format
  changed_when: false
  failed_when: false

- name: Re-set SonarQube DB user password to generate a SCRAM secret
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - "pass={{ postgresql_db_password }}"
      - -tAc
      - "ALTER ROLE {{ postgresql_db_user }} PASSWORD :'pass';"
  when: (postgresql_sonar_pw_format.stdout | trim) != 'scram'
  no_log: true

- name: Create SonarQube database
  become: true
  become_user: postgres
  postgresql_db:
    name: "{{ postgresql_db_name }}"
    owner: "{{ postgresql_db_user }}"
    state: present

- name: Check if SonarQube is already downloaded
  stat:
    path: "{{ sonarqube_home }}"
  register: sonarqube_installed

- name: Download SonarQube
  get_url:
    url: "{{ sonarqube_download_url }}"
    dest: /tmp/sonarqube.zip
    mode: '0644'
  when: not sonarqube_installed.stat.exists

- name: Create SonarQube home directory
  file:
    path: "{{ sonarqube_home }}"
    state: directory
    owner: "{{ sonarqube_user }}"
    group: "{{ sonarqube_group }}"
    mode: '0755'

- name: Extract SonarQube
  unarchive:
    src: /tmp/sonarqube.zip
    dest: /opt
    remote_src: yes
    creates: "/opt/sonarqube-{{ sonarqube_version }}"
  when: not sonarqube_installed.stat.exists

- name: Create symlink to SonarQube
  file:
    src: "/opt/sonarqube-{{ sonarqube_version }}"
    dest: "{{ sonarqube_home }}"
    state: link
    force: yes
  when: not sonarqube_installed.stat.exists

- name: Set ownership of SonarQube directory
  file:
    path: "{{ sonarqube_home }}"
    owner: "{{ sonarqube_user }}"
    group: "{{ sonarqube_group }}"
    recurse: yes
    state: directory

- name: Create SonarQube data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sonarqube_user }}"
    group: "{{ sonarqube_group }}"
    mode: '0755'
  loop:
    - "{{ sonarqube_data_dir }}"
    - "{{ sonarqube_logs_dir }}"
    - "{{ sonarqube_temp_dir }}"

- name: Deploy SonarQube configuration
  template:
    src: sonar.properties.j2
    dest: "{{ sonarqube_home }}/conf/sonar.properties"
    owner: "{{ sonarqube_user }}"
    group: "{{ sonarqube_group }}"
    mode: '0644'
    backup: yes
  notify: restart sonarqube

- name: Create SonarQube systemd service
  template:
    src: sonarqube.service.j2
    dest: /etc/systemd/system/sonarqube.service
    mode: '0644'
  notify:
    - reload systemd
    - restart sonarqube

- name: Configure firewall for SonarQube
  firewalld:
    port: "{{ sonarqube_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
  ignore_errors: yes

- name: Start and enable SonarQube service
  systemd:
    name: sonarqube
    enabled: "{{ sonarqube_service_enabled }}"
    state: "{{ sonarqube_service_state }}"
    daemon_reload: yes

- name: Wait for SonarQube to start (local)
  wait_for:
    port: "{{ sonarqube_port }}"
    host: 127.0.0.1
    delay: 10
    timeout: 600
  when: sonarqube_service_state == "started"

- name: Test SonarQube web interface (local)
  uri:
    url: "http://127.0.0.1:{{ sonarqube_port }}"
    method: GET
    timeout: 10
    status_code:
      - 200
      - 302
  register: sonarqube_status_check
  ignore_errors: yes

- name: Clean up download file
  file:
    path: /tmp/sonarqube.zip
    state: absent

- name: Display SonarQube installation completion
  debug:
    msg: |
      ✅ SonarQube Installation Complete!

      📋 Access Information:
      • URL: http://{{ inventory_hostname }}:{{ sonarqube_port }}
      • Status: {{ 'Running' if sonarqube_status_check.status is defined and sonarqube_status_check.status == 200 else 'Starting up' }}
      • Default Login: admin/admin

      📊 Service Details:
      • SonarQube Home: {{ sonarqube_home }}
      • Version: {{ sonarqube_version }}
      • Database: PostgreSQL
      • Java Version: {{ java_package }}

      🔧 Next Steps:
      1. Access SonarQube web interface
      2. Complete initial setup (change default password)
      3. Configure quality profiles
      4. Set up project analysis
