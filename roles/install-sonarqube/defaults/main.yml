---
# Default variables for SonarQube installation

# SonarQube configuration
sonarqube_version: "10.3.0.82913"
sonarqube_download_url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
sonarqube_user: sonar
sonarqube_group: sonar
sonarqube_home: /opt/sonarqube
sonarqube_data_dir: "{{ sonarqube_home }}/data"
sonarqube_logs_dir: "{{ sonarqube_home }}/logs"
sonarqube_temp_dir: "{{ sonarqube_home }}/temp"

# Java configuration
java_package: java-17-openjdk-devel

# PostgreSQL configuration
#
# Use an available PostgreSQL 16.x that supports pgaudit.
# Default install method is PGDG (keeps you on the latest 16.x + provides pgaudit packages).
sonarqube_postgresql_major_version: 16
sonarqube_postgresql_install_method: pgdg  # pgdg | distro_module
sonarqube_postgresql_install_pgaudit: true
sonarqube_postgresql_configure_pgaudit: true

# PGDG repo RPM (computed from target host facts)
sonarqube_pgdg_repo_rpm_url: >-
  https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}/pgdg-redhat-repo-latest.noarch.rpm

# Derived instance targeting used by the tasks below
postgresql_service_name: >-
  {{ 'postgresql-' ~ sonarqube_postgresql_major_version if sonarqube_postgresql_install_method == 'pgdg' else 'postgresql' }}
sonarqube_postgresql_data_dir: >-
  {{ '/var/lib/pgsql/' ~ sonarqube_postgresql_major_version ~ '/data' if sonarqube_postgresql_install_method == 'pgdg' else '/var/lib/pgsql/data' }}
sonarqube_postgresql_initdb_cmd: >-
  {{ '/usr/pgsql-' ~ sonarqube_postgresql_major_version ~ '/bin/postgresql-' ~ sonarqube_postgresql_major_version ~ '-setup initdb'
     if sonarqube_postgresql_install_method == 'pgdg'
     else 'postgresql-setup --initdb' }}

sonarqube_postgresql_psql_cmd: >-
  {{ '/usr/pgsql-' ~ sonarqube_postgresql_major_version ~ '/bin/psql'
     if sonarqube_postgresql_install_method == 'pgdg'
     else 'psql' }}

sonarqube_postgresql_packages: >-
  {{ sonarqube_postgresql_packages_pgdg if sonarqube_postgresql_install_method == 'pgdg' else sonarqube_postgresql_packages_distro }}

sonarqube_postgresql_packages_pgdg:
  - "postgresql{{ sonarqube_postgresql_major_version }}"
  - "postgresql{{ sonarqube_postgresql_major_version }}-server"
  - "postgresql{{ sonarqube_postgresql_major_version }}-contrib"
  - "pgaudit_{{ sonarqube_postgresql_major_version }}"

sonarqube_postgresql_packages_distro:
  - postgresql
  - postgresql-server
  - postgresql-contrib

postgresql_db_name: sonarqube
postgresql_db_user: sonar
postgresql_db_password: "{{ vault_postgresql_db_password | default('sonar123') }}"

# SonarQube service configuration
sonarqube_port: 9000
sonarqube_service_enabled: yes
sonarqube_service_state: started

# System configuration
sonarqube_max_map_count: 524288
sonarqube_max_file_descriptors: 131072

# Required packages
sonarqube_required_packages:
  - wget
  - unzip
  - curl
  - python3-psycopg2

# SonarQube properties
sonarqube_web_host: 0.0.0.0
sonarqube_web_port: "{{ sonarqube_port }}"
sonarqube_web_context: ""

# Database connection
sonarqube_db_url: "jdbc:postgresql://localhost/{{ postgresql_db_name }}"
sonarqube_db_username: "{{ postgresql_db_user }}"
sonarqube_db_password: "{{ vault_sonarqube_db_password | default(postgresql_db_password) }}"
