---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: sonarqube-stig-rocky8
    image: geerlingguy/docker-rockylinux8-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    capabilities:
      - SYS_ADMIN
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  inventory:
    host_vars:
      sonarqube-stig-rocky8:
        ansible_user: root
        # Keep Molecule fast/minimal; enable this once tailoring is finalized.
        sonarqube_stig_run_rhel8_stig: false

verifier:
  name: testinfra

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
