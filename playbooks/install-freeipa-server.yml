---
- name: Install and Configure FreeIPA Server
  hosts: freeipa
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Display installation information
      debug:
        msg: |
          🔧 FreeIPA Installation Playbook
          📅 Execution time: {{ ansible_date_time.iso8601 }}
          🖥️  Target server: {{ inventory_hostname }} ({{ ansible_host }})
          👤 User: {{ ansible_user }}

  roles:
    - install-freeipa

  post_tasks:
    - name: Display completion message
      debug:
        msg: |
          ✅ FreeIPA Installation Playbook Complete!

          📊 Summary:
          • FreeIPA installed on: {{ ansible_host }}
          • DNS Name: {{ freeipa_hostname }}
          • Domain: {{ freeipa_domain }}
          • Realm: {{ freeipa_realm }}
          • Web UI: https://{{ freeipa_hostname }}
          • LDAP: {{ ansible_host }}:389 (StartTLS) / 636 (LDAPS)
          • Kerberos: {{ freeipa_realm }}

          🔧 Next Steps:
          1. Add to /etc/hosts: {{ ansible_host }} {{ freeipa_hostname }}
          2. Configure Keycloak to connect to FreeIPA LDAP
          3. Set up SAML client for SonarQube
          4. Test SSO authentication flow
