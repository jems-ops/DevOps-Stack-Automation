---
- name: Setup Nginx Reverse Proxy for SonarQube
  hosts: nginx
  gather_facts: yes
  become: yes

  vars:
    backend_service: sonarqube

  pre_tasks:
    - name: Display proxy setup information
      debug:
        msg: |
          🔍 SonarQube Nginx Reverse Proxy Setup Playbook
          📅 Execution time: {{ ansible_date_time.iso8601 }}
          🖥️  Nginx server: {{ inventory_hostname }}
          🔗 SonarQube backend: {{ (site_backends | selectattr('server_name', 'equalto', 'sonar.local') | first).ip }}:{{ (site_backends | selectattr('server_name', 'equalto', 'sonar.local') | first).port }}
          👤 User: {{ ansible_user }}

  roles:
    - setup-nginx-reverse-proxy

  post_tasks:
    - name: Display completion message
      debug:
        msg: |
          ✅ SonarQube Nginx Reverse Proxy Setup Complete!

          📊 Summary:
          • Nginx server: {{ inventory_hostname }}
          • Backend: {{ (site_backends | selectattr('server_name', 'equalto', 'sonar.local') | first).ip }}:{{ (site_backends | selectattr('server_name', 'equalto', 'sonar.local') | first).port }}
          • Configuration: /etc/nginx/conf.d/dynamic-backends.conf

          🌐 Access Information:
          • Direct SonarQube: http://{{ (site_backends | selectattr('server_name', 'equalto', 'sonar.local') | first).ip }}:{{ (site_backends | selectattr('server_name', 'equalto', 'sonar.local') | first).port }}
          • Via Proxy: http://{{ inventory_hostname }}
          • Domain: http://sonar.local (configure DNS)

          🔧 Next Steps:
          1. Test proxy: curl -I http://{{ inventory_hostname }}
          2. Configure DNS/hosts for sonar.local
          3. Install SSL certificate (run install-ssl-cert.yml)
