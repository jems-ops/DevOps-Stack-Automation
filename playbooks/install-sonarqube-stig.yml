---
- name: Install SonarQube (if needed), apply STIG tailoring, and verify service state
  hosts: sonarqube
  gather_facts: yes
  become: yes

  tasks:
    - name: Check whether SonarQube systemd unit exists
      ansible.builtin.stat:
        path: /etc/systemd/system/sonarqube.service
      register: sonarqube_unit

    - name: Install SonarQube when not present
      ansible.builtin.include_role:
        name: install-sonarqube
      when: not (sonarqube_unit.stat.exists | default(false))

    - name: Apply SonarQube STIG role
      ansible.builtin.include_role:
        name: sonarqube-stig

    - name: Ensure SonarQube is enabled and started (final safety check)
      ansible.builtin.systemd:
        name: sonarqube
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify SonarQube listens on port 9000
      ansible.builtin.wait_for:
        port: 9000
        delay: 5
        timeout: 180
