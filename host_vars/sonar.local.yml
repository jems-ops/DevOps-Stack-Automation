---
############################################################
# sonar.local — Host-Specific PostgreSQL SRG Variables
#
# These override role defaults in roles/postgresql_SRG/defaults/main.yml.
# Only host-specific or environment-specific values belong here.
# Generic/safe defaults remain in the role's defaults/main.yml.
############################################################

############################################################
# Application Services
# Defines which apps use this PostgreSQL instance.
# Each entry drives: pg_hba.conf, DB/user provisioning,
# backup, healthcheck, and validation.
############################################################
postgresql_srg_application_services:
  - name: SonarQube
    service_name: sonarqube
    db_name: sonarqube
    db_user: sonar
    backup_configs:
      - /opt/sonarqube/conf/sonar.properties
      - /opt/sonarqube/conf/wrapper.conf
    web_url: "https://sonar.local"
    health_endpoint: /api/system/status
    healthy_field: status
    healthy_value: UP
    validate_certs: false
    timeout: 30
  # Uncomment to add more applications on this host:
  # - name: Bitbucket
  #   service_name: bitbucket
  #   db_name: bitbucket
  #   db_user: bitbucketuser
  #   backup_configs:
  #     - /var/atlassian/application-data/bitbucket/shared/bitbucket.properties
  #   web_url: "https://bitbucket.local"
  #   health_endpoint: /status
  #   healthy_field: state
  #   healthy_value: RUNNING
  #   validate_certs: false
  #   timeout: 30

############################################################
# Approved Login Roles
# Roles permitted to authenticate to this PostgreSQL instance.
############################################################
postgresql_srg_approved_login_roles:
  - postgres
  - sonar
  - stig_validate_role
  - stig_limited

############################################################
# Allowed Databases
# Databases permitted on this instance (V-206549).
# Add entries for each app sharing this PostgreSQL server.
############################################################
postgresql_srg_allowed_databases:
  - postgres
  - sonarqube
  # Uncomment if these apps share this PostgreSQL instance:
  # - bitbucket
  # - confluence
  # - satellite

############################################################
# Feature Toggles
# Override role defaults for this specific host.
############################################################

# pgaudit — enabled on this host
postgresql_srg_pgaudit_enabled: true

# FIPS — set to true once OS-level FIPS is confirmed active
postgresql_srg_fips_required: false

# Safety guard — set to true only after confirming allowed lists are complete
postgresql_srg_allow_removal: false

# SELinux — this host runs SELinux enforcing
postgresql_srg_selinux_required: true

############################################################
# Per-Control Toggles — CAT I
# All CAT I controls enabled for this host.
############################################################
postgresql_srg_v206520_enabled: true    # Authentication / isolation
postgresql_srg_v206521_enabled: true    # Least-privilege access control
postgresql_srg_v206545_enabled: true    # Installation account control
postgresql_srg_v206555_enabled: true    # Password storage security
postgresql_srg_v206556_enabled: true    # SCRAM password hashing
postgresql_srg_v206557_enabled: true    # Password transmission protection
postgresql_srg_v206559_enabled: true    # PKI private key protection
postgresql_srg_v206561_enabled: true    # No authentication secret display
postgresql_srg_v206562_enabled: true    # FIPS 140-2 validated modules
postgresql_srg_v206570_enabled: true    # Data-at-rest protection
postgresql_srg_v206604_enabled: true    # Data-in-transit confidentiality
postgresql_srg_v206605_enabled: true    # Information confidentiality
postgresql_srg_v265854_enabled: true    # Supported DBMS version
postgresql_srg_v233495_enabled: true    # NSA-approved cryptography

############################################################
# Per-Control Toggles — CAT II
# Set to true as controls are validated for this host.
############################################################
postgresql_srg_v206519_enabled: false   # Concurrent session limits
postgresql_srg_v206522_enabled: false   # Non-repudiation logging
postgresql_srg_v206523_enabled: false   # DoD audit records
postgresql_srg_v206524_enabled: false   # Audit config access
postgresql_srg_v206525_enabled: false   # Privilege/role audit
postgresql_srg_v206526_enabled: false   # Unsuccessful privilege audit
postgresql_srg_v206527_enabled: false   # Session audit on startup
postgresql_srg_v206528_enabled: false   # Event type in audit records
postgresql_srg_v206529_enabled: false   # Timestamps in audit records
postgresql_srg_v206530_enabled: false   # Event location in audit records
postgresql_srg_v206531_enabled: false   # Source/origin in audit records
postgresql_srg_v206532_enabled: false   # Event outcome in audit records
postgresql_srg_v206533_enabled: false   # User identity in audit records
postgresql_srg_v206534_enabled: false   # Additional audit info
postgresql_srg_v206537_enabled: false   # System clock for timestamps
postgresql_srg_v206538_enabled: false   # Audit read protection
postgresql_srg_v206539_enabled: false   # Audit delete protection
postgresql_srg_v206540_enabled: false   # Audit log access protection
postgresql_srg_v206541_enabled: false   # Audit feature access protection
postgresql_srg_v206542_enabled: false   # Audit config modification protection
postgresql_srg_v206543_enabled: false   # Audit feature disable protection
postgresql_srg_v206544_enabled: false   # Software module modification
postgresql_srg_v206546_enabled: false   # Software/data directory locations
postgresql_srg_v206547_enabled: false   # DB objects owned by authorized accounts
postgresql_srg_v206548_enabled: false   # DDL modification restriction
postgresql_srg_v206549_enabled: false   # Remove demo/sample databases
postgresql_srg_v206550_enabled: false   # Remove unused components
postgresql_srg_v206551_enabled: false   # Disable unnecessary components
postgresql_srg_v206552_enabled: false   # Restrict external executables
postgresql_srg_v206553_enabled: false   # Restrict network ports/protocols
postgresql_srg_v206554_enabled: false   # Non-org user authentication
postgresql_srg_v206565_enabled: false   # Session identifier invalidation
postgresql_srg_v206566_enabled: false   # Session ID generation
postgresql_srg_v206567_enabled: false   # MITM protection
postgresql_srg_v206580_enabled: false   # Inactive session termination
postgresql_srg_v206600_enabled: false   # Privilege escalation prevention
postgresql_srg_v206611_enabled: false   # Security patch maintenance
