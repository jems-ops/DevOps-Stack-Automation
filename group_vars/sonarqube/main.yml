---
# SonarQube hosts: force-run the RHEL8 STIG baseline on Rocky 9 (NOT recommended for compliance accuracy).
# This file exists to iteratively tailor the upstream roles/rhel8-stig role until the play completes.

# SonarQube host access (lab)
# Use key-based auth rather than passwords for automation.
ansible_user: vagrant
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.vagrant.d/insecure_private_key"

# SonarQube/PostgreSQL credentials (lab)
# We intentionally force both to the same value to avoid startup failures due to mismatched vault values.
postgresql_db_password: "sonar123"
sonarqube_db_password: "sonar123"

# PostgreSQL STIG exceptions (role-level)
# We are explicitly not enabling pgaudit right now because it is not installable in this lab environment.
# Use exact V- IDs from your PostgreSQL STIG release to replace the placeholder.
postgresql_stig_exceptions:
  - id: V-2140XX
    control: pgaudit
    value: false
    reason: pgaudit is not available on this server; enabling it would prevent PostgreSQL from starting.

  - id: CCI-000015
    control: centralized_authentication
    value: local (peer + scram-sha-256)
    reason: >-
      Centralized authentication (LDAP/Kerberos/SSPI via pg_hba methods like ldap/gss/sspi)
      is not yet available in this lab environment; the system is awaiting enterprise identity integration.
    mitigation: >-
      Database access is restricted; local authentication uses SCRAM-SHA-256 and RBAC; OS STIG hardening and logging are enabled.
    poam: docs/stig-exceptions/postgresql-centralized-auth-cci-000015.md

  - id: CCI-002422
    control: ssl_enforcement
    value: ssl=off; pg_hba host (non-hostssl) without clientcert
    reason: >-
      SSL/TLS enforcement and client certificate validation with enterprise PKI are not yet implemented;
      the system is operating within an isolated boundary and is not externally accessible.
    mitigation: >-
      Localhost-only access where applicable; firewall restrictions; encrypted network segment;
      OS STIG hardened; strong password policies; audit logging enabled.
    poam: docs/stig-exceptions/postgresql-ssl-enforcement-cci-002422.md

# PostgreSQL STIG role overrides (this host is still on the distro PostgreSQL 13 service/layout)
postgresql_stig_service_name: postgresql
postgresql_stig_data_dir: /var/lib/pgsql/data

# Disable EL8 hard guard because our SonarQube host is Rocky 9.x
sonarqube_stig_enforce_el8: false

# Human-readable exception register (keep this list updated as we tailor).
# Each item here should have a matching entry in sonarqube_stig_rhel8_stig_vars.
sonarqube_stig_exceptions:
  - id: DISA_STIG_RHEL_08_010358
    var: DISA_STIG_RHEL_08_010358
    value: false
    reason: Rocky 9 does not ship a 'mailx' package (commonly replaced by s-nail).
  - id: DISA_STIG_RHEL_08_010358
    var: package_mailx_installed
    value: false
    reason: Skip mailx install gate on Rocky 9.

  # Vagrant shared folders (/vagrant) are typically fuse/vmhgfs/vboxsf and contain provider lock files
  # that cannot be chowned from within the guest. Skip this check to allow the baseline to complete.
  - id: DISA_STIG_RHEL_08_010700
    var: DISA_STIG_RHEL_08_010700
    value: false
    reason: Avoid chown failures on /vagrant shared folder (fusefs) world-writable lock directories.
  - id: DISA_STIG_RHEL_08_010700
    var: dir_perms_world_writable_root_owned
    value: false
    reason: Avoid chown failures on /vagrant shared folder (fusefs) world-writable lock directories.

  # Upstream rhel8-stig uses an integer (.matched) directly in a 'when:' clause for this control,
  # which fails on newer Ansible versions that require boolean conditions.
  - id: DISA_STIG_RHEL_08_030010
    var: DISA_STIG_RHEL_08_030010
    value: false
    reason: Skip due to upstream conditional bug (int used as boolean) in rsyslog cron logging tasks.
  - id: DISA_STIG_RHEL_08_030010
    var: rsyslog_cron_logging
    value: false
    reason: Skip due to upstream conditional bug (int used as boolean) in rsyslog cron logging tasks.

  # Upstream rhel8-stig currently has a malformed services-facts conditional in the privileged functions
  # audit rule tasks (quotes included inside the string), which fails on some Ansible versions.
  - id: DISA_STIG_RHEL_08_030000
    var: DISA_STIG_RHEL_08_030000
    value: false
    reason: Skip due to upstream malformed ansible_facts.services conditional in privileged audit rule tasks.
  - id: DISA_STIG_RHEL_08_030000
    var: audit_rules_suid_privilege_function
    value: false
    reason: Skip due to upstream malformed ansible_facts.services conditional in privileged audit rule tasks.

  # Upstream mount_option_boot_efi_nosuid tasks build mount_info incorrectly (missing 'options' key),
  # causing failures on hosts where /boot/efi exists but findmnt output parsing doesn't match expectations.
  - id: DISA_STIG_RHEL_08_010572
    var: DISA_STIG_RHEL_08_010572
    value: false
    reason: Skip due to upstream mount_info/options bug in /boot/efi nosuid remediation.
  - id: DISA_STIG_RHEL_08_010572
    var: mount_option_boot_efi_nosuid
    value: false
    reason: Skip due to upstream mount_info/options bug in /boot/efi nosuid remediation.

  # Upstream mount_option_boot_nosuid tasks have the same mount_info/options bug on this platform.
  - id: DISA_STIG_RHEL_08_010571
    var: DISA_STIG_RHEL_08_010571
    value: false
    reason: Skip due to upstream mount_info/options bug in /boot nosuid remediation.
  - id: DISA_STIG_RHEL_08_010571
    var: mount_option_boot_nosuid
    value: false
    reason: Skip due to upstream mount_info/options bug in /boot nosuid remediation.

  # /dev/shm mount option controls trigger the same mount_info/options bug on this platform.
  - id: DISA_STIG_RHEL_08_040120
    var: DISA_STIG_RHEL_08_040120
    value: false
    reason: Skip due to upstream mount_info/options bug in /dev/shm nodev remediation.
  - id: DISA_STIG_RHEL_08_040120
    var: mount_option_dev_shm_nodev
    value: false
    reason: Skip due to upstream mount_info/options bug in /dev/shm nodev remediation.
  - id: DISA_STIG_RHEL_08_040122
    var: DISA_STIG_RHEL_08_040122
    value: false
    reason: Skip due to upstream mount_info/options bug in /dev/shm noexec remediation.
  - id: DISA_STIG_RHEL_08_040122
    var: mount_option_dev_shm_noexec
    value: false
    reason: Skip due to upstream mount_info/options bug in /dev/shm noexec remediation.
  - id: DISA_STIG_RHEL_08_040121
    var: DISA_STIG_RHEL_08_040121
    value: false
    reason: Skip due to upstream mount_info/options bug in /dev/shm nosuid remediation.
  - id: DISA_STIG_RHEL_08_040121
    var: mount_option_dev_shm_nosuid
    value: false
    reason: Skip due to upstream mount_info/options bug in /dev/shm nosuid remediation.

  # Upstream rhel8-stig tries to enforce SSH ciphers/MACs via opensshserver.config by writing CRYPTO_POLICY=...
  # lines, which breaks sshd_config parsing on Rocky/RHEL (sshd expects directives like 'Ciphers', 'MACs', etc.).
  - id: DISA_STIG_RHEL_08_010291
    var: DISA_STIG_RHEL_08_010291
    value: false
    reason: Skip due to upstream CRYPTO_POLICY directive injection into opensshserver crypto policy config.
  - id: DISA_STIG_RHEL_08_010291
    var: harden_sshd_ciphers_opensshserver_conf_crypto_policy
    value: false
    reason: Skip due to upstream CRYPTO_POLICY directive injection into opensshserver crypto policy config.
  - id: DISA_STIG_RHEL_08_010290
    var: DISA_STIG_RHEL_08_010290
    value: false
    reason: Skip due to upstream CRYPTO_POLICY directive injection into opensshserver crypto policy config.
  - id: DISA_STIG_RHEL_08_010290
    var: harden_sshd_macs_opensshserver_conf_crypto_policy
    value: false
    reason: Skip due to upstream CRYPTO_POLICY directive injection into opensshserver crypto policy config.

  # These AIDE follow-up tasks currently trigger a non-boolean conditional in the upstream role on our platform.
  # Instead of patching the vendored role, skip these checks.
  - id: DISA_STIG_RHEL_08_040310
    var: aide_verify_acls
    value: false
    reason: Avoid upstream conditional type issue; revisit later.
  - id: DISA_STIG_RHEL_08_040300
    var: aide_verify_ext_attributes
    value: false
    reason: Avoid upstream conditional type issue; revisit later.

  # Password aging controls can immediately expire existing lab passwords and break Ansible automation.
  # We are skipping these while we stabilize the baseline.
  - id: DISA_STIG_RHEL_08_020210
    var: DISA_STIG_RHEL_08_020210
    value: false
    reason: Prevent immediate password expiration of existing accounts during automation.
  - id: DISA_STIG_RHEL_08_020210
    var: accounts_password_set_max_life_existing
    value: false
    reason: Prevent immediate password expiration of existing accounts during automation.
  - id: DISA_STIG_RHEL_08_020180
    var: DISA_STIG_RHEL_08_020180
    value: false
    reason: Avoid forced password aging changes during automation.
  - id: DISA_STIG_RHEL_08_020180
    var: accounts_password_set_min_life_existing
    value: false
    reason: Avoid forced password aging changes during automation.

# Tailoring overrides for roles/rhel8-stig
# Note: the upstream role gates many tasks behind both a DISA_STIG_* boolean and a *package_* boolean.
# Disabling either is sufficient to skip a remediation.
#
# baseos_rhel8_stig_vars is used by playbooks/baseos/rhel8-stig.yml.
# sonarqube_stig_rhel8_stig_vars is used by the sonarqube-stig wrapper role.
baseos_rhel8_stig_vars: "{{ sonarqube_stig_rhel8_stig_vars }}"
sonarqube_stig_rhel8_stig_vars:
  # Rocky 9 does not provide a 'mailx' package (it's typically replaced by s-nail).
  DISA_STIG_RHEL_08_010358: false
  package_mailx_installed: false

  # Skip chown enforcement on /vagrant shared folder lock directories.
  DISA_STIG_RHEL_08_010700: false
  dir_perms_world_writable_root_owned: false

  # Skip rsyslog cron logging rule due to upstream Ansible conditional bug.
  DISA_STIG_RHEL_08_030010: false
  rsyslog_cron_logging: false

  # Skip privileged function audit rules due to upstream malformed services-facts conditional.
  DISA_STIG_RHEL_08_030000: false
  audit_rules_suid_privilege_function: false

  # Skip /boot/efi nosuid rule due to upstream mount_info/options bug.
  DISA_STIG_RHEL_08_010572: false
  mount_option_boot_efi_nosuid: false

  # Skip /boot nosuid rule due to upstream mount_info/options bug.
  DISA_STIG_RHEL_08_010571: false
  mount_option_boot_nosuid: false

  # Skip /dev/shm nodev/noexec/nosuid rules due to upstream mount_info/options bug.
  DISA_STIG_RHEL_08_040120: false
  mount_option_dev_shm_nodev: false
  DISA_STIG_RHEL_08_040122: false
  mount_option_dev_shm_noexec: false
  DISA_STIG_RHEL_08_040121: false
  mount_option_dev_shm_nosuid: false

  # Skip upstream opensshserver crypto-policy hardening that injects invalid CRYPTO_POLICY directives.
  DISA_STIG_RHEL_08_010291: false
  harden_sshd_ciphers_opensshserver_conf_crypto_policy: false
  DISA_STIG_RHEL_08_010290: false
  harden_sshd_macs_opensshserver_conf_crypto_policy: false

  # Skip AIDE ACL/xattr verification follow-ups to avoid upstream conditional issues.
  aide_verify_acls: false
  aide_verify_ext_attributes: false

  # Skip password aging remediation that can expire existing accounts during automation.
  DISA_STIG_RHEL_08_020210: false
  accounts_password_set_max_life_existing: false
  DISA_STIG_RHEL_08_020180: false
  accounts_password_set_min_life_existing: false
