version: '3.8'

services:
  # Redis for task queue
  redis:
    image: redis:7-alpine
    container_name: saml-webapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL database (optional, can use SQLite for dev)
  db:
    image: postgres:15-alpine
    container_name: saml-webapp-db
    environment:
      POSTGRES_DB: saml_integration
      POSTGRES_USER: samluser
      POSTGRES_PASSWORD: samlpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samluser"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: saml-webapp-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://samluser:samlpass@db:5432/saml_integration
      - REDIS_URL=redis://redis:6379/0
      - ANSIBLE_PROJECT_ROOT=/ansible
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
    volumes:
      - ../../:/ansible:ro  # Mount entire project as read-only
      - ../backend:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Background worker
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: saml-webapp-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://samluser:samlpass@db:5432/saml_integration
      - REDIS_URL=redis://redis:6379/0
      - ANSIBLE_PROJECT_ROOT=/ansible
    volumes:
      - ../../:/ansible:ro
      - ../backend:/app
    depends_on:
      - redis
      - db
    command: python -m app.workers.deployment_worker

  # Frontend (React)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: saml-webapp-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    name: saml-webapp-network
