[defaults]
inventory = inventory
roles_path = roles
host_key_checking = False
stdout_callback = yaml
display_skipped_hosts = False
timeout = 30
vault_password_file = .vault_pass
ask_vault_pass = False
# Required for become_user: postgres tasks when SELinux restricts
# temp file access and postgres has /sbin/nologin shell (V-206545)
allow_world_readable_tmpfiles = True

[ssh_connection]
pipelining = True
